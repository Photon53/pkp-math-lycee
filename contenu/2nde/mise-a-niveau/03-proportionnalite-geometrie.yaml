chapitre:
  code: 2NDE-MAN-PROP
  niveau: 2nde
  parcours: mise-a-niveau
  ordre: 3
  titre: Bases du collège, proportionnalité et géométrie
competences:
- code: 2NDE-MAN-PROPORTION
  libelle: Utiliser pourcentages, proportionnalité, Pythagore et Thalès
  objectifs:
  - Calculer un pourcentage et une quatrième proportionnelle.
  - Utiliser les théorèmes de Pythagore et de Thalès.
  resume: |
    - $t\,\%$ de $a$ : $\dfrac{t}{100} \times a$.
    - Quatrième proportionnelle : produit en croix.
    - Pythagore : dans un triangle rectangle, $c^2 = a^2 + b^2$ ($c$ hypoténuse).
    - Thalès : $\dfrac{AM}{AB} = \dfrac{AN}{AC} = \dfrac{MN}{BC}$ si $(MN) \parallel (BC)$.
  cours: |
    ## Pourcentages
    $20\,\%$ de $45$ : $0{,}2 \times 45 = 9$. Un prix TTC de $96$ € avec une TVA de $20\,\%$ : $HT = \dfrac{96}{1{,}2} = 80$ €.

    ## Proportionnalité
    3 cahiers coûtent $7{,}50$ € ; un cahier coûte $2{,}50$ €, donc 5 cahiers coûtent $12{,}50$ €.

    ## Géométrie
    Côtés de l'angle droit $5$ et $12$ : hypoténuse $\sqrt{25 + 144} = 13$.
    Thalès : $AM = 3$, $AB = 5$, $AC = 10$ donnent $AN = \dfrac{3}{5} \times 10 = 6$.
  methodes:
  - titre: Retrouver un prix hors taxe
    etapes:
    - Le prix TTC est le prix HT multiplié par 1 + taux.
    - Diviser le prix TTC par ce coefficient.
    exemple:
      enonce: TTC 60 €, TVA 20 %.
      resolution:
      - $\dfrac{60}{1{,}2} = 50$.
      resultat: 50 €
  erreurs_frequentes:
  - erreur: Retirer 20 % au prix TTC pour retrouver le prix HT.
    explication: '$96 - 20\,\% \times 96 = 76{,}8 \neq 80$ : il faut diviser par $1{,}2$.'
  questions:
  - code: 2NDE-MAN-PROPORTION-01
    difficulte: 1
    type: numerique
    enonce: Calculer 20 % de 45.
    solution: '9'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $0{,}2 \times 45 = 9$.
      resultat: '9'
  - code: 2NDE-MAN-PROPORTION-02
    difficulte: 2
    type: numerique
    enonce: 3 cahiers coûtent 7,50 €. Combien coûtent 5 cahiers (en €) ?
    solution: '12.5'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Un cahier : $2{,}50$ € ; cinq : $12{,}50$ €.'
      resultat: '12.5'
  - code: 2NDE-MAN-PROPORTION-03
    difficulte: 3
    type: numerique
    enonce: Les côtés de l'angle droit d'un triangle rectangle mesurent 5 et 12. Quelle est la longueur de l'hypoténuse ?
    solution: '13'
    auteur: Brouillon IA (Claude)
    correction:
      methode: 'Théorème de Pythagore : dans un triangle rectangle, $c^2 = a^2 + b^2$ pour les côtés de l''angle droit $a$ et $b$.'
      etapes:
      - 'On identifie les côtés de l''angle droit : $5$ et $12$.'
      - 'On applique Pythagore : $h^2 = 5^2 + 12^2 = 25 + 144 = 169$.'
      - 'On prend la racine carrée : $h = \sqrt{169} = 13$.'
      - 'Vérification : $13^2 = 169 = 25 + 144$, le triplet $(5 ; 12 ; 13)$ est bien pythagoricien.'
      erreurs_frequentes:
      - Additionner les longueurs ($5 + 12 = 17$), ou oublier la racine carrée.
      resultat: '13'
  - code: 2NDE-MAN-PROPORTION-04
    difficulte: 4
    type: numerique
    enonce: $M \in [AB]$, $N \in [AC]$ et $(MN) \parallel (BC)$, avec $AM = 3$, $AB = 5$ et $AC = 10$. Calculer $AN$.
    solution: '6'
    auteur: Brouillon IA (Claude)
    correction:
      methode: 'Théorème de Thalès : si $(MN) \parallel (BC)$, alors $\dfrac{AM}{AB} = \dfrac{AN}{AC}$.'
      etapes:
      - 'On écrit l''égalité des rapports : $\dfrac{AM}{AB} = \dfrac{AN}{AC}$.'
      - 'On remplace : $\dfrac{3}{5} = \dfrac{AN}{10}$.'
      - 'On isole $AN$ : $AN = 10 \times \dfrac{3}{5} = 6$.'
      - 'Vérification : $\dfrac{AN}{AC} = \dfrac{6}{10} = 0{,}6$ et $\dfrac{AM}{AB} = \dfrac{3}{5} = 0{,}6$ : les rapports sont égaux.'
      erreurs_frequentes:
      - Utiliser $MB$ au lieu de $AM$, ou écrire l'égalité avec $BC$ et $MN$ sans les longueurs données.
      resultat: '6'
  - code: 2NDE-MAN-PROPORTION-05
    difficulte: 5
    type: numerique
    enonce: Un article coûte 96 € TTC, avec une TVA de 20 %. Quel est son prix hors taxe (en €) ?
    solution: '80'
    auteur: Brouillon IA (Claude)
    correction:
      methode: 'Le prix TTC est le prix HT multiplié par le coefficient de TVA $1{,}20$ : pour retrouver le HT, on divise par ce coefficient.'
      etapes:
      - 'On identifie le coefficient : une TVA de $20\,\%$ correspond à $1 + 0{,}20 = 1{,}20$.'
      - 'On écrit la relation : prix TTC $=$ prix HT $\times 1{,}20$.'
      - 'On divise : prix HT $= \dfrac{96}{1{,}20} = 80$ €.'
      - 'Vérification : $80 \times 1{,}20 = 96$ € TTC, le prix de départ est retrouvé.'
      erreurs_frequentes:
      - 'Retrancher $20\,\%$ de $96$ et trouver $76{,}80$ : la TVA se calcule sur le prix HT, pas sur le TTC.'
      resultat: '80'