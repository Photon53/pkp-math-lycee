chapitre:
  code: 2NDE-NOMBRES
  niveau: 2nde
  parcours: tronc-commun
  ordre: 1
  titre: Nombres et calculs

competences:
  - code: 2NDE-FRAC
    libelle: Calculer avec des fractions
    attendus: [2NDE-2026-ARITH-04, 2NDE-2026-AUTO-02, 2NDE-2026-ALG-09]
    cours_couvre: [2NDE-2026-ARITH-04, 2NDE-2026-AUTO-02, 2NDE-2026-ALG-09]
    objectifs:
    - Additionner, multiplier et diviser des fractions.
    - Donner un résultat sous forme irréductible.
    methodes:
    - titre: Additionner deux fractions
      quand: Les dénominateurs sont différents.
      etapes:
      - Chercher un dénominateur commun, de préférence le plus petit multiple commun.
      - 'Transformer chaque fraction : multiplier numérateur et dénominateur par le même nombre.'
      - Additionner les numérateurs, garder le dénominateur commun, puis simplifier.
      exemple:
        enonce: Calculer $\dfrac{1}{4} + \dfrac{5}{6}$.
        resolution:
        - 'Dénominateur commun : $12$.'
        - $\dfrac{1}{4} = \dfrac{3}{12}$ et $\dfrac{5}{6} = \dfrac{10}{12}$.
        - $\dfrac{3}{12} + \dfrac{10}{12} = \dfrac{13}{12}$.
        resultat: $\dfrac{13}{12}$
    erreurs_frequentes:
    - erreur: 'Additionner numérateurs et dénominateurs : $\dfrac{1}{2} + \dfrac{1}{3} = \dfrac{2}{5}$.'
      explication: 'On ne peut additionner que des parts de même taille : il faut d''abord un dénominateur commun.'
    - erreur: Diviser par une fraction en divisant les numérateurs et les dénominateurs « en croix ».
      explication: Diviser par $\dfrac{c}{d}$, c'est multiplier par son inverse $\dfrac{d}{c}$.
    resume: |
      - Une fraction est **irréductible** quand numérateur et dénominateur n'ont aucun diviseur commun autre que $1$ : on simplifie par leur plus grand diviseur commun.
      - Additionner ou soustraire : on met d'abord au **même dénominateur**, puis on ajoute les numérateurs.
      - Multiplier : $\dfrac{a}{b} \times \dfrac{c}{d} = \dfrac{ac}{bd}$ ; diviser, c'est multiplier par l'inverse : $\dfrac{a}{b} \div \dfrac{c}{d} = \dfrac{a}{b} \times \dfrac{d}{c}$.
      - Comparer deux fractions : même dénominateur positif, puis comparer les numérateurs (ou étudier le signe de leur différence).
    cours: |
      ## 1. Définitions
      Pour deux entiers $a$ et $b$ avec $b \neq 0$, le quotient $\dfrac{a}{b}$ est le nombre qui, multiplié par $b$, donne $a$. On appelle $a$ le **numérateur** et $b$ le **dénominateur**.

      > **Propriété (égalité de fractions).** Pour tout $k \neq 0$ : $\dfrac{a}{b} = \dfrac{a \times k}{b \times k}$. On ne change pas un quotient en multipliant (ou en divisant) son numérateur et son dénominateur par un même nombre non nul.

      Une fraction est **irréductible** lorsque son numérateur et son dénominateur n'ont pas d'autre diviseur commun positif que $1$.

      ## 2. Rendre une fraction irréductible
      ### Méthode
      1. Décomposer le numérateur et le dénominateur en produits de facteurs premiers (ou chercher leur plus grand diviseur commun).
      2. Simplifier par **tous** les facteurs communs.
      3. Vérifier qu'il ne reste aucun facteur commun.

      **Exemple.** $\dfrac{84}{120} = \dfrac{2^2 \times 3 \times 7}{2^3 \times 3 \times 5} = \dfrac{7}{2 \times 5} = \dfrac{7}{10}$. Les nombres $7$ et $10$ n'ont aucun diviseur commun autre que $1$ : la fraction est irréductible.

      ## 3. Opérations
      > **Propriété (somme).** $\dfrac{a}{d} + \dfrac{b}{d} = \dfrac{a + b}{d}$ : on additionne les numérateurs **seulement si** les dénominateurs sont égaux.

      > **Propriété (produit et quotient).** $\dfrac{a}{b} \times \dfrac{c}{d} = \dfrac{a \times c}{b \times d}$ et, pour $c \neq 0$, $\dfrac{a}{b} \div \dfrac{c}{d} = \dfrac{a}{b} \times \dfrac{d}{c}$.

      ### Méthode : calculer une expression fractionnaire
      1. Respecter les priorités : parenthèses, puis produits et quotients, puis sommes.
      2. Pour une somme, chercher un dénominateur commun (si possible le plus petit multiple commun).
      3. Simplifier dès que possible, avant de multiplier, pour garder des nombres petits.
      4. Donner le résultat sous forme irréductible.

      **Exemple complet.** Calculer $A = \dfrac{5}{6} - \dfrac{3}{4} \times \dfrac{2}{9}$.
      - Priorité au produit : $\dfrac{3}{4} \times \dfrac{2}{9} = \dfrac{3 \times 2}{4 \times 9} = \dfrac{3 \times 2}{2 \times 2 \times 3 \times 3} = \dfrac{1}{6}$.
      - Puis la différence : $A = \dfrac{5}{6} - \dfrac{1}{6} = \dfrac{4}{6} = \dfrac{2}{3}$.

      Le même travail s'applique aux expressions littérales : pour $x \neq 0$, $\dfrac{1}{x} + \dfrac{2}{3} = \dfrac{3}{3x} + \dfrac{2x}{3x} = \dfrac{3 + 2x}{3x}$.

      ## 4. Comparer deux fractions
      > **Propriété.** Si $d > 0$ : $\dfrac{a}{d} < \dfrac{b}{d}$ équivaut à $a < b$.

      Pour comparer $\dfrac{5}{7}$ et $\dfrac{7}{10}$, on écrit $\dfrac{50}{70}$ et $\dfrac{49}{70}$ : donc $\dfrac{5}{7} > \dfrac{7}{10}$. On peut aussi calculer la différence $\dfrac{5}{7} - \dfrac{7}{10} = \dfrac{1}{70} > 0$.

      ## 5. Erreurs fréquentes
      - Additionner numérateurs **et** dénominateurs : $\dfrac{1}{2} + \dfrac{1}{3} \neq \dfrac{2}{5}$ ; en réalité $\dfrac{1}{2} + \dfrac{1}{3} = \dfrac{5}{6}$.
      - Simplifier une somme : dans $\dfrac{3 + x}{3}$, on ne peut pas « barrer » les $3$, car $3$ n'est pas un facteur du numérateur.
      - Oublier d'inverser la seconde fraction lors d'une division.
      - S'arrêter à une fraction encore simplifiable, comme $\dfrac{4}{6}$.
    questions:
      - code: 2NDE-FRAC-01
        difficulte: 1
        type: numerique
        enonce: Calculer 1/2 + 1/3.
        solution: 5/6
        auteur: Brouillon IA (Claude)
        correction:
          methode: Réduire au même dénominateur.
          etapes:
          - 'Dénominateur commun : $6$. $\dfrac{1}{2} = \dfrac{3}{6}$ et $\dfrac{1}{3} = \dfrac{2}{6}$.'
          - $\dfrac{3}{6} + \dfrac{2}{6} = \dfrac{5}{6}$.
          resultat: 5/6
          erreurs_frequentes:
          - Répondre $\dfrac{2}{5}$ en additionnant numérateurs et dénominateurs.
      - code: 2NDE-FRAC-02
        difficulte: 2
        type: numerique
        enonce: Calculer 3/4 × 2/9.
        solution: 1/6
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier les numérateurs entre eux et les dénominateurs entre eux.
          etapes:
          - $\dfrac{3}{4} \times \dfrac{2}{9} = \dfrac{3 \times 2}{4 \times 9} = \dfrac{6}{36}$.
          - $\dfrac{6}{36} = \dfrac{1}{6}$ (on divise par $6$).
          resultat: 1/6
      - code: 2NDE-FRAC-03
        difficulte: 3
        type: numerique
        enonce: Calculer (2/3) ÷ (4/9).
        solution: 3/2
        auteur: Brouillon IA (Claude)
        correction:
          methode: Diviser par une fraction, c'est multiplier par son inverse.
          etapes:
          - $\dfrac{2}{3} \div \dfrac{4}{9} = \dfrac{2}{3} \times \dfrac{9}{4}$.
          - $= \dfrac{18}{12} = \dfrac{3}{2}$.
          resultat: 3/2
      - code: 2NDE-FRAC-04
        difficulte: 2
        type: qcm
        enonce: 'Quelle est la forme irréductible de $\dfrac{4}{9} \times \dfrac{3}{8}$ ? A) $\dfrac{12}{72}$  B) $\dfrac{1}{6}$  C) $\dfrac{2}{12}$'
        solution: B
        source: STACK
        source_url: https://docs.stack-assessment.org/
        licence_source: à vérifier
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Simplifier avant ou après la multiplication.
          etapes:
          - $\dfrac{4}{9} \times \dfrac{3}{8} = \dfrac{12}{72}$.
          - '$\dfrac{12}{72} = \dfrac{1}{6}$ (on divise par $12$) : seule la réponse B est irréductible.'
          resultat: B
      - code: 2NDE-FRAC-05
        difficulte: 4
        type: numerique
        enonce: Calculer $\dfrac{\frac{2}{3} - \frac{1}{4}}{\frac{5}{6}}$ et donner le résultat sous forme de fraction irréductible.
        solution: 1/2
        auteur: Brouillon IA (Claude)
        correction:
          methode: Calculer le numérateur, puis diviser en multipliant par l'inverse.
          etapes:
          - $\dfrac{2}{3} - \dfrac{1}{4} = \dfrac{8}{12} - \dfrac{3}{12} = \dfrac{5}{12}$.
          - $\dfrac{5}{12} \div \dfrac{5}{6} = \dfrac{5}{12} \times \dfrac{6}{5} = \dfrac{6}{12} = \dfrac{1}{2}$.
          resultat: 1/2
      - code: 2NDE-FRAC-06
        difficulte: 5
        type: numerique
        enonce: Un réservoir est rempli aux $\dfrac{3}{5}$. On utilise le tiers de son contenu, puis on ajoute $\dfrac{1}{10}$ de la capacité totale. Quelle fraction du réservoir est alors remplie ?
        solution: 1/2
        auteur: Brouillon IA (Claude)
        correction:
          methode: '« Le tiers du contenu » se calcule en multipliant : $\dfrac{1}{3} \times \dfrac{3}{5}$.'
          etapes:
          - On utilise $\dfrac{1}{3} \times \dfrac{3}{5} = \dfrac{1}{5}$ ; il reste $\dfrac{3}{5} - \dfrac{1}{5} = \dfrac{2}{5}$.
          - $\dfrac{2}{5} + \dfrac{1}{10} = \dfrac{4}{10} + \dfrac{1}{10} = \dfrac{5}{10} = \dfrac{1}{2}$.
          erreurs_frequentes:
          - Retirer $\dfrac{1}{3}$ du réservoir au lieu du tiers de son contenu.
          resultat: 1/2
      - code: 2NDE-FRAC-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {a: {entre: [1, 9]}, b: {entre: [2, 9]}, c: {entre: [1, 9]}, d: {entre: [2, 9]}}
          calculs: {s: "a/b + c/d"}
          conditions: ["b != d", "pgcd(a, b) == 1", "pgcd(c, d) == 1"]
        enonce: 'Calculer $\dfrac{[[a]]}{[[b]]} + \dfrac{[[c]]}{[[d]]}$ (réponse sous forme de fraction).'
        solution: '[[s]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Mettre au même dénominateur, puis simplifier.'
          etapes:
          - 'Dénominateur commun : $[[b]] \times [[d]] = [[b*d]]$.'
          - '$\dfrac{[[a*d]]}{[[b*d]]} + \dfrac{[[c*b]]}{[[b*d]]} = \dfrac{[[a*d + c*b]]}{[[b*d]]}$.'
          - 'Forme irréductible : $[[s:frac]]$.'
          resultat: '[[s]]'

  - code: 2NDE-PUIS
    libelle: Calculer avec des puissances
    attendus: [2NDE-2026-ALG-01, 2NDE-2026-ALG-09, 2NDE-2026-AUTO-03]
    cours_couvre: [2NDE-2026-ALG-01, 2NDE-2026-ALG-09, 2NDE-2026-AUTO-03]
    objectifs:
    - Calculer une puissance et appliquer les règles de calcul.
    - Connaitre le signe d'une puissance d'un nombre négatif.
    methodes:
    - titre: Simplifier un produit de puissances de 10
      etapes:
      - Utiliser $10^a \times 10^b = 10^{a+b}$.
      - Se rappeler que $10^{-n} = \dfrac{1}{10^n}$.
      - Écrire le résultat en écriture décimale si demandé.
      exemple:
        enonce: Calculer $10^4 \times 10^{-6}$.
        resolution:
        - $10^4 \times 10^{-6} = 10^{4 + (-6)} = 10^{-2}$.
        - $10^{-2} = \dfrac{1}{100} = 0{,}01$.
        resultat: $0{,}01$
    erreurs_frequentes:
    - erreur: Confondre $2^5$ et $2 \times 5$.
      explication: '$2^5 = 2 \times 2 \times 2 \times 2 \times 2 = 32$ : l''exposant compte les facteurs.'
    - erreur: Penser qu'une puissance d'un nombre négatif est toujours négative.
      explication: 'Le signe dépend de l''exposant : pair donne un résultat positif, impair un résultat négatif.'
    resume: |
      - $a^n = a \times a \times \dots \times a$ ($n$ facteurs), $a^0 = 1$ et $a^{-n} = \dfrac{1}{a^n}$ pour $a \neq 0$.
      - Même base : $a^m \times a^n = a^{m+n}$, $\dfrac{a^m}{a^n} = a^{m-n}$, $(a^m)^n = a^{mn}$.
      - Même exposant : $a^n \times b^n = (ab)^n$ et $\dfrac{a^n}{b^n} = \left(\dfrac{a}{b}\right)^n$.
      - Notation scientifique : $a \times 10^n$ avec $1 \leqslant a < 10$ et $n$ entier relatif.
      - Il n'existe **aucune** règle pour $a^n + a^m$ ni pour $(a + b)^n$.
    cours: |
      ## 1. Définitions
      Soit $a$ un nombre réel et $n$ un entier naturel non nul.
      - $a^n = a \times a \times \dots \times a$, avec $n$ facteurs égaux à $a$ ; on lit « $a$ puissance $n$ » ; $n$ est l'**exposant**.
      - Par convention, pour $a \neq 0$ : $a^0 = 1$ et $a^{-n} = \dfrac{1}{a^n}$. En particulier $a^{-1} = \dfrac{1}{a}$ est l'inverse de $a$.

      Exemples : $2^5 = 32$, $(-3)^2 = 9$ mais $-3^2 = -9$, $10^{-3} = 0{,}001$, $5^{-2} = \dfrac{1}{25}$.

      ## 2. Règles de calcul
      Pour $a \neq 0$, $b \neq 0$ et $m$, $n$ entiers relatifs :

      > **Propriété (même base).** $a^m \times a^n = a^{m+n}$ ; $\dfrac{a^m}{a^n} = a^{m-n}$ ; $(a^m)^n = a^{m \times n}$.

      > **Propriété (même exposant).** $a^n \times b^n = (a \times b)^n$ ; $\dfrac{a^n}{b^n} = \left(\dfrac{a}{b}\right)^n$.

      **Pourquoi ?** Pour $m = 3$ et $n = 2$ : $a^3 \times a^2 = (a \times a \times a) \times (a \times a)$, ce qui fait $5$ facteurs, donc $a^5$. La convention $a^{-n} = \dfrac{1}{a^n}$ est choisie pour que ces règles restent vraies avec des exposants négatifs : $a^2 \times a^{-2} = a^0 = 1$.

      > **Propriété (signe).** Une puissance d'exposant **pair** d'un nombre non nul est strictement positive : $(-a)^n = a^n$ si $n$ est pair et $(-a)^n = -a^n$ si $n$ est impair.

      ## 3. Notation scientifique
      Tout nombre décimal non nul s'écrit de manière unique $a \times 10^n$ avec $1 \leqslant |a| < 10$ et $n$ entier relatif. Exemples : $47\,000 = 4{,}7 \times 10^4$ ; $0{,}000\,62 = 6{,}2 \times 10^{-4}$.

      ### Méthode : simplifier une expression avec des puissances
      1. Regrouper les facteurs de même base (on peut décomposer : $6^3 = 2^3 \times 3^3$, $8 = 2^3$).
      2. Appliquer les règles de la même base en additionnant ou soustrayant les exposants.
      3. Écrire le résultat sous la forme demandée (puissance unique, fraction ou notation scientifique).

      **Exemple complet.** Écrire $B = \dfrac{2^5 \times 6^{-2}}{3^{-4}}$ sous la forme $2^p \times 3^q$.
      - $6^{-2} = (2 \times 3)^{-2} = 2^{-2} \times 3^{-2}$.
      - $B = \dfrac{2^5 \times 2^{-2} \times 3^{-2}}{3^{-4}} = 2^{5 - 2} \times 3^{-2 - (-4)} = 2^3 \times 3^2$, soit $72$.

      **Exemple avec la notation scientifique.** $\dfrac{6 \times 10^{8}}{1{,}5 \times 10^{-3}} = \dfrac{6}{1{,}5} \times 10^{8 - (-3)} = 4 \times 10^{11}$.

      ## 4. Erreurs fréquentes
      - Multiplier les exposants au lieu de les additionner : $a^3 \times a^4 = a^7$, pas $a^{12}$.
      - Croire que $a^{-n}$ est négatif : $2^{-3} = \dfrac{1}{8} > 0$.
      - Écrire $(a + b)^2 = a^2 + b^2$ ou $2^3 + 2^4 = 2^7$ : les règles ne concernent que les **produits** et les **quotients**.
      - Confondre $(-2)^4 = 16$ et $-2^4 = -16$ : la puissance est prioritaire sur le signe moins.
    questions:
      - code: 2NDE-PUIS-01
        difficulte: 1
        type: numerique
        enonce: Calculer 2⁵.
        solution: 32
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $2^5 = 2 \times 2 \times 2 \times 2 \times 2 = 32$.
          resultat: 32
      - code: 2NDE-PUIS-02
        difficulte: 2
        type: qcm
        enonce: Quel est le signe de (−3)⁷ ? A) positif  B) négatif
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          methode: Le signe d'une puissance d'un nombre négatif dépend de la parité de l'exposant.
          etapes:
          - $(-3)^7$ est un produit de $7$ facteurs négatifs.
          - Un nombre impair de facteurs négatifs donne un produit négatif.
          resultat: B
      - code: 2NDE-PUIS-03
        difficulte: 3
        type: numerique
        enonce: Donner la valeur décimale de 10³ × 10⁻⁵.
        solution: 0.01
        auteur: Brouillon IA (Claude)
        correction:
          methode: $10^a \times 10^b = 10^{a+b}$.
          etapes:
          - $10^3 \times 10^{-5} = 10^{3 - 5} = 10^{-2}$.
          - $10^{-2} = 0{,}01$.
          resultat: 0.01
      - code: 2NDE-PUIS-04
        difficulte: 4
        type: numerique
        enonce: Calculer $\dfrac{2^5 \times 4^3}{8^3}$.
        solution: '4'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Tout écrire en puissances de 2.
          etapes:
          - $4^3 = (2^2)^3 = 2^6$ et $8^3 = (2^3)^3 = 2^9$.
          - $\dfrac{2^5 \times 2^6}{2^9} = 2^{5 + 6 - 9} = 2^2 = 4$.
          resultat: '4'
      - code: 2NDE-PUIS-05
        difficulte: 5
        type: numerique
        enonce: On écrit $\dfrac{(10^{-2})^3 \times 10^5}{10^{-4}}$ sous la forme $10^n$. Donner $n$.
        solution: '3'
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $(10^{-2})^3 = 10^{-6}$, puis $10^{-6} \times 10^5 = 10^{-1}$.
          - $\dfrac{10^{-1}}{10^{-4}} = 10^{-1 - (-4)} = 10^3$.
          erreurs_frequentes:
          - Calculer $-1 - 4$ au lieu de $-1 - (-4)$ au dénominateur.
          resultat: '3'
      - code: 2NDE-PUIS-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {m: {entre: [-5, 9]}, n: {entre: [-5, 9]}, p: {entre: [-4, 6]}}
          calculs: {e: "m + n - p"}
        enonce: 'On écrit $\dfrac{10^{[[m]]} \times 10^{[[n]]}}{10^{[[p]]}}$ sous la forme $10^k$. Donner $k$.'
        solution: '[[e]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Produit : on ajoute les exposants ; quotient : on les soustrait.'
          etapes:
          - '$10^{[[m]]} \times 10^{[[n]]} = 10^{[[m + n]]}$.'
          - '$\dfrac{10^{[[m + n]]}}{10^{[[p]]}} = 10^{[[m + n]] - ([[p]])} = 10^{[[e]]}$.'
          resultat: '[[e]]'

  - code: 2NDE-RAC
    libelle: Calculer avec des racines carrées
    attendus: [2NDE-2026-ALG-01, 2NDE-2026-ALG-09, 2NDE-2026-ALG-15]
    cours_couvre: [2NDE-2026-ALG-01, 2NDE-2026-ALG-09, 2NDE-2026-ALG-15]
    objectifs:
    - Calculer avec des racines carrées et simplifier $\sqrt{a}$.
    - Écrire un quotient sans racine carrée au dénominateur.
    prerequis:
    - 2NDE-PUIS
    methodes:
    - titre: Simplifier une racine carrée
      etapes:
      - Écrire le nombre sous la racine comme produit d'un carré parfait ($4$, $9$, $16$, $25$…) et d'un entier.
      - Utiliser $\sqrt{a \times b} = \sqrt{a} \times \sqrt{b}$ pour $a, b \geq 0$.
      exemple:
        enonce: Simplifier $\sqrt{50}$.
        resolution:
        - $50 = 25 \times 2$, et $25$ est un carré parfait.
        - $\sqrt{50} = \sqrt{25} \times \sqrt{2} = 5\sqrt{2}$.
        resultat: $5\sqrt{2}$
    erreurs_frequentes:
    - erreur: Écrire $\sqrt{a + b} = \sqrt{a} + \sqrt{b}$.
      explication: 'C''est faux : $\sqrt{9 + 16} = \sqrt{25} = 5$ alors que $\sqrt{9} + \sqrt{16} = 7$.'
    resume: |
      - Pour $a \geqslant 0$, $\sqrt{a}$ est le seul nombre **positif** dont le carré vaut $a$ : $\left(\sqrt{a}\right)^2 = a$.
      - Pour tout réel $a$ : $\sqrt{a^2} = |a|$ (et non $a$ si $a < 0$).
      - Pour $a \geqslant 0$ et $b \geqslant 0$ : $\sqrt{ab} = \sqrt{a}\sqrt{b}$ ; pour $b > 0$ : $\sqrt{\dfrac{a}{b}} = \dfrac{\sqrt{a}}{\sqrt{b}}$.
      - En général $\sqrt{a + b} \neq \sqrt{a} + \sqrt{b}$.
    cours: |
      ## 1. Définition
      Soit $a$ un réel positif. La **racine carrée** de $a$, notée $\sqrt{a}$, est l'unique nombre réel **positif** dont le carré est égal à $a$.

      Ainsi $\sqrt{a} \geqslant 0$ et $\left(\sqrt{a}\right)^2 = a$. Exemples : $\sqrt{49} = 7$, $\sqrt{0} = 0$, $\sqrt{0{,}09} = 0{,}3$. Le symbole $\sqrt{-4}$ n'a pas de sens : aucun réel n'a un carré négatif.

      > **Propriété.** Pour tout réel $a$ : $\sqrt{a^2} = |a|$.

      En effet, $|a|$ est positif et $|a|^2 = a^2$. Par exemple $\sqrt{(-5)^2} = \sqrt{25} = 5 = |-5|$.

      ## 2. Produit et quotient
      > **Propriété.** Pour tous réels $a \geqslant 0$ et $b \geqslant 0$ : $\sqrt{ab} = \sqrt{a} \times \sqrt{b}$. Si de plus $b > 0$ : $\sqrt{\dfrac{a}{b}} = \dfrac{\sqrt{a}}{\sqrt{b}}$.

      **Démonstration (exigible).** Soit $a \geqslant 0$ et $b \geqslant 0$. Le nombre $\sqrt{a} \times \sqrt{b}$ est un produit de deux nombres positifs, donc il est **positif**. Son carré vaut $\left(\sqrt{a}\sqrt{b}\right)^2 = \left(\sqrt{a}\right)^2 \times \left(\sqrt{b}\right)^2 = a \times b$. Ainsi $\sqrt{a}\sqrt{b}$ est un nombre positif dont le carré est $ab$ : par définition (et unicité) de la racine carrée, c'est $\sqrt{ab}$.

      > **Attention.** Il n'y a pas de règle pour la somme : $\sqrt{9 + 16} = \sqrt{25} = 5$, alors que $\sqrt{9} + \sqrt{16} = 7$.

      ## 3. Méthodes
      ### Simplifier une racine carrée
      1. Écrire le nombre sous la racine comme produit d'un **carré parfait** le plus grand possible et d'un autre entier.
      2. Utiliser $\sqrt{ab} = \sqrt{a}\sqrt{b}$ puis $\sqrt{k^2} = k$ pour $k \geqslant 0$.

      Exemple : $\sqrt{72} = \sqrt{36 \times 2} = 6\sqrt{2}$.

      ### Réduire une somme de racines
      On simplifie chaque terme pour faire apparaître la même racine, puis on factorise.

      **Exemple complet.** $C = \sqrt{50} - 3\sqrt{8} + \sqrt{18}$.
      - $\sqrt{50} = \sqrt{25 \times 2} = 5\sqrt{2}$ ; $\sqrt{8} = 2\sqrt{2}$ ; $\sqrt{18} = 3\sqrt{2}$.
      - $C = 5\sqrt{2} - 3 \times 2\sqrt{2} + 3\sqrt{2} = (5 - 6 + 3)\sqrt{2} = 2\sqrt{2}$.

      ### Supprimer une racine au dénominateur
      On multiplie numérateur et dénominateur par la racine : $\dfrac{6}{\sqrt{3}} = \dfrac{6\sqrt{3}}{\sqrt{3} \times \sqrt{3}} = \dfrac{6\sqrt{3}}{3} = 2\sqrt{3}$.

      ## 4. Erreurs fréquentes
      - Écrire $\sqrt{a + b} = \sqrt{a} + \sqrt{b}$.
      - Écrire $\sqrt{x^2} = x$ sans condition : c'est faux pour $x < 0$ ; la bonne égalité est $\sqrt{x^2} = |x|$.
      - Croire que $\sqrt{a}$ peut être négatif : la racine carrée est toujours positive.
      - Confondre $2\sqrt{3}$ (produit) et $\sqrt{2 \times 3}$.
    questions:
      - code: 2NDE-RAC-01
        difficulte: 1
        type: numerique
        enonce: 'Calculer $\sqrt{49}$.'
        solution: 7
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $7^2 = 49$ et $7 \geq 0$, donc $\sqrt{49} = 7$.
          resultat: 7
      - code: 2NDE-RAC-02
        difficulte: 2
        type: numerique
        enonce: 'Calculer $\left(\sqrt{5}\right)^2$.'
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          methode: Pour $a \geq 0$, $\left(\sqrt{a}\right)^2 = a$.
          etapes:
          - $\left(\sqrt{5}\right)^2 = 5$.
          resultat: 5
      - code: 2NDE-RAC-03
        difficulte: 3
        type: qcm
        enonce: 'Écrire $\sqrt{12}$ sous la forme $a\sqrt{b}$, avec $b$ entier le plus petit possible : A) $4\sqrt{3}$  B) $2\sqrt{3}$  C) $3\sqrt{2}$  D) $6\sqrt{2}$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          methode: Faire apparaitre un carré parfait sous la racine.
          etapes:
          - $12 = 4 \times 3$.
          - $\sqrt{12} = \sqrt{4} \times \sqrt{3} = 2\sqrt{3}$.
          resultat: B
          erreurs_frequentes:
          - Répondre $4\sqrt{3}$ en oubliant de prendre la racine de $4$.
      - code: 2NDE-RAC-04
        difficulte: 3
        type: qcm
        enonce: 'Laquelle de ces écritures de $\dfrac{1}{\sqrt{2}}$ n''a pas de racine carrée au dénominateur ? A) $\dfrac{\sqrt{2}}{2}$  B) $\dfrac{1}{\sqrt{2}}$  C) $\dfrac{2}{2\sqrt{2}}$'
        solution: A
        source: STACK
        source_url: https://docs.stack-assessment.org/
        licence_source: à vérifier
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier numérateur et dénominateur par la racine du dénominateur.
          etapes:
          - $\dfrac{1}{\sqrt{2}} = \dfrac{1 \times \sqrt{2}}{\sqrt{2} \times \sqrt{2}} = \dfrac{\sqrt{2}}{2}$.
          - Les écritures B et C ont encore une racine au dénominateur.
          resultat: A
      - code: 2NDE-RAC-05
        difficulte: 4
        type: numerique
        enonce: On écrit $\sqrt{50} + \sqrt{18} - \sqrt{8}$ sous la forme $a\sqrt{2}$. Donner $a$.
        solution: '6'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Faire apparaitre un carré parfait : $\sqrt{a^2 b} = a\sqrt{b}$.'
          etapes:
          - $\sqrt{50} = 5\sqrt{2}$, $\sqrt{18} = 3\sqrt{2}$, $\sqrt{8} = 2\sqrt{2}$.
          - $5\sqrt{2} + 3\sqrt{2} - 2\sqrt{2} = 6\sqrt{2}$.
          erreurs_frequentes:
          - 'Écrire $\sqrt{50} + \sqrt{18} = \sqrt{68}$ : la racine d''une somme n''est pas la somme des racines.'
          resultat: '6'
      - code: 2NDE-RAC-06
        difficulte: 5
        type: numerique
        enonce: Écrire $\dfrac{2}{\sqrt{3} - 1}$ sans racine au dénominateur (valeur exacte).
        solution: sqrt(3) + 1
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier en haut et en bas par la quantité conjuguée.
          etapes:
          - $\dfrac{2(\sqrt{3} + 1)}{(\sqrt{3} - 1)(\sqrt{3} + 1)} = \dfrac{2(\sqrt{3} + 1)}{3 - 1}$.
          - $= \sqrt{3} + 1$.
          resultat: sqrt(3) + 1
      - code: 2NDE-RAC-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {k: {entre: [2, 7]}, b: {parmi: [2, 3, 5, 6, 7]}}
          calculs: {n: "k*k*b"}
        enonce: 'Écrire $\sqrt{[[n]]}$ sous la forme $a\sqrt{b}$ avec $b$ entier le plus petit possible (réponse du type 3sqrt(2)).'
        solution: '[[k]]sqrt([[b]])'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Faire apparaître le plus grand carré parfait qui divise le nombre.'
          etapes:
          - '$[[n]] = [[k*k]] \times [[b]]$, et $[[k*k]] = [[k]]^2$.'
          - '$\sqrt{[[n]]} = \sqrt{[[k*k]]} \times \sqrt{[[b]]} = [[k]]\sqrt{[[b]]}$.'
          resultat: '[[k]]sqrt([[b]])'

  - code: 2NDE-ENSEMBLES
    libelle: Reconnaître les ensembles de nombres
    attendus: [2NDE-2026-REELS-01, 2NDE-2026-REELS-05, 2NDE-2026-REELS-06, 2NDE-2026-REELS-11, 2NDE-2026-REELS-12, 2NDE-2026-ARITH-01]
    cours_couvre: [2NDE-2026-REELS-01, 2NDE-2026-REELS-05, 2NDE-2026-REELS-06, 2NDE-2026-REELS-11, 2NDE-2026-REELS-12, 2NDE-2026-ARITH-01]
    objectifs:
    - Situer un nombre dans le plus petit des ensembles ℕ, ℤ, 𝔻, ℚ, ℝ.
    - Savoir que √2 et π sont irrationnels et que 1/3 n'est pas décimal.
    prerequis:
    - 2NDE-FRAC
    methodes:
    - titre: Trouver le plus petit ensemble contenant un nombre
      quand: On doit dire si un nombre est entier, décimal, rationnel ou irrationnel.
      etapes:
      - Simplifier l'écriture du nombre (fraction irréductible, racine simplifiée).
      - Tester dans l'ordre ℕ, ℤ, 𝔻 (s'écrit a/10ⁿ), ℚ (s'écrit a/b).
      - Un nombre qui n'est dans aucun des quatre est irrationnel.
      exemple:
        enonce: Dans quel plus petit ensemble se trouve $\dfrac{21}{4}$ ?
        resolution:
        - $\dfrac{21}{4} = \dfrac{525}{100} = 5{,}25$.
        - Ce n'est pas un entier, mais c'est un décimal.
        resultat: 𝔻
    erreurs_frequentes:
    - erreur: Croire que $\dfrac{1}{3}$ est décimal parce que la calculatrice affiche 0,333333.
      explication: L'écriture décimale de $\dfrac{1}{3}$ est illimitée ; la calculatrice l'arrondit.
    - erreur: Croire que $\sqrt{9}$ est irrationnel parce qu'il s'écrit avec une racine.
      explication: $\sqrt{9} = 3$ est un entier naturel.
    resume: |
      - $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R}$ : entiers naturels, entiers relatifs, décimaux, rationnels, réels.
      - Un décimal s'écrit $\dfrac{a}{10^n}$ ($a \in \mathbb{Z}$, $n \in \mathbb{N}$) ; un rationnel s'écrit $\dfrac{p}{q}$ ($p \in \mathbb{Z}$, $q \in \mathbb{N}$, $q \neq 0$).
      - $\dfrac{1}{3}$ est rationnel mais pas décimal ; $\sqrt{2}$ et $\pi$ sont irrationnels.
      - Chaque réel est l'abscisse d'un point de la droite numérique, et chaque point de cette droite a pour abscisse un réel.
    cours: |
      ## 1. Les ensembles de nombres
      - $\mathbb{N}$ : les **entiers naturels** $0, 1, 2, 3, \dots$
      - $\mathbb{Z}$ : les **entiers relatifs** $\dots, -2, -1, 0, 1, 2, \dots$
      - $\mathbb{D}$ : les **nombres décimaux**, qui s'écrivent $\dfrac{a}{10^n}$ avec $a \in \mathbb{Z}$ et $n \in \mathbb{N}$ (un nombre fini de chiffres après la virgule). Exemple : $-3{,}17 = \dfrac{-317}{10^2}$.
      - $\mathbb{Q}$ : les **nombres rationnels**, qui s'écrivent $\dfrac{p}{q}$ avec $p \in \mathbb{Z}$ et $q \in \mathbb{N}$, $q \neq 0$.
      - $\mathbb{R}$ : les **nombres réels**, abscisses de tous les points d'une droite graduée, appelée **droite numérique**.

      > **Propriété.** $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R}$.

      Un réel qui n'est pas rationnel est dit **irrationnel**. La géométrie en fournit des exemples : la diagonale d'un carré de côté $1$ mesure $\sqrt{2}$, et le périmètre d'un cercle de diamètre $1$ vaut $\pi$ ; ces deux nombres sont irrationnels.

      ## 2. Un rationnel non décimal
      > **Propriété.** Le nombre $\dfrac{1}{3}$ n'est pas décimal.

      **Démonstration (exigible, par l'absurde).** Supposons que $\dfrac{1}{3}$ soit décimal : il existe $a \in \mathbb{Z}$ et $n \in \mathbb{N}$ tels que $\dfrac{1}{3} = \dfrac{a}{10^n}$, c'est-à-dire $10^n = 3a$. Alors $10^n$ serait un multiple de $3$. Or la somme des chiffres de $10^n$ (un $1$ suivi de zéros) vaut $1$, qui n'est pas divisible par $3$ : $10^n$ n'est pas un multiple de $3$. C'est une contradiction, donc $\dfrac{1}{3}$ n'est pas décimal.

      ## 3. Un réel irrationnel
      > **Propriété.** Le nombre $\sqrt{2}$ est irrationnel.

      **Démonstration (exigible, par l'absurde).** Supposons $\sqrt{2} = \dfrac{p}{q}$ avec $p$ et $q$ entiers naturels non nuls et la fraction **irréductible**. En élevant au carré : $p^2 = 2q^2$, donc $p^2$ est pair. Si $p$ était impair, $p^2$ serait impair (le carré d'un impair est impair) : donc $p$ est pair, $p = 2k$. Alors $4k^2 = 2q^2$, soit $q^2 = 2k^2$ : $q^2$ est pair, donc $q$ est pair. Ainsi $p$ et $q$ sont tous les deux divisibles par $2$, ce qui contredit l'irréductibilité. Donc $\sqrt{2}$ n'est pas rationnel.

      ## 4. Encadrement décimal d'un réel
      Pour un réel $x$ et un entier $n \geqslant 0$, il existe un unique entier $k$ tel que $\dfrac{k}{10^n} \leqslant x < \dfrac{k + 1}{10^n}$ : c'est l'**encadrement décimal de $x$ à $10^{-n}$ près**. Exemple : $1{,}414 \leqslant \sqrt{2} < 1{,}415$ est l'encadrement de $\sqrt{2}$ à $10^{-3}$ près. Un irrationnel n'a jamais d'écriture décimale finie : on ne peut que l'encadrer.

      ### Méthode : trouver le plus petit ensemble qui contient un nombre
      1. Simplifier l'écriture du nombre (fraction irréductible, racine simplifiée).
      2. Tester dans l'ordre : entier naturel ? entier relatif ? décimal (fraction irréductible dont le dénominateur ne contient que des facteurs $2$ et $5$) ? rationnel ?
      3. Sinon, le nombre est irrationnel (cas de $\sqrt{2}$, $\pi$, $3\sqrt{5}$…).

      **Exemple complet.** $\dfrac{21}{12} = \dfrac{7}{4} = 1{,}75 \in \mathbb{D}$ ; $\dfrac{-12}{4} = -3 \in \mathbb{Z}$ ; $\sqrt{\dfrac{9}{4}} = \dfrac{3}{2} = 1{,}5 \in \mathbb{D}$ ; $\dfrac{2}{7} \in \mathbb{Q}$ mais $\dfrac{2}{7} \notin \mathbb{D}$ (son dénominateur contient le facteur $7$).

      ## 5. Erreurs fréquentes
      - Penser que $\dfrac{1}{3} = 0{,}33$ : ce n'est qu'une valeur approchée.
      - Croire qu'un nombre écrit avec une racine est forcément irrationnel : $\sqrt{16} = 4 \in \mathbb{N}$.
      - Oublier qu'un entier est aussi un décimal, un rationnel et un réel.
      - Confondre $\mathbb{D}$ (décimaux) et $\mathbb{Q}$ (rationnels).
    questions:
      - code: 2NDE-ENSEMBLES-01
        difficulte: 1
        type: qcm
        enonce: 'Quel est le plus petit ensemble qui contient $-4$ ? A) $\mathbb{N}$  B) $\mathbb{Z}$  C) $\mathbb{Q}$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$-4$ est un entier négatif : il est dans $\mathbb{Z}$ mais pas dans $\mathbb{N}$.'
          resultat: B
      - code: 2NDE-ENSEMBLES-02
        difficulte: 2
        type: qcm
        enonce: 'Le nombre $\dfrac{7}{8}$ est : A) un entier  B) un décimal  C) un rationnel non décimal'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$\dfrac{7}{8} = \dfrac{875}{1000} = 0{,}875$ : c''est un décimal.'
          resultat: B
      - code: 2NDE-ENSEMBLES-03
        difficulte: 3
        type: qcm
        enonce: 'Lequel de ces nombres est irrationnel ? A) $\sqrt{25}$  B) $\dfrac{22}{7}$  C) $\sqrt{3}$'
        solution: C
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\sqrt{25} = 5$ est entier ; $\dfrac{22}{7}$ est un quotient d'entiers.
          - $\sqrt{3}$ n'est pas rationnel (même raisonnement que pour $\sqrt{2}$).
          resultat: C
      - code: 2NDE-ENSEMBLES-04
        difficulte: 4
        type: qcm
        enonce: 'On veut montrer que $\dfrac{1}{3}$ n''est pas décimal. Si $\dfrac{1}{3} = \dfrac{a}{10^n}$, on obtient $3a = 10^n$. Pourquoi est-ce impossible ? A) Parce que $10^n$ n''est pas divisible par $3$  B) Parce que $a$ serait négatif  C) Parce que $10^n$ est impair'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $3a$ est un multiple de $3$.
          - 'La somme des chiffres de $10^n$ vaut $1$ : $10^n$ n''est pas divisible par $3$.'
          resultat: A
      - code: 2NDE-ENSEMBLES-05
        difficulte: 5
        type: qcm
        enonce: 'Dans la démonstration par l''absurde de l''irrationalité de $\sqrt{2}$, on suppose $\sqrt{2} = \dfrac{p}{q}$ irréductible et on obtient $p^2 = 2q^2$. Quelle est l''étape suivante ? A) $p^2$ est pair, donc $p$ est pair  B) $q$ est impair, donc $p$ l''est aussi  C) $p = q\sqrt{2}$ est entier'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $p^2 = 2q^2$ est pair ; le carré d'un impair est impair, donc $p$ est pair.
          - On écrit ensuite $p = 2k$ et on montre que $q$ est pair aussi, ce qui contredit l'irréductibilité.
          resultat: A

  - code: 2NDE-ENCADR
    libelle: Encadrer et arrondir un nombre réel
    attendus: [2NDE-2026-REELS-09, 2NDE-2026-REELS-10]
    cours_couvre: [2NDE-2026-REELS-09, 2NDE-2026-REELS-10]
    objectifs:
    - Encadrer un réel par deux décimaux d'amplitude donnée.
    - Arrondir un résultat avec un nombre de chiffres significatifs adapté.
    prerequis:
    - 2NDE-ENSEMBLES
    methodes:
    - titre: Encadrer à $10^{-n}$ près
      quand: On demande un encadrement d'amplitude $0{,}1$, $0{,}01$…
      etapes:
      - Écrire une valeur approchée du nombre avec un chiffre de plus que nécessaire.
      - Couper au rang demandé pour la borne inférieure, ajouter $10^{-n}$ pour la borne supérieure.
      exemple:
        enonce: Encadrer $\sqrt{2} \approx 1{,}41421$ à $10^{-2}$ près.
        resolution:
        - Au rang des centièmes, $1{,}41$.
        - $1{,}41 \leqslant \sqrt{2} \leqslant 1{,}42$.
        resultat: $1{,}41 \leqslant \sqrt{2} \leqslant 1{,}42$
    erreurs_frequentes:
    - erreur: Confondre arrondi au centième et troncature.
      explication: $2{,}678$ arrondi au centième donne $2{,}68$ (le chiffre suivant est $8 \geqslant 5$), alors que la troncature donne $2{,}67$.
    - erreur: Donner un résultat avec plus de chiffres significatifs que les données.
      explication: Avec des mesures à 2 chiffres significatifs, le résultat n'en garde pas plus.
    resume: |
      - Encadrer $x$ avec une amplitude $10^{-n}$ : trouver deux décimaux $a < b$ avec $a \leqslant x \leqslant b$ et $b - a = 10^{-n}$.
      - La **troncature** garde les $n$ premières décimales ; l'**arrondi** choisit la valeur la plus proche (on regarde la décimale suivante).
      - Les chiffres significatifs commencent au premier chiffre non nul ; les zéros de tête ne comptent pas.
      - Un résultat ne doit pas avoir plus de chiffres significatifs que la donnée la moins précise.
    cours: |
      ## 1. Encadrement d'amplitude donnée
      Encadrer un réel $x$, c'est trouver deux nombres $a$ et $b$ tels que $a \leqslant x \leqslant b$. Le nombre $b - a$ est l'**amplitude** de l'encadrement.

      > **Définition.** L'encadrement décimal de $x$ d'amplitude $10^{-n}$ est l'encadrement $a \leqslant x < a + 10^{-n}$, où $a$ est un décimal ayant au plus $n$ chiffres après la virgule.

      Exemple : avec $\pi = 3{,}141\,59\dots$, on a $3{,}14 \leqslant \pi < 3{,}15$ (amplitude $10^{-2}$).

      ## 2. Troncature et arrondi
      - La **troncature** à $10^{-n}$ d'un réel positif $x$ est la borne inférieure de cet encadrement : on « coupe » après la $n$-ième décimale.
      - L'**arrondi** à $10^{-n}$ est la borne de l'encadrement la plus proche de $x$ : si la décimale suivante est $5$, $6$, $7$, $8$ ou $9$, on prend la valeur supérieure ; sinon la valeur inférieure.

      **Exemple.** Pour $x = \dfrac{17}{7} = 2{,}428\,571\dots$ : la troncature au centième est $2{,}42$ et l'arrondi au centième est $2{,}43$ (la décimale suivante est $8$).

      ### Méthode : encadrer un nombre
      1. Obtenir suffisamment de décimales (calculatrice ou division posée).
      2. Écrire la troncature $a$ à la précision voulue, puis $a + 10^{-n}$.
      3. Sans calculatrice, pour une racine, encadrer par des carrés : $1{,}7^2 = 2{,}89$ et $1{,}8^2 = 3{,}24$, donc $1{,}7 < \sqrt{3} < 1{,}8$.

      ## 3. Chiffres significatifs
      Les **chiffres significatifs** d'un nombre écrit en décimal sont tous ses chiffres à partir du premier chiffre non nul (en partant de la gauche). Les zéros situés à gauche ne comptent pas ; les zéros situés entre des chiffres non nuls ou à leur droite comptent.

      | Nombre | Notation scientifique | Chiffres significatifs |
      |---|---|---|
      | $0{,}0472$ | $4{,}72 \times 10^{-2}$ | $3$ |
      | $3{,}050$ | $3{,}050$ | $4$ |
      | $120{,}4$ | $1{,}204 \times 10^{2}$ | $4$ |

      > **Règle en sciences.** Un résultat calculé est donné avec le même nombre de chiffres significatifs que la donnée la **moins précise** de l'énoncé.

      **Exemple complet.** Une voiture parcourt $12{,}5$ km en $0{,}35$ h. Sa vitesse moyenne est $v = \dfrac{12{,}5}{0{,}35} = 35{,}714\dots$ km/h. La donnée la moins précise ($0{,}35$) a $2$ chiffres significatifs : on écrit $v \approx 36$ km/h.

      ## 4. Erreurs fréquentes
      - Confondre troncature et arrondi : l'arrondi au dixième de $4{,}87$ est $4{,}9$, sa troncature est $4{,}8$.
      - Compter les zéros de tête comme significatifs : $0{,}005$ n'a qu'un chiffre significatif.
      - Arrondir les résultats intermédiaires : on garde les valeurs exactes (ou la mémoire de la calculatrice) et on arrondit seulement à la fin.
      - Donner un résultat avec trop de décimales, ce qui laisse croire à une précision qu'on n'a pas.
    questions:
      - code: 2NDE-ENCADR-01
        difficulte: 1
        type: qcm
        enonce: 'Quel est l''arrondi au centième de $5{,}876$ ? A) $5{,}87$  B) $5{,}88$  C) $5{,}9$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Le chiffre des millièmes est $6 \geqslant 5$ : on augmente le chiffre des centièmes.'
          resultat: B
      - code: 2NDE-ENCADR-02
        difficulte: 2
        type: qcm
        enonce: 'Sachant que $\sqrt{5} \approx 2{,}2360$, quel est l''encadrement de $\sqrt{5}$ à $10^{-2}$ près ? A) $2{,}23 \leqslant \sqrt{5} \leqslant 2{,}24$  B) $2{,}2 \leqslant \sqrt{5} \leqslant 2{,}3$  C) $2{,}236 \leqslant \sqrt{5} \leqslant 2{,}237$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Au rang des centièmes, $2{,}23$ ; on ajoute $0{,}01$ pour la borne supérieure.
          resultat: A
      - code: 2NDE-ENCADR-03
        difficulte: 3
        type: numerique
        enonce: 'Combien de chiffres significatifs le nombre $0{,}0305$ comporte-t-il ?'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Les chiffres significatifs commencent au premier chiffre non nul en partant de la gauche : ici, c''est le $3$.'
          - 'Les zéros placés avant ce $3$ (dans $0{,}0$) servent seulement à placer la virgule : ils ne sont pas significatifs.'
          - 'Le $0$ situé entre $3$ et $5$ est encadré par des chiffres non nuls : il compte. On compte donc $3$, $0$ et $5$.'
          - 'Contrôle avec la notation scientifique : $0{,}0305 = 3{,}05 \times 10^{-2}$, qui s''écrit avec trois chiffres.'
          resultat: 3
      - code: 2NDE-ENCADR-04
        difficulte: 4
        type: qcm
        enonce: 'Un terrain rectangulaire mesure $12{,}4$ m sur $8{,}65$ m. Quelle valeur de l''aire est donnée avec une précision adaptée ? A) $107{,}26$ m²  B) $107$ m²  C) $100$ m²'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $12{,}4 \times 8{,}65 = 107{,}26$.
          - Les deux données ont trois chiffres significatifs ; on garde trois chiffres significatifs, d'où $107$ m².
          resultat: B
      - code: 2NDE-ENCADR-05
        difficulte: 5
        type: qcm
        enonce: 'On sait que $1{,}41 \leqslant \sqrt{2} \leqslant 1{,}42$. Quel encadrement de $3\sqrt{2} + 1$ en déduit-on ? A) $5{,}23 \leqslant 3\sqrt{2} + 1 \leqslant 5{,}26$  B) $4{,}23 \leqslant 3\sqrt{2} + 1 \leqslant 4{,}26$  C) $5{,}23 \leqslant 3\sqrt{2} + 1 \leqslant 5{,}24$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: On multiplie par $3 > 0$ puis on ajoute $1$, sans changer le sens des inégalités.
          etapes:
          - $4{,}23 \leqslant 3\sqrt{2} \leqslant 4{,}26$.
          - $5{,}23 \leqslant 3\sqrt{2} + 1 \leqslant 5{,}26$ ; l'amplitude a été multipliée par $3$.
          resultat: A
