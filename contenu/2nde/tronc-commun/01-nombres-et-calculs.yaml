chapitre:
  code: 2NDE-NOMBRES
  niveau: 2nde
  parcours: tronc-commun
  ordre: 1
  titre: Nombres et calculs

competences:
  - code: 2NDE-FRAC
    libelle: Calculer avec des fractions
    attendus: [2NDE-2026-ARITH-04, 2NDE-2026-AUTO-02, 2NDE-2026-ALG-09]
    objectifs:
    - Additionner, multiplier et diviser des fractions.
    - Donner un résultat sous forme irréductible.
    methodes:
    - titre: Additionner deux fractions
      quand: Les dénominateurs sont différents.
      etapes:
      - Chercher un dénominateur commun, de préférence le plus petit multiple commun.
      - 'Transformer chaque fraction : multiplier numérateur et dénominateur par le même nombre.'
      - Additionner les numérateurs, garder le dénominateur commun, puis simplifier.
      exemple:
        enonce: Calculer $\dfrac{1}{4} + \dfrac{5}{6}$.
        resolution:
        - 'Dénominateur commun : $12$.'
        - $\dfrac{1}{4} = \dfrac{3}{12}$ et $\dfrac{5}{6} = \dfrac{10}{12}$.
        - $\dfrac{3}{12} + \dfrac{10}{12} = \dfrac{13}{12}$.
        resultat: $\dfrac{13}{12}$
    erreurs_frequentes:
    - erreur: 'Additionner numérateurs et dénominateurs : $\dfrac{1}{2} + \dfrac{1}{3} = \dfrac{2}{5}$.'
      explication: 'On ne peut additionner que des parts de même taille : il faut d''abord un dénominateur commun.'
    - erreur: Diviser par une fraction en divisant les numérateurs et les dénominateurs « en croix ».
      explication: Diviser par $\dfrac{c}{d}$, c'est multiplier par son inverse $\dfrac{d}{c}$.
    resume: |
      - $\dfrac{a}{b} + \dfrac{c}{d} = \dfrac{ad + bc}{bd}$ : on réduit d'abord au même dénominateur.
      - $\dfrac{a}{b} \times \dfrac{c}{d} = \dfrac{ac}{bd}$ : numérateur × numérateur, dénominateur × dénominateur.
      - Diviser par $\dfrac{c}{d}$, c'est multiplier par son inverse $\dfrac{d}{c}$.
      - On simplifie toujours le résultat final.
    cours: |
      ## Addition et soustraction
      Pour additionner deux fractions, il faut qu'elles aient **le même dénominateur**.
      On cherche un multiple commun aux deux dénominateurs (de préférence le plus petit).

      $$\frac{1}{4} + \frac{5}{6} = \frac{3}{12} + \frac{10}{12} = \frac{13}{12}$$

      ## Multiplication
      On multiplie les numérateurs entre eux et les dénominateurs entre eux.
      Simplifier **avant** de multiplier évite les grands nombres :

      $$\frac{6}{35} \times \frac{14}{9} = \frac{6 \times 14}{35 \times 9} = \frac{2 \times 3 \times 2 \times 7}{5 \times 7 \times 3 \times 3} = \frac{4}{15}$$

      ## Division
      Diviser par une fraction non nulle revient à multiplier par son inverse :

      $$\frac{3}{4} \div \frac{9}{8} = \frac{3}{4} \times \frac{8}{9} = \frac{24}{36} = \frac{2}{3}$$
    questions:
      - code: 2NDE-FRAC-01
        difficulte: 1
        type: numerique
        enonce: Calculer 1/2 + 1/3.
        solution: 5/6
        auteur: Brouillon IA (Claude)
        correction:
          methode: Réduire au même dénominateur.
          etapes:
          - 'Dénominateur commun : $6$. $\dfrac{1}{2} = \dfrac{3}{6}$ et $\dfrac{1}{3} = \dfrac{2}{6}$.'
          - $\dfrac{3}{6} + \dfrac{2}{6} = \dfrac{5}{6}$.
          resultat: 5/6
          erreurs_frequentes:
          - Répondre $\dfrac{2}{5}$ en additionnant numérateurs et dénominateurs.
      - code: 2NDE-FRAC-02
        difficulte: 2
        type: numerique
        enonce: Calculer 3/4 × 2/9.
        solution: 1/6
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier les numérateurs entre eux et les dénominateurs entre eux.
          etapes:
          - $\dfrac{3}{4} \times \dfrac{2}{9} = \dfrac{3 \times 2}{4 \times 9} = \dfrac{6}{36}$.
          - $\dfrac{6}{36} = \dfrac{1}{6}$ (on divise par $6$).
          resultat: 1/6
      - code: 2NDE-FRAC-03
        difficulte: 3
        type: numerique
        enonce: Calculer (2/3) ÷ (4/9).
        solution: 3/2
        auteur: Brouillon IA (Claude)
        correction:
          methode: Diviser par une fraction, c'est multiplier par son inverse.
          etapes:
          - $\dfrac{2}{3} \div \dfrac{4}{9} = \dfrac{2}{3} \times \dfrac{9}{4}$.
          - $= \dfrac{18}{12} = \dfrac{3}{2}$.
          resultat: 3/2
      - code: 2NDE-FRAC-04
        difficulte: 2
        type: qcm
        enonce: 'Quelle est la forme irréductible de $\dfrac{4}{9} \times \dfrac{3}{8}$ ? A) $\dfrac{12}{72}$  B) $\dfrac{1}{6}$  C) $\dfrac{2}{12}$'
        solution: B
        source: STACK
        source_url: https://docs.stack-assessment.org/
        licence_source: à vérifier
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Simplifier avant ou après la multiplication.
          etapes:
          - $\dfrac{4}{9} \times \dfrac{3}{8} = \dfrac{12}{72}$.
          - '$\dfrac{12}{72} = \dfrac{1}{6}$ (on divise par $12$) : seule la réponse B est irréductible.'
          resultat: B
      - code: 2NDE-FRAC-05
        difficulte: 4
        type: numerique
        enonce: Calculer $\dfrac{\frac{2}{3} - \frac{1}{4}}{\frac{5}{6}}$ et donner le résultat sous forme de fraction irréductible.
        solution: 1/2
        auteur: Brouillon IA (Claude)
        correction:
          methode: Calculer le numérateur, puis diviser en multipliant par l'inverse.
          etapes:
          - $\dfrac{2}{3} - \dfrac{1}{4} = \dfrac{8}{12} - \dfrac{3}{12} = \dfrac{5}{12}$.
          - $\dfrac{5}{12} \div \dfrac{5}{6} = \dfrac{5}{12} \times \dfrac{6}{5} = \dfrac{6}{12} = \dfrac{1}{2}$.
          resultat: 1/2
      - code: 2NDE-FRAC-06
        difficulte: 5
        type: numerique
        enonce: Un réservoir est rempli aux $\dfrac{3}{5}$. On utilise le tiers de son contenu, puis on ajoute $\dfrac{1}{10}$ de la capacité totale. Quelle fraction du réservoir est alors remplie ?
        solution: 1/2
        auteur: Brouillon IA (Claude)
        correction:
          methode: '« Le tiers du contenu » se calcule en multipliant : $\dfrac{1}{3} \times \dfrac{3}{5}$.'
          etapes:
          - On utilise $\dfrac{1}{3} \times \dfrac{3}{5} = \dfrac{1}{5}$ ; il reste $\dfrac{3}{5} - \dfrac{1}{5} = \dfrac{2}{5}$.
          - $\dfrac{2}{5} + \dfrac{1}{10} = \dfrac{4}{10} + \dfrac{1}{10} = \dfrac{5}{10} = \dfrac{1}{2}$.
          erreurs_frequentes:
          - Retirer $\dfrac{1}{3}$ du réservoir au lieu du tiers de son contenu.
          resultat: 1/2
      - code: 2NDE-FRAC-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {a: {entre: [1, 9]}, b: {entre: [2, 9]}, c: {entre: [1, 9]}, d: {entre: [2, 9]}}
          calculs: {s: "a/b + c/d"}
          conditions: ["b != d", "pgcd(a, b) == 1", "pgcd(c, d) == 1"]
        enonce: 'Calculer $\dfrac{[[a]]}{[[b]]} + \dfrac{[[c]]}{[[d]]}$ (réponse sous forme de fraction).'
        solution: '[[s]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Mettre au même dénominateur, puis simplifier.'
          etapes:
          - 'Dénominateur commun : $[[b]] \times [[d]] = [[b*d]]$.'
          - '$\dfrac{[[a*d]]}{[[b*d]]} + \dfrac{[[c*b]]}{[[b*d]]} = \dfrac{[[a*d + c*b]]}{[[b*d]]}$.'
          - 'Forme irréductible : $[[s:frac]]$.'
          resultat: '[[s]]'

  - code: 2NDE-PUIS
    libelle: Calculer avec des puissances
    attendus: [2NDE-2026-ALG-01, 2NDE-2026-ALG-09, 2NDE-2026-AUTO-03]
    objectifs:
    - Calculer une puissance et appliquer les règles de calcul.
    - Connaitre le signe d'une puissance d'un nombre négatif.
    methodes:
    - titre: Simplifier un produit de puissances de 10
      etapes:
      - Utiliser $10^a \times 10^b = 10^{a+b}$.
      - Se rappeler que $10^{-n} = \dfrac{1}{10^n}$.
      - Écrire le résultat en écriture décimale si demandé.
      exemple:
        enonce: Calculer $10^4 \times 10^{-6}$.
        resolution:
        - $10^4 \times 10^{-6} = 10^{4 + (-6)} = 10^{-2}$.
        - $10^{-2} = \dfrac{1}{100} = 0{,}01$.
        resultat: $0{,}01$
    erreurs_frequentes:
    - erreur: Confondre $2^5$ et $2 \times 5$.
      explication: '$2^5 = 2 \times 2 \times 2 \times 2 \times 2 = 32$ : l''exposant compte les facteurs.'
    - erreur: Penser qu'une puissance d'un nombre négatif est toujours négative.
      explication: 'Le signe dépend de l''exposant : pair donne un résultat positif, impair un résultat négatif.'
    resume: |
      Pour $a \neq 0$ et $m, n$ entiers :
      - $a^m \times a^n = a^{m+n}$ ;  $\dfrac{a^m}{a^n} = a^{m-n}$ ;  $(a^m)^n = a^{mn}$
      - $a^0 = 1$ et $a^{-n} = \dfrac{1}{a^n}$
      - $(-a)^n$ est positif si $n$ est pair, négatif si $n$ est impair.
    cours: |
      ## Définition
      Pour un nombre $a$ et un entier $n \geq 1$, $a^n = \underbrace{a \times a \times \dots \times a}_{n \text{ facteurs}}$.
      Pour $a \neq 0$, on pose $a^0 = 1$ et $a^{-n} = \dfrac{1}{a^n}$.

      ## Règles de calcul
      | Règle | Exemple |
      |-------|---------|
      | $a^m \times a^n = a^{m+n}$ | $2^3 \times 2^4 = 2^7$ |
      | $\dfrac{a^m}{a^n} = a^{m-n}$ | $\dfrac{5^6}{5^2} = 5^4$ |
      | $(a^m)^n = a^{mn}$ | $(3^2)^3 = 3^6$ |
      | $(ab)^n = a^n b^n$ | $(2x)^3 = 8x^3$ |

      ## Signe d'une puissance d'un nombre négatif
      Un produit de facteurs négatifs est positif s'il y en a un nombre pair :
      $(-2)^4 = 16$ mais $(-2)^5 = -32$.

      ## Puissances de 10
      $10^n$ s'écrit avec $n$ zéros, $10^{-n} = 0{,}\underbrace{0\dots0}_{n-1}1$.
      Par exemple $10^{-3} = 0{,}001$.
    questions:
      - code: 2NDE-PUIS-01
        difficulte: 1
        type: numerique
        enonce: Calculer 2⁵.
        solution: 32
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $2^5 = 2 \times 2 \times 2 \times 2 \times 2 = 32$.
          resultat: 32
      - code: 2NDE-PUIS-02
        difficulte: 2
        type: qcm
        enonce: Quel est le signe de (−3)⁷ ? A) positif  B) négatif
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          methode: Le signe d'une puissance d'un nombre négatif dépend de la parité de l'exposant.
          etapes:
          - $(-3)^7$ est un produit de $7$ facteurs négatifs.
          - Un nombre impair de facteurs négatifs donne un produit négatif.
          resultat: B
      - code: 2NDE-PUIS-03
        difficulte: 3
        type: numerique
        enonce: Donner la valeur décimale de 10³ × 10⁻⁵.
        solution: 0.01
        auteur: Brouillon IA (Claude)
        correction:
          methode: $10^a \times 10^b = 10^{a+b}$.
          etapes:
          - $10^3 \times 10^{-5} = 10^{3 - 5} = 10^{-2}$.
          - $10^{-2} = 0{,}01$.
          resultat: 0.01
      - code: 2NDE-PUIS-04
        difficulte: 4
        type: numerique
        enonce: Calculer $\dfrac{2^5 \times 4^3}{8^3}$.
        solution: '4'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Tout écrire en puissances de 2.
          etapes:
          - $4^3 = (2^2)^3 = 2^6$ et $8^3 = (2^3)^3 = 2^9$.
          - $\dfrac{2^5 \times 2^6}{2^9} = 2^{5 + 6 - 9} = 2^2 = 4$.
          resultat: '4'
      - code: 2NDE-PUIS-05
        difficulte: 5
        type: numerique
        enonce: On écrit $\dfrac{(10^{-2})^3 \times 10^5}{10^{-4}}$ sous la forme $10^n$. Donner $n$.
        solution: '3'
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $(10^{-2})^3 = 10^{-6}$, puis $10^{-6} \times 10^5 = 10^{-1}$.
          - $\dfrac{10^{-1}}{10^{-4}} = 10^{-1 - (-4)} = 10^3$.
          erreurs_frequentes:
          - Calculer $-1 - 4$ au lieu de $-1 - (-4)$ au dénominateur.
          resultat: '3'
      - code: 2NDE-PUIS-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {m: {entre: [-5, 9]}, n: {entre: [-5, 9]}, p: {entre: [-4, 6]}}
          calculs: {e: "m + n - p"}
        enonce: 'On écrit $\dfrac{10^{[[m]]} \times 10^{[[n]]}}{10^{[[p]]}}$ sous la forme $10^k$. Donner $k$.'
        solution: '[[e]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Produit : on ajoute les exposants ; quotient : on les soustrait.'
          etapes:
          - '$10^{[[m]]} \times 10^{[[n]]} = 10^{[[m + n]]}$.'
          - '$\dfrac{10^{[[m + n]]}}{10^{[[p]]}} = 10^{[[m + n]] - ([[p]])} = 10^{[[e]]}$.'
          resultat: '[[e]]'

  - code: 2NDE-RAC
    libelle: Calculer avec des racines carrées
    attendus: [2NDE-2026-ALG-01, 2NDE-2026-ALG-09, 2NDE-2026-ALG-15]
    objectifs:
    - Calculer avec des racines carrées et simplifier $\sqrt{a}$.
    - Écrire un quotient sans racine carrée au dénominateur.
    prerequis:
    - 2NDE-PUIS
    methodes:
    - titre: Simplifier une racine carrée
      etapes:
      - Écrire le nombre sous la racine comme produit d'un carré parfait ($4$, $9$, $16$, $25$…) et d'un entier.
      - Utiliser $\sqrt{a \times b} = \sqrt{a} \times \sqrt{b}$ pour $a, b \geq 0$.
      exemple:
        enonce: Simplifier $\sqrt{50}$.
        resolution:
        - $50 = 25 \times 2$, et $25$ est un carré parfait.
        - $\sqrt{50} = \sqrt{25} \times \sqrt{2} = 5\sqrt{2}$.
        resultat: $5\sqrt{2}$
    erreurs_frequentes:
    - erreur: Écrire $\sqrt{a + b} = \sqrt{a} + \sqrt{b}$.
      explication: 'C''est faux : $\sqrt{9 + 16} = \sqrt{25} = 5$ alors que $\sqrt{9} + \sqrt{16} = 7$.'
    resume: |
      - Pour $a \geq 0$ : $\sqrt{a}$ est le nombre positif dont le carré vaut $a$, et $(\sqrt{a})^2 = a$.
      - Pour $a, b \geq 0$ : $\sqrt{ab} = \sqrt{a}\sqrt{b}$, mais en général $\sqrt{a + b} \neq \sqrt{a} + \sqrt{b}$.
      - Simplifier : faire apparaître un carré parfait, $\sqrt{12} = \sqrt{4 \times 3} = 2\sqrt{3}$.
      - Supprimer une racine au dénominateur : $\dfrac{1}{\sqrt{2}} = \dfrac{\sqrt{2}}{2}$.
    cours: |
      ## Définition
      Pour un nombre $a \geq 0$, $\sqrt{a}$ est l'unique nombre **positif** dont le carré est $a$ :
      $\sqrt{25} = 5$ (et non $-5$). Pour tout $a \geq 0$, $(\sqrt{a})^2 = a$.

      ## Produits et quotients
      Pour $a \geq 0$ et $b > 0$ : $\sqrt{a \times b} = \sqrt{a} \times \sqrt{b}$ et $\sqrt{\dfrac{a}{b}} = \dfrac{\sqrt{a}}{\sqrt{b}}$.

      **Piège** : pas de règle pour les sommes. $\sqrt{9 + 16} = \sqrt{25} = 5$, alors que $\sqrt{9} + \sqrt{16} = 7$.

      ## Simplifier $\sqrt{a}$
      On cherche le plus grand carré parfait qui divise $a$ :
      $$\sqrt{50} = \sqrt{25 \times 2} = 5\sqrt{2}.$$

      ## Racine au dénominateur
      On multiplie numérateur et dénominateur par la racine :
      $$\frac{3}{\sqrt{5}} = \frac{3\sqrt{5}}{\sqrt{5} \times \sqrt{5}} = \frac{3\sqrt{5}}{5}.$$
    questions:
      - code: 2NDE-RAC-01
        difficulte: 1
        type: numerique
        enonce: 'Calculer $\sqrt{49}$.'
        solution: 7
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $7^2 = 49$ et $7 \geq 0$, donc $\sqrt{49} = 7$.
          resultat: 7
      - code: 2NDE-RAC-02
        difficulte: 2
        type: numerique
        enonce: 'Calculer $\left(\sqrt{5}\right)^2$.'
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          methode: Pour $a \geq 0$, $\left(\sqrt{a}\right)^2 = a$.
          etapes:
          - $\left(\sqrt{5}\right)^2 = 5$.
          resultat: 5
      - code: 2NDE-RAC-03
        difficulte: 3
        type: qcm
        enonce: 'Écrire $\sqrt{12}$ sous la forme $a\sqrt{b}$, avec $b$ entier le plus petit possible : A) $4\sqrt{3}$  B) $2\sqrt{3}$  C) $3\sqrt{2}$  D) $6\sqrt{2}$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          methode: Faire apparaitre un carré parfait sous la racine.
          etapes:
          - $12 = 4 \times 3$.
          - $\sqrt{12} = \sqrt{4} \times \sqrt{3} = 2\sqrt{3}$.
          resultat: B
          erreurs_frequentes:
          - Répondre $4\sqrt{3}$ en oubliant de prendre la racine de $4$.
      - code: 2NDE-RAC-04
        difficulte: 3
        type: qcm
        enonce: 'Laquelle de ces écritures de $\dfrac{1}{\sqrt{2}}$ n''a pas de racine carrée au dénominateur ? A) $\dfrac{\sqrt{2}}{2}$  B) $\dfrac{1}{\sqrt{2}}$  C) $\dfrac{2}{2\sqrt{2}}$'
        solution: A
        source: STACK
        source_url: https://docs.stack-assessment.org/
        licence_source: à vérifier
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier numérateur et dénominateur par la racine du dénominateur.
          etapes:
          - $\dfrac{1}{\sqrt{2}} = \dfrac{1 \times \sqrt{2}}{\sqrt{2} \times \sqrt{2}} = \dfrac{\sqrt{2}}{2}$.
          - Les écritures B et C ont encore une racine au dénominateur.
          resultat: A
      - code: 2NDE-RAC-05
        difficulte: 4
        type: numerique
        enonce: On écrit $\sqrt{50} + \sqrt{18} - \sqrt{8}$ sous la forme $a\sqrt{2}$. Donner $a$.
        solution: '6'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Faire apparaitre un carré parfait : $\sqrt{a^2 b} = a\sqrt{b}$.'
          etapes:
          - $\sqrt{50} = 5\sqrt{2}$, $\sqrt{18} = 3\sqrt{2}$, $\sqrt{8} = 2\sqrt{2}$.
          - $5\sqrt{2} + 3\sqrt{2} - 2\sqrt{2} = 6\sqrt{2}$.
          erreurs_frequentes:
          - 'Écrire $\sqrt{50} + \sqrt{18} = \sqrt{68}$ : la racine d''une somme n''est pas la somme des racines.'
          resultat: '6'
      - code: 2NDE-RAC-06
        difficulte: 5
        type: numerique
        enonce: Écrire $\dfrac{2}{\sqrt{3} - 1}$ sans racine au dénominateur (valeur exacte).
        solution: sqrt(3) + 1
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier en haut et en bas par la quantité conjuguée.
          etapes:
          - $\dfrac{2(\sqrt{3} + 1)}{(\sqrt{3} - 1)(\sqrt{3} + 1)} = \dfrac{2(\sqrt{3} + 1)}{3 - 1}$.
          - $= \sqrt{3} + 1$.
          resultat: sqrt(3) + 1
      - code: 2NDE-RAC-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {k: {entre: [2, 7]}, b: {parmi: [2, 3, 5, 6, 7]}}
          calculs: {n: "k*k*b"}
        enonce: 'Écrire $\sqrt{[[n]]}$ sous la forme $a\sqrt{b}$ avec $b$ entier le plus petit possible (réponse du type 3sqrt(2)).'
        solution: '[[k]]sqrt([[b]])'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Faire apparaître le plus grand carré parfait qui divise le nombre.'
          etapes:
          - '$[[n]] = [[k*k]] \times [[b]]$, et $[[k*k]] = [[k]]^2$.'
          - '$\sqrt{[[n]]} = \sqrt{[[k*k]]} \times \sqrt{[[b]]} = [[k]]\sqrt{[[b]]}$.'
          resultat: '[[k]]sqrt([[b]])'

  - code: 2NDE-ENSEMBLES
    libelle: Reconnaître les ensembles de nombres
    attendus: [2NDE-2026-REELS-01, 2NDE-2026-REELS-05, 2NDE-2026-REELS-06, 2NDE-2026-REELS-11, 2NDE-2026-REELS-12, 2NDE-2026-ARITH-01]
    objectifs:
    - Situer un nombre dans le plus petit des ensembles ℕ, ℤ, 𝔻, ℚ, ℝ.
    - Savoir que √2 et π sont irrationnels et que 1/3 n'est pas décimal.
    prerequis:
    - 2NDE-FRAC
    methodes:
    - titre: Trouver le plus petit ensemble contenant un nombre
      quand: On doit dire si un nombre est entier, décimal, rationnel ou irrationnel.
      etapes:
      - Simplifier l'écriture du nombre (fraction irréductible, racine simplifiée).
      - Tester dans l'ordre ℕ, ℤ, 𝔻 (s'écrit a/10ⁿ), ℚ (s'écrit a/b).
      - Un nombre qui n'est dans aucun des quatre est irrationnel.
      exemple:
        enonce: Dans quel plus petit ensemble se trouve $\dfrac{21}{4}$ ?
        resolution:
        - $\dfrac{21}{4} = \dfrac{525}{100} = 5{,}25$.
        - Ce n'est pas un entier, mais c'est un décimal.
        resultat: 𝔻
    erreurs_frequentes:
    - erreur: Croire que $\dfrac{1}{3}$ est décimal parce que la calculatrice affiche 0,333333.
      explication: L'écriture décimale de $\dfrac{1}{3}$ est illimitée ; la calculatrice l'arrondit.
    - erreur: Croire que $\sqrt{9}$ est irrationnel parce qu'il s'écrit avec une racine.
      explication: $\sqrt{9} = 3$ est un entier naturel.
    resume: |
      - $\mathbb{N} \subset \mathbb{Z} \subset \mathbb{D} \subset \mathbb{Q} \subset \mathbb{R}$.
      - Décimal : s'écrit $\dfrac{a}{10^n}$ avec $a$ entier ; rationnel : s'écrit $\dfrac{a}{b}$ avec $a, b$ entiers, $b \neq 0$.
      - $\dfrac{1}{3}$ est rationnel mais pas décimal ; $\sqrt{2}$ et $\pi$ sont irrationnels.
      - Tout réel est l'abscisse d'un point de la droite numérique.
    cours: |
      ## Les ensembles de nombres
      | Ensemble | Nombres | Exemples |
      |---|---|---|
      | $\mathbb{N}$ | entiers naturels | $0$, $7$, $\sqrt{16}$ |
      | $\mathbb{Z}$ | entiers relatifs | $-3$, $12$ |
      | $\mathbb{D}$ | décimaux $\dfrac{a}{10^n}$ | $2{,}5$, $-0{,}125$, $\dfrac{3}{4}$ |
      | $\mathbb{Q}$ | rationnels $\dfrac{a}{b}$ | $\dfrac{1}{3}$, $\dfrac{-7}{6}$ |
      | $\mathbb{R}$ | réels, abscisses des points d'une droite graduée | $\sqrt{2}$, $\pi$ |

      Chaque ensemble est inclus dans le suivant.

      ## $\dfrac{1}{3}$ n'est pas décimal
      Si $\dfrac{1}{3} = \dfrac{a}{10^n}$, alors $3a = 10^n$. Or $3a$ est divisible par $3$ et $10^n$ ne l'est pas (la somme de ses chiffres vaut $1$) : c'est impossible.

      ## $\sqrt{2}$ est irrationnel
      Supposons $\sqrt{2} = \dfrac{p}{q}$ avec une fraction irréductible. Alors $p^2 = 2q^2$ : $p^2$ est pair, donc $p$ est pair, $p = 2k$. Il vient $4k^2 = 2q^2$, soit $q^2 = 2k^2$ : $q$ est pair aussi. La fraction n'était pas irréductible : contradiction (raisonnement par l'absurde).
    questions:
      - code: 2NDE-ENSEMBLES-01
        difficulte: 1
        type: qcm
        enonce: 'Quel est le plus petit ensemble qui contient $-4$ ? A) $\mathbb{N}$  B) $\mathbb{Z}$  C) $\mathbb{Q}$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$-4$ est un entier négatif : il est dans $\mathbb{Z}$ mais pas dans $\mathbb{N}$.'
          resultat: B
      - code: 2NDE-ENSEMBLES-02
        difficulte: 2
        type: qcm
        enonce: 'Le nombre $\dfrac{7}{8}$ est : A) un entier  B) un décimal  C) un rationnel non décimal'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$\dfrac{7}{8} = \dfrac{875}{1000} = 0{,}875$ : c''est un décimal.'
          resultat: B
      - code: 2NDE-ENSEMBLES-03
        difficulte: 3
        type: qcm
        enonce: 'Lequel de ces nombres est irrationnel ? A) $\sqrt{25}$  B) $\dfrac{22}{7}$  C) $\sqrt{3}$'
        solution: C
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\sqrt{25} = 5$ est entier ; $\dfrac{22}{7}$ est un quotient d'entiers.
          - $\sqrt{3}$ n'est pas rationnel (même raisonnement que pour $\sqrt{2}$).
          resultat: C
      - code: 2NDE-ENSEMBLES-04
        difficulte: 4
        type: qcm
        enonce: 'On veut montrer que $\dfrac{1}{3}$ n''est pas décimal. Si $\dfrac{1}{3} = \dfrac{a}{10^n}$, on obtient $3a = 10^n$. Pourquoi est-ce impossible ? A) Parce que $10^n$ n''est pas divisible par $3$  B) Parce que $a$ serait négatif  C) Parce que $10^n$ est impair'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $3a$ est un multiple de $3$.
          - 'La somme des chiffres de $10^n$ vaut $1$ : $10^n$ n''est pas divisible par $3$.'
          resultat: A
      - code: 2NDE-ENSEMBLES-05
        difficulte: 5
        type: qcm
        enonce: 'Dans la démonstration par l''absurde de l''irrationalité de $\sqrt{2}$, on suppose $\sqrt{2} = \dfrac{p}{q}$ irréductible et on obtient $p^2 = 2q^2$. Quelle est l''étape suivante ? A) $p^2$ est pair, donc $p$ est pair  B) $q$ est impair, donc $p$ l''est aussi  C) $p = q\sqrt{2}$ est entier'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $p^2 = 2q^2$ est pair ; le carré d'un impair est impair, donc $p$ est pair.
          - On écrit ensuite $p = 2k$ et on montre que $q$ est pair aussi, ce qui contredit l'irréductibilité.
          resultat: A

  - code: 2NDE-ENCADR
    libelle: Encadrer et arrondir un nombre réel
    attendus: [2NDE-2026-REELS-09, 2NDE-2026-REELS-10]
    objectifs:
    - Encadrer un réel par deux décimaux d'amplitude donnée.
    - Arrondir un résultat avec un nombre de chiffres significatifs adapté.
    prerequis:
    - 2NDE-ENSEMBLES
    methodes:
    - titre: Encadrer à $10^{-n}$ près
      quand: On demande un encadrement d'amplitude $0{,}1$, $0{,}01$…
      etapes:
      - Écrire une valeur approchée du nombre avec un chiffre de plus que nécessaire.
      - Couper au rang demandé pour la borne inférieure, ajouter $10^{-n}$ pour la borne supérieure.
      exemple:
        enonce: Encadrer $\sqrt{2} \approx 1{,}41421$ à $10^{-2}$ près.
        resolution:
        - Au rang des centièmes, $1{,}41$.
        - $1{,}41 \leqslant \sqrt{2} \leqslant 1{,}42$.
        resultat: $1{,}41 \leqslant \sqrt{2} \leqslant 1{,}42$
    erreurs_frequentes:
    - erreur: Confondre arrondi au centième et troncature.
      explication: $2{,}678$ arrondi au centième donne $2{,}68$ (le chiffre suivant est $8 \geqslant 5$), alors que la troncature donne $2{,}67$.
    - erreur: Donner un résultat avec plus de chiffres significatifs que les données.
      explication: Avec des mesures à 2 chiffres significatifs, le résultat n'en garde pas plus.
    resume: |
      - Encadrement d'amplitude $10^{-n}$ : $a \leqslant x \leqslant a + 10^{-n}$ avec $a$ décimal à $n$ chiffres après la virgule.
      - Arrondi : on regarde le chiffre suivant ($\geqslant 5$ : on augmente).
      - Les chiffres significatifs se comptent à partir du premier chiffre non nul.
      - On arrondit le résultat final au même nombre de chiffres significatifs que la donnée la moins précise.
    cours: |
      ## Encadrement décimal
      $\pi \approx 3{,}14159$ : à $10^{-1}$ près, $3{,}1 \leqslant \pi \leqslant 3{,}2$ ; à $10^{-3}$ près, $3{,}141 \leqslant \pi \leqslant 3{,}142$.

      ## Arrondi
      $3{,}14159$ arrondi au millième : $3{,}142$. Arrondi à l'unité : $3$.

      ## Chiffres significatifs
      $0{,}00450$ a trois chiffres significatifs ($4$, $5$, $0$) ; $1\,200$ en a deux, trois ou quatre selon la précision de la mesure.
      Un rectangle de $2{,}3$ m sur $4{,}7$ m a une aire de $10{,}81$ m², qu'on arrondit à $11$ m² (deux chiffres significatifs, comme les données).
    questions:
      - code: 2NDE-ENCADR-01
        difficulte: 1
        type: qcm
        enonce: 'Quel est l''arrondi au centième de $5{,}876$ ? A) $5{,}87$  B) $5{,}88$  C) $5{,}9$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Le chiffre des millièmes est $6 \geqslant 5$ : on augmente le chiffre des centièmes.'
          resultat: B
      - code: 2NDE-ENCADR-02
        difficulte: 2
        type: qcm
        enonce: 'Sachant que $\sqrt{5} \approx 2{,}2360$, quel est l''encadrement de $\sqrt{5}$ à $10^{-2}$ près ? A) $2{,}23 \leqslant \sqrt{5} \leqslant 2{,}24$  B) $2{,}2 \leqslant \sqrt{5} \leqslant 2{,}3$  C) $2{,}236 \leqslant \sqrt{5} \leqslant 2{,}237$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Au rang des centièmes, $2{,}23$ ; on ajoute $0{,}01$ pour la borne supérieure.
          resultat: A
      - code: 2NDE-ENCADR-03
        difficulte: 3
        type: numerique
        enonce: 'Combien de chiffres significatifs le nombre $0{,}0305$ comporte-t-il ?'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Les zéros de tête ne comptent pas ; on compte $3$, $0$, $5$.
          resultat: 3
      - code: 2NDE-ENCADR-04
        difficulte: 4
        type: qcm
        enonce: 'Un terrain rectangulaire mesure $12{,}4$ m sur $8{,}65$ m. Quelle valeur de l''aire est donnée avec une précision adaptée ? A) $107{,}26$ m²  B) $107$ m²  C) $100$ m²'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $12{,}4 \times 8{,}65 = 107{,}26$.
          - Les deux données ont trois chiffres significatifs ; on garde trois chiffres significatifs, d'où $107$ m².
          resultat: B
      - code: 2NDE-ENCADR-05
        difficulte: 5
        type: qcm
        enonce: 'On sait que $1{,}41 \leqslant \sqrt{2} \leqslant 1{,}42$. Quel encadrement de $3\sqrt{2} + 1$ en déduit-on ? A) $5{,}23 \leqslant 3\sqrt{2} + 1 \leqslant 5{,}26$  B) $4{,}23 \leqslant 3\sqrt{2} + 1 \leqslant 4{,}26$  C) $5{,}23 \leqslant 3\sqrt{2} + 1 \leqslant 5{,}24$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: On multiplie par $3 > 0$ puis on ajoute $1$, sans changer le sens des inégalités.
          etapes:
          - $4{,}23 \leqslant 3\sqrt{2} \leqslant 4{,}26$.
          - $5{,}23 \leqslant 3\sqrt{2} + 1 \leqslant 5{,}26$ ; l'amplitude a été multipliée par $3$.
          resultat: A
