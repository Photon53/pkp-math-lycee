# Partie transversale « Vocabulaire ensembliste et logique » du programme de seconde 2026.
# Rédaction : brouillon IA, à relire par un professeur de mathématiques avant toute validation.
chapitre:
  code: 2NDE-LOGIQUE
  niveau: 2nde
  parcours: tronc-commun
  ordre: 15
  titre: Ensembles, logique et raisonnement

competences:
  - code: 2NDE-ENS-LOG
    libelle: Utiliser le vocabulaire des ensembles et les connecteurs logiques
    attendus: [2NDE-2026-LOGIQUE-01, 2NDE-2026-LOGIQUE-02, 2NDE-2026-LOGIQUE-03, 2NDE-2026-LOGIQUE-04, 2NDE-2026-LOGIQUE-08]
    objectifs:
    - Utiliser appartenance, inclusion, réunion, intersection et complémentaire.
    - Lire et écrire des propositions avec « et », « ou », « pour tout », « il existe ».
    - Formuler la négation d'une proposition simple.
    methodes:
    - titre: Nier une proposition avec « et » ou « ou »
      quand: On doit écrire le contraire d'une proposition composée.
      etapes:
      - Nier chaque proposition élémentaire.
      - Échanger « et » et « ou ».
      exemple:
        enonce: Nier « $x > 2$ et $x < 5$ ».
        resolution:
        - Négation de $x > 2$ $:$ $x \leqslant 2$ ; de $x < 5$ $:$ $x \geqslant 5$.
        - Le « et » devient « ou ».
        resultat: « $x \leqslant 2$ ou $x \geqslant 5$ »
    erreurs_frequentes:
    - erreur: Nier « $x > 3$ » par « $x < 3$ ».
      explication: La négation de $x > 3$ est $x \leqslant 3$ $:$ le cas $x = 3$ en fait partie.
    - erreur: Croire que « ou » est exclusif en mathématiques.
      explication: « $A$ ou $B$ » est vraie si au moins l'une des deux l'est, éventuellement les deux.
    resume: |
      - $x \in A$ : $x$ appartient à $A$ ; $A \subset B$ : tout élément de $A$ est dans $B$.
      - $A \cap B$ : éléments communs ; $A \cup B$ : éléments de $A$ ou de $B$ ; $\bar{A}$ : éléments de $E$ hors de $A$.
      - Non (P et Q) = (non P) ou (non Q) ; non (P ou Q) = (non P) et (non Q).
      - « Pour tout $x$, P » est fausse dès qu'un $x$ ne vérifie pas P ; « il existe $x$ tel que P » est vraie dès qu'un $x$ convient.
    cours: |
      ## Ensembles
      Avec $E = \{1, 2, \ldots, 10\}$, $A = \{2, 4, 6, 8, 10\}$ (pairs) et $B = \{1, 2, 3, 4\}$ :
      $A \cap B = \{2, 4\}$, $A \cup B = \{1, 2, 3, 4, 6, 8, 10\}$, $\bar{A} = \{1, 3, 5, 7, 9\}$, $\text{Card}(A) = 5$.

      ## Propositions et connecteurs
      Une proposition est un énoncé vrai ou faux. « $x$ est pair et $x > 5$ » est vraie pour $x = 6$, fausse pour $x = 4$.

      ## Quantificateurs
      « Pour tout réel $x$, $x^2 \geqslant 0$ » est vraie. « Il existe un réel $x$ tel que $x^2 = 2$ » est vraie ($x = \sqrt{2}$).

      ## Négation
      La négation de « pour tout $x$, P » est « il existe $x$ tel que non P ».
    questions:
      - code: 2NDE-ENS-LOG-01
        difficulte: 1
        type: qcm
        enonce: 'Avec $M = \{2, 4, 6, 8\}$ et $N = \{1, 2, 3, 4\}$, que vaut $M \cap N$ ? A) $\{2, 4\}$  B) $\{1, 2, 3, 4, 6, 8\}$  C) $\{6, 8\}$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - L'intersection contient les éléments communs aux deux ensembles $:$ $2$ et $4$.
          resultat: A
      - code: 2NDE-ENS-LOG-02
        difficulte: 2
        type: numerique
        enonce: 'Avec $M = \{2, 4, 6, 8\}$ et $N = \{1, 2, 3, 4\}$, combien d''éléments l''ensemble $M \cup N$ contient-il ?'
        solution: 6
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $M \cup N = \{1, 2, 3, 4, 6, 8\}$, soit $6$ éléments.
          resultat: 6
      - code: 2NDE-ENS-LOG-03
        difficulte: 3
        type: qcm
        enonce: 'Quelle est la négation de « $x > 2$ et $x < 5$ » ? A) « $x \leqslant 2$ ou $x \geqslant 5$ »  B) « $x \leqslant 2$ et $x \geqslant 5$ »  C) « $x < 2$ ou $x > 5$ »'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - On nie chaque inégalité (inégalités larges) et « et » devient « ou ».
          resultat: A
      - code: 2NDE-ENS-LOG-04
        difficulte: 4
        type: qcm
        enonce: 'La proposition « pour tout réel $x$, $x^2 > x$ » est-elle vraie ? A) Oui  B) Non, $x = \frac{1}{2}$ est un contre-exemple  C) Non, car aucun réel ne la vérifie'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Pour $x = \frac{1}{2}$ $:$ $x^2 = \frac{1}{4} < \frac{1}{2}$.
          - Un seul contre-exemple suffit à montrer qu'une proposition « pour tout » est fausse ; mais $x = 3$ la vérifie, donc C est faux.
          resultat: B
      - code: 2NDE-ENS-LOG-05
        difficulte: 5
        type: qcm
        enonce: 'Quelle est la négation de « tous les élèves de la classe ont la moyenne » ? A) « aucun élève n''a la moyenne »  B) « au moins un élève n''a pas la moyenne »  C) « tous les élèves ont moins que la moyenne »'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - La négation de « pour tout » est « il existe … tel que non … ».
          - Il suffit d'un élève sans la moyenne pour que la phrase soit fausse.
          resultat: B

  - code: 2NDE-RAISON
    libelle: Raisonner avec implications, réciproques et contre-exemples
    attendus: [2NDE-2026-LOGIQUE-05, 2NDE-2026-LOGIQUE-06, 2NDE-2026-LOGIQUE-07, 2NDE-2026-LOGIQUE-09]
    objectifs:
    - Formuler une implication, sa réciproque et sa contraposée.
    - Utiliser un contre-exemple, la disjonction des cas et le raisonnement par l'absurde.
    prerequis:
    - 2NDE-ENS-LOG
    methodes:
    - titre: Écrire la réciproque et la contraposée
      quand: On dispose d'une implication « si P, alors Q ».
      etapes:
      - Réciproque $:$ échanger P et Q $:$ « si Q, alors P ».
      - Contraposée $:$ échanger et nier $:$ « si non Q, alors non P ».
      - Une implication et sa contraposée sont toujours vraies ou fausses ensemble ; la réciproque peut être fausse.
      exemple:
        enonce: « Si $x = 3$, alors $x^2 = 9$. »
        resolution:
        - Réciproque $:$ « si $x^2 = 9$, alors $x = 3$ » (fausse $:$ $x = -3$).
        - Contraposée $:$ « si $x^2 \neq 9$, alors $x \neq 3$ » (vraie).
        resultat: implication vraie, réciproque fausse
    erreurs_frequentes:
    - erreur: Croire qu'une implication vraie a une réciproque vraie.
      explication: « Si un nombre est multiple de $4$, il est pair » est vraie, mais $6$ est pair sans être multiple de $4$.
    - erreur: Démontrer une proposition « pour tout » avec un seul exemple.
      explication: Un exemple ne prouve rien pour tous les cas ; seul un contre-exemple suffit, pour montrer qu'elle est fausse.
    resume: |
      - « Si P, alors Q » : $P \Rightarrow Q$. Réciproque : $Q \Rightarrow P$. Contraposée : non $Q \Rightarrow$ non $P$.
      - $P \iff Q$ : l'implication et sa réciproque sont vraies.
      - Contre-exemple : un cas où P est vraie et Q fausse suffit à montrer que $P \Rightarrow Q$ est fausse.
      - Disjonction des cas : on étudie séparément tous les cas possibles. Absurde : on suppose le contraire et on aboutit à une contradiction.
    cours: |
      ## Implication et réciproque
      « Si un quadrilatère est un carré, alors c'est un rectangle » est vraie ; sa réciproque est fausse.

      ## Contraposée
      « Si $n^2$ est pair, alors $n$ est pair » équivaut à sa contraposée « si $n$ est impair, alors $n^2$ est impair », facile à démontrer : $(2k + 1)^2 = 2(2k^2 + 2k) + 1$.

      ## Disjonction des cas
      Pour tout entier $n$, $n(n + 1)$ est pair : si $n$ est pair, le facteur $n$ l'est ; si $n$ est impair, $n + 1$ est pair.

      ## Raisonnement par l'absurde
      Voir la démonstration de l'irrationalité de $\sqrt{2}$ (chapitre « Nombres et calculs »).
    questions:
      - code: 2NDE-RAISON-01
        difficulte: 1
        type: qcm
        enonce: 'Quelle est la réciproque de « si $x = 3$, alors $x^2 = 9$ » ? A) « si $x^2 = 9$, alors $x = 3$ »  B) « si $x \neq 3$, alors $x^2 \neq 9$ »  C) « si $x^2 \neq 9$, alors $x \neq 3$ »'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - La réciproque échange l'hypothèse et la conclusion.
          resultat: A
      - code: 2NDE-RAISON-02
        difficulte: 2
        type: qcm
        enonce: 'Quelle est la contraposée de « si un nombre est multiple de $6$, alors il est pair » ? A) « si un nombre est pair, il est multiple de $6$ »  B) « si un nombre n''est pas pair, il n''est pas multiple de $6$ »  C) « si un nombre n''est pas multiple de $6$, il n''est pas pair »'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - La contraposée de « si P, alors Q » est « si non Q, alors non P ».
          resultat: B
      - code: 2NDE-RAISON-03
        difficulte: 3
        type: numerique
        enonce: 'On affirme : « pour tout entier $n$, $n^2 + n + 41$ est premier ». Donner le plus petit entier naturel $n$ qui fournit un contre-exemple, sachant qu''il est inférieur à $50$ et que $n^2 + n + 41$ est alors un multiple de $41$.'
        solution: 40
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Pour $n = 40$ $:$ $1\,600 + 40 + 41 = 1\,681 = 41^2$, qui n'est pas premier.
          - Pour $n$ de $0$ à $39$, la formule donne des nombres premiers.
          resultat: 40
      - code: 2NDE-RAISON-04
        difficulte: 4
        type: qcm
        enonce: 'On veut montrer que, pour tout entier $n$, $n(n + 1)$ est pair. Quel type de raisonnement est le plus adapté ? A) Un exemple bien choisi  B) Une disjonction des cas selon la parité de $n$  C) Un contre-exemple'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Si $n$ est pair, $n$ est un facteur pair ; si $n$ est impair, $n + 1$ est pair.
          - Les deux cas couvrent tous les entiers.
          resultat: B
      - code: 2NDE-RAISON-05
        difficulte: 5
        type: qcm
        enonce: 'Laquelle de ces équivalences est vraie pour tout réel $x$ ? A) $x^2 = 4 \iff x = 2$  B) $x^2 = 4 \iff (x = 2$ ou $x = -2)$  C) $x^2 = 4 \iff (x = 2$ et $x = -2)$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $x^2 = 4 \iff x^2 - 4 = 0 \iff (x - 2)(x + 2) = 0$.
          - Un produit est nul si l'un des facteurs l'est $:$ « ou ».
          resultat: B
