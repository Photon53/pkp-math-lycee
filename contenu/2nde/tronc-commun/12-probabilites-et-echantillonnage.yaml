chapitre:
  code: 2NDE-PROBAS
  niveau: 2nde
  parcours: tronc-commun
  ordre: 12
  titre: Probabilités et échantillonnage

competences:
  - code: 2NDE-PROBA
    libelle: Calculer des probabilités
    attendus: [2NDE-2026-AUTO-27, 2NDE-2026-AUTO-28, 2NDE-2026-AUTO-29, 2NDE-2026-AUTO-30]
    objectifs:
    - Calculer des probabilités en situation d'équiprobabilité.
    - Utiliser l'évènement contraire et la formule de la réunion.
    methodes:
    - titre: Calculer une probabilité avec un tableau à double entrée
      quand: L'expérience combine deux épreuves (deux dés, deux pièces).
      etapes:
      - Construire le tableau de toutes les issues, toutes équiprobables.
      - Compter les issues favorables.
      - Diviser par le nombre total d'issues.
      exemple:
        enonce: 'Deux dés : probabilité d''un double ?'
        resolution:
        - $36$ issues, dont $6$ doubles.
        - $P = \dfrac{6}{36} = \dfrac{1}{6}$.
        resultat: $\dfrac{1}{6}$
    erreurs_frequentes:
    - erreur: Additionner $P(A)$ et $P(B)$ quand $A$ et $B$ peuvent arriver ensemble.
      explication: '$P(A \cup B) = P(A) + P(B) - P(A \cap B)$ : on retire ce qui est compté deux fois.'
    resume: |
      - En situation d'équiprobabilité : $P(A) = \dfrac{\text{nombre d'issues favorables}}{\text{nombre total d'issues}}$.
      - Événement contraire : $P(\bar A) = 1 - P(A)$.
      - Réunion : $P(A \cup B) = P(A) + P(B) - P(A \cap B)$.
      - Pour deux épreuves, un tableau à double entrée ou un arbre liste toutes les issues.
    cours: |
      ## Équiprobabilité
      Avec un dé équilibré, $P(\text{« 5 ou 6 »}) = \dfrac{2}{6} = \dfrac{1}{3}$.

      ## Contraire
      « Au moins une face » avec deux pièces : le contraire est « deux piles », de probabilité $\dfrac{1}{4}$, donc $P = 1 - \dfrac{1}{4} = \dfrac{3}{4}$.

      ## Réunion
      $P(A) = 0{,}5$, $P(B) = 0{,}4$, $P(A \cap B) = 0{,}2$ : $P(A \cup B) = 0{,}5 + 0{,}4 - 0{,}2 = 0{,}7$.

      ## Deux dés
      Le tableau $6 \times 6$ a $36$ cases équiprobables ; la somme $7$ apparaît $6$ fois : probabilité $\dfrac{1}{6}$.
    questions:
      - code: 2NDE-PROBA-01
        difficulte: 1
        type: numerique
        enonce: 'On lance un dé équilibré à six faces. Quelle est la probabilité d''obtenir 5 ou 6 ?'
        solution: 1/3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$2$ issues favorables sur $6$ : $\dfrac{2}{6} = \dfrac{1}{3}$.'
          resultat: 1/3
      - code: 2NDE-PROBA-02
        difficulte: 2
        type: numerique
        enonce: 'On sait que $P(A) = 0{,}3$. Calculer $P(\bar A)$.'
        solution: 7/10
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $P(\bar A) = 1 - P(A) = 1 - 0{,}3 = 0{,}7$.
          resultat: 7/10
      - code: 2NDE-PROBA-03
        difficulte: 3
        type: numerique
        enonce: 'On sait que $P(A) = 0{,}5$, $P(B) = 0{,}4$ et $P(A \cap B) = 0{,}2$. Calculer $P(A \cup B)$.'
        solution: 7/10
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $P(A \cup B) = 0{,}5 + 0{,}4 - 0{,}2 = 0{,}7$.
          resultat: 7/10
      - code: 2NDE-PROBA-04
        difficulte: 4
        type: numerique
        enonce: 'On lance deux pièces équilibrées. Quelle est la probabilité d''obtenir au moins une face ?'
        solution: 3/4
        auteur: Brouillon IA (Claude)
        correction:
          methode: Passer par l'évènement contraire.
          etapes:
          - 'Contraire de « au moins une face » : « deux piles », de probabilité $\dfrac{1}{4}$.'
          - $1 - \dfrac{1}{4} = \dfrac{3}{4}$.
          resultat: 3/4
      - code: 2NDE-PROBA-05
        difficulte: 5
        type: numerique
        enonce: 'On lance deux dés équilibrés à six faces. Quelle est la probabilité que la somme des faces soit égale à 7 ?'
        solution: 1/6
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $36$ issues équiprobables.
          - 'Somme $7$ : $(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)$, soit $6$ issues.'
          - $\dfrac{6}{36} = \dfrac{1}{6}$.
          resultat: 1/6
      - code: 2NDE-PROBA-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {r: {entre: [1, 9]}, v: {entre: [1, 9]}, j: {entre: [0, 6]}}
          calculs: {p: "r/(r + v + j)"}
        enonce: 'Une urne contient $[[r]]$ boules rouges, $[[v]]$ vertes et $[[j]]$ jaunes. On tire une boule au hasard. Quelle est la probabilité qu''elle soit rouge ?'
        solution: '[[p]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Équiprobabilité : nombre de cas favorables ÷ nombre de cas possibles.'
          etapes:
          - 'Nombre total de boules : $[[r + v + j]]$.'
          - '$P = \dfrac{[[r]]}{[[r + v + j]]} = [[p:frac]]$.'
          resultat: '[[p]]'

  - code: 2NDE-ECH
    libelle: Utiliser la fluctuation d'échantillonnage
    attendus: [2NDE-2026-PROBA-01, 2NDE-2026-PROBA-04]
    objectifs:
    - Calculer une fréquence et utiliser l'intervalle de fluctuation au seuil de 95 %.
    prerequis:
    - 2NDE-PROBA
    methodes:
    - titre: Tester une fréquence observée
      etapes:
      - Calculer $\dfrac{1}{\sqrt{n}}$ et l'intervalle $\left[p - \dfrac{1}{\sqrt{n}} ; p + \dfrac{1}{\sqrt{n}}\right]$.
      - Calculer la fréquence observée.
      - 'Conclure : si elle est hors de l''intervalle, le modèle est mis en doute (avec un risque d''erreur d''environ 5 %).'
      exemple:
        enonce: $p = 0{,}5$, $n = 400$, fréquence observée $0{,}53$.
        resolution:
        - '$\dfrac{1}{\sqrt{400}} = 0{,}05$ : intervalle $[0{,}45 ; 0{,}55]$.'
        - $0{,}53$ est dans l'intervalle.
        resultat: Rien ne permet de rejeter le modèle.
    erreurs_frequentes:
    - erreur: Croire qu'un échantillon plus grand élargit l'intervalle.
      explication: 'L''amplitude vaut 2/√n : elle diminue quand n augmente.'
    resume: |
      - La fréquence observée d'un caractère dans un échantillon varie d'un échantillon à l'autre : c'est la **fluctuation**.
      - Pour un échantillon de taille $n$ et une proportion $p$, environ $95\,\%$ des fréquences observées sont dans $\left[p - \dfrac{1}{\sqrt n} ; p + \dfrac{1}{\sqrt n}\right]$.
      - Plus $n$ est grand, plus l'intervalle est étroit.
    cours: |
      ## Fréquence observée
      $18$ succès sur $60$ essais : $f = \dfrac{18}{60} = 0{,}3$.

      ## Intervalle de fluctuation
      Pour $n = 400$ : $\dfrac{1}{\sqrt{400}} = 0{,}05$. Avec $p = 0{,}5$, l'intervalle est $[0{,}45 ; 0{,}55]$.

      ## Influence de la taille
      Si $n$ est multiplié par $4$, $\sqrt n$ est multiplié par $2$ : l'amplitude $\dfrac{2}{\sqrt n}$ est divisée par $2$.

      ## Prise de décision
      Si la fréquence observée sort de l'intervalle, on peut mettre en doute (au risque de $5\,\%$) la valeur annoncée de $p$.
    questions:
      - code: 2NDE-ECH-01
        difficulte: 1
        type: numerique
        enonce: 'On observe 18 succès sur 60 essais. Calculer la fréquence observée.'
        solution: 3/10
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\dfrac{18}{60} = 0{,}3$.
          resultat: 3/10
      - code: 2NDE-ECH-02
        difficulte: 2
        type: numerique
        enonce: 'Pour un échantillon de taille $n = 400$, calculer $\dfrac{1}{\sqrt n}$.'
        solution: 1/20
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\sqrt{400} = 20$, donc $\dfrac{1}{20} = 0{,}05$.
          resultat: 1/20
      - code: 2NDE-ECH-03
        difficulte: 3
        type: qcm
        enonce: 'Si la taille de l''échantillon est multipliée par 4, l''amplitude de l''intervalle $\left[p - \dfrac{1}{\sqrt n} ; p + \dfrac{1}{\sqrt n}\right]$ est : A) divisée par 2  B) divisée par 4  C) inchangée'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$\dfrac{1}{\sqrt{4n}} = \dfrac{1}{2\sqrt{n}}$ : l''amplitude est divisée par $2$.'
          resultat: A
      - code: 2NDE-ECH-04
        difficulte: 4
        type: numerique
        enonce: 'Quelle taille $n$ d''échantillon donne $\dfrac{1}{\sqrt n} = 0{,}02$ ?'
        solution: 2500
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\sqrt{n} = \dfrac{1}{0{,}02} = 50$, donc $n = 2\,500$.
          resultat: 2500
      - code: 2NDE-ECH-05
        difficulte: 5
        type: qcm
        enonce: 'Une pièce est censée être équilibrée ($p = 0{,}5$). Sur 100 lancers, on obtient 62 faces. La fréquence observée est-elle dans l''intervalle $\left[p - \dfrac{1}{\sqrt n} ; p + \dfrac{1}{\sqrt n}\right]$ ? A) oui  B) non'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$\dfrac{1}{\sqrt{100}} = 0{,}1$ : intervalle $[0{,}4 ; 0{,}6]$.'
          - 'Fréquence observée : $0{,}62$, hors de l''intervalle.'
          resultat: B

  - code: 2NDE-PCOND
    libelle: Calculer une probabilité conditionnelle
    attendus: [2NDE-2026-PROBA-02, 2NDE-2026-PROBA-06, 2NDE-2026-PROBA-09]
    objectifs:
    - Calculer $P_A(B)$ à partir d'un tableau croisé d'effectifs, en tirant un individu au hasard.
    - Utiliser la définition $P_A(B) = \dfrac{P(A \cap B)}{P(A)}$.
    - Distinguer $P_A(B)$ et $P_B(A)$, notamment pour les faux positifs d'un test.
    prerequis:
    - 2NDE-CROISE
    - 2NDE-PROBA
    methodes:
    - titre: Calculer une probabilité conditionnelle avec un tableau croisé
      quand: On tire au hasard un individu d'une population décrite par un tableau croisé.
      etapes:
      - Repérer l'évènement « sachant » (la condition) et lire son effectif dans la marge.
      - Lire l'effectif de la case qui réalise les deux évènements.
      - Diviser l'effectif de la case par l'effectif de la condition.
      exemple:
        enonce: 'Sur $1\,000$ personnes, $140$ ont un test positif, dont $95$ sont malades. On tire une personne au hasard. Calculer $P_T(M)$.'
        resolution:
        - 'Condition : « le test est positif », effectif $140$.'
        - 'Case « malade et test positif » : $95$.'
        - $P_T(M) = \dfrac{95}{140} = \dfrac{19}{28}$.
        resultat: $\dfrac{19}{28} \approx 0{,}68$
    erreurs_frequentes:
    - erreur: Confondre $P_A(B)$ et $P_B(A)$.
      explication: 'Dans $P_A(B)$, l''évènement en indice est la condition : c''est lui qui fournit le dénominateur.'
    - erreur: Confondre $P_A(B)$ et $P(A \cap B)$.
      explication: '$P(A \cap B)$ se calcule sur toute la population, $P_A(B)$ seulement parmi les individus qui réalisent $A$.'
    resume: |
      - Si $P(A) \neq 0$, la **probabilité de $B$ sachant $A$** est $P_A(B) = \dfrac{P(A \cap B)}{P(A)}$.
      - Tirage au hasard dans un tableau croisé : $P_A(B) = \dfrac{\text{effectif de } A \cap B}{\text{effectif de } A}$.
      - $P_A(B)$ et $P_B(A)$ sont en général **différentes** : la condition change le dénominateur.
      - Test de dépistage : $P_M(T)$ (un malade est détecté) n'est pas $P_T(M)$ (un test positif signale un malade).
    cours: |
      ## Définition
      Soit $A$ un évènement de probabilité non nulle. La probabilité de $B$ **sachant** $A$ est
      $$P_A(B) = \dfrac{P(A \cap B)}{P(A)}.$$
      C'est la probabilité de $B$ quand on sait que $A$ est réalisé : on se restreint aux issues de $A$.

      ## Avec un tableau croisé
      On teste $1\,000$ personnes pour une maladie. $M$ : « la personne est malade » ; $T$ : « le test est positif ».

      | | $T$ | $\bar T$ | Total |
      |---|:-:|:-:|:-:|
      | $M$ | $95$ | $5$ | $100$ |
      | $\bar M$ | $45$ | $855$ | $900$ |
      | Total | $140$ | $860$ | $1\,000$ |

      On tire une personne au hasard (équiprobabilité) :
      - $P(M) = \dfrac{100}{1\,000} = 0{,}1$ ;
      - $P(M \cap T) = \dfrac{95}{1\,000} = 0{,}095$ ;
      - $P_M(T) = \dfrac{95}{100} = 0{,}95$ : $95\,\%$ des malades ont un test positif ;
      - $P_T(M) = \dfrac{95}{140} \approx 0{,}68$ : seulement $68\,\%$ des tests positifs signalent un malade.

      ## Faux positifs
      Les $45$ personnes non malades au test positif sont des **faux positifs**. Parmi les tests positifs, leur part est $\dfrac{45}{140} \approx 0{,}32$. Un test très sensible peut donc donner beaucoup de faux positifs quand la maladie est rare : c'est pourquoi il ne faut jamais confondre $P_M(T)$ et $P_T(M)$.
    questions:
      - code: 2NDE-PCOND-01
        difficulte: 1
        type: numerique
        enonce: 'On teste $1\,000$ personnes ; $100$ sont malades. On tire une personne au hasard. Quelle est la probabilité qu''elle soit malade ?'
        solution: 1/10
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Équiprobabilité : $P(M) = \dfrac{100}{1\,000} = 0{,}1$.'
          resultat: 1/10
      - code: 2NDE-PCOND-02
        difficulte: 2
        type: numerique
        enonce: 'Parmi $100$ personnes malades, $95$ ont un test positif. On note $M$ « être malade » et $T$ « avoir un test positif ». Calculer $P_M(T)$.'
        solution: 19/20
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'La condition est $M$ : on se restreint aux $100$ malades.'
          etapes:
          - $P_M(T) = \dfrac{95}{100} = 0{,}95$.
          resultat: 19/20
      - code: 2NDE-PCOND-03
        difficulte: 3
        type: numerique
        enonce: 'On sait que $P(R) = 0{,}4$ et $P(R \cap S) = 0{,}1$. Calculer $P_R(S)$.'
        solution: 1/4
        auteur: Brouillon IA (Claude)
        correction:
          methode: Définition de la probabilité conditionnelle.
          etapes:
          - $P_R(S) = \dfrac{P(R \cap S)}{P(R)} = \dfrac{0{,}1}{0{,}4} = 0{,}25$.
          resultat: 1/4
      - code: 2NDE-PCOND-04
        difficulte: 3
        type: qcm
        enonce: 'On note $M$ « la personne est malade » et $T$ « son test est positif ». La probabilité qu''une personne malade ait un test positif se note : A) $P_T(M)$  B) $P_M(T)$  C) $P(M \cap T)$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'On sait que la personne est malade : la condition est $M$, placée en indice.'
          - 'On cherche la probabilité que le test soit positif : $P_M(T)$.'
          resultat: B
      - code: 2NDE-PCOND-05
        difficulte: 4
        type: numerique
        enonce: 'Sur $1\,000$ personnes testées, $140$ ont un test positif ; parmi elles, $95$ sont malades. On tire au hasard une personne dont le test est positif. Quelle est la probabilité qu''elle soit malade ? (Réponse sous forme de fraction.)'
        solution: 19/28
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'La condition est « test positif » : on se restreint aux $140$ tests positifs.'
          etapes:
          - $P_T(M) = \dfrac{95}{140} = \dfrac{19}{28} \approx 0{,}68$.
          resultat: 19/28
          erreurs_frequentes:
          - 'Répondre $\dfrac{95}{100}$ : c''est $P_M(T)$, la probabilité qu''un malade soit détecté.'
      - code: 2NDE-PCOND-06
        difficulte: 5
        type: numerique
        enonce: 'Un test est appliqué à $1\,000$ personnes : $100$ sont malades, dont $95$ ont un test positif, et $45$ des $900$ personnes non malades ont aussi un test positif. Parmi les personnes dont le test est positif, quelle est la proportion de faux positifs (personnes non malades) ? (Réponse sous forme de fraction.)'
        solution: 9/28
        auteur: Brouillon IA (Claude)
        correction:
          methode: Compléter le tableau croisé, puis se restreindre aux tests positifs.
          etapes:
          - 'Tests positifs : $95 + 45 = 140$.'
          - 'Faux positifs parmi eux : $45$.'
          - $\dfrac{45}{140} = \dfrac{9}{28} \approx 0{,}32$.
          resultat: 9/28
          erreurs_frequentes:
          - 'Diviser par $900$ : on obtiendrait la part des tests positifs parmi les non malades.'
      - code: 2NDE-PCOND-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {nm: {entre: [20, 120], pas: 10}, tp: {entre: [5, 95], pas: 5}}
          calculs: {vp: "nm*tp/100", p: "tp/100"}
        enonce: 'Parmi $[[nm]]$ personnes malades, $[[vp]]$ ont un test positif. On note $M$ « être malade » et $T$ « avoir un test positif ». Calculer $P_M(T)$.'
        solution: '[[p]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'La condition est $M$ : on se restreint aux personnes malades.'
          etapes:
          - '$P_M(T) = \dfrac{[[vp]]}{[[nm]]}$.'
          - '$P_M(T) = [[p]]$.'
          resultat: '[[p]]'

  - code: 2NDE-ARBRE
    libelle: Construire et exploiter un arbre pondéré
    attendus: [2NDE-2026-PROBA-03, 2NDE-2026-PROBA-05, 2NDE-2026-PROBA-07, 2NDE-2026-PROBA-08]
    objectifs:
    - Traduire un énoncé en arbre pondéré, et inversement.
    - Interpréter chaque pondération comme une probabilité ou une probabilité conditionnelle.
    - Calculer la probabilité d'un chemin en multipliant les probabilités de ses branches.
    prerequis:
    - 2NDE-PCOND
    methodes:
    - titre: Construire un arbre pondéré à partir d'un énoncé
      quand: L'énoncé donne une répartition, puis des pourcentages « parmi » chaque groupe.
      etapes:
      - 'Premier niveau : l''évènement de départ et son contraire, avec leurs probabilités.'
      - 'Second niveau : sur chaque branche, l''évènement étudié et son contraire, avec les probabilités conditionnelles.'
      - Vérifier que les branches issues d'un même nœud ont une somme égale à $1$.
      exemple:
        enonce: '$60\,\%$ des pièces viennent de la machine $M$, les autres d''une seconde machine. $5\,\%$ des pièces de $M$ sont rebutées. Pondérations ?'
        resolution:
        - 'Premier niveau : $P(M) = 0{,}6$ et $P(\bar M) = 0{,}4$.'
        - 'Second niveau depuis $M$ : $P_M(R) = 0{,}05$ et $P_M(\bar R) = 0{,}95$.'
        resultat: 'Chaque nœud a des branches de somme $1$.'
    - titre: Calculer la probabilité d'un chemin
      quand: On cherche la probabilité que deux évènements soient réalisés à la fois.
      etapes:
      - Repérer le chemin de l'arbre qui mène aux deux évènements.
      - Multiplier les probabilités des branches de ce chemin.
      exemple:
        enonce: 'Avec $P(M) = 0{,}6$ et $P_M(R) = 0{,}05$, calculer $P(M \cap R)$.'
        resolution:
        - 'Chemin $M$ puis $R$.'
        - $P(M \cap R) = P(M) \times P_M(R) = 0{,}6 \times 0{,}05 = 0{,}03$.
        resultat: $0{,}03$
    erreurs_frequentes:
    - erreur: Écrire sur la seconde branche $P(R)$ au lieu de $P_M(R)$.
      explication: 'Une branche du second niveau part d''un évènement déjà réalisé : sa pondération est une probabilité conditionnelle.'
    - erreur: Additionner les probabilités d'un chemin au lieu de les multiplier.
      explication: 'Le long d''un chemin, on multiplie : $P(M \cap R) = P(M) \times P_M(R)$.'
    resume: |
      - Un **arbre pondéré** représente une situation en deux étapes ; chaque branche porte une probabilité.
      - Premier niveau : $P(A)$ et $P(\bar A)$. Second niveau : des probabilités **conditionnelles** $P_A(B)$, $P_A(\bar B)$…
      - Les branches issues d'un même nœud ont une somme égale à $1$.
      - **Probabilité d'un chemin** : produit des probabilités de ses branches, $P(A \cap B) = P(A) \times P_A(B)$.
    cours: |
      ## Construire l'arbre
      Une usine fabrique $60\,\%$ de ses pièces sur la machine $M$ et les autres sur une seconde machine. $5\,\%$ des pièces de $M$ et $10\,\%$ des autres pièces sont rebutées. On choisit une pièce au hasard ; $R$ : « la pièce est rebutée ».

      - Premier niveau : $P(M) = 0{,}6$ et $P(\bar M) = 0{,}4$.
      - Depuis $M$ : $P_M(R) = 0{,}05$ et $P_M(\bar R) = 0{,}95$.
      - Depuis $\bar M$ : $P_{\bar M}(R) = 0{,}1$ et $P_{\bar M}(\bar R) = 0{,}9$.

      ## Lire les pondérations
      La pondération $0{,}05$ de la branche $M \to R$ signifie : **parmi les pièces de la machine $M$**, $5\,\%$ sont rebutées. Ce n'est ni $P(R)$, ni $P(M \cap R)$.

      ## Probabilité d'un chemin
      La définition $P_M(R) = \dfrac{P(M \cap R)}{P(M)}$ donne $P(M \cap R) = P(M) \times P_M(R)$ : on multiplie le long du chemin.
      $$P(M \cap R) = 0{,}6 \times 0{,}05 = 0{,}03 \qquad P(\bar M \cap R) = 0{,}4 \times 0{,}1 = 0{,}04.$$
    questions:
      - code: 2NDE-ARBRE-01
        difficulte: 1
        type: numerique
        enonce: 'Dans un arbre pondéré, la branche allant vers $M$ porte la probabilité $0{,}6$. Quelle probabilité porte la branche allant vers $\bar M$ ?'
        solution: 2/5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Les branches issues d''un même nœud ont une somme égale à $1$ : $1 - 0{,}6 = 0{,}4$.'
          resultat: 2/5
      - code: 2NDE-ARBRE-02
        difficulte: 2
        type: numerique
        enonce: 'Dans un arbre pondéré, on lit $P_M(R) = 0{,}05$. Quelle probabilité porte la branche allant de $M$ vers $\bar R$ ?'
        solution: 19/20
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $P_M(\bar R) = 1 - P_M(R) = 1 - 0{,}05 = 0{,}95$.
          resultat: 19/20
      - code: 2NDE-ARBRE-03
        difficulte: 3
        type: numerique
        enonce: '$60\,\%$ des pièces d''une usine sont fabriquées par la machine $M$, et $5\,\%$ des pièces de cette machine sont rebutées. On choisit une pièce au hasard. Quelle est la probabilité qu''elle vienne de $M$ et soit rebutée ?'
        solution: 3/100
        auteur: Brouillon IA (Claude)
        correction:
          methode: Probabilité d'un chemin.
          etapes:
          - $P(M \cap R) = P(M) \times P_M(R) = 0{,}6 \times 0{,}05 = 0{,}03$.
          resultat: 3/100
      - code: 2NDE-ARBRE-04
        difficulte: 3
        type: qcm
        enonce: 'Dans l''arbre pondéré de l''usine, la branche allant de $M$ vers $R$ porte la probabilité $0{,}05$. Cette probabilité est : A) $P(R)$  B) $P(M \cap R)$  C) $P_M(R)$'
        solution: C
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Cette branche part du nœud $M$ : on sait déjà que la pièce vient de $M$.'
          - 'Sa pondération est la probabilité conditionnelle $P_M(R)$.'
          resultat: C
      - code: 2NDE-ARBRE-05
        difficulte: 4
        type: numerique
        enonce: 'Dans une usine, $40\,\%$ des pièces sont fabriquées par une seconde machine, et $10\,\%$ des pièces de cette machine sont rebutées. On choisit une pièce au hasard. Quelle est la probabilité qu''elle vienne de la seconde machine et soit rebutée ?'
        solution: 1/25
        auteur: Brouillon IA (Claude)
        correction:
          methode: Probabilité d'un chemin.
          etapes:
          - 'Chemin $\bar M$ puis $R$ : $P(\bar M) = 0{,}4$ et $P_{\bar M}(R) = 0{,}1$.'
          - $P(\bar M \cap R) = 0{,}4 \times 0{,}1 = 0{,}04$.
          resultat: 1/25
      - code: 2NDE-ARBRE-06
        difficulte: 4
        type: numerique
        enonce: 'Dans un lycée, $30\,\%$ des élèves jouent d''un instrument, et $12\,\%$ des élèves jouent d''un instrument et chantent à la chorale. On choisit au hasard un élève qui joue d''un instrument. Quelle est la probabilité qu''il chante à la chorale ?'
        solution: 2/5
        auteur: Brouillon IA (Claude)
        correction:
          methode: Remonter du chemin à la pondération de la branche.
          etapes:
          - 'On note $I$ « jouer d''un instrument » et $K$ « chanter à la chorale » : $P(I) = 0{,}3$ et $P(I \cap K) = 0{,}12$.'
          - $P_I(K) = \dfrac{P(I \cap K)}{P(I)} = \dfrac{0{,}12}{0{,}3} = 0{,}4$.
          resultat: 2/5
      - code: 2NDE-ARBRE-07
        difficulte: 5
        type: numerique
        enonce: 'Dans un lycée, $30\,\%$ des élèves jouent d''un instrument. Parmi eux, $70\,\%$ chantent à la chorale ; parmi les autres élèves, $10\,\%$ chantent à la chorale. On choisit un élève au hasard. Quelle est la probabilité qu''il ne joue d''aucun instrument et chante à la chorale ?'
        solution: 7/100
        auteur: Brouillon IA (Claude)
        correction:
          methode: Construire l'arbre, puis suivre le bon chemin.
          etapes:
          - 'Premier niveau : $P(I) = 0{,}3$ et $P(\bar I) = 0{,}7$.'
          - 'Depuis $\bar I$ : $P_{\bar I}(K) = 0{,}1$.'
          - $P(\bar I \cap K) = 0{,}7 \times 0{,}1 = 0{,}07$.
          resultat: 7/100
          erreurs_frequentes:
          - 'Utiliser $0{,}7$ deux fois : le $70\,\%$ de l''énoncé concerne les instrumentistes, pas les autres élèves.'
      - code: 2NDE-ARBRE-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {a: {entre: [0.1, 0.9], pas: 0.1}, b: {entre: [0.05, 0.95], pas: 0.05}}
          calculs: {p: "a*b"}
        enonce: 'Dans un arbre pondéré, $P(A) = [[a]]$ et $P_A(B) = [[b]]$. Calculer $P(A \cap B)$.'
        solution: '[[p]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Probabilité d''un chemin : produit des probabilités des branches.'
          etapes:
          - '$P(A \cap B) = P(A) \times P_A(B)$.'
          - '$= [[a]] \times [[b]] = [[p]]$.'
          resultat: '[[p]]'
