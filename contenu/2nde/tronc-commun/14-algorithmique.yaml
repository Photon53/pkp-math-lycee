      - code: 2NDE-PY-FONC-02
        difficulte: 2
        type: numerique
        enonce: 'On définit `def f(a, b): return 3 * a - b`. Que renvoie `f(2, 5)` ?'
        solution: 1
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $3 \times 2 - 5 = 1$.
          resultat: 1
      - code: 2NDE-PY-FONC-03
        difficulte: 3
        type: numerique
        enonce: 'La fonction `moyenne(a, b, c)` renvoie `(a + b + c) / 3`. Que renvoie `moyenne(12, 15, 9)` ?'
        solution: 12
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'À l''appel `moyenne(12, 15, 9)`, les arguments prennent les valeurs `a = 12`, `b = 15` et `c = 9`.'
          - 'La fonction calcule d''abord la parenthèse : $12 + 15 + 9 = 36$.'
          - 'Puis elle divise par $3$ : $\dfrac{36}{3} = 12$. Elle renvoie donc `12` (affiché `12.0`, car `/` donne un flottant).'
          resultat: 12
      - code: 2NDE-PY-FONC-04
        difficulte: 4
        type: qcm
        enonce: 'La fonction `lancer(p)` renvoie `1` si `random() < p`, et `0` sinon. Que simule `lancer(0.25)` ? A) Une expérience réussie avec la probabilité $0{,}25$  B) Une expérience réussie une fois sur quatre exactement  C) Un nombre aléatoire entre $0$ et $0{,}25$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '`random()` est uniforme sur $[0 ; 1[$ $:$ `random() < 0.25` est vrai avec la probabilité $0{,}25$.'
          - Le résultat est aléatoire $:$ « une fois sur quatre exactement » est faux.
          resultat: A
      - code: 2NDE-PY-FONC-05
        difficulte: 5
        type: qcm
        enonce: 'La fonction `frequence(n, p)` additionne `n` appels à `lancer(p)` et renvoie la somme divisée par `n`. Que renvoie, le plus probablement, `frequence(10000, 0.3)` ? A) Exactement $0{,}3$  B) Un nombre proche de $0{,}3$  C) Un nombre proche de $3\,000$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - La fonction renvoie une fréquence de succès sur $10\,000$ répétitions.
          - D'après la loi des grands nombres, elle est proche de $0{,}3$, sans être exactement égale.
          resultat: B
