      explication: C'est une affectation $:$ on calcule `a + 1` avec l'ancienne valeur, puis on range le résultat dans `a`.
    - erreur: Confondre `=` (affectation) et `==` (test d'égalité).
      explication: '`x == 3` vaut `True` ou `False` ; `x = 3` range $3$ dans `x`.'
    resume: |
      - Une variable a un nom, une valeur et un **type** : entier (`int`), flottant (`float`), chaîne de caractères (`str`), booléen (`bool`).
      - L'affectation `x = 5` (notée `x ← 5` en langage naturel) range une valeur dans une variable ; l'ancienne valeur est perdue.
      - Les instructions d'une séquence s'exécutent dans l'ordre, l'une après l'autre.
      - Instruction conditionnelle : `if condition:` … `else:` …, avec des blocs **indentés**.
      - Opérateurs : `+ - * /`, `**` (puissance), `//` (quotient entier), `%` (reste) ; comparaisons `==`, `!=`, `<`, `<=`.
    cours: |
      ## 1. Variables et types
      Une **variable** est une case mémoire désignée par un nom, qui contient une valeur. En Python, le type est déterminé par la valeur :

      | Type | Nom Python | Exemples |
      |---|---|---|
      | entier | `int` | `12`, `-3`, `0` |
      | flottant (nombre à virgule) | `float` | `3.5`, `-0.25`, `2.0` |
      | chaîne de caractères | `str` | `"Bonjour"`, `"12"` |
      | booléen | `bool` | `True`, `False` |

      On choisit le type selon ce que représente la variable : un nombre d'élèves est un entier, une moyenne un flottant, un nom une chaîne, le résultat d'un test (« la note est-elle au moins $10$ ? ») un booléen. Attention : `"12"` est un texte, pas un nombre ; `int("12")` le convertit en entier.

      ## 2. Affectation
      > **Définition.** L'**affectation** donne une valeur à une variable. En langage naturel on écrit `a ← 3` ; en Python, `a = 3`. La valeur précédente de la variable est remplacée.

      Le signe `=` de Python n'est pas une égalité mathématique : `x = x + 1` signifie « calculer `x + 1` puis ranger le résultat dans `x` », c'est-à-dire augmenter `x` de $1$.

      On écrit des **formules** combinant des variables : `prix_ttc = prix_ht * 1.2`, `aire = longueur * largeur`, `moyenne = (n1 + n2 + n3) / 3`. Opérateurs utiles : `**` pour la puissance (`x ** 2`), `//` pour le quotient entier et `%` pour le reste (`17 // 5` vaut `3` et `17 % 5` vaut `2`).

      ## 3. Séquence d'instructions
      Les instructions s'exécutent **dans l'ordre**. Pour comprendre un programme, on peut suivre l'évolution des variables dans un tableau :

      ```python
      a = 4
      b = 7
      a = a + b
      b = a - b
      a = a - b
      ```

      | Instruction | `a` | `b` |
      |---|---|---|
      | `a = 4` | $4$ | — |
      | `b = 7` | $4$ | $7$ |
      | `a = a + b` | $11$ | $7$ |
      | `b = a - b` | $11$ | $4$ |
      | `a = a - b` | $7$ | $4$ |

      Ce programme échange les valeurs de `a` et `b`.

      ## 4. Instruction conditionnelle
      > **Définition.** Une instruction conditionnelle exécute un bloc d'instructions seulement si une **condition** (une expression booléenne) est vraie.

      ```python
      if condition:
          instructions si vrai
      elif autre_condition:
          instructions si la seconde condition est vraie
      else:
          instructions sinon
      ```

      Les blocs sont repérés par l'**indentation** (décalage de $4$ espaces) et la ligne `if` se termine par `:`. Les conditions utilisent `==` (égal), `!=` (différent), `<`, `<=`, `>`, `>=`, et se combinent avec `and`, `or`, `not`.

      ### Méthode : écrire un programme avec une condition
      1. Identifier les données (variables d'entrée) et leur type.
      2. Écrire la condition qui sépare les cas, en faisant attention aux inégalités strictes ou larges.
      3. Écrire le bloc de chaque cas, indenté.
      4. Tester le programme avec une valeur de chaque cas, et avec la valeur « frontière ».

      **Exemple complet.** Un parking coûte $2$ € pour moins de $3$ heures, puis $1{,}5$ € par heure au total à partir de $3$ heures.

      ```python
      duree = 5
      if duree < 3:
          prix = 2
      else:
          prix = 1.5 * duree
      ```

      Avec `duree = 5`, la condition `5 < 3` est fausse : le bloc `else` donne `prix = 7.5`. Avec `duree = 3` (valeur frontière), on obtient `4.5`.

      ## 5. Erreurs fréquentes
      - Confondre `=` (affectation) et `==` (test d'égalité).
      - Oublier les deux-points `:` ou l'indentation après `if` et `else`.
      - Additionner une chaîne et un nombre : `"12" + 3` provoque une erreur.
      - Se tromper de condition à la frontière (`<` au lieu de `<=`).
