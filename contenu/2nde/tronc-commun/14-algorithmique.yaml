  - code: 2NDE-PY-BOUCLE
    libelle: Programmer une boucle bornée ou non bornée
    attendus: [2NDE-2026-ALGOVAR-05, 2NDE-2026-ALGOVAR-09, 2NDE-2026-ALGOVAR-10]
    cours_couvre: [2NDE-2026-ALGOVAR-05, 2NDE-2026-ALGOVAR-09, 2NDE-2026-ALGOVAR-10]
    objectifs:
    - Utiliser une boucle `for` quand le nombre de répétitions est connu.
    - Utiliser une boucle `while` pour répéter tant qu'une condition est vraie.
    prerequis:
    - 2NDE-PY-VAR
    methodes:
    - titre: Compter les tours d'une boucle
      quand: On veut prévoir le résultat d'une boucle.
      etapes:
      - Pour `for i in range(n)`, `i` prend les valeurs $0, 1, \ldots, n - 1$ $:$ $n$ tours.
      - Pour `while`, tester la condition avant chaque tour, et s'arrêter dès qu'elle est fausse.
      exemple:
        enonce: 'Valeur de `s` après `s = 0` puis `for i in range(4): s = s + i` ?'
        resolution:
        - '`i` prend les valeurs $0, 1, 2, 3$.'
        - $s = 0 + 1 + 2 + 3 = 6$.
        resultat: $6$
    erreurs_frequentes:
    - erreur: Croire que `range(5)` va de $1$ à $5$.
      explication: '`range(5)` donne $0, 1, 2, 3, 4$ $:$ cinq valeurs, à partir de $0$.'
    - erreur: Écrire une boucle `while` dont la condition reste toujours vraie.
      explication: Le programme ne s'arrête jamais ; une variable de la condition doit évoluer à chaque tour.
    resume: |
      - Boucle **bornée** `for i in range(n):` : le bloc est répété exactement $n$ fois, avec `i` prenant les valeurs $0, 1, \dots, n - 1$.
      - `range(a, b)` donne les entiers de $a$ à $b - 1$.
      - Boucle **non bornée** `while condition:` : le bloc est répété **tant que** la condition est vraie ; on ne connaît pas à l'avance le nombre de tours.
      - Dans une boucle `while`, une variable de la condition doit changer, sinon la boucle ne s'arrête jamais.
      - Un tableau de suivi des variables permet de comprendre ou de vérifier un programme.
    cours: |
      ## 1. Boucle bornée
      On utilise une **boucle bornée** quand on connaît à l'avance le nombre de répétitions.

      ```python
      for i in range(n):
          instructions
      ```

      `range(n)` produit les entiers $0, 1, \dots, n - 1$ (soit $n$ valeurs) ; `range(a, b)` produit les entiers de $a$ à $b - 1$.

      **Exemple : somme des entiers de $1$ à $100$.**

      ```python
      s = 0
      for k in range(1, 101):
          s = s + k
      ```

      La variable `s` est un **accumulateur** : initialisée à $0$, elle augmente de $k$ à chaque tour. À la fin, `s` vaut $5\,050$.

      ## 2. Boucle non bornée
      On utilise une **boucle non bornée** quand on répète une action **tant qu'**une condition est vraie, sans savoir combien de fois.

      ```python
      while condition:
          instructions
      ```

      La condition est testée **avant** chaque tour ; dès qu'elle est fausse, on sort de la boucle.

      ### Méthode : programmer une recherche de seuil
      1. Initialiser les variables (la grandeur étudiée et un compteur).
      2. Écrire la condition « on n'a pas encore atteint le seuil ».
      3. Dans la boucle, mettre à jour la grandeur et le compteur.
      4. Après la boucle, le compteur contient la réponse.

      **Exemple complet.** Un capital de $1\,000$ € augmente de $5\,\%$ par an. Au bout de combien d'années dépasse-t-il $1\,500$ € ?

      ```python
      capital = 1000
      annees = 0
      while capital <= 1500:
          capital = capital * 1.05
          annees = annees + 1
      ```

      | Tour | `capital` (arrondi) | `annees` |
      |---|---|---|
      | départ | $1\,000$ | $0$ |
      | 1 | $1\,050$ | $1$ |
      | 2 | $1\,102{,}50$ | $2$ |
      | … | … | … |
      | 8 | $1\,477{,}46$ | $8$ |
      | 9 | $1\,551{,}33$ | $9$ |

      Après le $9^\text{e}$ tour, `capital <= 1500` est faux : la boucle s'arrête et `annees` vaut $9$.

      ## 3. Lire, modifier ou compléter un programme
      1. Repérer les variables et leur rôle (compteur, accumulateur, valeur testée).
      2. Faire un tableau de suivi sur les premiers tours.
      3. Pour modifier : changer la valeur initiale, la condition ou la mise à jour, puis vérifier sur un exemple.

      Par exemple, pour compter les multiples de $7$ inférieurs à $100$, on peut ajouter une condition dans une boucle bornée : `if k % 7 == 0: compteur = compteur + 1`.

      ## 4. Erreurs fréquentes
      - Croire que `range(5)` va de $1$ à $5$ : il va de $0$ à $4$.
      - Oublier d'initialiser un accumulateur ou un compteur avant la boucle.
      - Écrire une boucle `while` dont la condition ne devient jamais fausse (boucle infinie).
      - Placer une instruction dans la boucle ou hors de la boucle par erreur d'indentation.
    questions:
      - code: 2NDE-PY-BOUCLE-01
        difficulte: 1
        type: numerique
        enonce: 'Combien de fois le corps de la boucle `for i in range(7):` est-il exécuté ?'
        solution: 7
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '`i` prend les valeurs $0$ à $6$ $:$ sept tours.'
          resultat: 7
      - code: 2NDE-PY-BOUCLE-02
        difficulte: 2
        type: numerique
        enonce: 'On exécute `s = 0`, puis `for i in range(4): s = s + i`. Que vaut `s` à la fin ?'
        solution: 6
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $0 + 1 + 2 + 3 = 6$.
          resultat: 6
      - code: 2NDE-PY-BOUCLE-03
        difficulte: 3
        type: numerique
        enonce: 'On exécute `p = 1`, puis `for i in range(1, 5): p = p * i`. Que vaut `p` à la fin ?'
        solution: 24
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '`i` prend les valeurs $1, 2, 3, 4$.'
          - $p = 1 \times 2 \times 3 \times 4 = 24$.
          resultat: 24
      - code: 2NDE-PY-BOUCLE-04
        difficulte: 4
        type: numerique
        enonce: 'On exécute `n = 0`, `x = 100`, puis `while x > 10: x = x / 2` et `n = n + 1` (dans la boucle). Que vaut `n` à la fin ?'
        solution: 4
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '`x` vaut successivement $50$, $25$, $12{,}5$, $6{,}25$.'
          - Après le quatrième tour, $6{,}25 > 10$ est faux $:$ la boucle s'arrête avec `n` égal à $4$.
          resultat: 4
      - code: 2NDE-PY-BOUCLE-05
        difficulte: 5
        type: numerique
        enonce: 'Un capital de $1\,000$ € augmente de $5\,\%$ par an. Le programme `c = 1000`, `n = 0`, puis `while c <= 1500: c = c * 1.05` et `n = n + 1` renvoie `n`. Quelle valeur obtient-on ?'
        solution: 9
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $1\,000 \times 1{,}05^8 \approx 1\,477$ et $1\,000 \times 1{,}05^9 \approx 1\,551$.
          - Le capital dépasse $1\,500$ € pour la première fois après $9$ ans.
          resultat: 9
      - code: 2NDE-PY-BOUCLE-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {n: {entre: [3, 12]}, d: {entre: [0, 3]}}
          calculs: {s: "n*(n - 1)/2 + d*n"}
        enonce: 'On exécute `s = 0`, puis `for i in range([[n]]): s = s + i + [[d]]`. Que vaut `s` à la fin ?'
        solution: '[[s]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Accumulateur : on additionne la valeur ajoutée à chaque tour.'
          etapes:
          - '`i` prend les valeurs $0$ à $[[n - 1]]$ : leur somme vaut $[[n*(n - 1)/2]]$.'
          - 'On ajoute aussi $[[d]]$ à chacun des $[[n]]$ tours : $[[d*n]]$.'
          - 'Total : $[[s]]$.'
          resultat: '[[s]]'

  - code: 2NDE-PY-FONC
    libelle: Écrire et utiliser des fonctions en Python
    attendus: [2NDE-2026-ALGOFCT-01, 2NDE-2026-ALGOFCT-02, 2NDE-2026-ALGOFCT-03, 2NDE-2026-ALGOFCT-04, 2NDE-2026-ALGOFCT-05]
    cours_couvre: [2NDE-2026-ALGOFCT-01, 2NDE-2026-ALGOFCT-02, 2NDE-2026-ALGOFCT-03, 2NDE-2026-ALGOFCT-04, 2NDE-2026-ALGOFCT-05]
    objectifs:
    - Définir et appeler une fonction à un ou plusieurs arguments.
    - Lire une fonction qui calcule une moyenne ou simule une expérience aléatoire.
    prerequis:
    - 2NDE-PY-BOUCLE
    methodes:
    - titre: Prévoir ce que renvoie une fonction
      quand: On appelle une fonction avec des valeurs données.
      etapes:
      - Remplacer chaque paramètre par la valeur passée à l'appel.
      - Exécuter le corps de la fonction jusqu'au `return`.
      exemple:
        enonce: 'Que renvoie `f(2, 5)` si `def f(a, b): return 3 * a - b` ?'
        resolution:
        - '`a` vaut $2$ et `b` vaut $5$.'
        - $3 \times 2 - 5 = 1$.
        resultat: $1$
    erreurs_frequentes:
    - erreur: Confondre `print` et `return`.
      explication: '`print` affiche une valeur ; `return` la renvoie au programme, qui peut la réutiliser dans un calcul.'
    resume: |
      - Une fonction se définit par `def nom(arguments):` et renvoie un résultat avec `return`.
      - On l'**appelle** en écrivant `nom(valeurs)` ; elle peut avoir un ou plusieurs arguments.
      - `random()` renvoie un flottant aléatoire de $[0 ; 1[$ ; `randint(a, b)` un entier aléatoire entre $a$ et $b$ inclus.
      - En appelant plusieurs fois une fonction aléatoire, on obtient une série statistique (fréquence, moyenne…).
      - Une fonction peut calculer une moyenne ou un écart type avec des accumulateurs, sans liste.
    cours: |
      ## 1. Définir et appeler une fonction
      Une **fonction** est un sous-programme qui reçoit des **arguments** et **renvoie** un résultat.

      ```python
      def aire_rectangle(longueur, largeur):
          return longueur * largeur
      ```

      - `def` introduit la définition ; la ligne se termine par `:` et le corps est indenté.
      - `return` renvoie le résultat et termine l'exécution de la fonction.
      - On **appelle** la fonction en lui donnant des valeurs : `aire_rectangle(5, 3)` renvoie `15`.

      Une fonction peut avoir un seul argument (`def carre(x): return x ** 2`), plusieurs, et contenir des conditions ou des boucles :

      ```python
      def valeur_absolue(x):
          if x >= 0:
              return x
          else:
              return -x
      ```

      ## 2. Fonctions aléatoires
      Le module `random` fournit des fonctions qui renvoient des nombres aléatoires :
      - `random()` : un flottant aléatoire de $[0 ; 1[$ ;
      - `randint(a, b)` : un entier aléatoire entre `a` et `b`, **bornes incluses**.

      On les importe avec `from random import random, randint`.

      ### Méthode : simuler une expérience aléatoire
      1. Écrire une fonction qui simule **une** expérience et renvoie son résultat numérique (par exemple $1$ pour un succès, $0$ sinon).
      2. Écrire une seconde fonction qui répète l'expérience $n$ fois dans une boucle et accumule les résultats.
      3. Renvoyer la fréquence, la moyenne ou le nombre de succès.

      **Exemple complet.** On lance deux dés et on s'intéresse à l'événement « la somme vaut $7$ ».

      ```python
      from random import randint

      def somme_deux_des():
          return randint(1, 6) + randint(1, 6)

      def frequence_sept(n):
          compteur = 0
          for i in range(n):
              if somme_deux_des() == 7:
                  compteur = compteur + 1
          return compteur / n
      ```

      L'appel `frequence_sept(10000)` renvoie une valeur proche de $\dfrac{6}{36} \approx 0{,}167$, conformément à la loi des grands nombres. Chaque appel donne un résultat un peu différent : c'est la fluctuation d'échantillonnage.

      ## 3. Moyenne et écart type d'une série simulée
      Sans utiliser de liste, on accumule la somme des valeurs et la somme de leurs carrés :

      ```python
      from math import sqrt

      def moyenne_ecart_type(n):
          s = 0
          s2 = 0
          for i in range(n):
              x = somme_deux_des()
              s = s + x
              s2 = s2 + x ** 2
          m = s / n
          return m, sqrt(s2 / n - m ** 2)
      ```

      La moyenne est `s / n`. Pour l'écart type, on utilise la formule (admise) : le carré de l'écart type est égal à la moyenne des carrés moins le carré de la moyenne. Il suffit de savoir **lire** et **comprendre** ce type de fonction.

      ## 4. Erreurs fréquentes
      - Confondre `print` (afficher) et `return` (renvoyer une valeur réutilisable).
      - Définir une fonction sans jamais l'appeler, ou l'appeler sans parenthèses.
      - Oublier que `randint(1, 6)` inclut $6$, alors que `range(1, 6)` s'arrête à $5$.
      - Placer `return` à l'intérieur de la boucle : la fonction s'arrête dès le premier tour.
    questions:
