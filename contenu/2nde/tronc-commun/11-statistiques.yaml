chapitre:
  code: 2NDE-STATS
  niveau: 2nde
  parcours: tronc-commun
  ordre: 11
  titre: Statistiques descriptives

competences:
  - code: 2NDE-MOY
    libelle: Calculer une moyenne et une médiane
    resume: |
      - Moyenne : $\bar x = \dfrac{n_1 x_1 + \dots + n_p x_p}{N}$ (somme des valeurs divisée par l'effectif).
      - Médiane : valeur qui partage la série **ordonnée** en deux moitiés de même effectif.
      - Si $N$ est pair, la médiane est la moyenne des deux valeurs centrales.
      - Moyenne de deux groupes : on pondère par les effectifs, on ne fait pas la moyenne des moyennes.
    cours: |
      ## Moyenne pondérée
      Notes $12$ (coefficient $2$), $9$ (coefficient $3$), $15$ (coefficient $1$) :
      $$\bar x = \frac{2 \times 12 + 3 \times 9 + 1 \times 15}{2 + 3 + 1} = \frac{66}{6} = 11$$

      ## Médiane
      Série $3, 7, 1, 9, 5, 8$. On ordonne : $1, 3, 5, 7, 8, 9$. Effectif pair : médiane $\dfrac{5 + 7}{2} = 6$.

      ## Regrouper deux séries
      $20$ élèves de moyenne $12$ et $30$ élèves de moyenne $10$ : $\bar x = \dfrac{20 \times 12 + 30 \times 10}{50} = 10{,}8$, et non $11$.
    questions:
      - code: 2NDE-MOY-01
        difficulte: 1
        type: numerique
        enonce: 'Calculer la moyenne de la série : 8 ; 12 ; 15 ; 9 ; 11.'
        solution: 11
      - code: 2NDE-MOY-02
        difficulte: 2
        type: numerique
        enonce: 'Déterminer la médiane de la série : 3 ; 7 ; 1 ; 9 ; 5 ; 8.'
        solution: 6
      - code: 2NDE-MOY-03
        difficulte: 3
        type: numerique
        enonce: 'Un élève a obtenu 12 (coefficient 2), 9 (coefficient 3) et 15 (coefficient 1). Calculer sa moyenne.'
        solution: 11
      - code: 2NDE-MOY-04
        difficulte: 4
        type: numerique
        enonce: 'Les notes d''un élève sont 10, 13, 8 et $x$. Leur moyenne est 11. Donner $x$.'
        solution: 13
      - code: 2NDE-MOY-05
        difficulte: 5
        type: numerique
        enonce: 'La classe A (20 élèves) a une moyenne de 12 et la classe B (30 élèves) une moyenne de 10. Calculer la moyenne des 50 élèves.'
        solution: 54/5

  - code: 2NDE-DISP
    libelle: Mesurer la dispersion d'une série
    resume: |
      - Étendue : plus grande valeur moins plus petite.
      - $Q_1$ : plus petite valeur telle qu'au moins $25\,\%$ des données lui sont inférieures ou égales ; $Q_3$ : idem avec $75\,\%$.
      - Écart interquartile : $Q_3 - Q_1$.
      - Écart type : $\sigma = \sqrt{\dfrac{1}{N}\sum n_i (x_i - \bar x)^2}$.
      - Ajouter une constante à toutes les valeurs décale la moyenne mais ne change pas l'écart type.
    cours: |
      ## Quartiles
      Série ordonnée de $8$ valeurs : $2, 4, 5, 7, 8, 10, 12, 15$.
      - $\dfrac{8}{4} = 2$ : $Q_1$ est la 2ᵉ valeur, $Q_1 = 4$.
      - $\dfrac{3 \times 8}{4} = 6$ : $Q_3$ est la 6ᵉ valeur, $Q_3 = 10$.
      L'écart interquartile vaut $10 - 4 = 6$. (Si le rang n'est pas entier, on arrondit à l'entier supérieur.)

      ## Écart type
      Série $2, 4, 4, 4, 5, 5, 7, 9$ de moyenne $5$ : carrés des écarts $9, 1, 1, 1, 0, 0, 4, 16$, de moyenne $\dfrac{32}{8} = 4$.
      Donc $\sigma = \sqrt{4} = 2$.
    questions:
      - code: 2NDE-DISP-01
        difficulte: 1
        type: numerique
        enonce: 'Calculer l''étendue de la série : 4 ; 11 ; 7 ; 2 ; 15.'
        solution: 13
      - code: 2NDE-DISP-02
        difficulte: 2
        type: numerique
        enonce: 'Déterminer le premier quartile $Q_1$ de la série : 2 ; 4 ; 5 ; 7 ; 8 ; 10 ; 12 ; 15.'
        solution: 4
      - code: 2NDE-DISP-03
        difficulte: 3
        type: numerique
        enonce: 'Calculer l''écart interquartile de la série : 2 ; 4 ; 5 ; 7 ; 8 ; 10 ; 12 ; 15.'
        solution: 6
      - code: 2NDE-DISP-04
        difficulte: 4
        type: numerique
        enonce: 'Calculer l''écart type de la série : 2 ; 4 ; 4 ; 4 ; 5 ; 5 ; 7 ; 9.'
        solution: 2
      - code: 2NDE-DISP-05
        difficulte: 5
        type: qcm
        enonce: 'On ajoute 3 points à toutes les notes d''une série. A) la moyenne augmente de 3, l''écart type ne change pas  B) la moyenne et l''écart type augmentent de 3  C) la moyenne ne change pas'
        solution: A
