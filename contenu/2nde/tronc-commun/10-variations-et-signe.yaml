chapitre:
  code: 2NDE-VARIATIONS
  niveau: 2nde
  parcours: tronc-commun
  ordre: 10
  titre: Fonctions affines, variations et signe

competences:
  - code: 2NDE-AFF
    libelle: Étudier une fonction affine
    objectifs:
    - Déterminer le sens de variation et le signe d'une fonction affine.
    - Retrouver une fonction affine à partir de deux valeurs.
    methodes:
    - titre: Étudier le signe de mx + p
      etapes:
      - 'Résoudre $mx + p = 0$ : $x_0 = -\dfrac{p}{m}$.'
      - 'Si $m > 0$ : négatif avant $x_0$, positif après. Si $m < 0$ : l''inverse.'
      exemple:
        enonce: Signe de $-3x + 6$.
        resolution:
        - $-3x + 6 = 0$ pour $x = 2$.
        - '$m = -3 < 0$ : positif sur $]-\infty ; 2[$, négatif sur $]2 ; +\infty[$.'
        resultat: Positif avant 2, négatif après.
    erreurs_frequentes:
    - erreur: Prendre $p$ pour le coefficient directeur.
      explication: Dans $mx + p$, c'est $m$ (le coefficient de $x$) qui donne le sens de variation.
    resume: |
      - $f(x) = mx + p$ est croissante si $m > 0$, décroissante si $m < 0$, constante si $m = 0$.
      - Si $m \neq 0$, $f$ s'annule en $x_0 = -\dfrac{p}{m}$ et a le signe de $m$ à droite de $x_0$.
      - $m = \dfrac{f(b) - f(a)}{b - a}$ (taux d'accroissement constant).
      - Sur un intervalle fermé, le maximum d'une fonction affine est atteint à une borne.
    cours: |
      ## Sens de variation
      $f(x) = -2x + 5$ : $m = -2 < 0$, $f$ est décroissante sur $\mathbb{R}$.

      ## Signe
      $-2x + 4 = 0 \iff x = 2$. Comme $m < 0$ : $-2x + 4 > 0$ pour $x < 2$ et $-2x + 4 < 0$ pour $x > 2$.

      | $x$ | $-\infty$ | | $2$ | | $+\infty$ |
      |---|---|---|---|---|---|
      | $-2x + 4$ | | $+$ | $0$ | $-$ | |

      ## Retrouver $f$
      $f(1) = 3$ et $f(4) = 9$ : $m = \dfrac{9 - 3}{4 - 1} = 2$, puis $3 = 2 + p$, donc $f(x) = 2x + 1$.
    questions:
      - code: 2NDE-AFF-01
        difficulte: 1
        type: qcm
        enonce: 'La fonction $f(x) = -2x + 5$ est sur $\mathbb{R}$ : A) croissante  B) décroissante  C) constante'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Le coefficient de $x$ est $-2 < 0$ : $f$ est décroissante.'
          resultat: B
      - code: 2NDE-AFF-02
        difficulte: 2
        type: numerique
        enonce: 'En quelle valeur de $x$ la fonction $f(x) = 3x - 6$ s''annule-t-elle ?'
        solution: 2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $3x - 6 = 0$ donne $x = 2$.
          resultat: 2
      - code: 2NDE-AFF-03
        difficulte: 3
        type: qcm
        enonce: 'Quel est le signe de $-2x + 4$ pour $x > 2$ ? A) positif  B) négatif'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$-2x + 4$ s''annule en $2$ ; le coefficient $-2$ est négatif : l''expression est négative après $2$.'
          resultat: B
      - code: 2NDE-AFF-04
        difficulte: 4
        type: numerique
        enonce: '$f$ est une fonction affine telle que $f(1) = 3$ et $f(4) = 9$. Calculer $f(10)$.'
        solution: 21
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $m = \dfrac{9 - 3}{4 - 1} = 2$.
          - $f(1) = 2 + p = 3$, donc $p = 1$ et $f(x) = 2x + 1$.
          - $f(10) = 21$.
          resultat: 21
      - code: 2NDE-AFF-05
        difficulte: 5
        type: numerique
        enonce: 'Quel est le maximum de $f(x) = -x + 4$ sur l''intervalle $[-1 ; 3]$ ?'
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          methode: Une fonction décroissante atteint son maximum à la borne gauche.
          etapes:
          - $f$ est décroissante (coefficient $-1$).
          - 'Maximum en $x = -1$ : $f(-1) = 1 + 4 = 5$.'
          resultat: 5

  - code: 2NDE-SIGNE
    libelle: Étudier le signe d'un produit ou d'un quotient
    objectifs:
    - Étudier le signe d'un produit ou d'un quotient avec un tableau de signes.
    - Résoudre une inéquation produit ou quotient.
    prerequis:
    - 2NDE-AFF
    methodes:
    - titre: Construire un tableau de signes
      etapes:
      - Chercher la valeur qui annule chaque facteur et les ranger dans l'ordre.
      - Une ligne par facteur affine, avec son signe de part et d'autre de sa valeur d'annulation.
      - Dernière ligne avec la règle des signes ; une double barre aux valeurs interdites d'un quotient.
      exemple:
        enonce: Signe de $(x - 2)(x + 3)$.
        resolution:
        - 'Annulations : $-3$ et $2$.'
        - '$x - 2$ : $-$ puis $+$ après $2$ ; $x + 3$ : $-$ puis $+$ après $-3$.'
        - 'Produit : $+$ sur $]-\infty ; -3[$, $-$ sur $]-3 ; 2[$, $+$ sur $]2 ; +\infty[$.'
        resultat: Négatif seulement entre -3 et 2.
    erreurs_frequentes:
    - erreur: Inclure la valeur interdite d'un quotient dans les solutions.
      explication: 'Un quotient n''existe pas quand son dénominateur est nul : crochet toujours ouvert à cette valeur.'
    - erreur: Diviser par $x$ pour résoudre $x^2 \geq 2x$.
      explication: 'Le signe de $x$ est inconnu : on factorise $x(x - 2) \geq 0$ et on fait un tableau de signes.'
    resume: |
      - On étudie le signe de chaque facteur, puis on applique la règle des signes dans un **tableau de signes**.
      - Une valeur qui annule un dénominateur est **interdite** (double barre dans le tableau).
      - Pour résoudre $A(x) \ge B(x)$, on étudie le signe de $A(x) - B(x)$ après factorisation.
    cours: |
      ## Tableau de signes d'un produit
      Pour $(x - 3)(x + 1)$ : $x - 3$ s'annule en $3$, $x + 1$ en $-1$.

      | $x$ | $-\infty$ | | $-1$ | | $3$ | | $+\infty$ |
      |---|---|---|---|---|---|---|---|
      | $x + 1$ | | $-$ | $0$ | $+$ | | $+$ | |
      | $x - 3$ | | $-$ | | $-$ | $0$ | $+$ | |
      | produit | | $+$ | $0$ | $-$ | $0$ | $+$ | |

      Donc $(x - 3)(x + 1) \ge 0 \iff x \in ]-\infty ; -1] \cup [3 ; +\infty[$.

      ## Quotient
      $\dfrac{2x - 4}{x + 1} < 0 \iff x \in ]-1 ; 2[$ ($-1$ est interdite).

      ## Se ramener à un produit
      $x^2 \ge 2x \iff x^2 - 2x \ge 0 \iff x(x - 2) \ge 0$. Ne jamais diviser par $x$ sans connaître son signe !
    questions:
      - code: 2NDE-SIGNE-01
        difficulte: 1
        type: qcm
        enonce: 'Quel est le signe de $(x - 1)(x + 2)$ pour $x = 0$ ? A) positif  B) négatif  C) nul'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $(0 - 1)(0 + 2) = (-1) \times 2 = -2 < 0$.
          resultat: B
      - code: 2NDE-SIGNE-02
        difficulte: 2
        type: qcm
        enonce: 'Résoudre $(x - 3)(x + 1) \ge 0$. A) $[-1 ; 3]$  B) $]-\infty ; -1] \cup [3 ; +\infty[$  C) $[3 ; +\infty[$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Annulations en $-1$ et $3$ ; le produit est positif à l'extérieur, négatif entre.
          - 'Inégalité large : $]-\infty ; -1] \cup [3 ; +\infty[$.'
          resultat: B
      - code: 2NDE-SIGNE-03
        difficulte: 3
        type: qcm
        enonce: 'Résoudre $\dfrac{2x - 4}{x + 1} < 0$. A) $]-1 ; 2[$  B) $[-1 ; 2]$  C) $]-\infty ; -1[$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $2x - 4$ s'annule en $2$, $x + 1$ en $-1$ (valeur interdite).
          - Le quotient est négatif entre $-1$ et $2$ ; $-1$ est exclu, $2$ aussi (inégalité stricte).
          resultat: A
      - code: 2NDE-SIGNE-04
        difficulte: 4
        type: numerique
        enonce: 'Combien de nombres entiers sont solutions de $(x + 2)(5 - x) > 0$ ?'
        solution: 6
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $(x + 2)(5 - x) > 0$ pour $-2 < x < 5$ (tableau de signes).
          - 'Entiers : $-1, 0, 1, 2, 3, 4$, soit $6$.'
          resultat: 6
      - code: 2NDE-SIGNE-05
        difficulte: 5
        type: qcm
        enonce: 'Résoudre $x^2 \ge 2x$. A) $[0 ; 2]$  B) $]-\infty ; 0] \cup [2 ; +\infty[$  C) $[2 ; +\infty[$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          methode: Tout passer d'un côté et factoriser.
          etapes:
          - $x^2 - 2x \geq 0$ équivaut à $x(x - 2) \geq 0$.
          - 'Tableau de signes : positif hors de $]0 ; 2[$.'
          resultat: B
          erreurs_frequentes:
          - Diviser par $x$ et trouver seulement $x \geq 2$ (réponse C).
