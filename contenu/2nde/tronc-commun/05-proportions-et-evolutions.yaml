chapitre:
  code: 2NDE-EVOL
  niveau: 2nde
  parcours: tronc-commun
  ordre: 5
  titre: Proportions et évolutions

competences:
  - code: 2NDE-PROP
    libelle: Calculer et utiliser une proportion
    attendus: [2NDE-2026-AUTO-13, 2NDE-2026-AUTO-14, 2NDE-2026-STAT-01, 2NDE-2026-STAT-10, 2NDE-2026-STAT-11]
    cours_couvre: [2NDE-2026-AUTO-13, 2NDE-2026-AUTO-14, 2NDE-2026-STAT-01, 2NDE-2026-STAT-10, 2NDE-2026-STAT-11]
    objectifs:
    - Calculer une proportion, une part d'un tout, et une proportion de proportion.
    methodes:
    - titre: Calculer une proportion de proportion
      quand: Une sous-population est incluse dans une autre (« 25 % des internes »).
      etapes:
      - Écrire les proportions en écriture décimale.
      - Les multiplier.
      exemple:
        enonce: $60\,\%$ des élèves sont demi-pensionnaires, et $30\,\%$ d'entre eux mangent bio. Quelle proportion des élèves mange bio ?
        resolution:
        - $0{,}6 \times 0{,}3 = 0{,}18$.
        resultat: $18\,\%$
    erreurs_frequentes:
    - erreur: Additionner des pourcentages qui ne portent pas sur le même ensemble.
      explication: '$25\,\%$ des internes et $40\,\%$ des élèves ne se rapportent pas au même total : on les multiplie.'
    resume: |
      - Proportion d'une sous-population $A$ dans une population $E$ : $p = \dfrac{n_A}{n_E}$, avec $0 \leqslant p \leqslant 1$.
      - Elle s'écrit en décimal, en fraction ou en pourcentage : $0{,}35 = \dfrac{7}{20} = 35\,\%$.
      - Partie : $n_A = p \times n_E$ ; tout : $n_E = \dfrac{n_A}{p}$.
      - Si $A \subset B \subset E$ : $p_{A/E} = p_{A/B} \times p_{B/E}$ (pourcentage de pourcentage).
      - Proportions de deux parties disjointes : on les additionne ; sinon, on retire la partie commune.
    cours: |
      ## 1. Définition
      Soit $E$ une population de référence d'effectif $n_E$ et $A$ une sous-population d'effectif $n_A$.

      > **Définition.** La **proportion** (ou fréquence) de $A$ dans $E$ est $p = \dfrac{n_A}{n_E}$. C'est un nombre compris entre $0$ et $1$.

      Une proportion peut s'écrire sous forme **décimale**, **fractionnaire** ou en **pourcentage** : $p = 0{,}35 = \dfrac{35}{100} = \dfrac{7}{20} = 35\,\%$. Pour passer d'un décimal à un pourcentage, on multiplie par $100$.

      ## 2. Relation entre effectifs et proportion
      > **Propriété.** $n_A = p \times n_E$ et, si $p \neq 0$, $n_E = \dfrac{n_A}{p}$.

      ### Méthode : calculer une partie ou le tout
      1. Repérer la population de référence (le « tout ») et la sous-population (la « partie »).
      2. Écrire la proportion en décimal.
      3. Pour une partie : multiplier le tout par $p$. Pour le tout : diviser la partie par $p$.

      **Exemples.**
      - $18\,\%$ des $650$ élèves d'un lycée font du théâtre : $0{,}18 \times 650 = 117$ élèves.
      - $42$ élèves, soit $12\,\%$ des élèves d'un lycée, sont délégués : le lycée compte $\dfrac{42}{0{,}12} = 350$ élèves.

      ## 3. Proportion de proportion
      > **Propriété.** Si $A \subset B \subset E$, en notant $p_1$ la proportion de $A$ dans $B$ et $p_2$ la proportion de $B$ dans $E$, la proportion de $A$ dans $E$ est $p = p_1 \times p_2$.

      **Justification.** $\dfrac{n_A}{n_E} = \dfrac{n_A}{n_B} \times \dfrac{n_B}{n_E}$.

      **Exemple complet.** Dans une entreprise, $60\,\%$ des salariés travaillent en atelier, et $15\,\%$ des salariés d'atelier sont des chefs d'équipe. La proportion de chefs d'équipe d'atelier parmi tous les salariés est $0{,}15 \times 0{,}6 = 0{,}09$, soit $9\,\%$. S'il y a $800$ salariés, cela représente $0{,}09 \times 800 = 72$ personnes.

      ## 4. Réunion de deux sous-populations
      Si $A$ et $B$ sont deux parties de $E$ **sans élément commun**, la proportion de « $A$ ou $B$ » est $p_A + p_B$. Sinon, les éléments communs sont comptés deux fois : la proportion de « $A$ ou $B$ » est $p_A + p_B - p_{A \text{ et } B}$.

      Exemple : $40\,\%$ des clients achètent du pain, $25\,\%$ des croissants et $10\,\%$ les deux ; donc $40 + 25 - 10 = 55\,\%$ achètent au moins l'un des deux.

      ## 5. Erreurs fréquentes
      - Additionner deux pourcentages qui n'ont pas la même population de référence.
      - Additionner au lieu de multiplier dans un pourcentage de pourcentage : « $15\,\%$ de $60\,\%$ » vaut $9\,\%$, pas $75\,\%$.
      - Oublier de retirer la partie commune quand on regroupe deux sous-populations.
      - Confondre la proportion $p$ (entre $0$ et $1$) et le pourcentage ($p \times 100$).
    questions:
      - code: 2NDE-PROP-01
        difficulte: 1
        type: numerique
        enonce: 'Calculer 30 % de 250.'
        solution: 75
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $250 \times \dfrac{30}{100} = 75$.
          resultat: 75
      - code: 2NDE-PROP-02
        difficulte: 2
        type: numerique
        enonce: 'Une classe compte 32 élèves dont 12 filles. Donner la proportion de filles en écriture décimale.'
        solution: 3/8
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\dfrac{12}{32} = \dfrac{3}{8} = 0{,}375$.
          resultat: 3/8
      - code: 2NDE-PROP-03
        difficulte: 3
        type: numerique
        enonce: '40 % des élèves d''un lycée sont internes et 25 % des internes sont en Seconde. Quelle proportion (en écriture décimale) des élèves du lycée sont des internes de Seconde ?'
        solution: 1/10
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Proportion de proportion : on multiplie.'
          etapes:
          - 'Les internes de Seconde forment une partie des internes, qui forment eux-mêmes une partie des élèves du lycée : c''est une proportion de proportion.'
          - 'Proportion des internes dans le lycée : $0{,}4$ ; proportion des Secondes parmi les internes : $0{,}25$.'
          - 'On multiplie les deux proportions : $0{,}4 \times 0{,}25 = 0{,}1$.'
          - 'Les internes de Seconde représentent donc $0{,}1 = \dfrac{1}{10}$ des élèves, soit $10\,\%$.'
          resultat: 1/10
      - code: 2NDE-PROP-04
        difficulte: 4
        type: numerique
        enonce: '480 habitants représentent 15 % de la population d''une ville. Combien la ville compte-t-elle d''habitants ?'
        solution: 3200
        auteur: Brouillon IA (Claude)
        correction:
          methode: Effectif total $= \dfrac{\text{effectif partiel}}{\text{proportion}}$.
          etapes:
          - $\dfrac{480}{0{,}15} = 3\,200$.
          - 'Vérification : $15\,\%$ de $3\,200 = 480$.'
          resultat: 3200
      - code: 2NDE-PROP-05
        difficulte: 5
        type: numerique
        enonce: 'Dans un club, 30 % des membres font du tennis, 50 % du football et 10 % les deux. Quel pourcentage des membres pratique au moins l''un des deux sports ? (Donner le nombre sans le symbole %.)'
        solution: 70
        auteur: Brouillon IA (Claude)
        correction:
          methode: Les membres qui font les deux sports sont comptés deux fois si on additionne.
          etapes:
          - 'Si on additionne $30\,\%$ et $50\,\%$, les membres qui pratiquent les deux sports sont comptés deux fois : une fois avec le tennis, une fois avec le football.'
          - 'On retire donc une fois la partie commune : $30 + 50 - 10 = 70$.'
          - '$70\,\%$ des membres pratiquent au moins l''un des deux sports (et donc $30\,\%$ n''en pratiquent aucun).'
          resultat: 70
      - code: 2NDE-PROP-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {t: {parmi: [5, 10, 12, 15, 20, 25, 30, 35, 40, 45, 60, 75]}, n: {entre: [2, 40], pas: 1}}
          calculs: {N: "n*20", r: "t*n*20/100"}
        enonce: 'Dans un lycée de $[[N]]$ élèves, $[[t]]\,\%$ sont internes. Combien d''élèves sont internes ?'
        solution: '[[r]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Appliquer une proportion : partie = proportion × tout.'
          etapes:
          - '$[[t]]\,\% = [[t/100]]$.'
          - '$[[t/100]] \times [[N]] = [[r]]$.'
          resultat: '[[r]]'

  - code: 2NDE-EVO
    libelle: Calculer des évolutions et des taux
    attendus: [2NDE-2026-AUTO-15, 2NDE-2026-STAT-02, 2NDE-2026-STAT-03, 2NDE-2026-STAT-12, 2NDE-2026-STAT-13]
    cours_couvre: [2NDE-2026-AUTO-15, 2NDE-2026-STAT-02, 2NDE-2026-STAT-03, 2NDE-2026-STAT-12, 2NDE-2026-STAT-13]
    objectifs:
    - Utiliser le coefficient multiplicateur pour des évolutions simples, successives ou réciproques.
    prerequis:
    - 2NDE-PROP
    methodes:
    - titre: Calculer une évolution globale ou réciproque
      etapes:
      - Associer à chaque évolution de $t\,\%$ son coefficient $1 + \dfrac{t}{100}$ (avec $t < 0$ pour une baisse).
      - 'Évolutions successives : multiplier les coefficients.'
      - 'Évolution réciproque : prendre l''inverse du coefficient.'
      - 'Revenir à un taux : $t = (\text{coefficient} - 1) \times 100$.'
      exemple:
        enonce: Un prix baisse de $10\,\%$ puis augmente de $10\,\%$. Évolution globale ?
        resolution:
        - $0{,}9 \times 1{,}1 = 0{,}99$.
        - $t = (0{,}99 - 1) \times 100 = -1$.
        resultat: Baisse de $1\,\%$
    erreurs_frequentes:
    - erreur: 'Additionner les taux : $+20\,\%$ puis $-20\,\%$ ne donne pas $0\,\%$.'
      explication: 'La seconde évolution s''applique à une valeur déjà modifiée : on multiplie les coefficients ($1{,}2 \times 0{,}8 = 0{,}96$).'
    resume: |
      - Variation absolue : $V_2 - V_1$ ; coefficient multiplicateur : $CM = \dfrac{V_2}{V_1}$ ; taux d'évolution : $t = \dfrac{V_2 - V_1}{V_1}$.
      - $CM = 1 + t$ : augmenter de $5\,\%$, c'est multiplier par $1{,}05$ ; diminuer de $5\,\%$, c'est multiplier par $0{,}95$.
      - Évolutions successives : les coefficients multiplicateurs se **multiplient** (les taux ne s'additionnent pas).
      - Évolution réciproque : coefficient $\dfrac{1}{CM}$.
    cours: |
      ## 1. Trois façons de mesurer une évolution
      Une grandeur passe d'une valeur $V_1 > 0$ à une valeur $V_2$.

      > **Définitions.**
      > - **Variation absolue** (additive) : $V_2 - V_1$, exprimée dans l'unité de la grandeur.
      > - **Coefficient multiplicateur** (variation multiplicative) : $CM = \dfrac{V_2}{V_1}$.
      > - **Taux d'évolution** (variation relative) : $t = \dfrac{V_2 - V_1}{V_1}$, souvent exprimé en pourcentage.

      > **Propriété.** $CM = 1 + t$ et $V_2 = V_1 \times (1 + t)$.

      **Démonstration.** $1 + t = \dfrac{V_1}{V_1} + \dfrac{V_2 - V_1}{V_1} = \dfrac{V_2}{V_1} = CM$.

      Ainsi, une hausse de $t\,\%$ correspond à un coefficient $1 + \dfrac{t}{100}$, une baisse de $t\,\%$ à un coefficient $1 - \dfrac{t}{100}$. « Augmenter de $5\,\%$ » revient à « multiplier par $1{,}05$ » ; « diminuer de $5\,\%$ » revient à « multiplier par $0{,}95$ ».

      **Exemple.** Un prix passe de $80$ € à $92$ € : variation absolue $12$ €, coefficient $\dfrac{92}{80} = 1{,}15$, taux $+15\,\%$.

      ## 2. Retrouver une valeur
      - Valeur d'arrivée : $V_2 = V_1 \times CM$. Un article à $45$ € soldé à $-20\,\%$ coûte $45 \times 0{,}8 = 36$ €.
      - Valeur de départ : $V_1 = \dfrac{V_2}{CM}$. Après une hausse de $8\,\%$, un loyer vaut $702$ € ; avant, il valait $\dfrac{702}{1{,}08} = 650$ €.

      ## 3. Évolutions successives
      > **Propriété.** Si une grandeur subit successivement des évolutions de coefficients $CM_1$ et $CM_2$, le coefficient global est $CM = CM_1 \times CM_2$. Le taux global est $t = CM - 1$.

      **Exemple complet.** Un prix augmente de $20\,\%$ puis baisse de $20\,\%$.
      - Coefficients : $1{,}2$ puis $0{,}8$.
      - Coefficient global : $1{,}2 \times 0{,}8 = 0{,}96$.
      - Taux global : $0{,}96 - 1 = -0{,}04$, soit une **baisse** de $4\,\%$ : le prix ne revient pas à sa valeur initiale.

      ## 4. Évolution réciproque
      > **Propriété.** L'évolution qui ramène $V_2$ à $V_1$ a pour coefficient $CM' = \dfrac{1}{CM}$, et pour taux $t' = \dfrac{1}{CM} - 1$.

      Exemple : après une hausse de $25\,\%$ ($CM = 1{,}25$), il faut une baisse de coefficient $\dfrac{1}{1{,}25} = 0{,}8$, soit $-20\,\%$, pour revenir à la valeur de départ.

      ### Méthode : calculer un taux global ou réciproque
      1. Traduire chaque pourcentage en coefficient multiplicateur.
      2. Multiplier les coefficients (évolutions successives) ou prendre l'inverse (évolution réciproque).
      3. Revenir au taux en soustrayant $1$, puis l'écrire en pourcentage.

      ## 5. Erreurs fréquentes
      - Additionner des taux successifs : $+20\,\%$ puis $-20\,\%$ ne donnent pas $0\,\%$.
      - Croire que la réciproque d'une hausse de $t\,\%$ est une baisse de $t\,\%$.
      - Diviser par $V_2$ au lieu de $V_1$ dans le calcul d'un taux : la référence est la valeur de **départ**.
      - Confondre variation absolue (en euros, en habitants…) et taux (sans unité).
    questions:
      - code: 2NDE-EVO-01
        difficulte: 1
        type: numerique
        enonce: 'Quel est le coefficient multiplicateur associé à une hausse de 15 % ?'
        solution: 1.15
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $1 + \dfrac{15}{100} = 1{,}15$.
          resultat: 1.15
      - code: 2NDE-EVO-02
        difficulte: 2
        type: numerique
        enonce: 'Un article coûte 80 €. Son prix baisse de 25 %. Quel est son nouveau prix en euros ?'
        solution: 60
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Coefficient d''une baisse de $25\,\%$ : $0{,}75$.'
          - $80 \times 0{,}75 = 60$.
          resultat: 60
      - code: 2NDE-EVO-03
        difficulte: 3
        type: numerique
        enonce: 'Un prix augmente de 20 % puis baisse de 20 %. Quel est le taux d''évolution global en pourcentage ? (Nombre négatif pour une baisse, sans le symbole %.)'
        solution: -4
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Évolutions successives : on multiplie les coefficients.'
          etapes:
          - $1{,}2 \times 0{,}8 = 0{,}96$.
          - $t = (0{,}96 - 1) \times 100 = -4$.
          resultat: -4
          erreurs_frequentes:
          - Répondre $0$ en additionnant $+20$ et $-20$.
      - code: 2NDE-EVO-04
        difficulte: 4
        type: numerique
        enonce: 'Un loyer a augmenté de 25 %. De quel taux doit-il évoluer pour revenir à sa valeur initiale ? (En pourcentage, nombre négatif pour une baisse.)'
        solution: -20
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Évolution réciproque : coefficient inverse.'
          etapes:
          - $\dfrac{1}{1{,}25} = 0{,}8$.
          - $t = (0{,}8 - 1) \times 100 = -20$.
          resultat: -20
          erreurs_frequentes:
          - 'Répondre $-25$ : une baisse de $25\,\%$ s''applique à une valeur plus grande.'
      - code: 2NDE-EVO-05
        difficulte: 5
        type: numerique
        enonce: 'Deux hausses successives de même taux $t\,\%$ donnent une hausse globale de 21 %. Donner $t$.'
        solution: 10
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $(1 + t)^2 = 1{,}21$ avec $1 + t > 0$.
          - $1 + t = 1{,}1$, donc une hausse de $10\,\%$.
          resultat: 10
      - code: 2NDE-EVO-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {t1: {parmi: [10, 20, 25, 50]}, t2: {parmi: [-10, -20, -25, 10, 20]}}
          calculs: {g: "((1 + t1/100)*(1 + t2/100) - 1)*100"}
        enonce: 'Un prix augmente de $[[t1]]\,\%$, puis évolue de $[[t2]]\,\%$. Quel est le taux d''évolution global, en pourcentage ?'
        solution: '[[g]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Évolutions successives : on multiplie les coefficients multiplicateurs.'
          etapes:
          - 'Coefficients : $[[1 + t1/100]]$ et $[[1 + t2/100]]$.'
          - 'Coefficient global : $[[1 + t1/100]] \times [[1 + t2/100]] = [[(1 + t1/100)*(1 + t2/100)]]$.'
          - 'Taux global : $([[(1 + t1/100)*(1 + t2/100)]] - 1) \times 100 = [[g]]\,\%$.'
          resultat: '[[g]]'
