chapitre:
  code: 2NDE-DROITES
  niveau: 2nde
  parcours: tronc-commun
  ordre: 7
  titre: Droites et systèmes d'équations

competences:
  - code: 2NDE-DROITE
    libelle: Déterminer et utiliser l'équation réduite d'une droite
    resume: |
      - Une droite non parallèle à l'axe des ordonnées a une équation réduite $y = mx + p$.
      - $m$ : coefficient directeur, $m = \dfrac{y_B - y_A}{x_B - x_A}$ ; $p$ : ordonnée à l'origine.
      - Une droite parallèle à l'axe des ordonnées a une équation $x = c$.
      - Deux droites sont parallèles si et seulement si elles ont le même coefficient directeur.
    cours: |
      ## Coefficient directeur
      Pour $A(1 ; 2)$ et $B(3 ; 8)$ : $m = \dfrac{8 - 2}{3 - 1} = 3$.

      ## Ordonnée à l'origine
      La droite passe par $A$ : $2 = 3 \times 1 + p$, donc $p = -1$ et $(AB) : y = 3x - 1$.

      ## Équation cartésienne
      Toute droite a une équation $ax + by + c = 0$. Si $b \neq 0$, on retrouve l'équation réduite en isolant $y$ :
      $4x - 2y + 3 = 0 \iff y = 2x + \dfrac{3}{2}$.

      ## Positions relatives
      Même $m$ et même $p$ : confondues ; même $m$, $p$ différents : parallèles ; $m$ différents : sécantes.
    questions:
      - code: 2NDE-DROITE-01
        difficulte: 1
        type: numerique
        enonce: 'Quel est le coefficient directeur de la droite d''équation $y = -3x + 2$ ?'
        solution: -3
      - code: 2NDE-DROITE-02
        difficulte: 2
        type: numerique
        enonce: 'Calculer le coefficient directeur de la droite $(AB)$ avec $A(1 ; 2)$ et $B(3 ; 8)$.'
        solution: 3
      - code: 2NDE-DROITE-03
        difficulte: 3
        type: numerique
        enonce: 'Une droite de coefficient directeur 3 passe par $A(1 ; 2)$. Quelle est son ordonnée à l''origine ?'
        solution: -1
      - code: 2NDE-DROITE-04
        difficulte: 4
        type: expression
        enonce: 'Déterminer l''équation réduite $y = \dots$ de la droite passant par $A(2 ; 1)$ et $B(4 ; 5)$. Écrire seulement l''expression en $x$.'
        solution: 2x - 3
      - code: 2NDE-DROITE-05
        difficulte: 5
        type: qcm
        enonce: 'Les droites d''équations $y = 2x + 1$ et $4x - 2y + 3 = 0$ sont : A) sécantes  B) strictement parallèles  C) confondues'
        solution: B

  - code: 2NDE-SYST
    libelle: Résoudre un système de deux équations à deux inconnues
    resume: |
      - **Substitution** : on isole une inconnue dans une équation et on la remplace dans l'autre.
      - **Combinaison** : on multiplie les équations pour éliminer une inconnue en les additionnant.
      - Un système peut avoir une solution, aucune (droites parallèles) ou une infinité (droites confondues).
    cours: |
      ## Par combinaison
      $$\begin{cases} 2x + y = 7 \\ x - y = 2 \end{cases}$$
      En additionnant : $3x = 9$, donc $x = 3$, puis $y = 7 - 2 \times 3 = 1$.

      ## Interprétation graphique
      Chaque équation est celle d'une droite ; la solution est le point d'intersection.
      $\begin{cases} x + 2y = 3 \\ 2x + 4y = 5 \end{cases}$ : la deuxième ligne donnerait $x + 2y = 2{,}5$, incompatible avec la première : aucune solution (droites parallèles).

      ## Mise en équation
      On choisit les inconnues (par exemple $c$ = prix d'un cahier, $s$ = prix d'un stylo), on traduit l'énoncé en deux équations, on résout et on vérifie.
    questions:
      - code: 2NDE-SYST-01
        difficulte: 1
        type: numerique
        enonce: 'Résoudre le système $x + y = 5$ et $x - y = 1$. Donner $x$.'
        solution: 3
      - code: 2NDE-SYST-02
        difficulte: 2
        type: numerique
        enonce: 'Résoudre le système $2x + y = 7$ et $x - y = 2$. Donner $y$.'
        solution: 1
      - code: 2NDE-SYST-03
        difficulte: 3
        type: qcm
        enonce: 'Combien de solutions a le système $x + 2y = 3$ et $2x + 4y = 5$ ? A) une seule  B) aucune  C) une infinité'
        solution: B
      - code: 2NDE-SYST-04
        difficulte: 4
        type: numerique
        enonce: 'Résoudre le système $3x + 2y = 12$ et $5x - 3y = 1$. Donner $y$.'
        solution: 3
      - code: 2NDE-SYST-05
        difficulte: 5
        type: numerique
        enonce: '3 cahiers et 2 stylos coûtent 9,50 € ; 1 cahier et 4 stylos coûtent 6,50 €. Quel est le prix d''un cahier en euros ?'
        solution: 5/2
