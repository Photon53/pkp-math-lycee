chapitre:
  code: 2NDE-LITTERAL
  niveau: 2nde
  parcours: tronc-commun
  ordre: 2
  titre: Calcul littéral

competences:
  - code: 2NDE-DEV
    libelle: Développer une expression
    objectifs:
    - Développer et réduire une expression avec la distributivité.
    - Utiliser les identités remarquables dans les deux sens.
    prerequis:
    - 2NDE-PUIS
    methodes:
    - titre: Développer un produit de deux facteurs
      etapes:
      - 'Multiplier chaque terme du premier facteur par chaque terme du second : $(a + b)(c + d) = ac + ad + bc + bd$.'
      - Faire attention aux signes de chaque produit.
      - Réduire en regroupant les termes de même degré.
      exemple:
        enonce: Développer $(3x - 2)(x + 5)$.
        resolution:
        - $3x \times x + 3x \times 5 - 2 \times x - 2 \times 5$.
        - $= 3x^2 + 15x - 2x - 10 = 3x^2 + 13x - 10$.
        resultat: $3x^2 + 13x - 10$
    erreurs_frequentes:
    - erreur: Écrire $(x + 3)^2 = x^2 + 9$.
      explication: 'Il manque le double produit : $(a + b)^2 = a^2 + 2ab + b^2$, donc $(x + 3)^2 = x^2 + 6x + 9$.'
    - erreur: Oublier un signe moins en distribuant.
      explication: '$-1 \times 4 = -4$ : on garde le signe de chaque terme.'
    resume: |
      - Simple distributivité : $k(a + b) = ka + kb$
      - Double distributivité : $(a + b)(c + d) = ac + ad + bc + bd$
      - Identités remarquables :
        $(a + b)^2 = a^2 + 2ab + b^2$ ;  $(a - b)^2 = a^2 - 2ab + b^2$ ;  $(a + b)(a - b) = a^2 - b^2$
    cours: |
      **Développer**, c'est transformer un produit en somme.

      ## Distributivité
      Chaque terme d'une parenthèse multiplie chaque terme de l'autre :

      $$(2x - 1)(x + 3) = 2x \times x + 2x \times 3 - 1 \times x - 1 \times 3 = 2x^2 + 5x - 3$$

      ## Identités remarquables
      Elles évitent de refaire la double distributivité à chaque fois :

      $$(x + 5)^2 = x^2 + 2 \times x \times 5 + 5^2 = x^2 + 10x + 25$$

      Attention : $(a + b)^2 \neq a^2 + b^2$. Le **double produit** $2ab$ est l'erreur la plus fréquente.

      ## Vérifier son résultat
      Remplacer $x$ par une valeur simple (par exemple $x = 1$) dans l'expression de départ
      et dans le résultat : on doit trouver la même valeur.
    questions:
      - code: 2NDE-DEV-01
        difficulte: 2
        type: expression
        enonce: Développer (x + 3)².
        solution: x^2 + 6x + 9
        auteur: Brouillon IA (Claude)
        correction:
          methode: Identité remarquable $(a + b)^2 = a^2 + 2ab + b^2$.
          etapes:
          - '$a = x$ et $b = 3$ : $x^2 + 2 \times x \times 3 + 3^2$.'
          - $= x^2 + 6x + 9$.
          resultat: x^2 + 6x + 9
          erreurs_frequentes:
          - Oublier le double produit $6x$.
      - code: 2NDE-DEV-02
        difficulte: 2
        type: expression
        enonce: Développer (a + b)(a − b).
        solution: a^2 - b^2
        auteur: Brouillon IA (Claude)
        correction:
          methode: Identité remarquable $(a + b)(a - b) = a^2 - b^2$.
          etapes:
          - $(a + b)(a - b) = a^2 - ab + ab - b^2 = a^2 - b^2$.
          resultat: a^2 - b^2
      - code: 2NDE-DEV-03
        difficulte: 3
        type: expression
        enonce: Développer (2x − 1)(x + 4).
        solution: 2x^2 + 7x - 4
        auteur: Brouillon IA (Claude)
        correction:
          methode: Double distributivité.
          etapes:
          - $(2x - 1)(x + 4) = 2x \times x + 2x \times 4 - 1 \times x - 1 \times 4$.
          - $= 2x^2 + 8x - x - 4 = 2x^2 + 7x - 4$.
          resultat: 2x^2 + 7x - 4
      - code: 2NDE-DEV-04
        difficulte: 4
        type: expression
        enonce: 'Développer $(x + 3)^3$. Indication : $(x + 3)^3 = (x + 3)^2 (x + 3)$.'
        solution: x^3 + 9x^2 + 27x + 27
        source: STACK
        source_url: https://docs.stack-assessment.org/
        licence_source: à vérifier
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Développer le carré, puis multiplier par le dernier facteur.
          etapes:
          - $(x + 3)^2 = x^2 + 6x + 9$.
          - $(x^2 + 6x + 9)(x + 3) = x^3 + 3x^2 + 6x^2 + 18x + 9x + 27$.
          - $= x^3 + 9x^2 + 27x + 27$.
          resultat: x^3 + 9x^2 + 27x + 27
      - code: 2NDE-DEV-05
        difficulte: 1
        type: expression
        enonce: Développer $3(x + 4)$.
        solution: 3x + 12
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Distributivité simple : $k(a + b) = ka + kb$.'
          etapes:
          - $3 \times x + 3 \times 4 = 3x + 12$.
          resultat: 3x + 12
      - code: 2NDE-DEV-06
        difficulte: 5
        type: expression
        enonce: Développer et réduire $(2x - 3)^2 - (x + 1)(x - 1)$.
        solution: 3x^2 - 12x + 10
        auteur: Brouillon IA (Claude)
        correction:
          methode: Deux identités remarquables, puis une soustraction entre parenthèses.
          etapes:
          - $(2x - 3)^2 = 4x^2 - 12x + 9$ et $(x + 1)(x - 1) = x^2 - 1$.
          - $4x^2 - 12x + 9 - (x^2 - 1) = 4x^2 - 12x + 9 - x^2 + 1$.
          - $= 3x^2 - 12x + 10$.
          erreurs_frequentes:
          - Oublier les parenthèses et écrire $- x^2 - 1$ au lieu de $- x^2 + 1$.
          resultat: 3x^2 - 12x + 10

  - code: 2NDE-EQ1
    libelle: Résoudre une équation du premier degré
    objectifs:
    - Résoudre une équation du premier degré à une inconnue.
    - Vérifier la solution en la remplaçant dans l'équation.
    methodes:
    - titre: Résoudre une équation du premier degré
      etapes:
      - Regrouper les termes en $x$ d'un côté et les nombres de l'autre, en faisant la même opération des deux côtés.
      - Diviser les deux membres par le coefficient de $x$.
      - Vérifier en remplaçant $x$ par la valeur trouvée.
      exemple:
        enonce: Résoudre $5x - 3 = 2x + 9$.
        resolution:
        - $5x - 2x = 9 + 3$, soit $3x = 12$.
        - '$x = 4$. Vérification : $5 \times 4 - 3 = 17$ et $2 \times 4 + 9 = 17$.'
        resultat: $x = 4$
    erreurs_frequentes:
    - erreur: Changer un terme de membre sans changer son signe.
      explication: '« Passer de l''autre côté » revient à soustraire (ou ajouter) ce terme aux deux membres : son signe change.'
    resume: |
      - On peut ajouter ou soustraire le même nombre aux deux membres.
      - On peut multiplier ou diviser les deux membres par le même nombre **non nul**.
      - $ax + b = 0$ avec $a \neq 0$ a pour unique solution $x = -\dfrac{b}{a}$.
    cours: |
      ## Méthode
      1. Regrouper les termes en $x$ d'un côté, les nombres de l'autre.
      2. Réduire chaque membre.
      3. Diviser par le coefficient de $x$.

      ## Exemple
      $$5x - 4 = 2x + 8 \iff 5x - 2x = 8 + 4 \iff 3x = 12 \iff x = 4$$

      ## Vérification
      On remplace $x$ par la solution trouvée : $5 \times 4 - 4 = 16$ et $2 \times 4 + 8 = 16$.
      Les deux membres sont égaux, la solution est correcte.
    questions:
      - code: 2NDE-EQ1-01
        difficulte: 1
        type: numerique
        enonce: Résoudre 3x + 5 = 20. x = ?
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $3x + 5 = 20$ donne $3x = 15$.
          - '$x = 5$. Vérification : $3 \times 5 + 5 = 20$.'
          resultat: 5
      - code: 2NDE-EQ1-02
        difficulte: 2
        type: numerique
        enonce: Résoudre 2x − 7 = 4x + 1. x = ?
        solution: -4
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $2x - 4x = 1 + 7$, soit $-2x = 8$.
          - $x = \dfrac{8}{-2} = -4$.
          - 'Vérification : $2 \times (-4) - 7 = -15$ et $4 \times (-4) + 1 = -15$.'
          resultat: -4
          erreurs_frequentes:
          - Diviser par $2$ au lieu de $-2$ et trouver $4$.
      - code: 2NDE-EQ1-03
        difficulte: 3
        type: numerique
        enonce: Résoudre (x + 1)/3 = 2. x = ?
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier les deux membres par le dénominateur.
          etapes:
          - $\dfrac{x + 1}{3} = 2$ donne $x + 1 = 6$.
          - $x = 5$.
          resultat: 5
      - code: 2NDE-EQ1-04
        difficulte: 1
        type: numerique
        enonce: Résoudre 2x = 6. x = ? (ancienne version)
        solution: 3
        archivee: true
      - code: 2NDE-EQ1-05
        difficulte: 4
        type: numerique
        enonce: Résoudre $\dfrac{2x - 1}{3} = \dfrac{x + 4}{2}$.
        solution: '14'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier les deux membres par 6 (produit en croix).
          etapes:
          - $2(2x - 1) = 3(x + 4)$, soit $4x - 2 = 3x + 12$.
          - '$x = 14$. Vérification : $\dfrac{27}{3} = 9$ et $\dfrac{18}{2} = 9$.'
          resultat: '14'
      - code: 2NDE-EQ1-06
        difficulte: 5
        type: numerique
        enonce: Un forfait téléphonique coûte 12 € par mois plus 0,05 € par SMS ; un autre coûte 20 € par mois, SMS illimités. Pour combien de SMS par mois les deux forfaits coûtent-ils le même prix ?
        solution: '160'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Mettre le problème en équation avec $x$ le nombre de SMS.
          etapes:
          - $12 + 0{,}05x = 20$, soit $0{,}05x = 8$.
          - $x = \dfrac{8}{0{,}05} = 160$ SMS.
          resultat: '160'
