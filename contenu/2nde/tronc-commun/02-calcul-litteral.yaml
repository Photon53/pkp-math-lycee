chapitre:
  code: 2NDE-LITTERAL
  niveau: 2nde
  parcours: tronc-commun
  ordre: 2
  titre: Calcul littéral

competences:
  - code: 2NDE-DEV
    libelle: Développer une expression
    attendus: [2NDE-2026-AUTO-09, 2NDE-2026-ALG-02, 2NDE-2026-ALG-11]
    cours_couvre: [2NDE-2026-AUTO-09, 2NDE-2026-ALG-02, 2NDE-2026-ALG-11]
    objectifs:
    - Développer et réduire une expression avec la distributivité.
    - Utiliser les identités remarquables dans les deux sens.
    prerequis:
    - 2NDE-PUIS
    methodes:
    - titre: Développer un produit de deux facteurs
      etapes:
      - 'Multiplier chaque terme du premier facteur par chaque terme du second : $(a + b)(c + d) = ac + ad + bc + bd$.'
      - Faire attention aux signes de chaque produit.
      - Réduire en regroupant les termes de même degré.
      exemple:
        enonce: Développer $(3x - 2)(x + 5)$.
        resolution:
        - $3x \times x + 3x \times 5 - 2 \times x - 2 \times 5$.
        - $= 3x^2 + 15x - 2x - 10 = 3x^2 + 13x - 10$.
        resultat: $3x^2 + 13x - 10$
    erreurs_frequentes:
    - erreur: Écrire $(x + 3)^2 = x^2 + 9$.
      explication: 'Il manque le double produit : $(a + b)^2 = a^2 + 2ab + b^2$, donc $(x + 3)^2 = x^2 + 6x + 9$.'
    - erreur: Oublier un signe moins en distribuant.
      explication: '$-1 \times 4 = -4$ : on garde le signe de chaque terme.'
    resume: |
      - **Développer** transforme un produit en somme ; **factoriser** transforme une somme en produit.
      - Distributivité : $k(a + b) = ka + kb$ et $(a + b)(c + d) = ac + ad + bc + bd$.
      - Identités remarquables : $(a + b)^2 = a^2 + 2ab + b^2$, $(a - b)^2 = a^2 - 2ab + b^2$, $(a + b)(a - b) = a^2 - b^2$.
      - Factoriser $ax^2 + bx = x(ax + b)$ en repérant le facteur commun.
      - Forme développée pour calculer une image ou comparer ; forme factorisée pour résoudre $= 0$ ou étudier un signe.
    cours: |
      ## 1. Vocabulaire
      Une **expression algébrique** contient des nombres et des lettres. Elle est une **somme** si la dernière opération à effectuer est une addition ou une soustraction, un **produit** si c'est une multiplication.
      - **Développer**, c'est écrire un produit sous forme de somme.
      - **Factoriser**, c'est écrire une somme sous forme de produit.
      - **Réduire**, c'est regrouper les termes de même nature : $3x^2 + 5x - x^2 + 2x = 2x^2 + 7x$.

      ## 2. Distributivité
      > **Propriété.** Pour tous réels $k$, $a$, $b$, $c$, $d$ : $k(a + b) = ka + kb$ et $(a + b)(c + d) = ac + ad + bc + bd$.

      Lue de droite à gauche, la simple distributivité permet de **factoriser** par un facteur commun : $ax + bx = (a + b)x$ et $ax^2 + bx = x(ax + b)$.

      ## 3. Identités remarquables
      > **Propriété.** Pour tous réels $a$ et $b$ :
      > - $(a + b)^2 = a^2 + 2ab + b^2$
      > - $(a - b)^2 = a^2 - 2ab + b^2$
      > - $(a + b)(a - b) = a^2 - b^2$

      **Démonstration.** $(a + b)^2 = (a + b)(a + b) = a^2 + ab + ba + b^2 = a^2 + 2ab + b^2$. Les deux autres se démontrent de la même façon par double distributivité.

      Elles s'utilisent dans les deux sens : pour développer et pour factoriser. Par exemple $9x^2 - 25 = (3x)^2 - 5^2 = (3x - 5)(3x + 5)$.

      ### Méthode : factoriser une expression
      1. Chercher un **facteur commun** visible (nombre, $x$, parenthèse entière).
      2. Sinon, reconnaître une **identité remarquable** : trois termes dont deux carrés (forme $a^2 \pm 2ab + b^2$) ou une différence de deux carrés.
      3. Contrôler en redéveloppant le résultat.

      **Exemple complet.** Factoriser $E = (2x + 1)(x - 3) - (2x + 1)(4x + 5)$.
      - Le facteur commun est $(2x + 1)$ : $E = (2x + 1)\big[(x - 3) - (4x + 5)\big]$.
      - On réduit le crochet en changeant les signes de la parenthèse précédée de « $-$ » : $x - 3 - 4x - 5 = -3x - 8$.
      - Donc $E = (2x + 1)(-3x - 8)$.

      ## 4. Expressions fractionnaires
      Pour additionner deux quotients, on les met au même dénominateur, comme pour les fractions. Pour $x \neq 0$ et $x \neq -1$ :
      $\dfrac{2}{x} + \dfrac{3}{x + 1} = \dfrac{2(x + 1)}{x(x + 1)} + \dfrac{3x}{x(x + 1)} = \dfrac{5x + 2}{x(x + 1)}$.

      ## 5. Choisir la forme adaptée
      Une même expression peut s'écrire sous plusieurs formes ; on choisit celle qui rend la question facile.
      - Pour **résoudre** $f(x) = 0$ ou étudier un **signe** : forme factorisée.
      - Pour calculer une **image** comme $f(0)$ ou comparer à une constante : forme développée.
      - Pour un maximum ou un minimum : une forme du type $a(x - \alpha)^2 + \beta$.

      **Exemple.** $f(x) = (x - 1)^2 - 4$ a pour forme développée $x^2 - 2x - 3$ et pour forme factorisée $(x - 3)(x + 1)$. Avec la forme développée, $f(0) = -3$ ; avec la forme factorisée, $f(x) = 0$ pour $x = 3$ ou $x = -1$ ; avec la première forme, $f(x) \geqslant -4$ car un carré est positif.

      ## 6. Erreurs fréquentes
      - Oublier le double produit : $(x + 3)^2 \neq x^2 + 9$.
      - Mal distribuer un signe moins : $-(4x + 5) = -4x - 5$, et non $-4x + 5$.
      - Factoriser partiellement : dans $6x^2 + 3x$, le facteur commun est $3x$ et non seulement $3$ : $6x^2 + 3x = 3x(2x + 1)$.
      - Oublier de contrôler le résultat en redéveloppant ou en testant une valeur (par exemple $x = 1$).
    questions:
      - code: 2NDE-DEV-01
        difficulte: 2
        type: expression
        enonce: Développer (x + 3)².
        solution: x^2 + 6x + 9
        auteur: Brouillon IA (Claude)
        correction:
          methode: Identité remarquable $(a + b)^2 = a^2 + 2ab + b^2$.
          etapes:
          - '$a = x$ et $b = 3$ : $x^2 + 2 \times x \times 3 + 3^2$.'
          - $= x^2 + 6x + 9$.
          resultat: x^2 + 6x + 9
          erreurs_frequentes:
          - Oublier le double produit $6x$.
      - code: 2NDE-DEV-02
        difficulte: 2
        type: expression
        enonce: Développer (a + b)(a − b).
        solution: a^2 - b^2
        auteur: Brouillon IA (Claude)
        correction:
          methode: Identité remarquable $(a + b)(a - b) = a^2 - b^2$.
          etapes:
          - $(a + b)(a - b) = a^2 - ab + ab - b^2 = a^2 - b^2$.
          resultat: a^2 - b^2
      - code: 2NDE-DEV-03
        difficulte: 3
        type: expression
        enonce: Développer (2x − 1)(x + 4).
        solution: 2x^2 + 7x - 4
        auteur: Brouillon IA (Claude)
        correction:
          methode: Double distributivité.
          etapes:
          - $(2x - 1)(x + 4) = 2x \times x + 2x \times 4 - 1 \times x - 1 \times 4$.
          - $= 2x^2 + 8x - x - 4 = 2x^2 + 7x - 4$.
          resultat: 2x^2 + 7x - 4
      - code: 2NDE-DEV-04
        difficulte: 4
        type: expression
        enonce: 'Développer $(x + 3)^3$. Indication : $(x + 3)^3 = (x + 3)^2 (x + 3)$.'
        solution: x^3 + 9x^2 + 27x + 27
        source: STACK
        source_url: https://docs.stack-assessment.org/
        licence_source: à vérifier
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Développer le carré, puis multiplier par le dernier facteur.
          etapes:
          - $(x + 3)^2 = x^2 + 6x + 9$.
          - $(x^2 + 6x + 9)(x + 3) = x^3 + 3x^2 + 6x^2 + 18x + 9x + 27$.
          - $= x^3 + 9x^2 + 27x + 27$.
          resultat: x^3 + 9x^2 + 27x + 27
      - code: 2NDE-DEV-05
        difficulte: 1
        type: expression
        enonce: Développer $3(x + 4)$.
        solution: 3x + 12
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Distributivité simple : $k(a + b) = ka + kb$.'
          etapes:
          - $3 \times x + 3 \times 4 = 3x + 12$.
          resultat: 3x + 12
      - code: 2NDE-DEV-06
        difficulte: 5
        type: expression
        enonce: Développer et réduire $(2x - 3)^2 - (x + 1)(x - 1)$.
        solution: 3x^2 - 12x + 10
        auteur: Brouillon IA (Claude)
        correction:
          methode: Deux identités remarquables, puis une soustraction entre parenthèses.
          etapes:
          - $(2x - 3)^2 = 4x^2 - 12x + 9$ et $(x + 1)(x - 1) = x^2 - 1$.
          - $4x^2 - 12x + 9 - (x^2 - 1) = 4x^2 - 12x + 9 - x^2 + 1$.
          - $= 3x^2 - 12x + 10$.
          erreurs_frequentes:
          - Oublier les parenthèses et écrire $- x^2 - 1$ au lieu de $- x^2 + 1$.
          resultat: 3x^2 - 12x + 10
      - code: 2NDE-DEV-V1
        difficulte: 2
        type: expression
        gabarit:
          parametres: {a: {entre: [1, 5]}, b: {entre: [-7, 7], sauf: [0]}, c: {entre: [1, 5]}, d: {entre: [-7, 7], sauf: [0]}}
          conditions: ["a*d + b*c != 0"]
        enonce: 'Développer et réduire $([[a:coef]]x [[b:+]])([[c:coef]]x [[d:+]])$.'
        solution: '[[a*c]]x^2 [[a*d + b*c:+]]x [[b*d:+]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Double distributivité : chaque terme du premier facteur multiplie chaque terme du second.'
          etapes:
          - '$[[a:coef]]x \times [[c:coef]]x = [[a*c:coef]]x^2$ et $[[a:coef]]x \times ([[d]]) = [[a*d]]x$.'
          - '$[[b]] \times [[c:coef]]x = [[b*c]]x$ et $[[b]] \times ([[d]]) = [[b*d]]$.'
          - 'On réduit : $[[a*c:coef]]x^2 [[a*d + b*c:+]]x [[b*d:+]]$.'
          resultat: '[[a*c]]x^2 [[a*d + b*c:+]]x [[b*d:+]]'

  - code: 2NDE-EQ1
    libelle: Résoudre une équation du premier degré
    attendus: [2NDE-2026-ALG-05, 2NDE-2026-ALG-14, 2NDE-2026-AUTO-10]
    cours_couvre: [2NDE-2026-ALG-05, 2NDE-2026-ALG-14, 2NDE-2026-AUTO-10]
    objectifs:
    - Résoudre une équation du premier degré à une inconnue.
    - Vérifier la solution en la remplaçant dans l'équation.
    methodes:
    - titre: Résoudre une équation du premier degré
      etapes:
      - Regrouper les termes en $x$ d'un côté et les nombres de l'autre, en faisant la même opération des deux côtés.
      - Diviser les deux membres par le coefficient de $x$.
      - Vérifier en remplaçant $x$ par la valeur trouvée.
      exemple:
        enonce: Résoudre $5x - 3 = 2x + 9$.
        resolution:
        - $5x - 2x = 9 + 3$, soit $3x = 12$.
        - '$x = 4$. Vérification : $5 \times 4 - 3 = 17$ et $2 \times 4 + 9 = 17$.'
        resultat: $x = 4$
    erreurs_frequentes:
    - erreur: Changer un terme de membre sans changer son signe.
      explication: '« Passer de l''autre côté » revient à soustraire (ou ajouter) ce terme aux deux membres : son signe change.'
    resume: |
      - On ne change pas les solutions d'une équation en ajoutant un même nombre aux deux membres, ou en les multipliant par un même nombre **non nul**.
      - Si $a \neq 0$, l'équation $ax + b = 0$ a une unique solution : $x = -\dfrac{b}{a}$.
      - $x^2 = a$ : deux solutions $\sqrt{a}$ et $-\sqrt{a}$ si $a > 0$, une seule ($0$) si $a = 0$, aucune si $a < 0$.
      - $\dfrac{a}{x} = b$ avec $a \neq 0$ et $b \neq 0$ : unique solution $x = \dfrac{a}{b}$.
      - On présente la réponse par l'ensemble des solutions, par exemple $S = \left\{\dfrac{7}{3}\right\}$.
    cours: |
      ## 1. Vocabulaire
      Une **équation** d'inconnue $x$ est une égalité qui contient $x$. Une **solution** est une valeur de $x$ qui rend l'égalité vraie. **Résoudre** l'équation, c'est trouver l'**ensemble** $S$ de toutes ses solutions.

      Deux équations sont **équivalentes** si elles ont le même ensemble de solutions.

      > **Propriété.** On obtient une équation équivalente :
      > - en ajoutant (ou soustrayant) un même nombre ou une même expression aux deux membres ;
      > - en multipliant (ou divisant) les deux membres par un même nombre **non nul**.

      ## 2. Équations du premier degré
      > **Propriété.** Soit $a$ et $b$ deux réels avec $a \neq 0$. L'équation $ax + b = 0$ a une unique solution, $x = -\dfrac{b}{a}$.

      **Démonstration.** $ax + b = 0 \iff ax = -b \iff x = -\dfrac{b}{a}$, car on peut diviser par $a \neq 0$.

      Cas particuliers : $a + x = b$ donne $x = b - a$ ; $ax = b$ (avec $a \neq 0$) donne $x = \dfrac{b}{a}$.

      ### Méthode : résoudre $ax + b = cx + d$
      1. Regrouper les termes en $x$ dans un membre et les constantes dans l'autre.
      2. Réduire pour obtenir une équation du type $kx = m$.
      3. Si $k \neq 0$, diviser par $k$. Si $k = 0$, l'équation n'a aucune solution ou en a une infinité (selon que $m \neq 0$ ou $m = 0$).
      4. Vérifier en remplaçant $x$ par la valeur trouvée.

      **Exemple complet.** Résoudre $5x - 4 = 2x + 3$.
      - On soustrait $2x$ : $3x - 4 = 3$. On ajoute $4$ : $3x = 7$.
      - On divise par $3$ : $x = \dfrac{7}{3}$. Donc $S = \left\{\dfrac{7}{3}\right\}$.
      - Vérification : $5 \times \dfrac{7}{3} - 4 = \dfrac{23}{3}$ et $2 \times \dfrac{7}{3} + 3 = \dfrac{23}{3}$.

      ## 3. Équations $x^2 = a$ et $\dfrac{a}{x} = b$
      > **Propriété.** L'équation $x^2 = a$ a deux solutions $-\sqrt{a}$ et $\sqrt{a}$ si $a > 0$ ; une seule solution, $0$, si $a = 0$ ; aucune solution si $a < 0$.

      Exemples : $x^2 = 7$ donne $S = \{-\sqrt{7} ; \sqrt{7}\}$ ; $x^2 = -4$ donne $S = \varnothing$.

      Pour $\dfrac{a}{x} = b$ avec $a \neq 0$ et $b \neq 0$ : la valeur $x = 0$ est interdite ; pour $x \neq 0$, l'équation équivaut à $a = bx$, donc $x = \dfrac{a}{b}$. Exemple : $\dfrac{6}{x} = 4$ donne $x = \dfrac{3}{2}$.

      ## 4. Inéquation du premier degré
      Les mêmes transformations s'appliquent à une inéquation, avec une règle supplémentaire : **multiplier ou diviser par un nombre négatif change le sens de l'inégalité**. Si $a > 0$, $ax + b > 0 \iff x > -\dfrac{b}{a}$ ; si $a < 0$, $ax + b > 0 \iff x < -\dfrac{b}{a}$. L'ensemble des solutions est alors un intervalle (voir le chapitre sur les inéquations).

      Exemple : $-2x + 6 > 0 \iff -2x > -6 \iff x < 3$, donc $S = \left]-\infty ; 3\right[$.

      ## 5. Erreurs fréquentes
      - Changer de membre sans changer l'opération : de $3x = 7$, on ne déduit pas $x = 7 - 3$.
      - Oublier la solution négative de $x^2 = a$ : $x^2 = 9$ a deux solutions, $-3$ et $3$.
      - Diviser par une expression qui peut être nulle (par exemple par $x$) : on risque de perdre une solution.
      - Écrire la réponse sans accolades, ou confondre $S = \varnothing$ (aucune solution) et $S = \{0\}$.
    questions:
      - code: 2NDE-EQ1-01
        difficulte: 1
        type: numerique
        enonce: Résoudre 3x + 5 = 20. x = ?
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $3x + 5 = 20$ donne $3x = 15$.
          - '$x = 5$. Vérification : $3 \times 5 + 5 = 20$.'
          resultat: 5
      - code: 2NDE-EQ1-02
        difficulte: 2
        type: numerique
        enonce: Résoudre 2x − 7 = 4x + 1. x = ?
        solution: -4
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $2x - 4x = 1 + 7$, soit $-2x = 8$.
          - $x = \dfrac{8}{-2} = -4$.
          - 'Vérification : $2 \times (-4) - 7 = -15$ et $4 \times (-4) + 1 = -15$.'
          resultat: -4
          erreurs_frequentes:
          - Diviser par $2$ au lieu de $-2$ et trouver $4$.
      - code: 2NDE-EQ1-03
        difficulte: 3
        type: numerique
        enonce: Résoudre (x + 1)/3 = 2. x = ?
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier les deux membres par le dénominateur.
          etapes:
          - $\dfrac{x + 1}{3} = 2$ donne $x + 1 = 6$.
          - $x = 5$.
          resultat: 5
      - code: 2NDE-EQ1-04
        difficulte: 1
        type: numerique
        enonce: Résoudre 2x = 6. x = ? (ancienne version)
        solution: 3
        archivee: true
      - code: 2NDE-EQ1-05
        difficulte: 4
        type: numerique
        enonce: Résoudre $\dfrac{2x - 1}{3} = \dfrac{x + 4}{2}$.
        solution: '14'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier les deux membres par 6 (produit en croix).
          etapes:
          - $2(2x - 1) = 3(x + 4)$, soit $4x - 2 = 3x + 12$.
          - '$x = 14$. Vérification : $\dfrac{27}{3} = 9$ et $\dfrac{18}{2} = 9$.'
          resultat: '14'
      - code: 2NDE-EQ1-06
        difficulte: 5
        type: numerique
        enonce: Un forfait téléphonique coûte 12 € par mois plus 0,05 € par SMS ; un autre coûte 20 € par mois, SMS illimités. Pour combien de SMS par mois les deux forfaits coûtent-ils le même prix ?
        solution: '160'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Mettre le problème en équation avec $x$ le nombre de SMS.
          etapes:
          - $12 + 0{,}05x = 20$, soit $0{,}05x = 8$.
          - $x = \dfrac{8}{0{,}05} = 160$ SMS.
          resultat: '160'
      - code: 2NDE-EQ1-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {a: {entre: [2, 9]}, x: {entre: [-8, 8], sauf: [0]}, b: {entre: [-9, 9], sauf: [0]}}
          calculs: {c: "a*x + b"}
        enonce: 'Résoudre $[[a]]x [[b:+]] = [[c]]$.'
        solution: '[[x]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Isoler $x$ : on retire la constante, puis on divise par le coefficient.'
          etapes:
          - 'On ajoute $[[-b]]$ aux deux membres : $[[a]]x = [[c - b]]$.'
          - 'On divise par $[[a]]$ : $x = \dfrac{[[c - b]]}{[[a]]} = [[x]]$.'
          - 'Vérification : $[[a]] \times ([[x]]) [[b:+]] = [[c]]$.'
          resultat: '[[x]]'
      - code: 2NDE-EQ1-V2
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {a: {entre: [2, 9]}, c: {entre: [-6, 9]}, b: {entre: [-9, 9]}, x: {entre: [-6, 6]}}
          calculs: {d: "(a - c)*x + b"}
          conditions: ["a != c", "c != 0"]
        enonce: 'Résoudre $[[a]]x [[b:+]] = [[c:coef]]x [[d:+]]$.'
        solution: '[[x]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Regrouper les termes en $x$ d''un côté et les constantes de l''autre.'
          etapes:
          - 'On retire $[[c:coef]]x$ aux deux membres : $[[a - c:coef]]x [[b:+]] = [[d]]$.'
          - 'On retire $[[b]]$ : $[[a - c:coef]]x = [[d - b]]$.'
          - '$x = \dfrac{[[d - b]]}{[[a - c]]} = [[x]]$.'
          resultat: '[[x]]'

  - code: 2NDE-EQQUOT
    libelle: Résoudre une équation quotient
    attendus: [2NDE-2026-ALG-08, 2NDE-2026-FREP-02]
    cours_couvre: [2NDE-2026-ALG-08, 2NDE-2026-FREP-02]
    objectifs:
    - Déterminer les valeurs interdites d'une expression fractionnaire.
    - Résoudre une équation du type $\dfrac{A(x)}{B(x)} = k$.
    prerequis:
    - 2NDE-EQ1
    - 2NDE-SIGNE
    methodes:
    - titre: Résoudre $\dfrac{A(x)}{B(x)} = k$
      quand: L'inconnue apparaît au dénominateur.
      etapes:
      - Chercher les valeurs interdites, qui annulent $B(x)$.
      - Pour les autres valeurs, l'équation équivaut à $A(x) = k \times B(x)$.
      - Résoudre, puis rejeter toute solution qui serait une valeur interdite.
      exemple:
        enonce: Résoudre $\dfrac{2x + 1}{x - 3} = 5$.
        resolution:
        - Valeur interdite $x = 3$.
        - $2x + 1 = 5(x - 3)$, soit $2x + 1 = 5x - 15$, donc $x = \dfrac{16}{3}$.
        - '$\dfrac{16}{3} \neq 3$ : la solution est acceptée.'
        resultat: $\dfrac{16}{3}$
    erreurs_frequentes:
    - erreur: Oublier de vérifier que la solution trouvée n'est pas une valeur interdite.
      explication: Pour $\dfrac{x - 2}{x - 2} = 1$, tout $x$ convient… sauf $x = 2$.
    - erreur: Écrire que $\dfrac{A(x)}{B(x)} = 0$ quand $B(x) = 0$.
      explication: Un quotient est nul quand son numérateur est nul et son dénominateur non nul.
    resume: |
      - Un quotient $\dfrac{A(x)}{B(x)}$ n'existe que si $B(x) \neq 0$ : on cherche d'abord les **valeurs interdites**.
      - Ensemble de définition : tous les réels sauf les valeurs interdites, par exemple $\mathbb{R} \setminus \{2\}$.
      - $\dfrac{A(x)}{B(x)} = 0 \iff A(x) = 0$ et $B(x) \neq 0$.
      - $\dfrac{A(x)}{B(x)} = k \iff A(x) = k\,B(x)$ et $B(x) \neq 0$.
      - On élimine toujours les solutions trouvées qui sont des valeurs interdites.
    cours: |
      ## 1. Ensemble de définition d'une expression
      L'**ensemble de définition** d'une expression (ou d'une fonction) est l'ensemble des réels $x$ pour lesquels on peut la calculer. En seconde, deux situations imposent une contrainte :
      - un **dénominateur** doit être non nul ;
      - un nombre sous une **racine carrée** doit être positif.

      > **Définition.** Une **valeur interdite** d'un quotient $\dfrac{A(x)}{B(x)}$ est un réel qui annule le dénominateur $B(x)$.

      **Exemples.**
      - $\dfrac{3x + 1}{x - 2}$ est définie sur $\mathbb{R} \setminus \{2\}$, que l'on peut écrire $]-\infty ; 2[ \cup ]2 ; +\infty[$.
      - $\dfrac{1}{x^2 + 1}$ est définie sur $\mathbb{R}$, car $x^2 + 1 \geqslant 1 > 0$.
      - $\sqrt{x - 3}$ est définie sur $[3 ; +\infty[$, car il faut $x - 3 \geqslant 0$.

      Dans un problème concret, le **domaine d'étude** peut être plus petit : une longueur doit être positive, un nombre d'objets entier…

      ## 2. Équation quotient égal à zéro
      > **Propriété.** Un quotient est nul si et seulement si son numérateur est nul et son dénominateur ne l'est pas : $\dfrac{A(x)}{B(x)} = 0 \iff A(x) = 0$ et $B(x) \neq 0$.

      Exemple : $\dfrac{x - 4}{x + 1} = 0$ donne $x = 4$, qui n'est pas une valeur interdite ($4 \neq -1$) : $S = \{4\}$.

      ## 3. Équation quotient égal à $k$
      > **Propriété.** Pour $B(x) \neq 0$ : $\dfrac{A(x)}{B(x)} = k \iff A(x) = k\,B(x)$.

      ### Méthode
      1. Chercher les valeurs interdites en résolvant $B(x) = 0$.
      2. Pour $x$ différent de ces valeurs, multiplier les deux membres par $B(x)$ (ou faire un produit en croix).
      3. Résoudre l'équation obtenue, souvent du premier degré.
      4. Garder seulement les solutions qui ne sont pas des valeurs interdites, puis conclure par l'ensemble $S$.

      **Exemple complet.** Résoudre $\dfrac{2x + 1}{x - 3} = 5$.
      - Valeur interdite : $x - 3 = 0 \iff x = 3$. On résout sur $\mathbb{R} \setminus \{3\}$.
      - Pour $x \neq 3$ : $2x + 1 = 5(x - 3)$, soit $2x + 1 = 5x - 15$.
      - $16 = 3x$, donc $x = \dfrac{16}{3}$, qui est différent de $3$.
      - $S = \left\{\dfrac{16}{3}\right\}$. Vérification : $\dfrac{2 \times \frac{16}{3} + 1}{\frac{16}{3} - 3} = \dfrac{35/3}{7/3} = 5$.

      **Exemple où une solution est rejetée.** $\dfrac{x^2 - 1}{x - 1} = 0$ donne $x^2 = 1$, soit $x = 1$ ou $x = -1$ ; or $1$ est une valeur interdite, donc $S = \{-1\}$.

      ## 4. Erreurs fréquentes
      - Oublier de chercher les valeurs interdites, et garder une « solution » qui annule le dénominateur.
      - Annuler le dénominateur au lieu du numérateur pour résoudre $\dfrac{A(x)}{B(x)} = 0$.
      - Multiplier seulement un membre par $B(x)$.
      - Simplifier $\dfrac{x + 2}{x}$ en « barrant » les $x$ : on ne simplifie que des **facteurs** communs.
    questions:
      - code: 2NDE-EQQUOT-01
        difficulte: 1
        type: numerique
        enonce: 'Quelle est la valeur interdite de l''expression $\dfrac{2}{x - 7}$ ?'
        solution: 7
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Le dénominateur s'annule pour $x = 7$.
          resultat: 7
      - code: 2NDE-EQQUOT-02
        difficulte: 2
        type: numerique
        enonce: 'Résoudre $\dfrac{x - 5}{x + 1} = 0$.'
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Numérateur nul pour $x = 5$, et $5 \neq -1$.
          resultat: 5
      - code: 2NDE-EQQUOT-03
        difficulte: 3
        type: numerique
        enonce: 'Résoudre $\dfrac{x}{x - 1} = 3$.'
        solution: 3/2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Valeur interdite : le dénominateur $x - 1$ s''annule pour $x = 1$. On résout donc pour $x \neq 1$.'
          - 'Pour $x \neq 1$, on multiplie les deux membres par $x - 1$ : $x = 3(x - 1)$, soit $x = 3x - 3$.'
          - 'On regroupe les termes en $x$ : $-2x = -3$, donc $x = \dfrac{3}{2}$.'
          - '$\dfrac{3}{2} \neq 1$ : ce n''est pas une valeur interdite. Vérification : $\dfrac{3/2}{1/2} = 3$.'
          resultat: 3/2
      - code: 2NDE-EQQUOT-04
        difficulte: 4
        type: numerique
        enonce: 'Résoudre $\dfrac{2x + 1}{x - 3} = 5$.'
        solution: 16/3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Valeur interdite $3$.
          - $2x + 1 = 5x - 15$, soit $3x = 16$.
          - $x = \dfrac{16}{3}$, différent de $3$.
          resultat: 16/3
      - code: 2NDE-EQQUOT-05
        difficulte: 5
        type: qcm
        enonce: 'Quel est l''ensemble des solutions de $\dfrac{x^2 - 4}{x - 2} = 0$ ? A) $\{-2 ; 2\}$  B) $\{-2\}$  C) $\{2\}$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $x^2 - 4 = 0$ pour $x = 2$ ou $x = -2$.
          - '$2$ est une valeur interdite : il reste $-2$.'
          resultat: B
      - code: 2NDE-EQQUOT-V1
        difficulte: 4
        type: numerique
        gabarit:
          parametres: {a: {entre: [-6, 6]}, b: {entre: [-6, 6]}, k: {entre: [2, 5]}}
          calculs: {x: "(k*b - a)/(1 - k)"}
          conditions: ["a != b", "x + b != 0"]
        enonce: 'Résoudre $\dfrac{x [[a:+]]}{x [[b:+]]} = [[k]]$ (réponse exacte).'
        solution: '[[x]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Valeur interdite, produit en croix, puis équation du premier degré.'
          etapes:
          - 'Valeur interdite : $x = [[-b]]$.'
          - 'Pour $x \neq [[-b]]$ : $x [[a:+]] = [[k]](x [[b:+]])$, soit $x [[a:+]] = [[k]]x [[k*b:+]]$.'
          - '$[[1 - k]]x = [[k*b - a]]$, donc $x = [[x:frac]]$, qui n''est pas la valeur interdite.'
          resultat: '[[x]]'
