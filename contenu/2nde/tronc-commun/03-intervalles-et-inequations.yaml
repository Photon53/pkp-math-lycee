chapitre:
  code: 2NDE-INEQ
  niveau: 2nde
  parcours: tronc-commun
  ordre: 3
  titre: Intervalles, inégalités et inéquations

competences:
  - code: 2NDE-INT
    libelle: Utiliser les intervalles et la valeur absolue
    attendus: [2NDE-2026-REELS-02, 2NDE-2026-REELS-03, 2NDE-2026-REELS-04, 2NDE-2026-REELS-08]
    cours_couvre: [2NDE-2026-REELS-02, 2NDE-2026-REELS-03, 2NDE-2026-REELS-04, 2NDE-2026-REELS-08]
    objectifs:
    - Traduire une inégalité par un intervalle, et inversement.
    - Utiliser la valeur absolue comme une distance.
    methodes:
    - titre: Traduire une condition de la forme |x − a| ≤ r
      quand: On rencontre $|x - a| \leq r$ avec $r \geq 0$.
      etapes:
      - Lire $|x - a|$ comme la distance entre $x$ et $a$.
      - Les $x$ à distance au plus $r$ de $a$ forment l'intervalle $[a - r ; a + r]$.
      exemple:
        enonce: Écrire l'ensemble des $x$ tels que $|x - 1| \leq 4$.
        resolution:
        - Centre $a = 1$, rayon $r = 4$.
        - $x \in [1 - 4 ; 1 + 4] = [-3 ; 5]$.
        resultat: $[-3 ; 5]$
    erreurs_frequentes:
    - erreur: Confondre crochet ouvert et fermé.
      explication: « $<$ » exclut la borne (crochet tourné vers l'extérieur), « $\leq$ » l'inclut.
    resume: |
      - $[a ; b]$ : réels $x$ tels que $a \leqslant x \leqslant b$ ; le crochet tourné vers l'extérieur, comme dans $]a ; b]$, exclut la borne.
      - Du côté de $+\infty$ ou $-\infty$, le crochet est toujours ouvert : $[a ; +\infty[$, $]-\infty ; a]$.
      - $|a|$ est la distance de $a$ à $0$ ; $|a - b|$ est la distance entre $a$ et $b$.
      - $|x - a| \leqslant r \iff x \in [a - r ; a + r]$ (avec $r \geqslant 0$).
      - Intersection $\cap$ : nombres dans les deux ensembles ; réunion $\cup$ : nombres dans l'un au moins.
    cours: |
      ## 1. Intervalles de $\mathbb{R}$
      Soit $a$ et $b$ deux réels avec $a < b$.

      | Intervalle | Réels $x$ tels que | Représentation |
      |---|---|---|
      | $[a ; b]$ | $a \leqslant x \leqslant b$ | segment, bornes incluses |
      | $]a ; b[$ | $a < x < b$ | bornes exclues |
      | $[a ; b[$ | $a \leqslant x < b$ | $a$ inclus, $b$ exclu |
      | $[a ; +\infty[$ | $x \geqslant a$ | demi-droite vers la droite |
      | $]-\infty ; b[$ | $x < b$ | demi-droite vers la gauche |

      Sur la droite numérique, un crochet tourné vers l'intervalle signifie que la borne est **incluse**, tourné vers l'extérieur qu'elle est **exclue**. Les symboles $+\infty$ et $-\infty$ ne sont pas des nombres : le crochet y est toujours ouvert. On note $\mathbb{R} = ]-\infty ; +\infty[$.

      ### Méthode : savoir si un nombre appartient à un intervalle
      1. Traduire l'intervalle par une double inégalité.
      2. Comparer le nombre aux bornes, en faisant attention aux bornes exclues.

      Exemple : $\sqrt{5} \approx 2{,}236$, donc $\sqrt{5} \in [2 ; 3[$ ; mais $3 \notin [2 ; 3[$.

      ## 2. Intersection et réunion
      - L'**intersection** $I \cap J$ contient les réels qui sont **à la fois** dans $I$ et dans $J$.
      - La **réunion** $I \cup J$ contient les réels qui sont dans $I$ **ou** dans $J$ (ou dans les deux).

      **Exemple.** Avec $I = [-2 ; 5[$ et $J = [1 ; 8]$ : $I \cap J = [1 ; 5[$ et $I \cup J = [-2 ; 8]$. Sur un dessin, on trace les deux intervalles l'un au-dessus de l'autre et on lit la partie commune.

      ## 3. Valeur absolue et distance
      > **Définition.** La **valeur absolue** d'un réel $a$, notée $|a|$, est la distance entre le point d'abscisse $a$ et l'origine sur la droite numérique : $|a| = a$ si $a \geqslant 0$ et $|a| = -a$ si $a < 0$.

      > **Propriété.** La distance entre deux réels $a$ et $b$ est $|a - b| = |b - a|$.

      Exemples : $|-7| = 7$ ; la distance entre $-3$ et $4$ est $|4 - (-3)| = 7$.

      ## 4. Inéquation $|x - a| \leqslant r$
      > **Propriété.** Soit $r \geqslant 0$. $|x - a| \leqslant r \iff a - r \leqslant x \leqslant a + r \iff x \in [a - r ; a + r]$.

      En effet, $|x - a| \leqslant r$ signifie que la distance entre $x$ et $a$ est au plus $r$ : $x$ est dans l'intervalle de **centre** $a$ et de **rayon** $r$.

      **Exemple complet.** Résoudre $|x + 1| \leqslant 3$.
      - On écrit $|x + 1| = |x - (-1)|$ : distance entre $x$ et $-1$.
      - Centre $a = -1$, rayon $r = 3$ : $-1 - 3 \leqslant x \leqslant -1 + 3$.
      - $S = [-4 ; 2]$.

      Inversement, l'intervalle $[2 ; 10]$ a pour centre $\dfrac{2 + 10}{2} = 6$ et pour rayon $\dfrac{10 - 2}{2} = 4$ : c'est l'ensemble des $x$ tels que $|x - 6| \leqslant 4$.

      ## 5. Erreurs fréquentes
      - Fermer un crochet en $+\infty$ : $[3 ; +\infty]$ n'a pas de sens.
      - Confondre intersection et réunion.
      - Lire $|x + 1|$ comme la distance entre $x$ et $1$ : c'est la distance entre $x$ et $-1$.
      - Écrire un intervalle avec les bornes dans le mauvais ordre, comme $[5 ; 2]$.
    questions:
      - code: 2NDE-INT-01
        difficulte: 1
        type: qcm
        enonce: 'Quel intervalle correspond à $-2 \le x < 5$ ? A) $[-2 ; 5[$  B) $]-2 ; 5]$  C) $[-2 ; 5]$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $-2$ est inclus (crochet fermé), $5$ est exclu (crochet ouvert).
          resultat: A
      - code: 2NDE-INT-02
        difficulte: 2
        type: numerique
        enonce: 'Combien de nombres entiers appartiennent à l''intervalle $[-3 ; 4[$ ?'
        solution: 7
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $[-3 ; 4[$ contient $-3$ mais pas $4$.
          - 'Entiers : $-3, -2, -1, 0, 1, 2, 3$, soit $7$ entiers.'
          resultat: 7
      - code: 2NDE-INT-03
        difficulte: 3
        type: qcm
        enonce: 'Que vaut $[1 ; 6] \cap [4 ; 9]$ ? A) $[1 ; 9]$  B) $[4 ; 6]$  C) l''ensemble vide'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          methode: L'intersection contient les nombres qui sont dans les deux intervalles à la fois.
          etapes:
          - 'On traduit chaque intervalle : $x \in [1 ; 6]$ signifie $1 \leqslant x \leqslant 6$, et $x \in [4 ; 9]$ signifie $4 \leqslant x \leqslant 9$.'
          - 'L''intersection contient les nombres qui vérifient les deux conditions : il faut $x \geqslant 1$ et $x \geqslant 4$, donc $x \geqslant 4$ ; il faut $x \leqslant 6$ et $x \leqslant 9$, donc $x \leqslant 6$.'
          - 'D''où $[1 ; 6] \cap [4 ; 9] = [4 ; 6]$ : réponse B. L''intervalle $[1 ; 9]$ est la réunion, pas l''intersection.'
          resultat: B
      - code: 2NDE-INT-04
        difficulte: 4
        type: numerique
        enonce: 'L''ensemble des réels $x$ tels que $|x - 3| \le 2$ est un intervalle $[a ; b]$. Donner $b$.'
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          methode: $|x - a| \leq r$ équivaut à $x \in [a - r ; a + r]$.
          etapes:
          - '$|x - 3|$ est la distance entre $x$ et $3$ sur la droite numérique.'
          - '$|x - 3| \leqslant 2$ signifie que $x$ est à une distance au plus $2$ de $3$ : $3 - 2 \leqslant x \leqslant 3 + 2$.'
          - 'L''ensemble des solutions est $[1 ; 5]$ : intervalle de centre $3$ et de rayon $2$, donc $b = 5$.'
          resultat: 5
      - code: 2NDE-INT-05
        difficulte: 5
        type: qcm
        enonce: 'Quel est l''ensemble des réels $x$ tels que $|2x + 1| < 3$ ? A) $]-2 ; 1[$  B) $]-1 ; 2[$  C) $]-2 ; 2[$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: $|X| < 3$ équivaut à $-3 < X < 3$.
          etapes:
          - $-3 < 2x + 1 < 3$ donne $-4 < 2x < 2$.
          - 'En divisant par $2$ : $-2 < x < 1$.'
          resultat: A

  - code: 2NDE-INEQ1
    libelle: Résoudre une inéquation du premier degré
    attendus: [2NDE-2026-ALG-03, 2NDE-2026-ALG-05, 2NDE-2026-ALG-13]
    cours_couvre: [2NDE-2026-ALG-03, 2NDE-2026-ALG-05, 2NDE-2026-ALG-13]
    objectifs:
    - Résoudre une inéquation du premier degré et écrire ses solutions avec un intervalle.
    prerequis:
    - 2NDE-EQ1
    - 2NDE-INT
    methodes:
    - titre: Résoudre une inéquation du premier degré
      etapes:
      - Regrouper les termes en $x$ d'un côté, comme pour une équation.
      - 'Diviser par le coefficient de $x$ : si ce nombre est **négatif**, changer le sens de l''inégalité.'
      - Écrire l'ensemble des solutions sous forme d'intervalle.
      exemple:
        enonce: Résoudre $-3x + 1 > 7$.
        resolution:
        - $-3x > 6$.
        - 'On divise par $-3 < 0$ : $x < -2$.'
        resultat: $S = ]-\infty ; -2[$
    erreurs_frequentes:
    - erreur: Garder le sens de l'inégalité en divisant par un nombre négatif.
      explication: 'Multiplier ou diviser par un négatif inverse l''ordre : $2 < 3$ mais $-2 > -3$.'
    resume: |
      - Ajouter un même nombre aux deux membres conserve le sens d'une inégalité.
      - Multiplier par un nombre **strictement positif** conserve le sens ; par un nombre **strictement négatif**, on **change** le sens.
      - On peut additionner membre à membre deux inégalités de même sens.
      - Si $a > 0$ : $ax + b > 0 \iff x > -\dfrac{b}{a}$ ; si $a < 0$ : $ax + b > 0 \iff x < -\dfrac{b}{a}$.
      - L'ensemble des solutions s'écrit sous forme d'intervalle.
    cours: |
      ## 1. Règles sur les inégalités
      > **Propriété.** Soit $a$, $b$ et $c$ des réels avec $a < b$.
      > - $a + c < b + c$ (ajouter un même nombre conserve l'ordre) ;
      > - si $c > 0$ : $ac < bc$ (multiplier par un positif conserve l'ordre) ;
      > - si $c < 0$ : $ac > bc$ (multiplier par un négatif **inverse** l'ordre).

      **Justification.** $(b + c) - (a + c) = b - a > 0$. De même, $bc - ac = (b - a)c$ est du signe de $c$, car $b - a > 0$.

      **Lien avec les fonctions affines.** La fonction $x \mapsto cx$ est croissante si $c > 0$ et décroissante si $c < 0$ : une fonction croissante conserve l'ordre, une fonction décroissante l'inverse.

      > **Propriété (somme d'inégalités).** Si $a < b$ et $c < d$, alors $a + c < b + d$.

      En effet $a + c < b + c$ et $b + c < b + d$. Attention : on ne peut **pas** soustraire ni multiplier membre à membre sans précaution.

      ## 2. Inéquations du premier degré
      Une **inéquation** est une inégalité contenant une inconnue ; la **résoudre**, c'est trouver l'ensemble de ses solutions, souvent un intervalle.

      > **Propriété.** Soit $a \neq 0$ et $b$ réels. Si $a > 0$, l'ensemble des solutions de $ax + b > 0$ est $\left]-\dfrac{b}{a} ; +\infty\right[$ ; si $a < 0$, c'est $\left]-\infty ; -\dfrac{b}{a}\right[$.

      ### Méthode : résoudre $ax + b \geqslant cx + d$
      1. Regrouper les termes en $x$ dans un membre et les constantes dans l'autre (le sens ne change pas).
      2. Réduire pour obtenir $kx \geqslant m$.
      3. Diviser par $k$ : garder le sens si $k > 0$, le **changer** si $k < 0$.
      4. Écrire l'ensemble des solutions sous forme d'intervalle, en choisissant bien les crochets.

      **Exemple complet.** Résoudre $3 - 4x \geqslant x + 13$.
      - On soustrait $x$ et $3$ : $-5x \geqslant 10$.
      - On divise par $-5 < 0$, donc on change le sens : $x \leqslant -2$.
      - $S = ]-\infty ; -2]$. Contrôle avec $x = -3$ : $3 + 12 = 15 \geqslant 10$, c'est vrai.

      ## 3. Modéliser un problème par une inéquation
      1. Choisir l'inconnue et préciser ce qu'elle représente (et son unité).
      2. Traduire la phrase de l'énoncé (« au moins », « ne dépasse pas »…) par une inégalité.
      3. Résoudre, puis interpréter dans le contexte (par exemple garder les entiers si l'inconnue est un nombre d'objets).

      **Exemple.** Un abonnement coûte $12$ € par mois plus $0{,}5$ € par trajet ; sans abonnement, le trajet coûte $2$ €. On note $n$ le nombre de trajets dans le mois. L'abonnement est avantageux si $12 + 0{,}5n < 2n$, soit $12 < 1{,}5n$, donc $n > 8$ : à partir de $9$ trajets.

      ## 4. Erreurs fréquentes
      - Oublier de changer le sens en divisant par un nombre négatif.
      - Changer le sens en **soustrayant** un nombre : seule la multiplication ou la division par un négatif change le sens.
      - Se tromper de crochet : avec $\geqslant$ ou $\leqslant$, la borne est incluse.
      - Soustraire membre à membre deux inégalités.
    questions:
      - code: 2NDE-INEQ1-01
        difficulte: 1
        type: numerique
        enonce: 'Les solutions de $x + 4 > 7$ sont les réels $x > a$. Donner $a$.'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $x + 4 > 7$ donne $x > 3$.
          resultat: 3
      - code: 2NDE-INEQ1-02
        difficulte: 2
        type: qcm
        enonce: 'Résoudre $-2x \le 6$. A) $x \le -3$  B) $x \ge -3$  C) $x \ge 3$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          methode: Diviser par un nombre négatif change le sens de l'inégalité.
          etapes:
          - '$-2x \leq 6$ : on divise par $-2 < 0$, donc $x \geq -3$.'
          resultat: B
          erreurs_frequentes:
          - Répondre A en gardant le sens « $\leq$ ».
      - code: 2NDE-INEQ1-03
        difficulte: 3
        type: numerique
        enonce: 'Quel est le plus grand nombre entier $x$ tel que $3x - 5 < 2x + 1$ ?'
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $3x - 2x < 1 + 5$, soit $x < 6$.
          - Le plus grand entier strictement inférieur à $6$ est $5$.
          resultat: 5
      - code: 2NDE-INEQ1-04
        difficulte: 4
        type: qcm
        enonce: 'Résoudre $\dfrac{x}{2} - 1 \ge \dfrac{2x + 1}{3}$. A) $]-\infty ; -8]$  B) $[-8 ; +\infty[$  C) $]-\infty ; 8]$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier par le dénominateur commun, puis résoudre.
          etapes:
          - 'On multiplie par $6 > 0$ : $3x - 6 \geq 2(2x + 1) = 4x + 2$.'
          - $3x - 4x \geq 2 + 6$, soit $-x \geq 8$.
          - 'On multiplie par $-1$ : $x \leq -8$.'
          resultat: A
      - code: 2NDE-INEQ1-05
        difficulte: 5
        type: numerique
        enonce: 'Location de voiture : tarif A à 20 € plus 0,50 € par km, tarif B à 0,90 € par km. Le tarif A est strictement moins cher dès que la distance dépasse $d$ km. Donner $d$.'
        solution: 50
        auteur: Brouillon IA (Claude)
        correction:
          methode: Modéliser chaque tarif par une fonction de la distance, puis comparer.
          etapes:
          - 'Tarif A : $20 + 0{,}5d$ ; tarif B : $0{,}9d$.'
          - 'A moins cher : $20 + 0{,}5d < 0{,}9d$, soit $20 < 0{,}4d$, donc $d > 50$.'
          resultat: 50
