chapitre:
  code: 1RE-TEC-AUTO
  niveau: 1re
  parcours: technologique
  ordre: 1
  titre: Automatismes, évolutions et calcul algébrique
competences:
- code: 1RE-TEC-EVO
  libelle: Calculer des évolutions en pourcentage
  objectifs:
  - Appliquer un taux d'évolution pour obtenir une valeur finale ou initiale.
  - Calculer des évolutions successives et une évolution réciproque.
  prerequis:
  - 2NDE-EVO
  resume: |
    - Évolution de $t\,\%$ : multiplier par $CM = 1 + \dfrac{t}{100}$.
    - Valeur initiale : diviser la valeur finale par $CM$.
    - Évolutions successives : multiplier les coefficients ; réciproque : $\dfrac{1}{CM}$.
  cours: |
    ## Valeur finale, valeur initiale
    - $120$ € baissés de $25\,\%$ : $120 \times 0{,}75 = 90$ €.
    - Un prix de $330$ € après une hausse de $10\,\%$ valait $\dfrac{330}{1{,}1} = 300$ €.

    ## Évolutions successives
    $+20\,\%$ puis $-20\,\%$ : $1{,}2 \times 0{,}8 = 0{,}96$, soit $-4\,\%$.
    Trois hausses de $10\,\%$ : $1{,}1^3 = 1{,}331$, soit $+33{,}1\,\%$.

    ## Évolution réciproque
    Pour annuler $+25\,\%$ ($CM = 1{,}25$) : $\dfrac{1}{1{,}25} = 0{,}8$, soit $-20\,\%$.
  methodes:
  - titre: Retrouver une valeur initiale
    etapes:
    - Écrire le coefficient multiplicateur de l'évolution.
    - Diviser la valeur finale par ce coefficient.
    exemple:
      enonce: Après une baisse de 20 %, un article coûte 64 €. Prix initial ?
      resolution:
      - $\dfrac{64}{0{,}8} = 80$.
      resultat: 80 €
  erreurs_frequentes:
  - erreur: Retirer le pourcentage à la valeur finale pour retrouver la valeur initiale.
    explication: '$330 - 10\,\% \times 330 = 297 \neq 300$ : il faut diviser par $1{,}1$.'
  questions:
  - code: 1RE-TEC-EVO-01
    difficulte: 1
    type: numerique
    enonce: Un article coûte 120 €. Son prix baisse de 25 %. Quel est son nouveau prix (en €) ?
    solution: '90'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $120 \times 0{,}75 = 90$.
      resultat: '90'
  - code: 1RE-TEC-EVO-02
    difficulte: 2
    type: numerique
    enonce: Après une hausse de 10 %, un article coûte 330 €. Quel était son prix initial (en €) ?
    solution: '300'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\dfrac{330}{1{,}1} = 300$.
      resultat: '300'
  - code: 1RE-TEC-EVO-03
    difficulte: 3
    type: numerique
    enonce: Un prix augmente de 20 % puis baisse de 20 %. Quel est le taux d'évolution global, en pourcentage ?
    solution: '-4'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $1{,}2 \times 0{,}8 = 0{,}96$, soit $-4\,\%$.
      resultat: '-4'
  - code: 1RE-TEC-EVO-04
    difficulte: 4
    type: numerique
    enonce: Quel taux d'évolution (en pourcentage) annule une hausse de 25 % ?
    solution: '-20'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\dfrac{1}{1{,}25} = 0{,}8$, soit $-20\,\%$.
      resultat: '-20'
  - code: 1RE-TEC-EVO-05
    difficulte: 5
    type: numerique
    enonce: Un loyer augmente de 10 % trois années de suite. Quel est le taux d'évolution global, en pourcentage ?
    solution: '33.1'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $1{,}1^3 = 1{,}331$, soit $+33{,}1\,\%$.
      resultat: '33.1'
- code: 1RE-TEC-CALC
  libelle: Résoudre une équation produit nul et étudier un signe
  objectifs:
  - Résoudre une équation produit nul.
  - Déterminer le signe d'une expression du premier degré ou d'un produit factorisé.
  prerequis:
  - 2NDE-SIGNE
  - 2NDE-DEV
  resume: |
    - $A \times B = 0 \iff A = 0$ ou $B = 0$.
    - $ax + b$ est du signe de $a$ à droite de sa racine $-\dfrac{b}{a}$.
    - $a(x - x_1)(x - x_2)$ est du signe de $-a$ entre les racines, du signe de $a$ à l'extérieur.
  cours: |
    ## Produit nul
    $(x - 3)(x + 2) = 0 \iff x = 3$ ou $x = -2$.

    ## Signe d'une expression du premier degré
    $-2x + 4$ s'annule en $2$ ; le coefficient $-2$ est négatif, donc l'expression est positive avant $2$ et négative après.

    ## Signe d'un produit
    | $x$ | | $1$ | | $4$ | |
    |---|---|---|---|---|---|
    | $(x - 1)(x - 4)$ | $+$ | $0$ | $-$ | $0$ | $+$ |
  methodes:
  - titre: Étudier le signe d'un produit factorisé
    etapes:
    - Trouver la racine de chaque facteur.
    - Faire un tableau de signes, une ligne par facteur.
    - Appliquer la règle des signes dans chaque colonne.
    exemple:
      enonce: Signe de $(x + 1)(3 - x)$.
      resolution:
      - Racines $-1$ et $3$ ; $x + 1$ change de $-$ à $+$, $3 - x$ de $+$ à $-$.
      resultat: Positif sur $]-1 ; 3[$, négatif ailleurs.
  erreurs_frequentes:
  - erreur: Développer avant de résoudre une équation produit nul.
    explication: La forme factorisée permet de conclure directement.
  questions:
  - code: 1RE-TEC-CALC-01
    difficulte: 1
    type: numerique
    enonce: Résoudre $(x - 3)(x + 2) = 0$. Donner la plus grande solution.
    solution: '3'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - '$x - 3 = 0$ ou $x + 2 = 0$ : $x = 3$ ou $x = -2$.'
      resultat: '3'
  - code: 1RE-TEC-CALC-02
    difficulte: 2
    type: numerique
    enonce: Résoudre $2x(x - 5) = 0$. Donner la plus grande solution.
    solution: '5'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - '$2x = 0$ ou $x - 5 = 0$ : $x = 0$ ou $x = 5$.'
      resultat: '5'
  - code: 1RE-TEC-CALC-03
    difficulte: 3
    type: qcm
    enonce: 'Pour $x > 2$, l''expression $-2x + 4$ est : A) négative  B) positive  C) nulle'
    solution: A
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Elle s''annule en $2$ et son coefficient $-2$ est négatif : négative après $2$.'
      resultat: A
  - code: 1RE-TEC-CALC-04
    difficulte: 4
    type: expression
    enonce: Développer $(x - 3)(x + 3)$.
    solution: x^2 - 9
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - '$(a - b)(a + b) = a^2 - b^2$ : $x^2 - 9$.'
      resultat: x^2 - 9
  - code: 1RE-TEC-CALC-05
    difficulte: 5
    type: qcm
    enonce: 'Sur l''intervalle $]1 ; 4[$, l''expression $(x - 1)(x - 4)$ est : A) négative  B) positive'
    solution: A
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Entre les racines, $x - 1 > 0$ et $x - 4 < 0$ : le produit est négatif.'
      resultat: A
