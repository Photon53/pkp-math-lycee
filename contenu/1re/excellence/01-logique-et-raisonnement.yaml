chapitre:
  code: 1RE-EX-LOG
  niveau: 1re
  parcours: excellence
  ordre: 1
  titre: Logique et raisonnements
competences:
- code: 1RE-EX-LOGIQUE
  libelle: Utiliser quantificateurs, négation, contraposée et récurrence
  objectifs:
  - Nier une proposition quantifiée, écrire une contraposée.
  - Choisir un raisonnement (contraposée, absurde, récurrence).
  prerequis:
  - 1RE-SUI-TERME
  resume: |
    - Négation : « $\forall x, P(x)$ » devient « $\exists x, \text{non } P(x)$ », et inversement.
    - La contraposée de « $P \Rightarrow Q$ » est « non $Q \Rightarrow$ non $P$ » : elle lui est équivalente.
    - Récurrence : initialisation, hérédité, conclusion.
  cours: |
    ## Négation
    Non$(\forall x \in \mathbb{R},\ x^2 \geq 0)$ s'écrit $\exists x \in \mathbb{R},\ x^2 < 0$ (proposition fausse).

    ## Contraposée
    « Si $n^2$ est pair, alors $n$ est pair » équivaut à « si $n$ est impair, alors $n^2$ est impair », plus facile à démontrer : $(2k + 1)^2 = 2(2k^2 + 2k) + 1$.

    ## Récurrence
    $4^n - 1$ est divisible par $3$ : vrai pour $n = 0$ ; si $4^k - 1 = 3m$, alors $4^{k+1} - 1 = 4(3m + 1) - 1 = 3(4m + 1)$.
  methodes:
  - titre: Écrire la négation d'une phrase quantifiée
    etapes:
    - Échanger chaque ∀ et ∃.
    - Remplacer la propriété finale par sa négation (≥ devient <, = devient ≠…).
    exemple:
      enonce: Nier « $\exists M,\ \forall n,\ u_n \leq M$ ».
      resolution:
      - On échange les quantificateurs et on nie l'inégalité.
      resultat: $\forall M,\ \exists n,\ u_n > M$
  erreurs_frequentes:
  - erreur: Confondre contraposée et réciproque.
    explication: La réciproque « Q ⇒ P » n'est pas équivalente à « P ⇒ Q ».
  questions:
  - code: 1RE-EX-LOGIQUE-01
    difficulte: 1
    type: qcm
    enonce: 'La négation de « pour tout réel $x$, $x^2 \geq 0$ » est : A) il existe un réel $x$ tel que $x^2 < 0$  B) pour tout réel $x$, $x^2 < 0$  C) il existe un réel $x$ tel que $x^2 \geq 0$'
    solution: A
    source: math.ma
    source_url: https://www.math.ma/c:223:series-d-exercices
    licence_source: non clarifiée
    adaptation: inspiree
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - « Pour tout » devient « il existe », et ≥ devient <.
      resultat: A
  - code: 1RE-EX-LOGIQUE-02
    difficulte: 2
    type: qcm
    enonce: 'La contraposée de « si $n^2$ est pair, alors $n$ est pair » est : A) si $n$ est impair, alors $n^2$ est impair  B) si $n$ est pair, alors $n^2$ est pair  C) si $n^2$ est impair, alors $n$ est impair'
    solution: A
    source: math.ma
    source_url: https://www.math.ma/c:223:series-d-exercices
    licence_source: non clarifiée
    adaptation: inspiree
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - On nie la conclusion et l'hypothèse, et on les échange.
      resultat: A
  - code: 1RE-EX-LOGIQUE-03
    difficulte: 3
    type: qcm
    enonce: 'La proposition « il existe un réel $x$ tel que $x^2 + x + 1 = 0$ » est : A) vraie  B) fausse'
    solution: B
    source: math.ma
    source_url: https://www.math.ma/c:223:series-d-exercices
    licence_source: non clarifiée
    adaptation: inspiree
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - '$\Delta = 1 - 4 = -3 < 0$ : aucune solution réelle.'
      resultat: B
  - code: 1RE-EX-LOGIQUE-04
    difficulte: 4
    type: numerique
    enonce: On démontre par récurrence que $1 + 3 + 5 + \dots + (2n - 1) = n^2$. Calculer $1 + 3 + 5 + \dots + 99$.
    solution: '2500'
    source: math.ma
    source_url: https://www.math.ma/c:223:series-d-exercices
    licence_source: non clarifiée
    adaptation: inspiree
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $2n - 1 = 99$ donne $n = 50$.
      - 'Somme : $50^2 = 2\,500$.'
      resultat: '2500'
  - code: 1RE-EX-LOGIQUE-05
    difficulte: 5
    type: numerique
    enonce: On démontre par récurrence que $4^n - 1$ est divisible par 3 pour tout entier $n$. Quel est le reste de la division de $4^{50} - 1$ par 3 ?
    solution: '0'
    source: math.ma
    source_url: https://www.math.ma/c:223:series-d-exercices
    licence_source: non clarifiée
    adaptation: inspiree
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Hérédité : $4^{k+1} - 1 = 4(4^k - 1) + 3$, somme de deux multiples de 3.'
      - 'Donc $4^{50} - 1$ est divisible par 3 : reste $0$.'
      resultat: '0'
- code: 1RE-EX-LOG-PB
  libelle: 'Problème guidé : la somme des cubes par récurrence'
  objectifs:
  - Conjecturer une formule, la démontrer par récurrence et l'exploiter.
  prerequis:
  - 1RE-EX-LOGIQUE
  resume: |
    - $1^3 + 2^3 + \dots + n^3 = \left(\dfrac{n(n + 1)}{2}\right)^2 = (1 + 2 + \dots + n)^2$.
    - Une somme de $k = a$ à $b$ se calcule comme différence de deux sommes depuis 1.
  cours: |
    ## Le problème
    On observe $1^3 = 1^2$, $1^3 + 2^3 = 3^2$, $1^3 + 2^3 + 3^3 = 6^2$ : la somme des cubes semble être le carré de la somme des entiers.

    ## Hérédité
    Si $S_k = \left(\dfrac{k(k + 1)}{2}\right)^2$, alors
    $$S_{k+1} = \frac{k^2(k + 1)^2}{4} + (k + 1)^3 = \frac{(k + 1)^2(k^2 + 4k + 4)}{4} = \left(\frac{(k + 1)(k + 2)}{2}\right)^2.$$
  methodes:
  - titre: Rédiger l'hérédité d'une formule de somme
    etapes:
    - Écrire $S_{k+1} = S_k + (\text{terme } k + 1)$.
    - Remplacer S_k par l'hypothèse de récurrence.
    - Factoriser pour retrouver la formule au rang k + 1.
    exemple:
      enonce: $1 + 2 + \dots + n = \dfrac{n(n + 1)}{2}$.
      resolution:
      - $\dfrac{k(k + 1)}{2} + k + 1 = \dfrac{(k + 1)(k + 2)}{2}$.
      resultat: La formule est héréditaire.
  erreurs_frequentes:
  - erreur: Développer complètement au lieu de factoriser par (k + 1)².
    explication: La factorisation fait apparaître directement la forme attendue.
  questions:
  - code: 1RE-EX-LOG-PB-01
    difficulte: 1
    type: numerique
    enonce: 'Problème guidé (somme des cubes), étape 1 : calculer $1^3 + 2^3 + 3^3$.'
    solution: '36'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $1 + 8 + 27 = 36 = (1 + 2 + 3)^2$.
      resultat: '36'
  - code: 1RE-EX-LOG-PB-02
    difficulte: 2
    type: numerique
    enonce: 'Problème guidé (somme des cubes), étape 2 : on conjecture $1^3 + \dots + n^3 = \left(\dfrac{n(n + 1)}{2}\right)^2$. Que donne la formule pour $n = 10$ ?'
    solution: '3025'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\left(\dfrac{10 \times 11}{2}\right)^2 = 55^2 = 3\,025$.
      resultat: '3025'
  - code: 1RE-EX-LOG-PB-03
    difficulte: 3
    type: numerique
    enonce: 'Problème guidé (somme des cubes), étape 3 : vérifier l''hérédité de $k = 4$ à $k = 5$ en calculant $\left(\dfrac{4 \times 5}{2}\right)^2 + 5^3$.'
    solution: '225'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $100 + 125 = 225 = 15^2 = \left(\dfrac{5 \times 6}{2}\right)^2$.
      resultat: '225'
  - code: 1RE-EX-LOG-PB-04
    difficulte: 4
    type: numerique
    enonce: 'Problème guidé (somme des cubes), étape 4 : calculer $1^3 + 2^3 + \dots + 20^3$.'
    solution: '44100'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\left(\dfrac{20 \times 21}{2}\right)^2 = 210^2 = 44\,100$.
      resultat: '44100'
  - code: 1RE-EX-LOG-PB-05
    difficulte: 5
    type: numerique
    enonce: 'Problème guidé (somme des cubes), étape 5 : calculer $11^3 + 12^3 + \dots + 20^3$.'
    solution: '41075'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $44\,100 - 3\,025 = 41\,075$.
      resultat: '41075'
