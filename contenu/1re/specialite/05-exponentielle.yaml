chapitre:
  code: 1RE-EXPONENTIELLE
  niveau: 1re
  parcours: specialite
  ordre: 5
  titre: Fonction exponentielle

competences:
  - code: 1RE-EXP-ALG
    libelle: Utiliser les propriétés algébriques de l'exponentielle
    attendus: [1RE-SPE-2026-EXP-01, 1RE-SPE-2026-EXP-02, 1RE-SPE-2026-EXP-04]
    cours_couvre: [1RE-SPE-2026-EXP-01, 1RE-SPE-2026-EXP-02, 1RE-SPE-2026-EXP-04]
    objectifs:
    - Utiliser les propriétés algébriques de l'exponentielle et résoudre des équations.
    methodes:
    - titre: Résoudre une équation avec l'exponentielle
      etapes:
      - Se ramener à $e^A = e^B$ avec les propriétés ($e^a e^b = e^{a+b}$, $(e^a)^n = e^{na}$…).
      - Utiliser $e^A = e^B \iff A = B$, puis résoudre.
      exemple:
        enonce: Résoudre $e^{x + 1} = e^{3 - x}$.
        resolution:
        - $x + 1 = 3 - x$, donc $2x = 2$.
        resultat: $x = 1$
    erreurs_frequentes:
    - erreur: Écrire $e^a + e^b = e^{a+b}$.
      explication: 'La règle concerne le produit : $e^a \times e^b = e^{a+b}$.'
    resume: |
      - $\exp$ est l'unique fonction dérivable sur $\mathbb{R}$ telle que $\exp' = \exp$ et $\exp(0) = 1$ ; $e = \exp(1) \approx 2{,}718$ et $\exp(x) = e^x$.
      - $e^{x + y} = e^x e^y$, $e^{-x} = \dfrac{1}{e^x}$, $e^{x - y} = \dfrac{e^x}{e^y}$, $(e^x)^n = e^{nx}$.
      - $e^x > 0$ pour tout réel $x$.
      - $e^a = e^b \iff a = b$ et $e^a < e^b \iff a < b$.
    cours: |
      ## 1. Définition

      > **Théorème et définition (admis).** Il existe une unique fonction $f$ dérivable sur $\mathbb{R}$ telle que $f' = f$ et $f(0) = 1$. On l'appelle **fonction exponentielle** et on la note $\exp$.

      Ainsi $\exp(0) = 1$ et pour tout réel $x$, $\exp'(x) = \exp(x)$.

      ## 2. Relation fonctionnelle

      > **Propriété.** Pour tous réels $x$ et $y$ : $$\exp(x + y) = \exp(x)\exp(y) \qquad \text{et} \qquad \exp(x)\exp(-x) = 1.$$

      **Démonstration de $\exp(x)\exp(-x) = 1$.** Soit $g(x) = \exp(x)\exp(-x)$. Par la formule du produit et $(\exp(-x))' = -\exp(-x)$ :
      $g'(x) = \exp(x)\exp(-x) - \exp(x)\exp(-x) = 0$. Donc $g$ est constante, égale à $g(0) = 1$.
      Conséquence : $\exp(x) \neq 0$ pour tout $x$, et $\exp(-x) = \dfrac{1}{\exp(x)}$.

      *(La relation $\exp(x + y) = \exp(x)\exp(y)$ se démontre de façon analogue en dérivant $x \mapsto \dfrac{\exp(x + y)}{\exp(x)}$.)*

      ## 3. Le nombre $e$ et la notation $e^x$

      **Définition.** $e = \exp(1) \approx 2{,}718$. Pour tout entier $n$, $\exp(n) = \exp(1)^n = e^n$ ; on étend cette notation : pour tout réel $x$, $\exp(x) = e^x$.

      > **Propriété (règles de calcul).** Pour tous réels $a$, $b$ et tout entier $n$ :
      > $$e^{a + b} = e^a e^b, \quad e^{-a} = \frac{1}{e^a}, \quad e^{a - b} = \frac{e^a}{e^b}, \quad (e^a)^n = e^{na}, \quad e^0 = 1.$$

      Ce sont les mêmes règles que pour les puissances entières.

      ## 4. Signe et équations

      > **Propriété.** Pour tout réel $x$, $e^x > 0$.

      *Preuve.* $e^x = \left(e^{x/2}\right)^2 \geqslant 0$ et $e^x \neq 0$.

      La fonction exponentielle est strictement croissante (voir l'étude de la fonction), d'où :

      > **Propriété.** Pour tous réels $a$ et $b$ : $e^a = e^b \iff a = b$ et $e^a < e^b \iff a < b$.

      ## 5. Méthodes et exemple complet

      **Simplifier.** $\dfrac{e^{3x} \times e^{-x}}{(e^x)^2} = \dfrac{e^{2x}}{e^{2x}} = 1$.

      **Résoudre une équation.** $e^{x^2} = e^{4x - 3} \iff x^2 = 4x - 3 \iff x^2 - 4x + 3 = 0 \iff (x - 1)(x - 3) = 0$. $S = \{1 ; 3\}$.

      **Résoudre une inéquation.** $e^{2x + 1} > 1 \iff e^{2x + 1} > e^0 \iff 2x + 1 > 0 \iff x > -\dfrac{1}{2}$.

      **Factoriser.** $e^{2x} - e^x = e^x(e^x - 1)$.

      ## 6. Erreurs fréquentes

      - Écrire $e^{a + b} = e^a + e^b$ : c'est un **produit**.
      - Croire que $e^x$ peut être négatif ou nul : $e^x = -2$ n'a pas de solution.
      - Écrire $(e^x)^2 = e^{x^2}$ : en fait $(e^x)^2 = e^{2x}$.
    questions:
      - code: 1RE-EXP-ALG-01
        difficulte: 1
        type: numerique
        enonce: 'Que vaut $e^0$ ?'
        solution: 1
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Par définition, $e^0 = 1$.
          resultat: 1
      - code: 1RE-EXP-ALG-02
        difficulte: 2
        type: numerique
        enonce: 'Simplifier $e^3 \times e^{-1}$ (écrire la réponse sous la forme $e^n$).'
        solution: e^2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $e^3 \times e^{-1} = e^{3 - 1} = e^2$.
          resultat: e^2
      - code: 1RE-EXP-ALG-03
        difficulte: 3
        type: numerique
        enonce: 'Simplifier $\dfrac{(e^2)^3}{e^4}$.'
        solution: e^2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Puissance d''une puissance : $(e^a)^n = e^{na}$, donc $(e^2)^3 = e^{6}$.'
          - 'Quotient : $\dfrac{e^a}{e^b} = e^{a - b}$, donc $\dfrac{e^6}{e^4} = e^{6 - 4}$.'
          - 'Résultat : $e^2$.'
          resultat: e^2
      - code: 1RE-EXP-ALG-04
        difficulte: 4
        type: numerique
        enonce: 'Résoudre $e^{2x - 1} = e^3$.'
        solution: 2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'La fonction exponentielle est strictement croissante, donc $e^a = e^b \iff a = b$.'
          - '$e^{2x - 1} = e^3 \iff 2x - 1 = 3$.'
          - '$2x = 4$, donc $x = 2$.'
          resultat: 2
      - code: 1RE-EXP-ALG-05
        difficulte: 5
        type: numerique
        enonce: 'L''équation $e^{x^2 - 3} = e^{2x}$ a deux solutions. Donner la plus grande.'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $x^2 - 3 = 2x$, soit $x^2 - 2x - 3 = (x - 3)(x + 1) = 0$.
          - Solutions $-1$ et $3$ ; la plus grande est $3$.
          resultat: 3
      - code: 1RE-EXP-ALG-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {m: {entre: [-6, 9]}, n: {entre: [-6, 9]}, p: {entre: [-5, 6]}}
          calculs: {k: "m + n - p"}
        enonce: 'On écrit $\dfrac{e^{[[m]]} \times e^{[[n]]}}{e^{[[p]]}}$ sous la forme $e^k$. Donner $k$.'
        solution: '[[k]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: '$e^a \times e^b = e^{a+b}$ et $\dfrac{e^a}{e^b} = e^{a-b}$.'
          etapes:
          - '$e^{[[m]]} \times e^{[[n]]} = e^{[[m + n]]}$.'
          - '$\dfrac{e^{[[m + n]]}}{e^{[[p]]}} = e^{[[k]]}$.'
          resultat: '[[k]]'

  - code: 1RE-EXP-ETU
    libelle: Dériver et étudier des fonctions avec l'exponentielle
    attendus: [1RE-SPE-2026-EXP-03, 1RE-SPE-2026-EXP-05, 1RE-SPE-2026-EXP-06, 1RE-SPE-2026-EXP-07]
    cours_couvre: [1RE-SPE-2026-EXP-03, 1RE-SPE-2026-EXP-05, 1RE-SPE-2026-EXP-06, 1RE-SPE-2026-EXP-07]
    objectifs:
    - Dériver des fonctions avec l'exponentielle et en étudier les variations.
    prerequis:
    - 1RE-EXP-ALG
    - 1RE-DER-CALC
    methodes:
    - titre: Étudier le signe d'une dérivée contenant e^x
      etapes:
      - Factoriser la dérivée par $e^x$.
      - Comme $e^x > 0$, le signe est celui de l'autre facteur.
      exemple:
        enonce: Variations de $f(x) = (x - 2)e^x$.
        resolution:
        - $f'(x) = e^x + (x - 2)e^x = (x - 1)e^x$.
        - 'Signe de $x - 1$ : $f$ décroissante sur $]-\infty ; 1]$, croissante ensuite.'
        resultat: 'Minimum en $x = 1$ : $f(1) = -e$.'
    erreurs_frequentes:
    - erreur: Dériver $e^{3x}$ en $e^{3x}$.
      explication: '$(e^{ax})'' = ae^{ax}$ : $(e^{3x})'' = 3e^{3x}$.'
    resume: |
      - $\exp' = \exp > 0$ : la fonction exponentielle est **strictement croissante** sur $\mathbb{R}$ ; sa courbe passe par $(0 ; 1)$ et $(1 ; e)$.
      - $(e^{at})' = a\,e^{at}$ ; $(e^{at + b})' = a\,e^{at + b}$.
      - $k > 0$ : $t \mapsto e^{kt}$ est croissante (croissance exponentielle), $t \mapsto e^{-kt}$ est décroissante (décroissance exponentielle).
      - Pour tout réel $a$, la suite $(e^{na})$ est géométrique de raison $e^a$.
    cours: |
      ## 1. Variations et courbe

      > **Propriété.** La fonction exponentielle est dérivable sur $\mathbb{R}$, de dérivée elle-même. Comme $e^x > 0$, elle est **strictement croissante** sur $\mathbb{R}$.

      Repères sur la courbe : elle passe par $(0 ; 1)$ et $(1 ; e)$ ; sa tangente en $0$ a pour équation $y = x + 1$ ; elle est toujours au-dessus de l'axe des abscisses, qu'elle approche « à gauche » ; elle croît très vite « à droite » ($e^{10} \approx 22\,026$).

      ## 2. Dérivée de $t \mapsto e^{at}$

      > **Propriété.** Pour tout réel $a$, la fonction $t \mapsto e^{at}$ est dérivable sur $\mathbb{R}$ et $(e^{at})' = a\,e^{at}$. Plus généralement, $(e^{at + b})' = a\,e^{at + b}$.

      *Justification.* C'est la formule $(g(at + b))' = a\,g'(at + b)$ avec $g = \exp$.

      *Exemples.* $(e^{3t})' = 3e^{3t}$ ; $(e^{-0{,}5t})' = -0{,}5e^{-0{,}5t}$ ; $(t e^{-t})' = e^{-t} - te^{-t} = (1 - t)e^{-t}$.

      ## 3. Les fonctions $t \mapsto e^{kt}$ et $t \mapsto e^{-kt}$ ($k > 0$)

      > **Propriété.** Soit $k > 0$.
      > - $f(t) = e^{kt}$ : $f'(t) = ke^{kt} > 0$, $f$ est strictement croissante.
      > - $g(t) = e^{-kt}$ : $g'(t) = -ke^{-kt} < 0$, $g$ est strictement décroissante.
      > Les deux courbes passent par $(0 ; 1)$ et sont symétriques l'une de l'autre par rapport à l'axe des ordonnées ; plus $k$ est grand, plus la croissance (ou la décroissance) est rapide.

      ## 4. Lien avec les suites géométriques

      > **Propriété.** Pour tout réel $a$, la suite $u_n = e^{na}$ est géométrique de raison $q = e^a$, car $e^{(n + 1)a} = e^a \times e^{na}$.

      La fonction $t \mapsto Ce^{at}$ prolonge ainsi aux temps non entiers une évolution à **taux constant** : à chaque unité de temps, la grandeur est multipliée par $e^a$.

      ## 5. Modéliser

      *Exemple complet (décroissance radioactive).* La masse d'un échantillon est $m(t) = 50e^{-0{,}1t}$ (en grammes, $t$ en années).
      - $m(0) = 50$ g ; $m'(t) = -5e^{-0{,}1t} < 0$ : la masse diminue.
      - Chaque année, la masse est multipliée par $e^{-0{,}1} \approx 0{,}905$ : elle perd environ $9{,}5\,\%$ par an.
      - $m(10) = 50e^{-1} \approx 18{,}4$ g.

      *Capital à taux fixe.* Un capital de $1\,000$ € placé à $3\,\%$ par an vaut $1\,000 \times 1{,}03^n$ après $n$ ans : c'est une croissance exponentielle discrète, modélisée en continu par $t \mapsto 1\,000\,e^{at}$ avec $e^a = 1{,}03$.

      ## 6. Erreurs fréquentes

      - Écrire $(e^{3t})' = e^{3t}$ en oubliant le facteur $3$.
      - Écrire $(e^{3t})' = 3t\,e^{3t - 1}$ en confondant avec la dérivée de $t^n$.
      - Croire que $e^{-kt}$ devient négatif pour $t$ grand : elle reste strictement positive.
    questions:
      - code: 1RE-EXP-ETU-01
        difficulte: 1
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = e^{3x}$.'
        solution: 3e^(3x)
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$(e^{ax})'' = ae^{ax}$ : $f''(x) = 3e^{3x}$.'
          resultat: 3e^(3x)
      - code: 1RE-EXP-ETU-02
        difficulte: 2
        type: qcm
        enonce: 'Pour tout réel $x$, le nombre $e^x$ est : A) strictement positif  B) positif ou nul  C) de signe variable'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - La fonction exponentielle est strictement positive sur $\mathbb{R}$.
          resultat: A
      - code: 1RE-EXP-ETU-03
        difficulte: 3
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = x e^x$.'
        solution: (x + 1)e^x
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$f = uv$ avec $u(x) = x$, $u''(x) = 1$, $v(x) = e^x$, $v''(x) = e^x$.'
          - '$f''(x) = u''v + uv'' = 1 \times e^x + x \times e^x$.'
          - 'On factorise par $e^x$ : $f''(x) = (x + 1)e^x$.'
          resultat: (x + 1)e^x
      - code: 1RE-EXP-ETU-04
        difficulte: 4
        type: numerique
        enonce: 'Quel est le minimum sur $\mathbb{R}$ de $f(x) = (x - 1)e^x$ ?'
        solution: -1
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $f'(x) = e^x + (x - 1)e^x = xe^x$, du signe de $x$.
          - 'Minimum en $0$ : $f(0) = -1$.'
          resultat: -1
      - code: 1RE-EXP-ETU-05
        difficulte: 5
        type: numerique
        enonce: 'La suite définie par $u_n = 3e^{-2n}$ est géométrique. Donner sa raison.'
        solution: e^(-2)
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'On calcule le quotient de deux termes consécutifs (tous non nuls car $e^{-2n} > 0$).'
          - '$u_{n+1} = 3e^{-2(n + 1)} = 3e^{-2n - 2} = 3e^{-2n} \times e^{-2}$.'
          - 'Donc $\dfrac{u_{n+1}}{u_n} = e^{-2}$, constant : la suite est géométrique de raison $e^{-2}$.'
          resultat: e^(-2)
