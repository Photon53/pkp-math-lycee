chapitre:
  code: 1RE-SUITES
  niveau: 1re
  parcours: specialite
  ordre: 2
  titre: Suites numériques

competences:
  - code: 1RE-SUI-TERME
    libelle: Calculer les termes d'une suite
    attendus: [1RE-SPE-2026-SUI-01, 1RE-SPE-2026-SUI-02, 1RE-SPE-2026-SUI-09]
    objectifs:
    - Calculer des termes d'une suite définie explicitement ou par récurrence.
    methodes:
    - titre: Calculer des termes d'une suite définie par récurrence
      etapes:
      - Partir du premier terme donné ($u_0$ ou $u_1$).
      - Appliquer la relation pour obtenir le terme suivant, en remplaçant $n$ par le bon indice.
      - Recommencer jusqu'au terme demandé, sans sauter d'étape.
      exemple:
        enonce: $u_0 = 2$ et $u_{n+1} = 3u_n - 1$. Calculer $u_2$.
        resolution:
        - $u_1 = 3 \times 2 - 1 = 5$.
        - $u_2 = 3 \times 5 - 1 = 14$.
        resultat: $u_2 = 14$
    erreurs_frequentes:
    - erreur: Calculer $u_4$ d'une suite récurrente avec la formule « $u_n$ » directement.
      explication: 'Par récurrence, chaque terme dépend du précédent : il faut calculer $u_1$, $u_2$, $u_3$ avant $u_4$.'
    - erreur: Oublier que $n$ change dans la relation (comme dans $u_{n+1} = 2u_n + 3n$).
      explication: 'Pour calculer $u_{n+1}$, on utilise la valeur de $n$ du terme précédent : $u_1 = 2u_0 + 3 \times 0$.'
    resume: |
      - **Suite explicite** $u_n = f(n)$ : on remplace $n$ par sa valeur, par exemple $u_5 = f(5)$.
      - **Suite récurrente** $u_{n+1} = f(u_n)$ : on calcule les termes **un par un** à partir de $u_0$.
      - Bien distinguer le **rang** $n$ et le **terme** $u_n$.
    cours: |
      ## Deux façons de définir une suite
      Une suite $(u_n)$ associe à chaque entier naturel $n$ un nombre $u_n$, appelé **terme de rang $n$**.

      | Définition | Exemple | Calcul de $u_3$ |
      |---|---|---|
      | **Explicite** : $u_n$ en fonction de $n$ | $u_n = 4n - 1$ | $u_3 = 4 \times 3 - 1 = 11$ |
      | **Par récurrence** : premier terme et lien entre deux termes consécutifs | $u_0 = 2$, $u_{n+1} = u_n + 5$ | $u_1 = 7$, $u_2 = 12$, $u_3 = 17$ |

      ## Suite explicite
      On calcule directement n'importe quel terme. Attention aux priorités : $u_n = 2n^2$ donne $u_3 = 2 \times 9 = 18$,
      et non $(2 \times 3)^2$.

      ## Suite définie par récurrence
      Pour obtenir $u_4$, il faut d'abord $u_1$, $u_2$ et $u_3$ : on ne peut pas « sauter » d'étape.
      Quand la relation contient aussi $n$, comme $u_{n+1} = 2u_n + n$, on remplace $n$ par le rang **du terme précédent** :
      $u_1 = 2u_0 + 0$, $u_2 = 2u_1 + 1$, etc.
    questions:
      - code: 1RE-SUI-TERME-01
        difficulte: 1
        type: numerique
        enonce: 'La suite $(u_n)$ est définie par $u_n = 3n - 4$. Calculer $u_5$.'
        solution: 11
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_5 = 3 \times 5 - 4 = 11$.
          resultat: 11
      - code: 1RE-SUI-TERME-02
        difficulte: 2
        type: numerique
        enonce: 'La suite $(u_n)$ est définie pour tout $n \in \mathbb{N}$ par $u_n = 3n^2 - 2n + 5$. Calculer $u_7$.'
        solution: 138
        source: MathALÉA
        source_url: https://www.mathalea.fr/alea/
        licence_source: CC BY-SA 4.0
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_7 = 3 \times 49 - 2 \times 7 + 5 = 147 - 14 + 5 = 138$.
          resultat: 138
      - code: 1RE-SUI-TERME-03
        difficulte: 3
        type: numerique
        enonce: 'La suite $(u_n)$ est définie par $u_0 = 1$ et, pour tout $n \in \mathbb{N}$, $u_{n+1} = 2u_n + 3n$. Calculer $u_4$.'
        solution: 49
        source: MathALÉA
        source_url: https://www.mathalea.fr/alea/
        licence_source: CC BY-SA 4.0
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Calculer les termes un par un.
          etapes:
          - $u_1 = 2 \times 1 + 3 \times 0 = 2$ ; $u_2 = 2 \times 2 + 3 \times 1 = 7$.
          - $u_3 = 2 \times 7 + 3 \times 2 = 20$ ; $u_4 = 2 \times 20 + 3 \times 3 = 49$.
          resultat: 49
      - code: 1RE-SUI-TERME-04
        difficulte: 4
        type: numerique
        enonce: 'La suite $(u_n)$ est définie par $u_0 = 5$ et $u_{n+1} = \dfrac{u_n}{2} + 1$. Calculer $u_3$ (valeur exacte ou décimale).'
        solution: 19/8
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_1 = \dfrac{5}{2} + 1 = \dfrac{7}{2}$ ; $u_2 = \dfrac{7}{4} + 1 = \dfrac{11}{4}$.
          - $u_3 = \dfrac{11}{8} + 1 = \dfrac{19}{8}$.
          resultat: 19/8
      - code: 1RE-SUI-TERME-05
        difficulte: 5
        type: numerique
        enonce: $u_0 = 1$ et $u_{n+1} = u_n + 2n + 1$. Calculer $u_{10}$.
        solution: '101'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Calculer quelques termes, conjecturer une formule, puis la vérifier.
          etapes:
          - '$u_1 = 2$, $u_2 = 5$, $u_3 = 10$, $u_4 = 17$ : on conjecture $u_n = n^2 + 1$.'
          - 'Vérification : $(n^2 + 1) + 2n + 1 = (n + 1)^2 + 1$, la formule se transmet d''un rang au suivant.'
          - $u_{10} = 100 + 1 = 101$.
          resultat: '101'
      - code: 1RE-SUI-TERME-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {u: {entre: [-10, 20]}, r: {entre: [-6, 9], sauf: [0]}, n: {entre: [5, 30]}}
          calculs: {v: "u + n*r"}
        enonce: '$(u_n)$ est arithmétique de premier terme $u_0 = [[u]]$ et de raison $[[r]]$. Calculer $u_{[[n]]}$.'
        solution: '[[v]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Terme général d''une suite arithmétique : $u_n = u_0 + nr$.'
          etapes:
          - '$u_{[[n]]} = [[u]] + [[n]] \times ([[r]])$.'
          - '$u_{[[n]]} = [[v]]$.'
          resultat: '[[v]]'

  - code: 1RE-SUI-MOD
    libelle: Modéliser une situation par une suite
    attendus: [1RE-SPE-2026-SUI-03, 1RE-SPE-2026-SUI-04, 1RE-SPE-2026-SUI-08, 1RE-SPE-2026-SUI-10, 1RE-SPE-2026-SUI-11, 1RE-SPE-2026-SUI-13]
    objectifs:
    - Reconnaitre une évolution arithmétique ou géométrique et écrire le terme général.
    prerequis:
    - 1RE-SUI-TERME
    - 2NDE-EVO
    methodes:
    - titre: Choisir entre suite arithmétique et suite géométrique
      etapes:
      - 'On ajoute toujours la même quantité $r$ : suite arithmétique, $u_n = u_0 + nr$.'
      - 'On multiplie toujours par le même nombre $q$ (évolution à taux fixe) : suite géométrique, $u_n = u_0 \times q^n$.'
      exemple:
        enonce: Une ville de $20\,000$ habitants perd $3\,\%$ de sa population par an. Population $P_n$ après $n$ années ?
        resolution:
        - 'Baisse de $3\,\%$ : on multiplie par $0{,}97$ chaque année.'
        - Suite géométrique de premier terme $20\,000$ et de raison $0{,}97$.
        resultat: $P_n = 20\,000 \times 0{,}97^n$
    erreurs_frequentes:
    - erreur: Prendre $1{,}02$ comme raison d'une suite arithmétique.
      explication: 'Un taux fixe agit par multiplication : c''est une suite géométrique.'
    resume: |
      - On ajoute **la même quantité** à chaque étape : suite **arithmétique**, $u_n = u_0 + nr$.
      - On multiplie **par le même nombre** à chaque étape : suite **géométrique**, $u_n = u_0 \times q^n$.
      - Augmenter de $t\,\%$, c'est multiplier par $1 + \dfrac{t}{100}$.
    cours: |
      ## Repérer le type d'évolution
      | Situation | Évolution | Modèle |
      |---|---|---|
      | Un forfait de 20 € puis 3 € par séance | $+3$ à chaque séance | arithmétique : $u_n = 20 + 3n$ |
      | Une population qui augmente de 4 % par an | $\times 1{,}04$ chaque année | géométrique : $u_n = u_0 \times 1{,}04^n$ |
      | Une valeur qui baisse de 10 % par an | $\times 0{,}9$ chaque année | géométrique : $u_n = u_0 \times 0{,}9^n$ |

      ## Méthode
      1. Calculer les premiers termes à la main : $u_0$, $u_1$, $u_2$.
      2. Regarder si l'on **ajoute** toujours le même nombre ou si l'on **multiplie** toujours par le même nombre.
      3. Écrire la formule, puis la **vérifier** sur les termes calculés.

      ## Attention à $u_0$
      Le premier terme correspond souvent à la situation de départ ($n = 0$ séance, année 0) : bien lire l'énoncé.
    questions:
      - code: 1RE-SUI-MOD-01
        difficulte: 2
        type: qcm
        enonce: 'Une population augmente de 50 individus chaque année. Le nombre d''individus au bout de $n$ années est modélisé par une suite : A) arithmétique de raison 50  B) géométrique de raison 50  C) ni arithmétique ni géométrique'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'On ajoute $50$ chaque année : suite arithmétique de raison $50$.'
          resultat: A
      - code: 1RE-SUI-MOD-02
        difficulte: 2
        type: expression
        enonce: 'Une médiathèque demande une adhésion annuelle de 12 €, puis 1,50 € par emprunt. On note $w_n$ le prix payé dans l''année pour $n$ emprunts. Exprimer $w_n$ en fonction de $n$.'
        solution: 12 + 1.5n
        source: MathALÉA
        source_url: https://www.mathalea.fr/alea/
        licence_source: CC BY-SA 4.0
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Partie fixe $12$, plus $1{,}50$ par emprunt : $w_n = 12 + 1{,}5n$ (suite arithmétique).'
          resultat: 12 + 1.5n
      - code: 1RE-SUI-MOD-03
        difficulte: 3
        type: expression
        enonce: 'Un capital de 500 € est placé à intérêts composés au taux de 2 % par an. On note $C_n$ le capital au bout de $n$ années. Exprimer $C_n$ en fonction de $n$.'
        solution: 500*1.02^n
        auteur: Brouillon IA (Claude)
        correction:
          methode: Intérêts composés = évolution à taux fixe = suite géométrique.
          etapes:
          - Chaque année, le capital est multiplié par $1{,}02$.
          - $C_n = 500 \times 1{,}02^n$.
          resultat: 500*1.02^n
      - code: 1RE-SUI-MOD-04
        difficulte: 1
        type: qcm
        enonce: 'Une tirelire contient 50 € ; chaque mois, Léa y ajoute 20 €. La somme contenue chaque mois se modélise par une suite : A) arithmétique de raison 20  B) géométrique de raison 20  C) arithmétique de raison 50'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'On ajoute toujours la même quantité, 20 € : suite arithmétique de raison 20 (et de premier terme 50).'
          resultat: A
      - code: 1RE-SUI-MOD-05
        difficulte: 4
        type: numerique
        enonce: Une population de 2 000 bactéries augmente de 10 % par heure. Au bout de combien d'heures entières dépasse-t-elle 4 000 bactéries ?
        solution: '8'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Suite géométrique, puis recherche de seuil.
          etapes:
          - $P_n = 2\,000 \times 1{,}1^n$ ; on cherche $1{,}1^n > 2$.
          - $1{,}1^7 \approx 1{,}95 < 2$ et $1{,}1^8 \approx 2{,}14 > 2$.
          resultat: '8'
      - code: 1RE-SUI-MOD-06
        difficulte: 5
        type: numerique
        enonce: Un abonnement coûte 30 € la première année, puis son prix augmente de 2 € chaque année. Quelle somme totale aura-t-on payée au bout de 10 années ?
        solution: '390'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Somme des termes d'une suite arithmétique.
          etapes:
          - 'Prix de l''année $n$ (de 0 à 9) : $u_n = 30 + 2n$, donc $u_9 = 48$.'
          - 'Somme : $10 \times \dfrac{u_0 + u_9}{2} = 10 \times \dfrac{30 + 48}{2} = 390$ €.'
          erreurs_frequentes:
          - 'Prendre $u_{10}$ comme dernier terme : 10 années vont de $u_0$ à $u_9$.'
          resultat: '390'
      - code: 1RE-SUI-MOD-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {u: {entre: [1, 6]}, q: {parmi: [2, 3, -2]}, n: {entre: [3, 7]}}
          calculs: {v: "u*q**n"}
        enonce: '$(v_n)$ est géométrique de premier terme $v_0 = [[u]]$ et de raison $[[q]]$. Calculer $v_{[[n]]}$.'
        solution: '[[v]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Terme général d''une suite géométrique : $v_n = v_0 \times q^n$.'
          etapes:
          - '$v_{[[n]]} = [[u]] \times ([[q]])^{[[n]]}$.'
          - '$([[q]])^{[[n]]} = [[q**n]]$, donc $v_{[[n]]} = [[v]]$.'
          resultat: '[[v]]'

  - code: 1RE-SUI-VAR
    libelle: Étudier le sens de variation d'une suite
    attendus: [1RE-SPE-2026-SUI-05, 1RE-SPE-2026-SUI-12]
    objectifs:
    - Étudier le sens de variation d'une suite par le signe de $u_{n+1} - u_n$.
    prerequis:
    - 1RE-SUI-TERME
    methodes:
    - titre: Étudier le sens de variation d'une suite
      etapes:
      - Calculer $u_{n+1}$ en remplaçant $n$ par $n + 1$ dans la formule.
      - Calculer et simplifier $u_{n+1} - u_n$ (réduire au même dénominateur si besoin).
      - 'Signe positif pour tout $n$ : suite croissante ; négatif : décroissante.'
      exemple:
        enonce: $u_n = n^2 - 3n$. Sens de variation à partir de $n = 1$ ?
        resolution:
        - $u_{n+1} - u_n = (n + 1)^2 - 3(n + 1) - n^2 + 3n = 2n - 2$.
        - $2n - 2 \geq 0$ pour $n \geq 1$.
        resultat: Croissante à partir du rang 1.
    erreurs_frequentes:
    - erreur: Conclure à partir des premiers termes seulement.
      explication: 'Quelques termes croissants ne prouvent rien : il faut le signe de $u_{n+1} - u_n$ pour tout $n$.'
    resume: |
      - $(u_n)$ est **croissante** si $u_{n+1} - u_n \geq 0$ pour tout $n$, **décroissante** si $u_{n+1} - u_n \leq 0$.
      - Méthode : calculer $u_{n+1} - u_n$, le **simplifier**, puis étudier son **signe**.
      - Si $u_n = f(n)$ avec $f$ monotone sur $[0 ; +\infty[$, la suite a le même sens de variation que $f$.
    cours: |
      ## Définition
      - $(u_n)$ est **croissante** si, pour tout $n$, $u_{n+1} \geq u_n$.
      - $(u_n)$ est **décroissante** si, pour tout $n$, $u_{n+1} \leq u_n$.

      ## Méthode de la différence
      On étudie le signe de $u_{n+1} - u_n$.

      Exemple : $u_n = n^2 - 3n$.
      $$u_{n+1} - u_n = (n+1)^2 - 3(n+1) - (n^2 - 3n) = 2n - 2$$
      Pour $n \geq 1$, $2n - 2 \geq 0$ : la suite est croissante **à partir du rang 1**.

      ## Avec une fonction
      Si $u_n = f(n)$ et que $f$ est croissante sur $[0 ; +\infty[$, alors $(u_n)$ est croissante.
      Attention, la réciproque est fausse : une suite peut être croissante sans que la fonction le soit sur tout $[0 ; +\infty[$.

      ## Erreur fréquente
      Comparer seulement $u_0$ et $u_1$ ne suffit pas : il faut un argument valable **pour tout $n$**.
    questions:
      - code: 1RE-SUI-VAR-01
        difficulte: 2
        type: qcm
        enonce: 'La suite $(u_n)$ est définie par $u_n = 5 - 2n$. Elle est : A) croissante  B) décroissante  C) ni croissante ni décroissante'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_{n+1} - u_n = 5 - 2(n + 1) - 5 + 2n = -2 < 0$.
          resultat: B
      - code: 1RE-SUI-VAR-02
        difficulte: 3
        type: expression
        enonce: 'La suite $(u_n)$ est définie par $u_n = n^2 + n$. Exprimer $u_{n+1} - u_n$ en fonction de $n$, sous forme simplifiée.'
        solution: 2n + 2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_{n+1} = (n + 1)^2 + (n + 1) = n^2 + 3n + 2$.
          - $u_{n+1} - u_n = 2n + 2$.
          resultat: 2n + 2
      - code: 1RE-SUI-VAR-03
        difficulte: 4
        type: qcm
        enonce: 'La suite $(u_n)$ est définie pour tout $n \in \mathbb{N}$ par $u_n = \dfrac{3n - 1}{n + 2}$. En étudiant le signe de $u_{n+1} - u_n$, on montre qu''elle est : A) croissante  B) décroissante  C) ni croissante ni décroissante'
        solution: A
        source: MathALÉA
        source_url: https://www.mathalea.fr/alea/
        licence_source: CC BY-SA 4.0
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_{n+1} - u_n = \dfrac{7}{(n + 2)(n + 3)}$ (voir le calcul de la question suivante).
          - 'Ce quotient est strictement positif pour tout $n$ : la suite est croissante.'
          resultat: A
      - code: 1RE-SUI-VAR-04
        difficulte: 5
        type: expression
        enonce: 'La suite $(u_n)$ est définie par $u_n = \dfrac{3n - 1}{n + 2}$. Exprimer $u_{n+1} - u_n$ en fonction de $n$ sous la forme d''un seul quotient.'
        solution: 7/((n + 2)(n + 3))
        source: MathALÉA
        source_url: https://www.mathalea.fr/alea/
        licence_source: CC BY-SA 4.0
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Réduire au même dénominateur.
          etapes:
          - $u_{n+1} = \dfrac{3n + 2}{n + 3}$.
          - $u_{n+1} - u_n = \dfrac{(3n + 2)(n + 2) - (3n - 1)(n + 3)}{(n + 2)(n + 3)}$.
          - 'Numérateur : $(3n^2 + 8n + 4) - (3n^2 + 8n - 3) = 7$.'
          resultat: 7/((n + 2)(n + 3))
      - code: 1RE-SUI-VAR-05
        difficulte: 1
        type: qcm
        enonce: 'Une suite arithmétique de raison $-3$ est : A) croissante  B) décroissante  C) constante'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$u_{n+1} - u_n = -3 < 0$ : la suite est décroissante.'
          resultat: B

  - code: 1RE-SUI-SOMME
    libelle: Calculer une somme de termes et conjecturer une limite
    attendus: [1RE-SPE-2026-SUI-06, 1RE-SPE-2026-SUI-07, 1RE-SPE-2026-SUI-14, 1RE-SPE-2026-SUI-15]
    objectifs:
    - Calculer $1 + 2 + \cdots + n$ et $1 + q + \cdots + q^n$, et les démontrer.
    - Conjecturer la limite éventuelle d'une suite à partir de ses termes ou de sa représentation graphique.
    prerequis:
    - 1RE-SUI-MOD
    methodes:
    - titre: Calculer une somme de termes consécutifs
      quand: La somme porte sur une suite arithmétique ou géométrique.
      etapes:
      - Identifier la nature de la suite, son premier terme et le nombre de termes.
      - Arithmétique $:$ $S = \text{nombre de termes} \times \dfrac{\text{premier} + \text{dernier}}{2}$.
      - Géométrique de raison $q \neq 1$ $:$ $S = \text{premier terme} \times \dfrac{1 - q^{\text{nombre de termes}}}{1 - q}$.
      exemple:
        enonce: Calculer $3 + 6 + 12 + \cdots + 384$.
        resolution:
        - Suite géométrique de premier terme $3$ et de raison $2$ ; $384 = 3 \times 2^7$ $:$ $8$ termes.
        - $S = 3 \times \dfrac{1 - 2^8}{1 - 2} = 3 \times 255 = 765$.
        resultat: $765$
    erreurs_frequentes:
    - erreur: Se tromper sur le nombre de termes.
      explication: De $u_0$ à $u_n$, il y a $n + 1$ termes ; de $u_1$ à $u_n$, il y en a $n$.
    - erreur: Conclure à une limite à partir de quelques termes seulement.
      explication: Les premiers termes suggèrent une conjecture ; la limite se démontre en terminale.
    resume: |
      - $1 + 2 + \cdots + n = \dfrac{n(n + 1)}{2}$.
      - Pour $q \neq 1$ : $1 + q + q^2 + \cdots + q^n = \dfrac{1 - q^{n + 1}}{1 - q}$.
      - Une suite peut tendre vers un réel, vers $+\infty$ ou $-\infty$, ou n'avoir pas de limite (ex. $(-1)^n$).
      - On passe d'un registre à l'autre : phrase, formule, tableau de valeurs, nuage de points.
    cours: |
      ## Somme des premiers entiers
      $S = 1 + 2 + \cdots + n$ ; en écrivant la somme à l'envers et en ajoutant terme à terme, $2S = n(n + 1)$, d'où $S = \dfrac{n(n + 1)}{2}$.

      ## Somme géométrique
      $S = 1 + q + \cdots + q^n$ ; alors $qS = q + q^2 + \cdots + q^{n + 1}$ et $S - qS = 1 - q^{n + 1}$, d'où, pour $q \neq 1$, $S = \dfrac{1 - q^{n + 1}}{1 - q}$.

      ## Approche intuitive de la limite
      - $u_n = \dfrac{1}{n}$ : les termes se rapprochent de $0$.
      - $v_n = 2^n$ : les termes deviennent aussi grands qu'on veut ($+\infty$).
      - $w_n = (-1)^n$ : les termes valent alternativement $1$ et $-1$ ; pas de limite.
    questions:
      - code: 1RE-SUI-SOMME-01
        difficulte: 1
        type: numerique
