  - code: 1RE-SUI-SOMME
    libelle: Calculer une somme de termes et conjecturer une limite
    attendus: [1RE-SPE-2026-SUI-06, 1RE-SPE-2026-SUI-07, 1RE-SPE-2026-SUI-14, 1RE-SPE-2026-SUI-15]
    cours_couvre: [1RE-SPE-2026-SUI-06, 1RE-SPE-2026-SUI-07, 1RE-SPE-2026-SUI-14, 1RE-SPE-2026-SUI-15]
    objectifs:
    - Calculer $1 + 2 + \cdots + n$ et $1 + q + \cdots + q^n$, et les démontrer.
    - Conjecturer la limite éventuelle d'une suite à partir de ses termes ou de sa représentation graphique.
    prerequis:
    - 1RE-SUI-MOD
    methodes:
    - titre: Calculer une somme de termes consécutifs
      quand: La somme porte sur une suite arithmétique ou géométrique.
      etapes:
      - Identifier la nature de la suite, son premier terme et le nombre de termes.
      - Arithmétique $:$ $S = \text{nombre de termes} \times \dfrac{\text{premier} + \text{dernier}}{2}$.
      - Géométrique de raison $q \neq 1$ $:$ $S = \text{premier terme} \times \dfrac{1 - q^{\text{nombre de termes}}}{1 - q}$.
      exemple:
        enonce: Calculer $3 + 6 + 12 + \cdots + 384$.
        resolution:
        - Suite géométrique de premier terme $3$ et de raison $2$ ; $384 = 3 \times 2^7$ $:$ $8$ termes.
        - $S = 3 \times \dfrac{1 - 2^8}{1 - 2} = 3 \times 255 = 765$.
        resultat: $765$
    erreurs_frequentes:
    - erreur: Se tromper sur le nombre de termes.
      explication: De $u_0$ à $u_n$, il y a $n + 1$ termes ; de $u_1$ à $u_n$, il y en a $n$.
    - erreur: Conclure à une limite à partir de quelques termes seulement.
      explication: Les premiers termes suggèrent une conjecture ; la limite se démontre en terminale.
    resume: |
      - $1 + 2 + \cdots + n = \dfrac{n(n + 1)}{2}$.
      - Pour $q \neq 1$ : $1 + q + q^2 + \cdots + q^n = \dfrac{1 - q^{n+1}}{1 - q}$ (attention : $n + 1$ termes).
      - Somme de termes consécutifs : arithmétique $= N \times \dfrac{\text{premier} + \text{dernier}}{2}$ ; géométrique $= \text{premier} \times \dfrac{1 - q^N}{1 - q}$, $N$ = nombre de termes.
      - On décrit une suite en mots, par une formule ou par un graphique, et on conjecture sa limite (finie, infinie ou absente).
    cours: |
      ## 1. Somme des $n$ premiers entiers

      > **Propriété.** Pour tout entier $n \geqslant 1$ : $$1 + 2 + \cdots + n = \frac{n(n + 1)}{2}.$$

      **Démonstration (exigible).** Notons $S = 1 + 2 + \cdots + n$. On l'écrit aussi dans l'ordre inverse : $S = n + (n - 1) + \cdots + 1$. En additionnant terme à terme :
      $$2S = (1 + n) + (2 + n - 1) + \cdots + (n + 1) = n(n + 1),$$
      car chacune des $n$ parenthèses vaut $n + 1$. Donc $S = \dfrac{n(n + 1)}{2}$.

      *Exemple.* $1 + 2 + \cdots + 100 = \dfrac{100 \times 101}{2} = 5\,050$.

      ## 2. Somme des puissances successives de $q$

      > **Propriété.** Pour tout réel $q \neq 1$ et tout entier $n$ : $$1 + q + q^2 + \cdots + q^n = \frac{1 - q^{n+1}}{1 - q}.$$

      **Démonstration (exigible).** Notons $S = 1 + q + \cdots + q^n$. Alors $qS = q + q^2 + \cdots + q^{n+1}$. En soustrayant, tous les termes intermédiaires se simplifient : $S - qS = 1 - q^{n+1}$, soit $(1 - q)S = 1 - q^{n+1}$, et comme $q \neq 1$, $S = \dfrac{1 - q^{n+1}}{1 - q}$.

      *Exemple.* $1 + 2 + 4 + \cdots + 2^{9} = \dfrac{1 - 2^{10}}{1 - 2} = 1\,023$.

      ## 3. Sommes de termes de suites arithmétiques ou géométriques

      > **Méthode.** Compter d'abord le **nombre de termes** $N$ : de $u_p$ à $u_n$, il y en a $n - p + 1$.
      > - Arithmétique : $u_p + \cdots + u_n = N \times \dfrac{u_p + u_n}{2}$.
      > - Géométrique de raison $q \neq 1$ : $u_p + \cdots + u_n = u_p \times \dfrac{1 - q^N}{1 - q}$.

      *Exemple complet.* Un club compte $40$ adhérents la première année et en gagne $6$ chaque année. Total des cotisations versées sur $10$ ans, à $30$ € par adhérent et par an ?
      Adhérents : $u_1 = 40$, $u_{10} = 40 + 9 \times 6 = 94$. Somme : $10 \times \dfrac{40 + 94}{2} = 670$ adhérents-années, soit $670 \times 30 = 20\,100$ €.

      ## 4. Différents registres

      Une même suite se décrit :
      - en **langue naturelle** : « chaque année, on ajoute 6 adhérents » ;
      - de façon **algébrique** : $u_{n+1} = u_n + 6$, ou $u_n = 34 + 6n$ ;
      - **graphiquement** : nuage de points $(n ; u_n)$, ici alignés.
      Savoir passer de l'un à l'autre fait partie de l'étude d'une suite.

      ## 5. Approche intuitive de la limite

      En observant les termes ou le nuage de points :
      - **limite finie** $\ell$ : les termes finissent par être aussi proches de $\ell$ qu'on veut (ex. $u_n = 2 - 0{,}5^n$ s'approche de $2$) ;
      - **limite infinie** : les termes finissent par dépasser tout nombre (ex. $u_n = n^2$) ;
      - **pas de limite** : ex. $u_n = (-1)^n$, ou $u_n = \cos(n)$.
      Avec les sommes : si $0 < q < 1$, $q^{n+1}$ s'approche de $0$ et $1 + q + \cdots + q^n$ semble tendre vers $\dfrac{1}{1 - q}$ (pour $q = \dfrac{1}{2}$, vers $2$).

      ## 6. Erreurs fréquentes

      - Se tromper dans le nombre de termes : de $u_0$ à $u_n$, il y a $n + 1$ termes.
      - Utiliser la formule géométrique avec $q = 1$ (division par $0$) : la somme vaut alors simplement $N$ fois le premier terme.
      - Confondre $q^{n+1}$ et $q^n + 1$.
    questions:
      - code: 1RE-SUI-SOMME-01
        difficulte: 1
        type: numerique
