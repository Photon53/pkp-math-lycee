        gabarit:
          parametres: {u: {entre: [1, 15]}, r: {entre: [1, 6]}, n: {entre: [8, 25]}}
          calculs: {d: "u + (n - 1)*r", s: "n*(u + u + (n - 1)*r)/2"}
        enonce: 'Calculer la somme des $[[n]]$ premiers termes de la suite arithmétique de premier terme $[[u]]$ et de raison $[[r]]$.'
        solution: '[[s]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Somme = nombre de termes × (premier + dernier) ÷ 2.'
          etapes:
