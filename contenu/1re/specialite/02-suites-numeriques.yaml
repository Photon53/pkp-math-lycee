chapitre:
  code: 1RE-SUITES
  niveau: 1re
  parcours: specialite
  ordre: 2
  titre: Suites numériques

competences:
  - code: 1RE-SUI-TERME
    libelle: Calculer les termes d'une suite
    attendus: [1RE-SPE-2026-SUI-01, 1RE-SPE-2026-SUI-02, 1RE-SPE-2026-SUI-09]
    cours_couvre: [1RE-SPE-2026-SUI-01, 1RE-SPE-2026-SUI-02, 1RE-SPE-2026-SUI-09]
    objectifs:
    - Calculer des termes d'une suite définie explicitement ou par récurrence.
    methodes:
    - titre: Calculer des termes d'une suite définie par récurrence
      etapes:
      - Partir du premier terme donné ($u_0$ ou $u_1$).
      - Appliquer la relation pour obtenir le terme suivant, en remplaçant $n$ par le bon indice.
      - Recommencer jusqu'au terme demandé, sans sauter d'étape.
      exemple:
        enonce: $u_0 = 2$ et $u_{n+1} = 3u_n - 1$. Calculer $u_2$.
        resolution:
        - $u_1 = 3 \times 2 - 1 = 5$.
        - $u_2 = 3 \times 5 - 1 = 14$.
        resultat: $u_2 = 14$
    erreurs_frequentes:
    - erreur: Calculer $u_4$ d'une suite récurrente avec la formule « $u_n$ » directement.
      explication: 'Par récurrence, chaque terme dépend du précédent : il faut calculer $u_1$, $u_2$, $u_3$ avant $u_4$.'
    - erreur: Oublier que $n$ change dans la relation (comme dans $u_{n+1} = 2u_n + 3n$).
      explication: 'Pour calculer $u_{n+1}$, on utilise la valeur de $n$ du terme précédent : $u_1 = 2u_0 + 3 \times 0$.'
    resume: |
      - Une **suite** $(u_n)$ associe à chaque entier naturel $n$ un réel $u_n$ (terme de rang $n$) ; on note aussi $u(n)$.
      - **Forme explicite** $u_n = f(n)$ : on calcule directement n'importe quel terme.
      - **Récurrence** $u_{n+1} = f(u_n)$ et $u_0$ donné : on calcule les termes de proche en proche.
      - Une suite peut aussi être produite par un **algorithme** ou un **motif géométrique**.
    cours: |
      ## 1. Notion de suite

      **Définition.** Une **suite numérique** $u$ est une fonction qui, à tout entier naturel $n$ (éventuellement à partir d'un rang $n_0$), associe un réel noté $u(n)$ ou $u_n$, appelé **terme de rang $n$**. La suite elle-même se note $u$, $(u(n))$ ou $(u_n)$.

      Attention : $u_n$ est un **nombre**, $(u_n)$ est la **suite**. Le terme qui suit $u_n$ est $u_{n+1}$, à ne pas confondre avec $u_n + 1$.

      ## 2. Suite définie de façon explicite

      > **Définition.** La suite est définie **explicitement** lorsque $u_n = f(n)$ pour une fonction $f$ définie sur $[0 ; +\infty[$.

      *Exemple.* $u_n = n^2 - 3n$ : $u_0 = 0$, $u_1 = -2$, $u_{10} = 70$. On calcule $u_{10}$ sans calculer les termes précédents.

      ## 3. Suite définie par récurrence

      > **Définition.** La suite est définie **par récurrence** lorsqu'on donne son premier terme et une relation $u_{n+1} = f(u_n)$ permettant de calculer chaque terme à partir du précédent.

      *Exemple complet.* $u_0 = 2$ et $u_{n+1} = 3u_n - 1$.
      - $u_1 = 3 \times 2 - 1 = 5$ ;
      - $u_2 = 3 \times 5 - 1 = 14$ ;
      - $u_3 = 3 \times 14 - 1 = 41$.
      Pour obtenir $u_{10}$, il faut calculer tous les termes intermédiaires (calculatrice, tableur ou programme).

      ## 4. Suite définie par un algorithme

      ```python
      u = 2
      for k in range(10):
          u = 3 * u - 1
      print(u)   # affiche u_10
      ```
      La boucle applique dix fois la relation de récurrence. Au tableur : $2$ en A1, puis `=3*A1-1` en A2, recopié vers le bas.

      ## 5. Suite définie par un motif

      On construit des figures étape par étape : 1 carré, puis 3, puis 5… Si l'on ajoute $2$ carrés à chaque étape, le nombre de carrés à l'étape $n$ vérifie $c_{n+1} = c_n + 2$ et $c_n = 1 + 2n$. On cherche à traduire le motif par une relation de récurrence **et** par une formule explicite.

      ## 6. Méthode : calculer un terme

      1. Repérer le mode de génération (explicite ou récurrence).
      2. Explicite : remplacer $n$ par le rang demandé.
      3. Récurrence : partir du premier terme et appliquer la relation autant de fois que nécessaire, en notant chaque terme.

      ## 7. Erreurs fréquentes

      - Confondre $u_{n+1}$ (terme suivant) et $u_n + 1$.
      - Se décaler d'un rang : si la suite commence à $u_0$, le 5e terme est $u_4$.
      - Pour une récurrence, remplacer $n$ au lieu de $u_n$ dans la relation.
    questions:
      - code: 1RE-SUI-TERME-01
        difficulte: 1
        type: numerique
        enonce: 'La suite $(u_n)$ est définie par $u_n = 3n - 4$. Calculer $u_5$.'
        solution: 11
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_5 = 3 \times 5 - 4 = 11$.
          resultat: 11
      - code: 1RE-SUI-TERME-02
        difficulte: 2
        type: numerique
        enonce: 'La suite $(u_n)$ est définie pour tout $n \in \mathbb{N}$ par $u_n = 3n^2 - 2n + 5$. Calculer $u_7$.'
        solution: 138
        source: MathALÉA
        source_url: https://www.mathalea.fr/alea/
        licence_source: CC BY-SA 4.0
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_7 = 3 \times 49 - 2 \times 7 + 5 = 147 - 14 + 5 = 138$.
          resultat: 138
      - code: 1RE-SUI-TERME-03
        difficulte: 3
        type: numerique
        enonce: 'La suite $(u_n)$ est définie par $u_0 = 1$ et, pour tout $n \in \mathbb{N}$, $u_{n+1} = 2u_n + 3n$. Calculer $u_4$.'
        solution: 49
        source: MathALÉA
        source_url: https://www.mathalea.fr/alea/
        licence_source: CC BY-SA 4.0
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          methode: Calculer les termes un par un.
          etapes:
          - $u_1 = 2 \times 1 + 3 \times 0 = 2$ ; $u_2 = 2 \times 2 + 3 \times 1 = 7$.
          - $u_3 = 2 \times 7 + 3 \times 2 = 20$ ; $u_4 = 2 \times 20 + 3 \times 3 = 49$.
          resultat: 49
      - code: 1RE-SUI-TERME-04
        difficulte: 4
        type: numerique
        enonce: 'La suite $(u_n)$ est définie par $u_0 = 5$ et $u_{n+1} = \dfrac{u_n}{2} + 1$. Calculer $u_3$ (valeur exacte ou décimale).'
        solution: 19/8
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $u_1 = \dfrac{5}{2} + 1 = \dfrac{7}{2}$ ; $u_2 = \dfrac{7}{4} + 1 = \dfrac{11}{4}$.
          - $u_3 = \dfrac{11}{8} + 1 = \dfrac{19}{8}$.
          resultat: 19/8
      - code: 1RE-SUI-TERME-05
        difficulte: 5
        type: numerique
        enonce: $u_0 = 1$ et $u_{n+1} = u_n + 2n + 1$. Calculer $u_{10}$.
        solution: '101'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Calculer quelques termes, conjecturer une formule, puis la vérifier.
          etapes:
          - '$u_1 = 2$, $u_2 = 5$, $u_3 = 10$, $u_4 = 17$ : on conjecture $u_n = n^2 + 1$.'
          - 'Vérification : $(n^2 + 1) + 2n + 1 = (n + 1)^2 + 1$, la formule se transmet d''un rang au suivant.'
          - $u_{10} = 100 + 1 = 101$.
          resultat: '101'
      - code: 1RE-SUI-TERME-V1
        difficulte: 2
        type: numerique
        gabarit:
          parametres: {u: {entre: [-10, 20]}, r: {entre: [-6, 9], sauf: [0]}, n: {entre: [5, 30]}}
          calculs: {v: "u + n*r"}
        enonce: '$(u_n)$ est arithmétique de premier terme $u_0 = [[u]]$ et de raison $[[r]]$. Calculer $u_{[[n]]}$.'
        solution: '[[v]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Terme général d''une suite arithmétique : $u_n = u_0 + nr$.'
          etapes:
          - '$u_{[[n]]} = [[u]] + [[n]] \times ([[r]])$.'
          - '$u_{[[n]]} = [[v]]$.'
          resultat: '[[v]]'

  - code: 1RE-SUI-MOD
    libelle: Modéliser une situation par une suite
    attendus: [1RE-SPE-2026-SUI-03, 1RE-SPE-2026-SUI-04, 1RE-SPE-2026-SUI-08, 1RE-SPE-2026-SUI-10, 1RE-SPE-2026-SUI-11, 1RE-SPE-2026-SUI-13]
    cours_couvre: [1RE-SPE-2026-SUI-03, 1RE-SPE-2026-SUI-04, 1RE-SPE-2026-SUI-08, 1RE-SPE-2026-SUI-10, 1RE-SPE-2026-SUI-11, 1RE-SPE-2026-SUI-13]
    objectifs:
    - Reconnaitre une évolution arithmétique ou géométrique et écrire le terme général.
    prerequis:
    - 1RE-SUI-TERME
    - 2NDE-EVO
    methodes:
    - titre: Choisir entre suite arithmétique et suite géométrique
      etapes:
      - 'On ajoute toujours la même quantité $r$ : suite arithmétique, $u_n = u_0 + nr$.'
      - 'On multiplie toujours par le même nombre $q$ (évolution à taux fixe) : suite géométrique, $u_n = u_0 \times q^n$.'
      exemple:
        enonce: Une ville de $20\,000$ habitants perd $3\,\%$ de sa population par an. Population $P_n$ après $n$ années ?
        resolution:
        - 'Baisse de $3\,\%$ : on multiplie par $0{,}97$ chaque année.'
        - Suite géométrique de premier terme $20\,000$ et de raison $0{,}97$.
        resultat: $P_n = 20\,000 \times 0{,}97^n$
    erreurs_frequentes:
    - erreur: Prendre $1{,}02$ comme raison d'une suite arithmétique.
      explication: 'Un taux fixe agit par multiplication : c''est une suite géométrique.'
    resume: |
      - **Arithmétique** de raison $r$ : $u_{n+1} = u_n + r$, $u_n = u_0 + nr = u_p + (n - p)r$ ; croissance linéaire.
      - **Géométrique** de raison $q$ : $u_{n+1} = q\,u_n$, $u_n = u_0\,q^n = u_p\,q^{n-p}$ ; croissance exponentielle.
      - Une évolution de $t\,\%$ répétée : suite géométrique de raison $q = 1 + \dfrac{t}{100}$.
      - $1 + 2 + \cdots + n = \dfrac{n(n + 1)}{2}$ et, pour $q \neq 1$, $1 + q + \cdots + q^n = \dfrac{1 - q^{n+1}}{1 - q}$.
    cours: |
      ## 1. Suites arithmétiques

      **Définition.** $(u_n)$ est **arithmétique** s'il existe un réel $r$ (la **raison**) tel que pour tout $n$, $u_{n+1} = u_n + r$. On passe d'un terme au suivant en **ajoutant** toujours le même nombre.

      > **Propriété (terme général).** Pour tous entiers $n$ et $p$ : $u_n = u_0 + nr$ et $u_n = u_p + (n - p)r$.

      **Démonstration.** $u_1 = u_0 + r$, $u_2 = u_1 + r = u_0 + 2r$… On ajoute $n$ fois la raison pour aller de $u_0$ à $u_n$ : $u_n = u_0 + nr$. De même $u_p = u_0 + pr$, donc $u_n - u_p = (n - p)r$.

      **Lien avec les fonctions affines.** $u_n = u_0 + rn$ : les points $(n ; u_n)$ sont alignés sur la droite $y = rx + u_0$. C'est le modèle des **accroissements constants** (croissance linéaire).

      ## 2. Suites géométriques

      **Définition.** $(u_n)$ est **géométrique** s'il existe un réel $q$ (la **raison**) tel que pour tout $n$, $u_{n+1} = q\,u_n$. On passe d'un terme au suivant en **multipliant** toujours par le même nombre.

      > **Propriété (terme général).** Pour tous entiers $n$ et $p$ : $u_n = u_0\,q^n$ et $u_n = u_p\,q^{n-p}$.

      **Démonstration.** $u_1 = qu_0$, $u_2 = qu_1 = q^2u_0$… On multiplie $n$ fois par $q$ pour aller de $u_0$ à $u_n$ : $u_n = u_0q^n$.

      **Lien avec les évolutions en pourcentage.** Une grandeur qui augmente de $t\,\%$ par période est multipliée par $1 + \dfrac{t}{100}$ : elle forme une suite géométrique (taux constant, croissance **exponentielle**). Lien avec la fonction exponentielle : pour tout réel $a$, $e^{a(n+1)} = e^a \times e^{an}$, donc la suite $(e^{an})$ est géométrique de raison $e^a$.

      ## 3. Démontrer qu'une suite est arithmétique ou géométrique

      > **Méthode.**
      > - Arithmétique : montrer que $u_{n+1} - u_n$ est une constante (indépendante de $n$).
      > - Géométrique (termes non nuls) : montrer que $\dfrac{u_{n+1}}{u_n}$ est une constante, ou écrire $u_{n+1} = q\,u_n$.
      > - Pour prouver que ce n'est **pas** le cas : trouver deux différences (ou deux quotients) différents parmi les premiers termes.

      *Exemple.* $u_n = 5 - 3n$ : $u_{n+1} - u_n = 5 - 3(n + 1) - 5 + 3n = -3$. Suite arithmétique de raison $-3$.

      ## 4. Sommes de termes

      > **Propriété.** $1 + 2 + \cdots + n = \dfrac{n(n + 1)}{2}$ et, pour $q \neq 1$, $1 + q + q^2 + \cdots + q^n = \dfrac{1 - q^{n+1}}{1 - q}$.

      (Démonstrations dans le cours sur les sommes.) Conséquence : une somme de termes consécutifs d'une suite arithmétique vaut $\text{nombre de termes} \times \dfrac{\text{premier} + \text{dernier}}{2}$ ; pour une suite géométrique, $u_0 + \cdots + u_n = u_0 \dfrac{1 - q^{n+1}}{1 - q}$.

      ## 5. Modéliser

      *Exemple complet.* Une ville compte $20\,000$ habitants en 2025.
      - Modèle A : elle gagne $500$ habitants par an. $a_n = 20\,000 + 500n$ (arithmétique, raison $500$). En 2035 : $a_{10} = 25\,000$.
      - Modèle B : elle gagne $2\,\%$ par an. $b_n = 20\,000 \times 1{,}02^n$ (géométrique, raison $1{,}02$). En 2035 : $b_{10} \approx 24\,380$.
      - Population cumulée sur 2025–2034 dans le modèle A : $10 \times \dfrac{20\,000 + 24\,500}{2} = 222\,500$ habitants-années.

      ## 6. Erreurs fréquentes

      - Écrire $u_n = u_1 + nr$ quand la suite commence à $u_1$ : c'est $u_n = u_1 + (n - 1)r$.
      - Confondre « $+2\,\%$ par an » (raison $1{,}02$) et « $+2$ par an » (raison $2$, arithmétique).
      - Conclure qu'une suite est arithmétique en vérifiant seulement les trois premiers termes : il faut un calcul **pour tout $n$**.
    questions:
      - code: 1RE-SUI-MOD-01
        difficulte: 2
        type: qcm
        enonce: 'Une population augmente de 50 individus chaque année. Le nombre d''individus au bout de $n$ années est modélisé par une suite : A) arithmétique de raison 50  B) géométrique de raison 50  C) ni arithmétique ni géométrique'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'On ajoute $50$ chaque année : suite arithmétique de raison $50$.'
          resultat: A
      - code: 1RE-SUI-MOD-02
        difficulte: 2
        type: expression
        enonce: 'Une médiathèque demande une adhésion annuelle de 12 €, puis 1,50 € par emprunt. On note $w_n$ le prix payé dans l''année pour $n$ emprunts. Exprimer $w_n$ en fonction de $n$.'
        solution: 12 + 1.5n
        source: MathALÉA
        source_url: https://www.mathalea.fr/alea/
        licence_source: CC BY-SA 4.0
        adaptation: inspiree
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Partie fixe $12$, plus $1{,}50$ par emprunt : $w_n = 12 + 1{,}5n$ (suite arithmétique).'
          resultat: 12 + 1.5n
      - code: 1RE-SUI-MOD-03
        difficulte: 3
        type: expression
        enonce: 'Un capital de 500 € est placé à intérêts composés au taux de 2 % par an. On note $C_n$ le capital au bout de $n$ années. Exprimer $C_n$ en fonction de $n$.'
        solution: 500*1.02^n
        auteur: Brouillon IA (Claude)
        correction:
          methode: Intérêts composés = évolution à taux fixe = suite géométrique.
          etapes:
          - Chaque année, le capital est multiplié par $1{,}02$.
          - $C_n = 500 \times 1{,}02^n$.
          resultat: 500*1.02^n
      - code: 1RE-SUI-MOD-04
        difficulte: 1
        type: qcm
        enonce: 'Une tirelire contient 50 € ; chaque mois, Léa y ajoute 20 €. La somme contenue chaque mois se modélise par une suite : A) arithmétique de raison 20  B) géométrique de raison 20  C) arithmétique de raison 50'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'On ajoute toujours la même quantité, 20 € : suite arithmétique de raison 20 (et de premier terme 50).'
          resultat: A
      - code: 1RE-SUI-MOD-05
        difficulte: 4
        type: numerique
        enonce: Une population de 2 000 bactéries augmente de 10 % par heure. Au bout de combien d'heures entières dépasse-t-elle 4 000 bactéries ?
        solution: '8'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Suite géométrique, puis recherche de seuil.
          etapes:
          - $P_n = 2\,000 \times 1{,}1^n$ ; on cherche $1{,}1^n > 2$.
          - $1{,}1^7 \approx 1{,}95 < 2$ et $1{,}1^8 \approx 2{,}14 > 2$.
          resultat: '8'
      - code: 1RE-SUI-MOD-06
        difficulte: 5
        type: numerique
        enonce: Un abonnement coûte 30 € la première année, puis son prix augmente de 2 € chaque année. Quelle somme totale aura-t-on payée au bout de 10 années ?
        solution: '390'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Somme des termes d'une suite arithmétique.
          etapes:
          - 'Prix de l''année $n$ (de 0 à 9) : $u_n = 30 + 2n$, donc $u_9 = 48$.'
          - 'Somme : $10 \times \dfrac{u_0 + u_9}{2} = 10 \times \dfrac{30 + 48}{2} = 390$ €.'
          erreurs_frequentes:
          - 'Prendre $u_{10}$ comme dernier terme : 10 années vont de $u_0$ à $u_9$.'
          resultat: '390'
      - code: 1RE-SUI-MOD-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {u: {entre: [1, 6]}, q: {parmi: [2, 3, -2]}, n: {entre: [3, 7]}}
          calculs: {v: "u*q**n"}
        enonce: '$(v_n)$ est géométrique de premier terme $v_0 = [[u]]$ et de raison $[[q]]$. Calculer $v_{[[n]]}$.'
        solution: '[[v]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Terme général d''une suite géométrique : $v_n = v_0 \times q^n$.'
          etapes:
          - '$v_{[[n]]} = [[u]] \times ([[q]])^{[[n]]}$.'
          - '$([[q]])^{[[n]]} = [[q**n]]$, donc $v_{[[n]]} = [[v]]$.'
          resultat: '[[v]]'

  - code: 1RE-SUI-VAR
    libelle: Étudier le sens de variation d'une suite
    attendus: [1RE-SPE-2026-SUI-05, 1RE-SPE-2026-SUI-12]
    cours_couvre: [1RE-SPE-2026-SUI-05, 1RE-SPE-2026-SUI-12]
    objectifs:
    - Étudier le sens de variation d'une suite par le signe de $u_{n+1} - u_n$.
    prerequis:
    - 1RE-SUI-TERME
    methodes:
    - titre: Étudier le sens de variation d'une suite
      etapes:
      - Calculer $u_{n+1}$ en remplaçant $n$ par $n + 1$ dans la formule.
      - Calculer et simplifier $u_{n+1} - u_n$ (réduire au même dénominateur si besoin).
      - 'Signe positif pour tout $n$ : suite croissante ; négatif : décroissante.'
      exemple:
        enonce: $u_n = n^2 - 3n$. Sens de variation à partir de $n = 1$ ?
        resolution:
        - $u_{n+1} - u_n = (n + 1)^2 - 3(n + 1) - n^2 + 3n = 2n - 2$.
        - $2n - 2 \geq 0$ pour $n \geq 1$.
        resultat: Croissante à partir du rang 1.
    erreurs_frequentes:
    - erreur: Conclure à partir des premiers termes seulement.
      explication: 'Quelques termes croissants ne prouvent rien : il faut le signe de $u_{n+1} - u_n$ pour tout $n$.'
    resume: |
      - $(u_n)$ est **croissante** si $u_{n+1} \geqslant u_n$ pour tout $n$, **décroissante** si $u_{n+1} \leqslant u_n$.
      - Méthode générale : étudier le **signe de $u_{n+1} - u_n$**.
      - Arithmétique : croissante si $r > 0$, décroissante si $r < 0$. Géométrique ($u_0 > 0$) : croissante si $q > 1$, décroissante si $0 < q < 1$.
      - Si $u_n = f(n)$ et $f$ est monotone sur $[0 ; +\infty[$, la suite a le même sens de variation que $f$.
    cours: |
      ## 1. Définitions

      > **Définition.** Une suite $(u_n)$ est
      > - **croissante** si pour tout $n$, $u_{n+1} \geqslant u_n$ ;
      > - **décroissante** si pour tout $n$, $u_{n+1} \leqslant u_n$ ;
      > - **constante** si pour tout $n$, $u_{n+1} = u_n$ ;
      > - **monotone** si elle est croissante ou décroissante.

      (Strictement croissante : $u_{n+1} > u_n$.) Une suite peut n'être ni croissante ni décroissante : $u_n = (-1)^n$.

      ## 2. Méthode 1 : signe de $u_{n+1} - u_n$

      *Exemple.* $u_n = n^2 - 4n$. $u_{n+1} - u_n = (n + 1)^2 - 4(n + 1) - n^2 + 4n = 2n - 3$.
      $2n - 3 \geqslant 0 \iff n \geqslant 2$ : la suite est croissante à partir du rang $2$ ($u_0 = 0$, $u_1 = -3$, $u_2 = -4$, $u_3 = -3$…).

      ## 3. Méthode 2 : fonction associée

      > **Propriété.** Si $u_n = f(n)$ avec $f$ croissante (resp. décroissante) sur $[0 ; +\infty[$, alors $(u_n)$ est croissante (resp. décroissante).

      *Exemple.* $u_n = \dfrac{1}{n + 1}$ : $f(x) = \dfrac{1}{x + 1}$ est décroissante sur $[0 ; +\infty[$, donc $(u_n)$ est décroissante.
      La réciproque est fausse : une suite peut être croissante sans que $f$ le soit sur tout l'intervalle.

      ## 4. Méthode 3 : suites de référence

      > **Propriété.**
      > - Suite arithmétique de raison $r$ : $u_{n+1} - u_n = r$. Croissante si $r > 0$, décroissante si $r < 0$, constante si $r = 0$.
      > - Suite géométrique de raison $q > 0$ et de premier terme $u_0 > 0$ : $u_{n+1} - u_n = u_0q^n(q - 1)$. Croissante si $q > 1$, décroissante si $0 < q < 1$.
      > - Si $u_0 < 0$, les conclusions s'inversent ; si $q < 0$, les termes changent de signe et la suite n'est pas monotone.

      ## 5. Conjecturer une limite

      On calcule des termes (tableur, programme) ou on trace le nuage de points $(n ; u_n)$ et on observe le comportement quand $n$ devient grand :
      - $u_n = 3 + \dfrac{1}{n}$ ($n \geqslant 1$) : $4$ ; $3{,}5$ ; … ; $3{,}001$ : les termes semblent s'approcher de $3$. On conjecture que la limite est $3$.
      - $u_n = 1{,}1^n$ : les termes dépassent n'importe quel nombre : limite $+\infty$.
      - $u_n = (-1)^n$ : alternance entre $-1$ et $1$ : pas de limite.
      - $u_n = 0{,}5^n$ : les termes se rapprochent de $0$.

      Ce ne sont que des **conjectures** : la démonstration se fera en terminale.

      ## 6. Exemple complet

      $u_0 = 100$ et $u_{n+1} = 0{,}8u_n$. Géométrique de raison $0{,}8 \in ]0 ; 1[$ avec $u_0 > 0$ : décroissante. Termes : $100$ ; $80$ ; $64$ ; $51{,}2$ ; … ; $u_{20} \approx 1{,}15$. On conjecture que $(u_n)$ tend vers $0$.

      ## 7. Erreurs fréquentes

      - Conclure sur le sens de variation à partir de deux ou trois termes seulement.
      - Étudier le signe de $u_n$ au lieu de celui de $u_{n+1} - u_n$.
      - Dire « la raison est négative donc la suite décroît » pour une suite **géométrique** : avec $q < 0$, elle n'est pas monotone.
    questions:
      - code: 1RE-SUI-VAR-01
        difficulte: 2
        type: qcm
        enonce: 'La suite $(u_n)$ est définie par $u_n = 5 - 2n$. Elle est : A) croissante  B) décroissante  C) ni croissante ni décroissante'
