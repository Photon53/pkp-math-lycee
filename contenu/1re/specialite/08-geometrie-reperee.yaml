chapitre:
  code: 1RE-GEOMETRIE-REPEREE
  niveau: 1re
  parcours: specialite
  ordre: 8
  titre: Géométrie repérée

competences:
  - code: 1RE-NORMAL
    libelle: Utiliser un vecteur normal à une droite
    attendus: [1RE-SPE-2026-GEOREP-01, 1RE-SPE-2026-GEOREP-04]
    cours_couvre: [1RE-SPE-2026-GEOREP-01, 1RE-SPE-2026-GEOREP-04]
    objectifs:
    - Utiliser un vecteur normal pour écrire l'équation d'une droite et trouver un projeté orthogonal.
    prerequis:
    - 1RE-PS-APP
    - 2NDE-DROITE
    methodes:
    - titre: Écrire une équation de droite avec un vecteur normal
      etapes:
      - Un vecteur normal $\vec n(a ; b)$ donne une équation $ax + by + c = 0$.
      - Trouver $c$ en remplaçant par les coordonnées d'un point de la droite.
      exemple:
        enonce: Droite passant par $A(2 ; -1)$, de vecteur normal $\vec n(1 ; 4)$.
        resolution:
        - '$x + 4y + c = 0$ ; avec $A$ : $2 - 4 + c = 0$, donc $c = 2$.'
        resultat: $x + 4y + 2 = 0$
    erreurs_frequentes:
    - erreur: Confondre vecteur normal et vecteur directeur.
      explication: Pour $ax + by + c = 0$, $(a ; b)$ est normal et $(-b ; a)$ est directeur.
    resume: |
      - Un **vecteur normal** à une droite $d$ est un vecteur non nul orthogonal à un vecteur directeur de $d$.
      - La droite d'équation $ax + by + c = 0$ a pour vecteur normal $\vec n(a ; b)$ (et pour vecteur directeur $\vec u(-b ; a)$).
      - Droite passant par $A$ de vecteur normal $\vec n$ : $M \in d \iff \overrightarrow{AM} \cdot \vec n = 0$, soit $a(x - x_A) + b(y - y_A) = 0$.
      - Deux droites sont perpendiculaires si et seulement si leurs vecteurs normaux sont orthogonaux.
    cours: |
      ## 1. Vecteur normal

      > **Définition.** Un vecteur $\vec n$ **non nul** est **normal** à une droite $d$ s'il est orthogonal à un vecteur directeur de $d$.

      Une droite admet une infinité de vecteurs normaux, tous colinéaires entre eux.

      ## 2. Lien avec l'équation cartésienne

      Dans un repère orthonormé :

      > **Propriété.**
      > - Si $\vec n(a ; b)$ est normal à une droite $d$, alors $d$ a une équation de la forme $ax + by + c = 0$.
      > - Réciproquement, la droite d'équation $ax + by + c = 0$ (avec $(a ; b) \neq (0 ; 0)$) admet $\vec n(a ; b)$ comme vecteur normal.

      **Démonstration.** Soit $A(x_A ; y_A)$ un point de $d$ et $M(x ; y)$. $M \in d \iff \overrightarrow{AM} \perp \vec n \iff \overrightarrow{AM} \cdot \vec n = 0 \iff a(x - x_A) + b(y - y_A) = 0$, c'est-à-dire $ax + by + c = 0$ avec $c = -ax_A - by_A$.
      Réciproquement, la droite $ax + by + c = 0$ a pour vecteur directeur $\vec u(-b ; a)$ et $\vec n \cdot \vec u = -ab + ba = 0$.

      ## 3. Méthode : équation d'une droite de point et vecteur normal donnés

      1. Écrire $ax + by + c = 0$ avec $(a ; b)$ les coordonnées du vecteur normal.
      2. Remplacer $x$ et $y$ par les coordonnées du point pour trouver $c$.
         (Ou écrire directement $\overrightarrow{AM} \cdot \vec n = 0$.)

      *Exemple complet.* Droite $d$ passant par $A(2 ; -1)$ de vecteur normal $\vec n(3 ; 4)$ : $3x + 4y + c = 0$ et $3 \times 2 + 4 \times (-1) + c = 0$, donc $c = -2$.
      $d : 3x + 4y - 2 = 0$. Contrôle : $A$ vérifie l'équation.

      ## 4. Applications

      **Hauteur d'un triangle.** La hauteur issue de $C$ dans $ABC$ passe par $C$ et a pour vecteur normal $\overrightarrow{AB}$.
      *Exemple :* $A(0 ; 0)$, $B(4 ; 2)$, $C(1 ; 3)$. $\overrightarrow{AB}(4 ; 2)$ : $4x + 2y + c = 0$ avec $4 + 6 + c = 0$, soit $4x + 2y - 10 = 0$, ou $2x + y - 5 = 0$.

      **Médiatrice d'un segment $[AB]$.** Elle passe par le milieu de $[AB]$ et a pour vecteur normal $\overrightarrow{AB}$.

      **Perpendicularité.** $d : ax + by + c = 0$ et $d' : a'x + b'y + c' = 0$ sont perpendiculaires si et seulement si $aa' + bb' = 0$.

      **Tangente à un cercle.** La tangente en un point $T$ au cercle de centre $\Omega$ a pour vecteur normal $\overrightarrow{\Omega T}$.

      ## 5. Erreurs fréquentes

      - Confondre vecteur normal $(a ; b)$ et vecteur directeur $(-b ; a)$.
      - Lire un vecteur normal sur une équation réduite $y = mx + p$ sans la réécrire : $mx - y + p = 0$ donne $\vec n(m ; -1)$.
      - Utiliser cette méthode dans un repère non orthonormé.
    questions:
      - code: 1RE-NORMAL-01
        difficulte: 1
        type: qcm
        enonce: 'Quel vecteur est normal à la droite d''équation $2x - 3y + 1 = 0$ ? A) $\vec n(2 ; -3)$  B) $\vec n(3 ; 2)$  C) $\vec n(-3 ; 2)$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Pour $ax + by + c = 0$, $\vec n(a ; b)$ est normal : ici $(2 ; -3)$.'
          resultat: A
      - code: 1RE-NORMAL-02
        difficulte: 2
        type: numerique
        enonce: 'La droite passant par $A(1 ; 2)$ de vecteur normal $\vec n(3 ; 1)$ a une équation $3x + y + c = 0$. Donner $c$.'
        solution: -5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $3 \times 1 + 2 + c = 0$, donc $c = -5$.
          resultat: -5
      - code: 1RE-NORMAL-03
        difficulte: 3
        type: qcm
        enonce: 'Quelle est une équation de la droite passant par $A(1 ; 1)$ et perpendiculaire à $d : x + 2y = 0$ ? A) $2x - y - 1 = 0$  B) $x + 2y - 3 = 0$  C) $2x + y - 3 = 0$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: Un vecteur normal à d est directeur de la perpendiculaire.
          etapes:
          - $\vec n(1 ; 2)$ est normal à $d$ ; la perpendiculaire a pour vecteur normal $(2 ; -1)$.
          - '$2x - y + c = 0$ passant par $(1 ; 1)$ : $c = -1$.'
          resultat: A
      - code: 1RE-NORMAL-04
        difficulte: 4
        type: numerique
        enonce: 'Soit $H$ le projeté orthogonal de l''origine $O$ sur la droite $x + y - 2 = 0$. Donner l''abscisse de $H$.'
        solution: 1
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$H$ est sur la droite passant par $O$ de vecteur directeur $\vec n(1 ; 1)$ : $H(t ; t)$.'
          - $t + t - 2 = 0$, donc $t = 1$.
          resultat: 1
      - code: 1RE-NORMAL-05
        difficulte: 5
        type: numerique
        enonce: 'La parabole d''équation $y = 2x^2 - 8x + 3$ a un axe de symétrie d''équation $x = k$. Donner $k$.'
        solution: 2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$f(x) = 2x^2 - 8x + 3$ a pour coefficients $a = 2$ et $b = -8$.'
          - 'L''axe de symétrie passe par le sommet, d''abscisse $-\dfrac{b}{2a} = -\dfrac{-8}{4} = 2$.'
          - 'Vérification par symétrie : $f(0) = f(4) = 3$, et le milieu de $0$ et $4$ est $2$. Donc $k = 2$.'
          resultat: 2

  - code: 1RE-CERCLE
    libelle: Déterminer et utiliser l'équation d'un cercle
    attendus: [1RE-SPE-2026-GEOREP-03, 1RE-SPE-2026-GEOREP-06, 1RE-SPE-2026-GEOREP-07]
    cours_couvre: [1RE-SPE-2026-GEOREP-03, 1RE-SPE-2026-GEOREP-06, 1RE-SPE-2026-GEOREP-07]
    objectifs:
    - Lire et déterminer l'équation d'un cercle, reconnaitre centre et rayon.
    prerequis:
    - 1RE-SD-CANON
    methodes:
    - titre: Retrouver centre et rayon par complétion du carré
      etapes:
      - Regrouper les termes en $x$ et en $y$.
      - 'Compléter les carrés : $x^2 - 2ax = (x - a)^2 - a^2$.'
      - 'Écrire $(x - a)^2 + (y - b)^2 = r^2$ : centre $(a ; b)$, rayon $r$.'
      exemple:
        enonce: $x^2 + y^2 - 2x + 4y - 4 = 0$.
        resolution:
        - $(x - 1)^2 - 1 + (y + 2)^2 - 4 - 4 = 0$.
        - $(x - 1)^2 + (y + 2)^2 = 9$.
        resultat: Centre $(1 ; -2)$, rayon $3$.
    erreurs_frequentes:
    - erreur: Lire le centre $(-2 ; 1)$ dans $(x - 2)^2 + (y + 1)^2$.
      explication: '$(x - a)^2$ : le centre a pour abscisse $a$, donc $2$ ; $(y + 1)^2 = (y - (-1))^2$, ordonnée $-1$.'
    - erreur: Prendre r² pour le rayon.
      explication: 'Le membre de droite vaut $r^2$ : avec $9$, le rayon est $3$.'
    resume: |
      - Le cercle de centre $\Omega(a ; b)$ et de rayon $r$ a pour équation $(x - a)^2 + (y - b)^2 = r^2$.
      - $M$ est sur le cercle $\iff \Omega M^2 = r^2$.
      - Pour reconnaître un cercle dans $x^2 + y^2 + \alpha x + \beta y + \gamma = 0$ : **compléter les carrés**.
      - On obtient $(x - a)^2 + (y - b)^2 = k$ : cercle si $k > 0$ (rayon $\sqrt k$), point si $k = 0$, ensemble vide si $k < 0$.
    cours: |
      ## 1. Équation d'un cercle

      Dans un repère orthonormé, soit $\mathcal{C}$ le cercle de centre $\Omega(a ; b)$ et de rayon $r > 0$.

      > **Propriété.** $M(x ; y) \in \mathcal{C} \iff (x - a)^2 + (y - b)^2 = r^2$.

      **Démonstration.** $M \in \mathcal{C} \iff \Omega M = r \iff \Omega M^2 = r^2$ (des distances sont positives), et $\Omega M^2 = (x - a)^2 + (y - b)^2$.

      *Exemple.* Le cercle de centre $\Omega(2 ; -3)$ et de rayon $4$ a pour équation $(x - 2)^2 + (y + 3)^2 = 16$.

      ## 2. Utiliser l'équation

      - **Appartenance** : $M(6 ; -3)$ est sur ce cercle car $(6 - 2)^2 + 0^2 = 16$.
      - **Intérieur / extérieur** : $M$ est intérieur au disque si $\Omega M^2 < r^2$, extérieur si $\Omega M^2 > r^2$.
      - **Intersection avec une droite parallèle à un axe** : avec $x = 2$, $(y + 3)^2 = 16$, donc $y = 1$ ou $y = -7$.
      - **Cercle défini autrement** : par son centre et un point (le rayon est la distance entre eux), ou par un diamètre $[AB]$ (centre au milieu, rayon $\dfrac{AB}{2}$).

      ## 3. Reconnaître une équation de cercle

      > **Méthode.** Pour une équation $x^2 + y^2 + \alpha x + \beta y + \gamma = 0$ :
      > 1. Regrouper les termes en $x$ et en $y$.
      > 2. Compléter les carrés : $x^2 + \alpha x = \left(x + \dfrac{\alpha}{2}\right)^2 - \dfrac{\alpha^2}{4}$.
      > 3. Obtenir $(x - a)^2 + (y - b)^2 = k$ et conclure selon le signe de $k$.

      *Exemple complet.* $x^2 + y^2 - 6x + 4y - 3 = 0$.
      $x^2 - 6x = (x - 3)^2 - 9$ et $y^2 + 4y = (y + 2)^2 - 4$.
      L'équation devient $(x - 3)^2 - 9 + (y + 2)^2 - 4 - 3 = 0$, soit $(x - 3)^2 + (y + 2)^2 = 16$.
      C'est le cercle de centre $\Omega(3 ; -2)$ et de rayon $4$.

      *Contre-exemple.* $x^2 + y^2 + 2x + 5 = 0$ donne $(x + 1)^2 + y^2 = -4$ : aucun point ne vérifie l'équation.

      Remarque : une équation de cercle a des coefficients de $x^2$ et $y^2$ **égaux** et pas de terme en $xy$.

      ## 4. Erreurs fréquentes

      - Lire le centre avec le mauvais signe : $(x + 3)^2$ correspond à $a = -3$.
      - Donner $r^2$ au lieu de $r$ : dans $(x - 1)^2 + y^2 = 9$, le rayon est $3$.
      - Oublier de retrancher $\dfrac{\alpha^2}{4}$ en complétant le carré.
    questions:
      - code: 1RE-CERCLE-01
        difficulte: 1
        type: numerique
        enonce: 'Quel est le rayon du cercle d''équation $(x - 2)^2 + (y + 1)^2 = 9$ ?'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $r^2 = 9$, donc $r = 3$.
          resultat: 3
      - code: 1RE-CERCLE-02
        difficulte: 2
        type: qcm
        enonce: 'Quel est le centre du cercle d''équation $(x - 2)^2 + (y + 1)^2 = 9$ ? A) $(2 ; -1)$  B) $(-2 ; 1)$  C) $(2 ; 1)$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$(x - 2)^2 + (y - (-1))^2$ : centre $(2 ; -1)$.'
          resultat: A
      - code: 1RE-CERCLE-03
        difficulte: 3
        type: qcm
        enonce: 'Le point $M(1 ; 2)$ appartient-il au cercle de centre $O$ et de rayon $\sqrt 5$ ? A) oui  B) non'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$M$ appartient au cercle de centre $O$ et de rayon $r$ si et seulement si $OM^2 = r^2$.'
          - '$OM^2 = 1^2 + 2^2 = 5$ et $r^2 = (\sqrt 5)^2 = 5$.'
          - '$OM^2 = r^2$ : $M$ est sur le cercle (réponse A).'
          resultat: A
      - code: 1RE-CERCLE-04
        difficulte: 4
        type: numerique
        enonce: 'L''équation $x^2 + y^2 - 4x + 6y - 3 = 0$ est celle d''un cercle. Donner son rayon.'
        solution: 4
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $(x - 2)^2 - 4 + (y + 3)^2 - 9 - 3 = 0$.
          - '$(x - 2)^2 + (y + 3)^2 = 16$ : rayon $4$.'
          resultat: 4
      - code: 1RE-CERCLE-05
        difficulte: 5
        type: numerique
        enonce: 'Le cercle de diamètre $[AB]$, avec $A(1 ; 2)$ et $B(5 ; 6)$, a pour équation $(x - 3)^2 + (y - 4)^2 = k$. Donner $k$.'
        solution: 8
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Centre : milieu de $[AB]$, $(3 ; 4)$.'
          - $AB^2 = 16 + 16 = 32$, donc $r^2 = \dfrac{32}{4} = 8$.
          resultat: 8
      - code: 1RE-CERCLE-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {a: {entre: [-5, 5]}, b: {entre: [-5, 5]}, r: {entre: [1, 7]}}
          calculs: {c: "a*a + b*b - r*r"}
        enonce: 'Le cercle $\mathcal{C}$ a pour équation $x^2 + y^2 [[-2*a:+]]x [[-2*b:+]]y [[c:+]] = 0$. Quel est son rayon ?'
        solution: '[[r]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Compléter les carrés pour retrouver $(x - a)^2 + (y - b)^2 = r^2$.'
          etapes:
          - '$x^2 [[-2*a:+]]x = (x [[-a:+]])^2 - [[a*a]]$ et $y^2 [[-2*b:+]]y = (y [[-b:+]])^2 - [[b*b]]$.'
          - '$(x [[-a:+]])^2 + (y [[-b:+]])^2 = [[a*a + b*b - c]]$.'
          - 'Rayon : $\sqrt{[[r*r]]} = [[r]]$.'
          resultat: '[[r]]'

  - code: 1RE-PROJ
    libelle: Déterminer un projeté orthogonal et étudier une configuration en repère
    attendus: [1RE-SPE-2026-GEOREP-02, 1RE-SPE-2026-GEOREP-05, 1RE-SPE-2026-GEOREP-08]
    cours_couvre: [1RE-SPE-2026-GEOREP-02, 1RE-SPE-2026-GEOREP-05, 1RE-SPE-2026-GEOREP-08]
    objectifs:
    - Calculer les coordonnées du projeté orthogonal d'un point sur une droite.
    - Choisir un repère adapté pour démontrer une propriété géométrique.
    prerequis:
    - 1RE-NORMAL
    methodes:
    - titre: Coordonnées du projeté orthogonal de $A$ sur $d$
      quand: On connaît une équation cartésienne $ax + by + c = 0$ de $d$.
      etapes:
      - Le vecteur $\vec{n}(a ; b)$ est normal à $d$ $:$ la perpendiculaire à $d$ passant par $A$ a pour vecteur directeur $\vec{n}$.
      - Écrire $H = A + t\,\vec{n}$, soit $H(x_A + ta ; y_A + tb)$.
      - Trouver $t$ en écrivant que $H$ est sur $d$, puis en déduire $H$.
      exemple:
        enonce: Projeté de $A(4 ; 1)$ sur $d \colon x + y - 1 = 0$.
        resolution:
        - $H(4 + t ; 1 + t)$.
        - $4 + t + 1 + t - 1 = 0$, donc $t = -2$.
        resultat: $H(2 ; -1)$
    erreurs_frequentes:
    - erreur: Prendre un point quelconque de $d$ comme projeté.
      explication: Le projeté $H$ est le seul point de $d$ tel que $(AH)$ soit perpendiculaire à $d$.
    resume: |
      - Le **projeté orthogonal** $H$ d'un point $A$ sur une droite $d$ est le point de $d$ tel que $(AH) \perp d$.
      - $AH$ est la **distance** de $A$ à $d$ : c'est la plus petite distance entre $A$ et un point de $d$.
      - Calcul : $H$ est sur $d$ et sur la droite passant par $A$ de vecteur directeur $\vec n$ (normal à $d$) ; on résout le système.
      - Pour une configuration, on choisit un **repère** adapté et on traduit les propriétés en calculs.
    cours: |
      ## 1. Projeté orthogonal d'un point sur une droite

      > **Définition.** Soit $d$ une droite et $A$ un point. Le **projeté orthogonal** de $A$ sur $d$ est le point d'intersection $H$ de $d$ avec la perpendiculaire à $d$ passant par $A$.

      Si $A \in d$, alors $H = A$.

      > **Propriété.** $AH$ est la plus courte distance entre $A$ et un point de $d$ : pour tout $M \in d$, $AM \geqslant AH$. On l'appelle **distance de $A$ à la droite $d$**.

      *Démonstration.* Si $M \in d$, le triangle $AHM$ est rectangle en $H$, donc $AM^2 = AH^2 + HM^2 \geqslant AH^2$.

      ## 2. Méthode : coordonnées du projeté orthogonal

      Soit $d : ax + by + c = 0$, de vecteur normal $\vec n(a ; b)$, et $A(x_A ; y_A)$.
      1. $H$ est sur la droite passant par $A$ dirigée par $\vec n$ : il existe un réel $t$ tel que $H(x_A + ta ; y_A + tb)$.
      2. On écrit que $H \in d$ : on obtient une équation du premier degré en $t$.
      3. On en déduit $t$, puis les coordonnées de $H$, puis éventuellement la distance $AH$.

      *Variante.* Écrire l'équation de la perpendiculaire $\Delta$ à $d$ passant par $A$ (de vecteur normal un vecteur directeur de $d$) et résoudre le système formé par les équations de $d$ et $\Delta$.

      ## 3. Exemple complet

      $d : 2x - y + 1 = 0$ et $A(4 ; 0)$. Vecteur normal $\vec n(2 ; -1)$, donc $H(4 + 2t ; -t)$.
      $H \in d$ : $2(4 + 2t) - (-t) + 1 = 0$, soit $5t + 9 = 0$, $t = -\dfrac{9}{5}$.
      $H\left(4 - \dfrac{18}{5} ; \dfrac{9}{5}\right) = \left(\dfrac{2}{5} ; \dfrac{9}{5}\right)$.
      Distance : $AH = |t| \times \|\vec n\| = \dfrac{9}{5}\sqrt5 = \dfrac{9\sqrt5}{5} \approx 4{,}02$.
      Contrôle : $2 \times \dfrac{2}{5} - \dfrac{9}{5} + 1 = 0$ ✓.

      ## 4. Utiliser un repère pour étudier une configuration

      > **Méthode.**
      > 1. Choisir un repère orthonormé adapté (origine en un sommet, axes le long de côtés perpendiculaires).
      > 2. Donner les coordonnées de tous les points utiles.
      > 3. Traduire la question : alignement (colinéarité), orthogonalité (produit scalaire nul), longueur, appartenance à un cercle…
      > 4. Conclure **dans le langage de la géométrie**.

      *Exemple.* Dans un carré $ABCD$ de côté $1$, $I$ milieu de $[BC]$ et $J$ milieu de $[CD]$. Les droites $(AI)$ et $(BJ)$ sont-elles perpendiculaires ?
      Repère $(A ; B, D)$ : $A(0 ; 0)$, $B(1 ; 0)$, $I\left(1 ; \dfrac{1}{2}\right)$, $J\left(\dfrac{1}{2} ; 1\right)$.
      $\overrightarrow{AI}\left(1 ; \dfrac{1}{2}\right)$, $\overrightarrow{BJ}\left(-\dfrac{1}{2} ; 1\right)$, $\overrightarrow{AI} \cdot \overrightarrow{BJ} = -\dfrac{1}{2} + \dfrac{1}{2} = 0$ : oui.

      ## 5. Erreurs fréquentes

      - Utiliser un vecteur **directeur** de $d$ au lieu d'un vecteur normal pour aller de $A$ vers $H$.
      - Oublier de vérifier que $H$ appartient bien à $d$.
      - Choisir un repère non orthonormé puis utiliser le produit scalaire en coordonnées.
    questions:
      - code: 1RE-PROJ-01
        difficulte: 1
        type: numerique
        enonce: 'Quelle est l''abscisse du projeté orthogonal du point $A(3 ; 5)$ sur l''axe des abscisses ?'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Le projeté est $(3 ; 0)$.
          resultat: 3
      - code: 1RE-PROJ-02
        difficulte: 2
        type: numerique
        enonce: 'Quelle est l''ordonnée du projeté orthogonal du point $A(2 ; 7)$ sur la droite d''équation $y = 3$ ?'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - La droite est horizontale $:$ le projeté est $(2 ; 3)$.
          resultat: 3
      - code: 1RE-PROJ-03
        difficulte: 3
        type: numerique
        enonce: 'Soit $d$ la droite d''équation $x + y - 1 = 0$ et $A(4 ; 1)$. Le projeté orthogonal $H$ de $A$ sur $d$ s''écrit $H(4 + t ; 1 + t)$. Calculer $t$.'
        solution: -2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$d : x + y - 1 = 0$ a pour vecteur normal $\vec n(1 ; 1)$ ; $H$ est sur la droite passant par $A$ dirigée par $\vec n$, d''où $H(4 + t ; 1 + t)$.'
          - 'On écrit que $H$ appartient à $d$ : $(4 + t) + (1 + t) - 1 = 0$.'
          - '$2t + 4 = 0$, donc $t = -2$ (et $H(2 ; -1)$).'
          resultat: -2
      - code: 1RE-PROJ-04
        difficulte: 4
        type: numerique
        enonce: 'Avec $A(4 ; 1)$ et $d \colon x + y - 1 = 0$, le projeté orthogonal de $A$ sur $d$ est $H(2 ; -1)$. Calculer la distance $AH$ (forme exacte).'
        solution: 2sqrt(2)
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\overrightarrow{AH}(-2 ; -2)$.
          - $AH = \sqrt{4 + 4} = 2\sqrt{2}$.
