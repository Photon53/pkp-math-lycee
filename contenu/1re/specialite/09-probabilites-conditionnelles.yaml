      On peut aussi représenter la situation par un **tableau à double entrée** : la première épreuve en lignes, la seconde en colonnes, et dans chaque case le **produit** des probabilités.

      | Tirage 1 / tirage 2 | $R_2$ ($0{,}4$) | $B_2$ ($0{,}6$) |
      |---|---|---|
      | $R_1$ ($0{,}4$) | $0{,}16$ | $0{,}24$ |
      | $B_1$ ($0{,}6$) | $0{,}24$ | $0{,}36$ |

      Probabilité de tirer deux boules de la même couleur : $0{,}16 + 0{,}36 = 0{,}52$.

      **Tirages sans remise.** Les épreuves ne sont plus indépendantes : les probabilités du second niveau changent selon le premier tirage. Avec la même urne : $P(R_1 \cap R_2) = \dfrac{2}{5} \times \dfrac{1}{4} = \dfrac{1}{10}$ (il ne reste qu'une rouge sur $4$ boules).

      ## 6. Erreurs fréquentes
      - Écrire $P(B)$ ou $P(A \cap B)$ sur une branche du second niveau au lieu de $P_A(B)$.
      - Oublier un chemin dans la formule des probabilités totales.
      - Dans un tableau, diviser par le total général au lieu du total de la ligne pour obtenir une probabilité conditionnelle.
      - Diviser par $P(A)$ au lieu de $P(B)$ pour calculer $P_B(A)$.
    questions:
      - code: 1RE-TOTALES-01
        difficulte: 1
        type: numerique
        enonce: 'On sait que $P(A) = 0{,}3$, $P_A(B) = 0{,}2$ et $P_{\bar A}(B) = 0{,}5$. Calculer $P(B)$.'
        solution: 41/100
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Formule des probabilités totales avec la partition $A$, $\bar A$.
          etapes:
            - >-
              $P(\bar A) = 1 - 0{,}3 = 0{,}7$.
            - >-
              $P(B) = P(A)P_A(B) + P(\bar A)P_{\bar A}(B) = 0{,}3 \times 0{,}2 + 0{,}7 \times 0{,}5$.
            - >-
              $P(B) = 0{,}06 + 0{,}35 = 0{,}41$.
          resultat: 41/100
      - code: 1RE-TOTALES-02
        difficulte: 2
        type: numerique
        enonce: 'Une urne contient 3 boules rouges et 2 bleues. On tire successivement deux boules sans remise. Quelle est la probabilité d''obtenir deux boules rouges ?'
        solution: 3/10
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Arbre des deux tirages sans remise : on multiplie le long du chemin « rouge puis rouge ».
          etapes:
            - >-
              Premier tirage : $P(R_1) = \dfrac{3}{5}$.
            - >-
              Il reste $2$ rouges sur $4$ boules : $P_{R_1}(R_2) = \dfrac{2}{4}$.
            - >-
              $P(R_1 \cap R_2) = \dfrac{3}{5} \times \dfrac{2}{4} = \dfrac{6}{20} = \dfrac{3}{10}$.
          resultat: 3/10
          erreurs_frequentes:
            - >-
              Calculer $\dfrac{3}{5} \times \dfrac{3}{5}$ comme avec remise.
      - code: 1RE-TOTALES-03
        difficulte: 3
        type: numerique
        enonce: 'Même urne (3 rouges, 2 bleues), deux tirages sans remise. Quelle est la probabilité que la deuxième boule soit rouge ?'
        solution: 3/5
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Probabilités totales : deux chemins mènent à « deuxième boule rouge ».
          etapes:
            - >-
              Rouge puis rouge : $\dfrac{3}{5} \times \dfrac{2}{4} = \dfrac{6}{20}$.
            - >-
              Bleue puis rouge : $\dfrac{2}{5} \times \dfrac{3}{4} = \dfrac{6}{20}$.
            - >-
              $P(R_2) = \dfrac{6}{20} + \dfrac{6}{20} = \dfrac{12}{20} = \dfrac{3}{5}$.
          resultat: 3/5
          erreurs_frequentes:
            - >-
              Ne compter que le chemin « rouge puis rouge » ($\dfrac{3}{10}$).
      - code: 1RE-TOTALES-04
        difficulte: 4
        type: numerique
        enonce: 'Une maladie touche 2 % d''une population. Un test est positif chez 95 % des malades et chez 10 % des personnes saines. Calculer la probabilité qu''un test soit positif.'
        solution: 117/1000
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Arbre (malade ou sain, puis test positif ou non) et formule des probabilités totales.
          etapes:
            - >-
              $P(M) = 0{,}02$, $P(\bar M) = 0{,}98$, $P_M(T) = 0{,}95$, $P_{\bar M}(T) = 0{,}1$.
            - >-
              Chemin malade et positif : $0{,}02 \times 0{,}95 = 0{,}019$.
            - >-
              Chemin sain et positif : $0{,}98 \times 0{,}1 = 0{,}098$.
            - >-
              $P(T) = 0{,}019 + 0{,}098 = 0{,}117$.
          resultat: 117/1000
      - code: 1RE-TOTALES-05
        difficulte: 5
        type: numerique
        enonce: 'Avec les mêmes données (malades 2 %, positif chez 95 % des malades et 10 % des sains), quelle est la probabilité qu''une personne testée positive soit malade ? (Valeur exacte en fraction.)'
        solution: 19/117
        auteur: Brouillon IA (Claude)
        competences_secondaires: [1RE-COND]
        correction:
          methode: >-
            Inverser le conditionnement : $P_T(M) = \dfrac{P(M \cap T)}{P(T)}$.
          etapes:
            - >-
              $P(M \cap T) = 0{,}02 \times 0{,}95 = 0{,}019$ (chemin malade puis positif).
            - >-
              $P(T) = 0{,}117$ (question précédente, probabilités totales).
            - >-
              $P_T(M) = \dfrac{0{,}019}{0{,}117} = \dfrac{19}{117} \approx 0{,}16$.
            - >-
              Interprétation : seulement $16\,\%$ des personnes testées positives sont malades, car la maladie est rare.
          resultat: 19/117
          erreurs_frequentes:
            - >-
              Répondre $0{,}95$ : c'est $P_M(T)$, la probabilité d'être positif sachant qu'on est malade, pas l'inverse.
