      <text x="376" y="263">S̄</text>
      <text x="424" y="25" font-style="italic">S S S : 0,7 × 0,7 × 0,7 = 0,343</text>
      <text x="424" y="59" font-style="italic">S S S̄ : 0,7 × 0,7 × 0,3 = 0,147</text>
      <text x="424" y="93" font-style="italic">S S̄ S : 0,7 × 0,3 × 0,7 = 0,147</text>
      <text x="424" y="127" font-style="italic">S S̄ S̄ : 0,7 × 0,3 × 0,3 = 0,063</text>
      <text x="424" y="161" font-style="italic">S̄ S S : 0,3 × 0,7 × 0,7 = 0,147</text>
      <text x="424" y="195" font-style="italic">S̄ S S̄ : 0,3 × 0,7 × 0,3 = 0,063</text>
      <text x="424" y="229" font-style="italic">S̄ S̄ S : 0,3 × 0,3 × 0,7 = 0,063</text>
      <text x="424" y="263" font-style="italic">S̄ S̄ S̄ : 0,3 × 0,3 × 0,3 = 0,027</text>
      </svg>

      On lit directement sur l'arbre que les trois chemins à deux succès ($SS\bar S$, $S\bar SS$, $\bar SSS$) ont la même probabilité $0{,}147$.

      ## 3. Méthode : calculer une probabilité

      1. Identifier l'épreuve, le succès, $p$ et le nombre $n$ de répétitions ; justifier l'indépendance.
      2. Dessiner l'arbre (au plus $16$ chemins pour $n = 4$).
      3. Repérer les chemins qui réalisent l'évènement et les compter.
      4. Additionner leurs probabilités (tous les chemins à $k$ succès ont la même probabilité).
      5. Penser à l'évènement contraire pour « au moins un ».

      ## 4. Exemple complet

      Un tireur atteint sa cible avec la probabilité $0{,}7$. Il tire $3$ fois, de façon indépendante.
      - *Trois succès :* $P(SSS) = 0{,}7^3 = 0{,}343$.
      - *Exactement deux succès :* trois chemins $SS\bar S$, $S\bar SS$, $\bar SSS$, chacun de probabilité $0{,}7^2 \times 0{,}3 = 0{,}147$. Total : $3 \times 0{,}147 = 0{,}441$.
      - *Au moins un succès :* contraire de « trois échecs » : $1 - 0{,}3^3 = 1 - 0{,}027 = 0{,}973$.
      Contrôle : $P(0) + P(1) + P(2) + P(3) = 0{,}027 + 0{,}189 + 0{,}441 + 0{,}343 = 1$.

      ## 5. Nombre de chemins

      Pour $n = 4$, le nombre de chemins avec $k$ succès est : $1$ ($k = 0$), $4$ ($k = 1$), $6$ ($k = 2$), $4$ ($k = 3$), $1$ ($k = 4$) ; au total $16 = 2^4$. On les retrouve en dénombrant les places possibles des succès.

      ## 6. Erreurs fréquentes

      - Oublier de multiplier par le nombre de chemins (« exactement deux succès » n'est pas un seul chemin).
      - Appliquer ce modèle à des tirages **sans remise** : les épreuves ne sont alors ni identiques ni indépendantes.
      - Calculer « au moins un » en additionnant beaucoup de chemins au lieu d'utiliser l'évènement contraire.
