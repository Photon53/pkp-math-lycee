chapitre:
  code: 1RE-PROBA-COND
  niveau: 1re
  parcours: specialite
  ordre: 9
  titre: Probabilités conditionnelles et indépendance

# Corrections, méthodes et erreurs fréquentes : brouillon IA, à relire par un professeur avant validation.
competences:
  - code: 1RE-COND
    libelle: Calculer une probabilité conditionnelle
    attendus: [1RE-SPE-2026-AUTO-16, 1RE-SPE-2026-AUTO-17, 1RE-SPE-2026-PCOND-01, 1RE-SPE-2026-PCOND-06]
    cours_couvre: [1RE-SPE-2026-PCOND-01, 1RE-SPE-2026-PCOND-06, 1RE-SPE-2026-AUTO-16, 1RE-SPE-2026-AUTO-17]
    objectifs:
      - >-
        Identifier l'univers de référence : sur qui, ou sur quoi, porte la probabilité demandée.
      - >-
        Calculer $P_A(B)$ et $P(A \cap B)$ à partir d'un énoncé, d'un tableau ou d'un arbre.
      - >-
        Reconnaitre et utiliser l'indépendance de deux évènements.
    resume: |
      - Si $P(A) \neq 0$ : $P_A(B) = \dfrac{P(A \cap B)}{P(A)}$, donc $P(A \cap B) = P(A) \times P_A(B)$.
      - **Arbre pondéré** : premier niveau $P(A)$, $P(\bar A)$ ; second niveau les probabilités **conditionnelles** ; les branches d'un même nœud ont une somme égale à $1$.
      - Sur un arbre, on **multiplie** les probabilités le long d'un chemin.
      - $A$ et $B$ sont **indépendants** si $P(A \cap B) = P(A) \times P(B)$, c'est-à-dire si $P_A(B) = P(B)$.
    cours: |
      ## 1. Probabilité conditionnelle

      **Définition.** Soit $A$ un évènement de probabilité non nulle. La probabilité de $B$ **sachant** $A$ est
      $$P_A(B) = \frac{P(A \cap B)}{P(A)}.$$
      C'est la probabilité de $B$ quand on sait que $A$ est réalisé : on se restreint aux issues de $A$.

      *Avec un tableau croisé.* Dans un lycée de $200$ élèves dont $120$ filles, $30$ filles sont gauchères. On choisit un élève au hasard. Sachant que c'est une fille, la probabilité qu'il soit gaucher est $\dfrac{30}{120} = \dfrac{1}{4}$ : on se restreint à la ligne « filles ».

      Ne pas confondre $P(A \cap B)$ (les deux à la fois, sur toute la population), $P_A(B)$ (parmi les $A$) et $P_B(A)$ (parmi les $B$).

      ## 2. Construire un arbre pondéré

      Un arbre pondéré représente une expérience en deux étapes. **Méthode :**
      1. **Premier niveau** : on part d'un point (la racine) et on trace une branche par issue de la première étape, par exemple $A$ et $\bar A$ ; on écrit sur chaque branche sa probabilité $P(A)$ et $P(\bar A) = 1 - P(A)$.
      2. **Second niveau** : au bout de chaque branche, on trace les branches de la seconde étape ($B$ et $\bar B$). Leurs pondérations sont des probabilités **conditionnelles** : depuis $A$, on écrit $P_A(B)$ et $P_A(\bar B)$ ; depuis $\bar A$, on écrit $P_{\bar A}(B)$ et $P_{\bar A}(\bar B)$.
      3. **Contrôle** : les branches issues d'un même nœud ont une somme égale à $1$.
      4. **Chemins** : chaque chemin de la racine à une extrémité correspond à une intersection, par exemple $A \cap B$.

      *Exemple.* $40\,\%$ des élèves font du sport ($S$) ; parmi eux, $30\,\%$ sont gauchers ($G$) ; parmi les autres, $10\,\%$ sont gauchers.
      - Premier niveau : $P(S) = 0{,}4$ et $P(\bar S) = 0{,}6$.
      - Depuis $S$ : $P_S(G) = 0{,}3$ et $P_S(\bar G) = 0{,}7$. Depuis $\bar S$ : $P_{\bar S}(G) = 0{,}1$ et $P_{\bar S}(\bar G) = 0{,}9$.

      ## 3. Règles de calcul sur un arbre

      > **Propriété (chemin).** La probabilité d'un chemin est le **produit** des probabilités de ses branches : $P(A \cap B) = P(A) \times P_A(B)$.

      Dans l'exemple : $P(S \cap G) = 0{,}4 \times 0{,}3 = 0{,}12$ et $P(\bar S \cap G) = 0{,}6 \times 0{,}1 = 0{,}06$.

      > **Propriété (évènement).** La probabilité d'un évènement est la **somme** des probabilités des chemins qui y mènent (formule des probabilités totales, voir la compétence suivante) : $P(G) = 0{,}12 + 0{,}06 = 0{,}18$.

      ## 4. Indépendance

      **Définition.** $A$ et $B$ sont **indépendants** si $P(A \cap B) = P(A) \times P(B)$. Lorsque $P(A) \neq 0$, cela équivaut à $P_A(B) = P(B)$ : savoir que $A$ est réalisé ne change pas la probabilité de $B$.

      *Exemple.* $P(A) = 0{,}5$, $P(B) = 0{,}4$ et $P(A \cap B) = 0{,}2 = 0{,}5 \times 0{,}4$ : $A$ et $B$ sont indépendants. Alors $P(A \cup B) = 0{,}5 + 0{,}4 - 0{,}2 = 0{,}7$.

      *Contre-exemple.* Dans l'arbre ci-dessus, $P_S(G) = 0{,}3$ mais $P(G) = 0{,}18$ : être sportif et être gaucher ne sont pas indépendants.

      ## 5. Erreurs fréquentes
      - Confondre $P_A(B)$ et $P_B(A)$ : ce ne sont pas les mêmes « univers de référence ».
      - Écrire sur une branche du second niveau $P(B)$ au lieu de $P_A(B)$.
      - Additionner les probabilités le long d'un chemin au lieu de les multiplier.
    methodes:
      - titre: Calculer une probabilité conditionnelle à partir d'effectifs
        quand: >-
          L'énoncé donne des effectifs (un tableau, des nombres d'élèves…) et la question porte
          sur une partie de la population (« parmi les filles », « on choisit une fille »).
        etapes:
          - >-
            Repérer le groupe dans lequel on choisit : c'est le nouvel univers (le dénominateur).
          - >-
            Compter, dans ce groupe seulement, ceux qui ont la propriété demandée (le numérateur).
          - >-
            Diviser, puis simplifier la fraction.
        exemple:
          enonce: >-
            Sur $50$ joueurs d'un club, $20$ sont des filles, dont $8$ portent des lunettes.
            On choisit une fille au hasard : probabilité qu'elle porte des lunettes ?
          resolution:
            - >-
              On choisit parmi les filles : le dénominateur est $20$, pas $50$.
            - >-
              Parmi elles, $8$ portent des lunettes.
            - >-
              $P = \dfrac{8}{20} = \dfrac{2}{5}$.
          resultat: >-
            $\dfrac{2}{5}$
    erreurs_frequentes:
      - erreur: >-
          Diviser par l'effectif total au lieu de l'effectif du groupe choisi.
        explication: >-
          « On choisit une fille » : seules les filles comptent au dénominateur. Diviser par le total calcule
          $P(A \cap B)$, pas $P_A(B)$.
      - erreur: >-
          Confondre $P_A(B)$ et $P_B(A)$.
        explication: >-
          La probabilité d'être gaucher sachant qu'on est une fille n'est pas celle d'être une fille sachant qu'on est gaucher.
    questions:
      - code: 1RE-COND-01
        difficulte: 1
        type: numerique
        enonce: 'On sait que $P(A) = 0{,}4$ et $P(A \cap B) = 0{,}12$. Calculer $P_A(B)$.'
        solution: 3/10
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Définition : $P_A(B) = \dfrac{P(A \cap B)}{P(A)}$.
          etapes:
            - >-
              $P_A(B) = \dfrac{0{,}12}{0{,}4}$.
            - >-
              $\dfrac{0{,}12}{0{,}4} = \dfrac{12}{40} = \dfrac{3}{10}$.
          resultat: 3/10
      - code: 1RE-COND-02
        difficulte: 2
        type: numerique
        enonce: 'On sait que $P(A) = 0{,}6$ et $P_A(B) = 0{,}5$. Calculer $P(A \cap B)$.'
        solution: 3/10
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Formule des probabilités composées : $P(A \cap B) = P(A) \times P_A(B)$ (on multiplie le long d'un chemin de l'arbre).
          etapes:
            - >-
              $P(A \cap B) = 0{,}6 \times 0{,}5 = 0{,}3$.
          resultat: 3/10
      - code: 1RE-COND-03
        difficulte: 3
        type: numerique
        enonce: 'Un lycée compte 200 élèves dont 120 filles ; 30 filles sont gauchères. On choisit une fille au hasard. Quelle est la probabilité qu''elle soit gauchère ?'
        solution: 1/4
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Probabilité conditionnelle à partir d'effectifs : on se restreint au groupe dans lequel on choisit (cours, partie « Tableau croisé »).
          etapes:
            - >-
              On choisit **une fille** : l'univers de référence est l'ensemble des $120$ filles, pas les $200$ élèves.
            - >-
              Parmi ces $120$ filles, $30$ sont gauchères.
            - >-
              $P_F(G) = \dfrac{30}{120} = \dfrac{1}{4}$.
            - >-
              Avec la formule : $P_F(G) = \dfrac{P(F \cap G)}{P(F)} = \dfrac{30/200}{120/200} = \dfrac{30}{120}$, même résultat.
          resultat: 1/4
          erreurs_frequentes:
            - >-
              Calculer $\dfrac{30}{200} = \dfrac{3}{20}$ : c'est la probabilité qu'un élève choisi parmi tous soit une fille gauchère, $P(F \cap G)$.
            - >-
              Calculer $\dfrac{120}{200}$ : c'est la probabilité d'être une fille, pas d'être gauchère.
      - code: 1RE-COND-04
        difficulte: 4
        type: qcm
        enonce: 'Deux événements sont indépendants lorsque : A) la probabilité de leur intersection est le produit de leurs probabilités  B) la probabilité de leur réunion est la somme de leurs probabilités  C) ils ne peuvent pas se produire en même temps'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Définition de l'indépendance (cours, partie « Indépendance »).
          etapes:
            - >-
              Par définition, $A$ et $B$ sont indépendants si $P(A \cap B) = P(A) \times P(B)$ : c'est la réponse A.
            - >-
              B et C décrivent des évènements **incompatibles** ($A \cap B = \varnothing$), ce qui est différent :
              deux évènements incompatibles de probabilités non nulles ne sont jamais indépendants.
          resultat: A
      - code: 1RE-COND-05
        difficulte: 5
        type: numerique
        enonce: '$A$ et $B$ sont indépendants avec $P(A) = 0{,}5$ et $P(B) = 0{,}4$. Calculer $P(A \cup B)$.'
        solution: 7/10
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Indépendance pour l'intersection, puis $P(A \cup B) = P(A) + P(B) - P(A \cap B)$.
          etapes:
            - >-
              $A$ et $B$ indépendants : $P(A \cap B) = 0{,}5 \times 0{,}4 = 0{,}2$.
            - >-
              $P(A \cup B) = 0{,}5 + 0{,}4 - 0{,}2 = 0{,}7$.
          resultat: 7/10
          erreurs_frequentes:
            - >-
              Additionner sans retrancher l'intersection ($0{,}9$) : les issues communes seraient comptées deux fois.

  - code: 1RE-TOTALES
    libelle: Utiliser un arbre et la formule des probabilités totales
    attendus: [1RE-SPE-2026-PCOND-02, 1RE-SPE-2026-PCOND-03, 1RE-SPE-2026-PCOND-05, 1RE-SPE-2026-PCOND-07]
    cours_couvre: [1RE-SPE-2026-PCOND-02, 1RE-SPE-2026-PCOND-03, 1RE-SPE-2026-PCOND-05, 1RE-SPE-2026-PCOND-07]
    objectifs:
      - >-
        Construire un arbre pondéré à partir d'un énoncé.
      - >-
        Calculer une probabilité totale, puis « inverser » un conditionnement.
    prerequis: [1RE-COND]
    resume: |
      - **Partition** : $A_1, \ldots, A_n$ incompatibles deux à deux et dont la réunion est l'univers ; par exemple $A$ et $\bar A$.
      - **Probabilités totales** : $P(B) = P(A)P_A(B) + P(\bar A)P_{\bar A}(B)$ : on **additionne** les chemins qui mènent à $B$.
      - Pour « inverser » un conditionnement : $P_B(A) = \dfrac{P(A \cap B)}{P(B)}$.
      - Deux épreuves **indépendantes** : les branches du second niveau ne dépendent pas du premier résultat.
    cours: |
      ## 1. Partition de l'univers

      **Définition.** Des évènements $A_1, A_2, \ldots, A_n$ forment une **partition** de l'univers $\Omega$ s'ils sont de probabilités non nulles, deux à deux incompatibles, et si leur réunion est $\Omega$. Le cas le plus courant : $A$ et $\bar A$.

      ## 2. Formule des probabilités totales

      > **Propriété.** Si $A_1, \ldots, A_n$ forment une partition de $\Omega$, alors pour tout évènement $B$ :
      > $$P(B) = P(A_1 \cap B) + \cdots + P(A_n \cap B) = P(A_1)P_{A_1}(B) + \cdots + P(A_n)P_{A_n}(B).$$
      > Avec la partition $(A, \bar A)$ : $P(B) = P(A)P_A(B) + P(\bar A)P_{\bar A}(B)$.

      Sur l'arbre, cela revient à **additionner les probabilités de tous les chemins** qui aboutissent à $B$.

      *Exemple.* $P(A) = 0{,}3$, $P_A(B) = 0{,}2$, $P_{\bar A}(B) = 0{,}5$ :
      $$P(B) = 0{,}3 \times 0{,}2 + 0{,}7 \times 0{,}5 = 0{,}06 + 0{,}35 = 0{,}41.$$

      ## 3. Inverser un conditionnement

      On connaît souvent $P_A(B)$ et on cherche $P_B(A)$. On calcule $P(A \cap B)$ avec l'arbre, $P(B)$ avec la formule des probabilités totales, puis
      $$P_B(A) = \frac{P(A \cap B)}{P(B)}.$$

      *Test de dépistage.* Une maladie touche $2\,\%$ d'une population. Le test est positif chez $95\,\%$ des malades et chez $10\,\%$ des personnes saines.
      - $P(T) = 0{,}02 \times 0{,}95 + 0{,}98 \times 0{,}1 = 0{,}019 + 0{,}098 = 0{,}117$.
      - $P_T(M) = \dfrac{0{,}019}{0{,}117} = \dfrac{19}{117} \approx 0{,}16$ : un test positif est loin d'être une certitude !

      ## 4. Succession de deux épreuves

      **Épreuves indépendantes.** Si le résultat de la première épreuve n'influence pas la seconde, les pondérations du second niveau sont les mêmes sur toutes les branches. *Exemple :* deux lancers d'une pièce, $P(PP) = \dfrac{1}{2} \times \dfrac{1}{2} = \dfrac{1}{4}$. On peut aussi représenter la situation par un **tableau à double entrée**.

      **Tirages sans remise.** Les probabilités changent d'un tirage à l'autre : urne de $3$ rouges et $2$ bleues, deux tirages sans remise : $P(RR) = \dfrac{3}{5} \times \dfrac{2}{4} = \dfrac{3}{10}$.

      ## 5. Erreurs fréquentes
      - Oublier un chemin dans la formule des probabilités totales.
      - Diviser par $P(A)$ au lieu de $P(B)$ pour calculer $P_B(A)$.
    methodes:
      - titre: Utiliser un arbre pondéré et la formule des probabilités totales
        quand: >-
          L'expérience se fait en deux étapes, ou la population se partage en deux groupes ($A$ et $\bar A$).
        etapes:
          - >-
            Dessiner l'arbre : premier niveau $A$ et $\bar A$, second niveau $B$ et $\bar B$ ; la somme des branches issues d'un même nœud vaut $1$.
          - >-
            Probabilité d'un chemin : multiplier les probabilités des branches.
          - >-
            $P(B)$ : additionner les chemins qui mènent à $B$.
          - >-
            Pour $P_B(A)$ : diviser la probabilité du chemin $A \to B$ par $P(B)$.
        exemple:
          enonce: >-
            $40\,\%$ des élèves prennent le bus. Parmi eux, $25\,\%$ arrivent en retard ; parmi les autres, $5\,\%$.
            Probabilité qu'un élève arrive en retard ?
          resolution:
            - >-
              Arbre : $P(B) = 0{,}4$, $P(\bar B) = 0{,}6$, $P_B(R) = 0{,}25$, $P_{\bar B}(R) = 0{,}05$.
            - >-
              Chemins vers $R$ : $0{,}4 \times 0{,}25 = 0{,}1$ et $0{,}6 \times 0{,}05 = 0{,}03$.
            - >-
              $P(R) = 0{,}1 + 0{,}03 = 0{,}13$.
          resultat: >-
            $0{,}13$
    erreurs_frequentes:
      - erreur: >-
          Oublier un chemin dans la formule des probabilités totales.
        explication: >-
          Tous les chemins qui aboutissent à $B$ comptent : celui qui passe par $A$ et celui qui passe par $\bar A$.
      - erreur: >-
          Garder les mêmes probabilités au second tirage sans remise.
        explication: >-
          Après un premier tirage sans remise, l'urne contient une boule de moins : les probabilités du second niveau changent.
    questions:
      - code: 1RE-TOTALES-01
        difficulte: 1
        type: numerique
        enonce: 'On sait que $P(A) = 0{,}3$, $P_A(B) = 0{,}2$ et $P_{\bar A}(B) = 0{,}5$. Calculer $P(B)$.'
        solution: 41/100
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Formule des probabilités totales avec la partition $A$, $\bar A$.
          etapes:
            - >-
              $P(\bar A) = 1 - 0{,}3 = 0{,}7$.
            - >-
              $P(B) = P(A)P_A(B) + P(\bar A)P_{\bar A}(B) = 0{,}3 \times 0{,}2 + 0{,}7 \times 0{,}5$.
            - >-
              $P(B) = 0{,}06 + 0{,}35 = 0{,}41$.
          resultat: 41/100
      - code: 1RE-TOTALES-02
        difficulte: 2
        type: numerique
        enonce: 'Une urne contient 3 boules rouges et 2 bleues. On tire successivement deux boules sans remise. Quelle est la probabilité d''obtenir deux boules rouges ?'
        solution: 3/10
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Arbre des deux tirages sans remise : on multiplie le long du chemin « rouge puis rouge ».
          etapes:
            - >-
              Premier tirage : $P(R_1) = \dfrac{3}{5}$.
            - >-
              Il reste $2$ rouges sur $4$ boules : $P_{R_1}(R_2) = \dfrac{2}{4}$.
            - >-
              $P(R_1 \cap R_2) = \dfrac{3}{5} \times \dfrac{2}{4} = \dfrac{6}{20} = \dfrac{3}{10}$.
          resultat: 3/10
          erreurs_frequentes:
            - >-
              Calculer $\dfrac{3}{5} \times \dfrac{3}{5}$ comme avec remise.
      - code: 1RE-TOTALES-03
        difficulte: 3
        type: numerique
        enonce: 'Même urne (3 rouges, 2 bleues), deux tirages sans remise. Quelle est la probabilité que la deuxième boule soit rouge ?'
        solution: 3/5
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Probabilités totales : deux chemins mènent à « deuxième boule rouge ».
          etapes:
            - >-
              Rouge puis rouge : $\dfrac{3}{5} \times \dfrac{2}{4} = \dfrac{6}{20}$.
            - >-
              Bleue puis rouge : $\dfrac{2}{5} \times \dfrac{3}{4} = \dfrac{6}{20}$.
            - >-
              $P(R_2) = \dfrac{6}{20} + \dfrac{6}{20} = \dfrac{12}{20} = \dfrac{3}{5}$.
          resultat: 3/5
          erreurs_frequentes:
            - >-
              Ne compter que le chemin « rouge puis rouge » ($\dfrac{3}{10}$).
      - code: 1RE-TOTALES-04
        difficulte: 4
        type: numerique
        enonce: 'Une maladie touche 2 % d''une population. Un test est positif chez 95 % des malades et chez 10 % des personnes saines. Calculer la probabilité qu''un test soit positif.'
        solution: 117/1000
        auteur: Brouillon IA (Claude)
        correction:
          methode: >-
            Arbre (malade ou sain, puis test positif ou non) et formule des probabilités totales.
          etapes:
            - >-
              $P(M) = 0{,}02$, $P(\bar M) = 0{,}98$, $P_M(T) = 0{,}95$, $P_{\bar M}(T) = 0{,}1$.
            - >-
              Chemin malade et positif : $0{,}02 \times 0{,}95 = 0{,}019$.
            - >-
              Chemin sain et positif : $0{,}98 \times 0{,}1 = 0{,}098$.
            - >-
              $P(T) = 0{,}019 + 0{,}098 = 0{,}117$.
          resultat: 117/1000
      - code: 1RE-TOTALES-05
        difficulte: 5
        type: numerique
        enonce: 'Avec les mêmes données (malades 2 %, positif chez 95 % des malades et 10 % des sains), quelle est la probabilité qu''une personne testée positive soit malade ? (Valeur exacte en fraction.)'
        solution: 19/117
        auteur: Brouillon IA (Claude)
        competences_secondaires: [1RE-COND]
        correction:
          methode: >-
            Inverser le conditionnement : $P_T(M) = \dfrac{P(M \cap T)}{P(T)}$.
          etapes:
            - >-
              $P(M \cap T) = 0{,}02 \times 0{,}95 = 0{,}019$ (chemin malade puis positif).
            - >-
              $P(T) = 0{,}117$ (question précédente, probabilités totales).
            - >-
              $P_T(M) = \dfrac{0{,}019}{0{,}117} = \dfrac{19}{117} \approx 0{,}16$.
            - >-
              Interprétation : seulement $16\,\%$ des personnes testées positives sont malades, car la maladie est rare.
          resultat: 19/117
          erreurs_frequentes:
            - >-
              Répondre $0{,}95$ : c'est $P_M(T)$, la probabilité d'être positif sachant qu'on est malade, pas l'inverse.
      - code: 1RE-TOTALES-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {a: {entre: [0.1, 0.9], pas: 0.1}, b: {entre: [0.05, 0.95], pas: 0.05}, c: {entre: [0.05, 0.95], pas: 0.05}}
          calculs: {p: "a*b + (1 - a)*c"}
        enonce: 'On sait que $P(A) = [[a]]$, $P_A(B) = [[b]]$ et $P_{\bar A}(B) = [[c]]$. Calculer $P(B)$.'
        solution: '[[p]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Formule des probabilités totales avec la partition $(A, \bar A)$.'
          etapes:
          - '$P(B) = P(A) P_A(B) + P(\bar A) P_{\bar A}(B)$.'
          - '$= [[a]] \times [[b]] + [[1 - a]] \times [[c]] = [[a*b]] + [[(1 - a)*c]] = [[p]]$.'
          resultat: '[[p]]'

  - code: 1RE-BERNOULLI
    libelle: Répéter des épreuves de Bernoulli indépendantes (n ⩽ 4)
    attendus: [1RE-SPE-2026-PCOND-04, 1RE-SPE-2026-PCOND-08]
    cours_couvre: [1RE-SPE-2026-PCOND-04, 1RE-SPE-2026-PCOND-08]
    objectifs:
    - Représenter par un arbre la répétition de $n \leqslant 4$ épreuves de Bernoulli identiques et indépendantes.
    - Calculer la probabilité d'un nombre donné de succès en comptant les chemins.
    prerequis:
    - 1RE-TOTALES
    methodes:
    - titre: Probabilité de $k$ succès en $n$ épreuves
      quand: On répète $n \leqslant 4$ fois la même épreuve à deux issues, de façon indépendante.
      etapes:
      - Construire l'arbre (ou l'imaginer) $:$ chaque chemin est une suite de $n$ succès ou échecs.
      - Un chemin à $k$ succès a la probabilité $p^k(1 - p)^{n - k}$.
      - Compter les chemins à $k$ succès et multiplier.
      exemple:
        enonce: Trois tirs indépendants réussis chacun avec la probabilité $0{,}6$. Probabilité de deux réussites exactement ?
        resolution:
        - Chemins $:$ SSE, SES, ESS, soit $3$ chemins.
        - Chacun a la probabilité $0{,}6^2 \times 0{,}4 = 0{,}144$.
        resultat: $3 \times 0{,}144 = 0{,}432$
    erreurs_frequentes:
    - erreur: Oublier de compter tous les ordres possibles des succès.
      explication: « Deux succès sur trois » correspond à trois chemins (SSE, SES, ESS), pas à un seul.
    resume: |
      - **Épreuve de Bernoulli** : deux issues, succès $S$ (probabilité $p$) et échec $\bar S$ (probabilité $1 - p$).
      - Répéter $n$ fois ($n \leqslant 4$) une même épreuve de Bernoulli de façon **indépendante** : arbre à $2^n$ chemins.
      - Probabilité d'un chemin : produit des probabilités ; un chemin à $k$ succès a pour probabilité $p^k(1 - p)^{n - k}$.
      - $P(\text{au moins un succès}) = 1 - (1 - p)^n$.
    cours: |
      ## 1. Épreuve de Bernoulli

      > **Définition.** Une **épreuve de Bernoulli** est une expérience aléatoire à deux issues : le **succès** $S$, de probabilité $p$, et l'**échec** $\bar S$, de probabilité $1 - p$. Le réel $p$ est le **paramètre** de l'épreuve.

      *Exemples.* Lancer un dé et noter si l'on obtient $6$ ($p = \dfrac{1}{6}$) ; tirer un article et regarder s'il est défectueux ($p = 0{,}03$).

      ## 2. Répétition d'épreuves indépendantes et identiques

      On répète $n$ fois **la même** épreuve de Bernoulli, les répétitions étant **indépendantes** (le résultat d'une épreuve n'influence pas les autres : tirages avec remise, lancers successifs…).

      > **Propriété.** On représente la situation par un arbre à $n$ niveaux. Sur chaque nœud, les branches portent $p$ (vers $S$) et $1 - p$ (vers $\bar S$).
      > - La probabilité d'une issue (un chemin) est le **produit** des probabilités rencontrées.
      > - Un chemin comportant $k$ succès et $n - k$ échecs a pour probabilité $p^k(1 - p)^{n - k}$.
      > - La probabilité d'un évènement est la **somme** des probabilités des chemins qui le réalisent.

      ## 3. Méthode : calculer une probabilité

      1. Identifier l'épreuve, le succès, $p$ et le nombre $n$ de répétitions ; justifier l'indépendance.
      2. Dessiner l'arbre (au plus $16$ chemins pour $n = 4$).
      3. Repérer les chemins qui réalisent l'évènement et les compter.
      4. Additionner leurs probabilités (tous les chemins à $k$ succès ont la même probabilité).
      5. Penser à l'évènement contraire pour « au moins un ».

      ## 4. Exemple complet

      Un tireur atteint sa cible avec la probabilité $0{,}7$. Il tire $3$ fois, de façon indépendante.
      - *Trois succès :* $P(SSS) = 0{,}7^3 = 0{,}343$.
      - *Exactement deux succès :* trois chemins $SS\bar S$, $S\bar SS$, $\bar SSS$, chacun de probabilité $0{,}7^2 \times 0{,}3 = 0{,}147$. Total : $3 \times 0{,}147 = 0{,}441$.
      - *Au moins un succès :* contraire de « trois échecs » : $1 - 0{,}3^3 = 1 - 0{,}027 = 0{,}973$.
      Contrôle : $P(0) + P(1) + P(2) + P(3) = 0{,}027 + 0{,}189 + 0{,}441 + 0{,}343 = 1$.

      ## 5. Nombre de chemins

      Pour $n = 4$, le nombre de chemins avec $k$ succès est : $1$ ($k = 0$), $4$ ($k = 1$), $6$ ($k = 2$), $4$ ($k = 3$), $1$ ($k = 4$) ; au total $16 = 2^4$. On les retrouve en dénombrant les places possibles des succès.

      ## 6. Erreurs fréquentes

      - Oublier de multiplier par le nombre de chemins (« exactement deux succès » n'est pas un seul chemin).
      - Appliquer ce modèle à des tirages **sans remise** : les épreuves ne sont alors ni identiques ni indépendantes.
      - Calculer « au moins un » en additionnant beaucoup de chemins au lieu d'utiliser l'évènement contraire.
    questions:
      - code: 1RE-BERNOULLI-01
        difficulte: 1
        type: numerique
        enonce: 'On lance trois fois une pièce équilibrée. Combien l''arbre de probabilités a-t-il de chemins ?'
        solution: 8
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Deux issues à chaque lancer $:$ $2^3 = 8$ chemins.
          resultat: 8
      - code: 1RE-BERNOULLI-02
        difficulte: 2
        type: numerique
        enonce: 'Un tireur réussit chaque tir avec la probabilité $0{,}6$, de façon indépendante. Quelle est la probabilité qu''il réussisse ses trois tirs ?'
        solution: 0.216
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $0{,}6^3 = 0{,}216$.
          resultat: 0.216
      - code: 1RE-BERNOULLI-03
        difficulte: 3
        type: numerique
        enonce: 'Avec le même tireur, quelle est la probabilité qu''il réussisse exactement deux tirs sur trois ?'
        solution: 0.432
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Trois chemins (SSE, SES, ESS), chacun de probabilité $0{,}6^2 \times 0{,}4 = 0{,}144$.
          - $3 \times 0{,}144 = 0{,}432$.
          resultat: 0.432
      - code: 1RE-BERNOULLI-04
        difficulte: 4
        type: numerique
        enonce: 'Un dé équilibré est lancé quatre fois. Quelle est la probabilité d''obtenir au moins un six ? (Réponse sous forme de fraction.)'
        solution: 671/1296
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Contraire $:$ aucun six, de probabilité $\left(\dfrac{5}{6}\right)^4 = \dfrac{625}{1\,296}$.
          - $1 - \dfrac{625}{1\,296} = \dfrac{671}{1\,296}$.
          resultat: 671/1296
      - code: 1RE-BERNOULLI-05
        difficulte: 5
        type: numerique
        enonce: 'On lance quatre fois une pièce équilibrée. Quelle est la probabilité d''obtenir exactement deux piles ?'
        solution: 3/8
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Chemins à deux piles $:$ PPFF, PFPF, PFFP, FPPF, FPFP, FFPP, soit $6$ chemins.
          - Chacun a la probabilité $\left(\dfrac{1}{2}\right)^4 = \dfrac{1}{16}$.
          - $\dfrac{6}{16} = \dfrac{3}{8}$.
          resultat: 3/8
      - code: 1RE-BERNOULLI-V1
        difficulte: 3
        type: numerique
        gabarit:
          parametres: {p: {entre: [0.1, 0.9], pas: 0.1}, n: {entre: [2, 4]}}
          calculs: {q: "1 - (1 - p)**n"}
        enonce: 'On répète $[[n]]$ fois, de façon indépendante, une épreuve de succès de probabilité $[[p]]$. Quelle est la probabilité d''obtenir au moins un succès ?'
        solution: '[[q]]'
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Passer par le contraire : aucun succès.'
          etapes:
          - 'Aucun succès : $[[1 - p]]^{[[n]]} = [[(1 - p)**n]]$.'
          - 'Au moins un succès : $1 - [[(1 - p)**n]] = [[q]]$.'
          resultat: '[[q]]'
