        type: numerique
        enonce: 'Combien d''éléments contient la liste `[k for k in range(20) if k % 3 == 0]` ?'
        solution: 7
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '`range(20)` parcourt les entiers de $0$ à $19$ ; la condition `k % 3 == 0` garde ceux dont le reste dans la division par $3$ est nul.'
          - 'Ce sont les multiples de $3$ : $0, 3, 6, 9, 12, 15, 18$.'
          - 'La liste contient $7$ éléments.'
          resultat: 7
