    cours_couvre: [1RE-SPE-2026-LISTE-01, 1RE-SPE-2026-LISTE-02, 1RE-SPE-2026-LISTE-03, 1RE-SPE-2026-LISTE-04]
    objectifs:
    - Créer une liste en extension, par ajouts successifs ou en compréhension.
    - Accéder aux éléments par leur indice, ajouter ou supprimer un élément.
    - Parcourir une liste avec une boucle pour calculer une somme, un maximum, un comptage.
    methodes:
    - titre: Lire une liste en compréhension
      quand: Une liste est écrite sous la forme `[expression for i in range(…) if condition]`.
      etapes:
      - Énumérer les valeurs de `i` données par `range`.
      - Garder celles qui vérifient la condition (s'il y en a une).
      - Calculer l'expression pour chacune, dans l'ordre.
      exemple:
        enonce: 'Que contient `[i * i for i in range(5)]` ?'
        resolution:
        - '`i` prend les valeurs $0, 1, 2, 3, 4$.'
        - On calcule les carrés.
        resultat: '`[0, 1, 4, 9, 16]`'
    erreurs_frequentes:
    - erreur: Croire que le premier élément d'une liste a l'indice $1$.
      explication: 'En Python, les indices commencent à $0$ $:$ `L[0]` est le premier élément, `L[len(L) - 1]` le dernier.'
    resume: |
      - **Liste** Python : suite ordonnée d'éléments, entre crochets ; `L[0]` est le premier élément, `L[-1]` le dernier, `len(L)` la longueur.
      - **Générer** : en extension `[3, 7, 1]`, par ajouts successifs `L.append(x)`, en compréhension `[k**2 for k in range(5)]`.
      - **Manipuler** : `L[i] = x`, `L.insert(i, x)`, `L.remove(x)`, `L.pop(i)`, `del L[i]`.
      - **Parcourir** par indices (`for i in range(len(L))`) ou **itérer** sur les éléments (`for x in L`).
    cours: |
      ## 1. Qu'est-ce qu'une liste ?

      Une **liste** est une suite ordonnée d'éléments (nombres, textes…), écrite entre crochets et séparés par des virgules : `L = [4, 9, 2, 9]`.
      - Chaque élément a un **indice** (sa position), qui commence à **0** : `L[0]` vaut `4`, `L[3]` vaut `9`.
      - `L[-1]` est le dernier élément ; `len(L)` donne le nombre d'éléments (ici `4`), donc les indices vont de `0` à `len(L) - 1`.

      ## 2. Générer une liste

      > **Trois façons de créer une liste.**
      > - **En extension** : on écrit tous les éléments, `jours = ["lun", "mar", "mer"]`.
      > - **Par ajouts successifs** : on part d'une liste vide et on ajoute avec `append` dans une boucle.
      > - **En compréhension** : `[expression for variable in ... if condition]`.

      ```python
      carres = []
      for k in range(1, 6):
          carres.append(k ** 2)        # carres vaut [1, 4, 9, 16, 25]

      pairs = [k for k in range(20) if k % 2 == 0]   # [0, 2, 4, ..., 18]
      termes = [3 * 2 ** n for n in range(6)]        # termes d'une suite géométrique
      ```

      ## 3. Manipuler les éléments

      | Instruction | Effet sur `L = [4, 9, 2]` |
      |---|---|
      | `L[1] = 7` | remplace : `[4, 7, 2]` |
      | `L.append(5)` | ajoute à la fin : `[4, 9, 2, 5]` |
      | `L.insert(0, 1)` | insère à l'indice 0 : `[1, 4, 9, 2]` |
      | `L.remove(9)` | supprime la **première occurrence** de 9 : `[4, 2]` |
      | `L.pop(0)` | supprime et renvoie l'élément d'indice 0 : `[9, 2]` |
      | `x in L` | `True` si `x` est dans la liste |

      ## 4. Parcourir une liste

      **Itérer sur les éléments** (quand on n'a pas besoin des positions) :
      ```python
      total = 0
      for x in L:
          total = total + x
      ```
      **Parcourir par les indices** (quand la position compte, ou pour comparer des éléments voisins) :
      ```python
      for i in range(len(L) - 1):
          if L[i + 1] < L[i]:
              print("la liste n'est pas croissante à l'indice", i)
      ```

      ## 5. Exemple complet

      Notes d'un élève : `notes = [12, 8, 15, 10, 17]`. Moyenne et nombre de notes au moins égales à 10 ?
      ```python
      somme = 0
      compteur = 0
      for n in notes:
          somme = somme + n
          if n >= 10:
              compteur = compteur + 1
      moyenne = somme / len(notes)     # 62 / 5 = 12.4
      print(moyenne, compteur)         # 12.4 4
      ```
      Version compacte : `sum(notes) / len(notes)` et `len([n for n in notes if n >= 10])`.

      ## 6. Erreurs fréquentes

      - Oublier que le premier indice est `0` : `L[len(L)]` provoque une erreur.
      - Confondre `L.remove(x)` (par valeur) et `L.pop(i)` (par indice).
      - Croire que `range(1, 6)` contient `6` : il s'arrête à `5`.
