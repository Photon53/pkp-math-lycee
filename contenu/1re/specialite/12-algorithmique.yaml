        type: numerique
        enonce: 'On exécute `u = [5]`, puis `for k in range(3): u.append(2 * u[-1] + 1)`. Que vaut le dernier élément de `u` ?'
        solution: 47
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '`u[-1]` désigne le dernier élément ; on ajoute successivement $11$, $23$, $47$.'
          - La liste finale est `[5, 11, 23, 47]`.
          resultat: 47
