chapitre:
  code: TLE-SOMMES-VA
  niveau: Tle
  parcours: specialite
  ordre: 14
  titre: Sommes de variables aléatoires

competences:
  - code: TLE-SOMME-LIN
    libelle: Calculer espérance et variance d'une somme
    objectifs:
    - Calculer l'espérance et la variance d'une combinaison linéaire de variables aléatoires.
    prerequis:
    - 1RE-VARIANCE
    methodes:
    - titre: Espérance et variance de aX + bY
      etapes:
      - 'Toujours : $E(aX + bY) = aE(X) + bE(Y)$.'
      - 'Si $X$ et $Y$ sont indépendantes : $V(aX + bY) = a^2V(X) + b^2V(Y)$.'
      exemple:
        enonce: $V(X) = 3$, $V(Y) = 1$, indépendantes. Calculer $V(X - 2Y)$.
        resolution:
        - $1 \times 3 + 4 \times 1$.
        resultat: $7$
    erreurs_frequentes:
    - erreur: Écrire V(X − Y) = V(X) − V(Y).
      explication: 'Le coefficient $-1$ est élevé au carré : $V(X - Y) = V(X) + V(Y)$.'
    resume: |
      - Toujours : $E(X + Y) = E(X) + E(Y)$ et $E(aX + b) = aE(X) + b$.
      - Si $X$ et $Y$ sont **indépendantes** : $V(X + Y) = V(X) + V(Y)$.
      - $V(aX) = a^2V(X)$ : donc $V(X - Y) = V(X) + V(Y)$ (les variances s'**ajoutent**).
    cours: |
      ## Linéarité de l'espérance
      $E(2X - 3Y + 1) = 2E(X) - 3E(Y) + 1$. Avec $E(X) = 4$ et $E(Y) = 1$ : $8 - 3 + 1 = 6$.

      ## Variance d'une somme indépendante
      $V(2X + 3Y) = 4V(X) + 9V(Y)$. Avec $V(X) = 1$ et $V(Y) = 2$ : $4 + 18 = 22$.

      ## Somme de lancers
      Un dé équilibré a pour espérance $3{,}5$ ; la somme de $10$ lancers a pour espérance $35$.

      ## Erreur fréquente
      Écrire $V(X - Y) = V(X) - V(Y)$ : une variance ne peut pas devenir négative !
    questions:
      - code: TLE-SOMME-LIN-01
        difficulte: 1
        type: numerique
        enonce: 'On sait que $E(X) = 3$ et $E(Y) = 5$. Calculer $E(X + Y)$.'
        solution: 8
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Linéarité : $E(X + Y) = 3 + 5$.'
          resultat: 8
      - code: TLE-SOMME-LIN-02
        difficulte: 2
        type: numerique
        enonce: '$X$ et $Y$ sont indépendantes avec $V(X) = 2$ et $V(Y) = 3$. Calculer $V(X - Y)$.'
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Indépendance : $V(X - Y) = V(X) + V(Y) = 2 + 3$.'
          resultat: 5
      - code: TLE-SOMME-LIN-03
        difficulte: 3
        type: numerique
        enonce: 'On sait que $E(X) = 4$ et $E(Y) = 1$. Calculer $E(2X - 3Y + 1)$.'
        solution: 6
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Linéarité de l''espérance : $E(aX + bY + c) = aE(X) + bE(Y) + c$, quelles que soient les dépendances.'
          etapes:
          - 'On applique la linéarité : $E(2X - 3Y + 1) = 2E(X) - 3E(Y) + 1$.'
          - 'On remplace : $2 \times 4 - 3 \times 1 + 1$.'
          - 'On calcule : $8 - 3 + 1 = 6$.'
          - 'Vérification : le résultat est proche de $2E(X) = 8$, diminué de $3E(Y) = 3$ puis augmenté de $1$ : $6$ est cohérent.'
          erreurs_frequentes:
          - Oublier la constante $+1$, ou transposer cette linéarité à la variance, ce qui serait faux.
          resultat: '6'
      - code: TLE-SOMME-LIN-04
        difficulte: 4
        type: numerique
        enonce: '$X$ et $Y$ sont indépendantes avec $V(X) = 1$ et $V(Y) = 2$. Calculer $V(2X + 3Y)$.'
        solution: 22
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Pour $X$ et $Y$ indépendantes : $V(aX + bY) = a^2V(X) + b^2V(Y)$.'
          etapes:
          - 'L''indépendance autorise l''additivité des variances : $V(2X + 3Y) = V(2X) + V(3Y)$.'
          - 'On sort les coefficients au carré : $V(2X) = 4V(X) = 4 \times 1 = 4$ et $V(3Y) = 9V(Y) = 9 \times 2 = 18$.'
          - 'On additionne : $V(2X + 3Y) = 4 + 18 = 22$.'
          - 'Vérification : l''écart type de la somme vaut $\sqrt{22} \approx 4{,}69$, supérieur à chacun des écarts types $2$ et $3\sqrt{2} \approx 4{,}24$.'
          erreurs_frequentes:
          - Écrire $V(2X + 3Y) = 2V(X) + 3V(Y)$ en oubliant les carrés, ou additionner les variances sans l'indépendance.
          resultat: '22'
      - code: TLE-SOMME-LIN-05
        difficulte: 5
        type: numerique
        enonce: 'On lance 10 fois un dé équilibré à six faces et on additionne les résultats. Calculer l''espérance de cette somme.'
        solution: 35
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Un lancer a pour espérance $\dfrac{1 + 2 + \dots + 6}{6} = 3{,}5$.
          - 'Somme de 10 lancers : $10 \times 3{,}5$.'
          resultat: 35

  - code: TLE-ECHANTILLON
    libelle: Étudier la somme et la moyenne d'un échantillon
    objectifs:
    - Calculer espérance, variance et écart type de la somme et de la moyenne d'un échantillon.
    prerequis:
    - TLE-SOMME-LIN
    methodes:
    - titre: Espérance et variance d'une moyenne d'échantillon
      etapes:
      - 'Somme $S_n$ : $E(S_n) = n\mu$ et $V(S_n) = nV$.'
      - 'Moyenne $M_n = \dfrac{S_n}{n}$ : $E(M_n) = \mu$, $V(M_n) = \dfrac{V}{n}$, $\sigma(M_n) = \dfrac{\sigma}{\sqrt n}$.'
      exemple:
        enonce: $n = 25$ variables d'écart type $10$.
        resolution:
        - $\sigma(M_{25}) = \dfrac{10}{5}$.
        resultat: $2$
    erreurs_frequentes:
    - erreur: Diviser l'écart type par $n$ au lieu de $\sqrt n$.
      explication: C'est la variance qui est divisée par $n$ ; l'écart type est donc divisé par $\sqrt n$.
    resume: |
      - Un échantillon de taille $n$ : $X_1, \dots, X_n$ indépendantes et de même loi (espérance $\mu$, variance $V$).
      - Somme $S_n$ : $E(S_n) = n\mu$ et $V(S_n) = nV$.
      - Moyenne $M_n = \dfrac{S_n}{n}$ : $E(M_n) = \mu$, $V(M_n) = \dfrac{V}{n}$, $\sigma(M_n) = \dfrac{\sigma}{\sqrt n}$.
    cours: |
      ## Somme
      $50$ variables indépendantes de variance $2$ : $V(S_{50}) = 100$, $\sigma(S_{50}) = 10$.

      ## Moyenne
      $V(X) = 4$ et $n = 100$ : $V(M_n) = 0{,}04$.
      $\sigma = 6$ et $n = 36$ : $\sigma(M_n) = \dfrac{6}{6} = 1$.

      ## Interprétation
      La moyenne garde la même espérance mais fluctue moins : pour diviser l'écart type par $10$, il faut un échantillon $100$ fois plus grand.
    questions:
      - code: TLE-ECHANTILLON-01
        difficulte: 1
        type: numerique
        enonce: '$M_n$ est la moyenne d''un échantillon de $n$ variables indépendantes d''espérance 5. Calculer $E(M_n)$.'
        solution: 5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $E(M_n) = \mu = 5$.
          resultat: 5
      - code: TLE-ECHANTILLON-02
        difficulte: 2
        type: numerique
        enonce: 'Un échantillon de taille 100 est formé de variables indépendantes de variance 4. Calculer la variance de la moyenne $M_{100}$.'
        solution: 1/25
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $V(M_{100}) = \dfrac{4}{100} = \dfrac{1}{25}$.
          resultat: 1/25
      - code: TLE-ECHANTILLON-03
        difficulte: 3
        type: numerique
        enonce: 'Un échantillon de taille 36 est formé de variables indépendantes d''écart type 6. Calculer l''écart type de la moyenne $M_{36}$.'
        solution: 1
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Écart type de la moyenne d''un échantillon de variables indépendantes de même écart type $\sigma$ : $\sigma(M_n) = \dfrac{\sigma}{\sqrt n}$.'
          etapes:
          - On identifie $\sigma = 6$ et $n = 36$.
          - 'On applique la formule : $\sigma(M_{36}) = \dfrac{6}{\sqrt{36}}$.'
          - 'On calcule : $\dfrac{6}{6} = 1$.'
          - 'Vérification : la moyenne est $6$ fois plus concentrée que la variable seule, ce qui correspond à $\sqrt{36} = 6$.'
          erreurs_frequentes:
          - Diviser par $n$ au lieu de $\sqrt n$ et trouver $\dfrac{1}{6}$.
          resultat: '1'
      - code: TLE-ECHANTILLON-04
        difficulte: 4
        type: numerique
        enonce: '$S = X_1 + \dots + X_{50}$ où les $X_i$ sont indépendantes de variance 2. Calculer $V(S)$.'
        solution: 100
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Pour des variables indépendantes, les variances s''additionnent : $V(X_1 + \dots + X_n) = V(X_1) + \dots + V(X_n)$.'
          etapes:
          - 'Les $X_i$ sont indépendantes de variance $2$ : on additionne les $50$ variances.'
          - On calcule $V(S) = 50 \times 2 = 100$.
          - La variance est multipliée par la taille de l'échantillon, elle n'est pas divisée.
          - 'Vérification : l''écart type de $S$ vaut $\sqrt{100} = 10$, et $\sqrt{50} \times \sqrt{2} \approx 7{,}07 \times 1{,}41 \approx 10$ : cohérent.'
          erreurs_frequentes:
          - Diviser la variance par $n$ comme pour une moyenne, ou oublier l'indépendance.
          resultat: '100'
      - code: TLE-ECHANTILLON-05
        difficulte: 5
        type: numerique
        enonce: 'Quelle taille $n$ d''échantillon rend l''écart type de la moyenne $M_n$ dix fois plus petit que celui d''une seule variable ?'
        solution: 100
        auteur: Brouillon IA (Claude)
        correction:
          methode: On veut $\sigma(M_n) = \dfrac{\sigma}{\sqrt n} = \dfrac{\sigma}{10}$, ce qui donne $\sqrt n = 10$.
          etapes:
          - L'écart type de la moyenne vaut $\sigma(M_n) = \dfrac{\sigma}{\sqrt n}$.
          - 'On veut qu''il soit dix fois plus petit : $\dfrac{\sigma}{\sqrt n} = \dfrac{\sigma}{10}$.'
          - 'En simplifiant par $\sigma > 0$ : $\sqrt n = 10$, donc $n = 100$.'
          - 'Vérification : pour $n = 99$, $\dfrac{\sigma}{\sqrt{99}} \approx 0{,}1005\,\sigma > \dfrac{\sigma}{10}$ : $100$ est bien la plus petite taille entière.'
          erreurs_frequentes:
          - Écrire $n = 10$ au lieu de $n = 10^2$, ou croire que l'écart type est divisé par $n$.
          resultat: '100'