chapitre:
  code: TLE-CONTINUITE
  niveau: Tle
  parcours: specialite
  ordre: 8
  titre: Continuité des fonctions

competences:
  - code: TLE-TVI
    libelle: Appliquer le théorème des valeurs intermédiaires
    objectifs:
    - Appliquer le théorème des valeurs intermédiaires et son corollaire (solution unique).
    methodes:
    - titre: Montrer qu'une équation a une unique solution
      etapes:
      - Vérifier que $f$ est continue et strictement monotone sur $[a ; b]$.
      - Vérifier que $k$ est compris entre $f(a)$ et $f(b)$.
      - 'Conclure : $f(x) = k$ a une unique solution ; l''encadrer par balayage à la calculatrice.'
      exemple:
        enonce: $x^3 + 2x = 4$ sur $[1 ; 2]$.
        resolution:
        - $f'(x) = 3x^2 + 2 > 0$ ; $f(1) = 3 < 4 < 12 = f(2)$.
        resultat: Une unique solution dans [1 ; 2].
    erreurs_frequentes:
    - erreur: Oublier la stricte monotonie pour affirmer l'unicité.
      explication: La continuité seule garantit au moins une solution, pas une seule.
    resume: |
      - **TVI** : si $f$ est continue sur $[a ; b]$, tout réel $k$ compris entre $f(a)$ et $f(b)$ a au moins un antécédent dans $[a ; b]$.
      - **Corollaire** : si de plus $f$ est strictement monotone, cet antécédent est **unique**.
      - Une fonction dérivable est continue ; la fonction partie entière ne l'est pas aux entiers.
      - On encadre la solution par balayage ou par dichotomie.
    cours: |
      ## Unicité d'une solution
      $f(x) = x^3 + x - 1$ : $f'(x) = 3x^2 + 1 > 0$, $f$ est continue et strictement croissante, de limites $-\infty$ et $+\infty$.
      L'équation $f(x) = 0$ a donc une unique solution $\alpha$.

      ## Encadrement
      $f(0{,}6) = -0{,}184 < 0$ et $f(0{,}7) = 0{,}043 > 0$ : $\alpha \in ]0{,}6 ; 0{,}7[$.

      ## Plusieurs solutions
      $g(x) = x^3 - 3x + 1$ : maximum local $g(-1) = 3 > 0$, minimum local $g(1) = -1 < 0$.
      On applique le corollaire sur chacun des trois intervalles de monotonie : $3$ solutions.
    questions:
      - code: TLE-TVI-01
        difficulte: 1
        type: qcm
        enonce: '$f$ est continue sur $[a ; b]$ avec $f(a) < 0 < f(b)$. Alors : A) $f$ s''annule au moins une fois sur $[a ; b]$  B) $f$ ne s''annule pas  C) $f$ s''annule exactement une fois'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'Théorème des valeurs intermédiaires : $0$ est entre $f(a)$ et $f(b)$, donc $f$ s''annule au moins une fois.'
          resultat: A
      - code: TLE-TVI-02
        difficulte: 2
        type: numerique
        enonce: 'Combien l''équation $x^3 + x - 1 = 0$ a-t-elle de solutions réelles ?'
        solution: 1
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$f''(x) = 3x^2 + 1 > 0$ : $f$ est strictement croissante sur $\mathbb{R}$.'
          - '$f$ va de $-\infty$ à $+\infty$ : elle s''annule une seule fois.'
          resultat: 1
      - code: TLE-TVI-03
        difficulte: 3
        type: qcm
        enonce: 'La solution $\alpha$ de $x^3 + x - 1 = 0$ appartient à : A) $]0 ; 0{,}5[$  B) $]0{,}6 ; 0{,}7[$  C) $]0{,}8 ; 0{,}9[$'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $f(0{,}6) = -0{,}184 < 0$ et $f(0{,}7) = 0{,}043 > 0$.
          resultat: B
      - code: TLE-TVI-04
        difficulte: 4
        type: qcm
        enonce: 'La fonction partie entière est-elle continue sur $[0 ; 2]$ ? A) oui  B) non'
        solution: B
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - 'La partie entière « saute » de $0$ à $1$ en $x = 1$ : elle n''est pas continue sur $[0 ; 2]$.'
          resultat: B
      - code: TLE-TVI-05
        difficulte: 5
        type: numerique
        enonce: 'Combien l''équation $x^3 - 3x + 1 = 0$ a-t-elle de solutions réelles ?'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$f''(x) = 3(x - 1)(x + 1)$ : $f$ croît, décroît sur $[-1 ; 1]$, puis croît.'
          - '$f(-1) = 3 > 0$ et $f(1) = -1 < 0$ : une solution sur chacun des trois intervalles.'
          resultat: 3

  - code: TLE-POINT-FIXE
    libelle: Déterminer la limite d'une suite récurrente
    objectifs:
    - Trouver la limite d'une suite $u_{n+1} = f(u_n)$ convergente.
    prerequis:
    - TLE-SUI-LIM
    methodes:
    - titre: Calculer la limite d'une suite récurrente
      etapes:
      - Admettre ou démontrer que la suite converge vers ℓ.
      - '$f$ continue : $\ell = f(\ell)$.'
      - Résoudre cette équation et choisir la solution compatible (signe, bornes).
      exemple:
        enonce: $u_{n+1} = 0{,}2u_n + 4$ converge.
        resolution:
        - $\ell = 0{,}2\ell + 4$, soit $0{,}8\ell = 4$.
        resultat: $\ell = 5$
    erreurs_frequentes:
    - erreur: Utiliser l'équation ℓ = f(ℓ) sans savoir que la suite converge.
      explication: Une suite peut diverger alors que l'équation a une solution.
    resume: |
      - Si $u_{n+1} = f(u_n)$, si $(u_n)$ converge vers $\ell$ et si $f$ est **continue** en $\ell$, alors $f(\ell) = \ell$.
      - On montre d'abord la convergence (suite monotone et bornée), puis on résout $f(\ell) = \ell$.
      - Si l'équation a plusieurs solutions, on choisit grâce aux bornes de la suite.
    cours: |
      ## Suite arithmético-géométrique
      $u_{n+1} = 0{,}5u_n + 3$ converge ; sa limite vérifie $\ell = 0{,}5\ell + 3$, d'où $\ell = 6$.

      ## Avec une racine
      $u_0 = 0$ et $u_{n+1} = \sqrt{u_n + 2}$ : la suite est croissante et majorée par $2$, donc converge vers $\ell \ge 0$ avec $\ell = \sqrt{\ell + 2}$.
      $\ell^2 - \ell - 2 = 0$ donne $\ell = 2$ ou $\ell = -1$ ; on retient $\ell = 2$.

      ## Méthode de Héron
      $u_{n+1} = \dfrac{1}{2}\left(u_n + \dfrac{4}{u_n}\right)$ avec $u_0 = 1$ : $\ell = \dfrac{1}{2}\left(\ell + \dfrac{4}{\ell}\right) \iff \ell^2 = 4$, et $\ell > 0$ donc $\ell = 2$.
    questions:
      - code: TLE-POINT-FIXE-01
        difficulte: 1
        type: qcm
        enonce: '$u_{n+1} = f(u_n)$, $(u_n)$ converge vers $\ell$ et $f$ est continue. Alors : A) $f(\ell) = \ell$  B) $f(\ell) = 0$  C) $\ell = 0$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Par continuité, passer à la limite dans $u_{n+1} = f(u_n)$ donne $\ell = f(\ell)$.
          resultat: A
      - code: TLE-POINT-FIXE-02
        difficulte: 2
        type: numerique
        enonce: 'La suite définie par $u_{n+1} = 0{,}5u_n + 3$ converge. Quelle est sa limite ?'
        solution: 6
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\ell = 0{,}5\ell + 3$, donc $0{,}5\ell = 3$.
          resultat: 6
      - code: TLE-POINT-FIXE-03
        difficulte: 3
        type: numerique
        enonce: 'La suite définie par $u_0 = 0$ et $u_{n+1} = \sqrt{u_n + 2}$ converge vers un réel positif. Lequel ?'
        solution: 2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\ell = \sqrt{\ell + 2}$, donc $\ell^2 - \ell - 2 = (\ell - 2)(\ell + 1) = 0$.
          - '$\ell \geq 0$ : $\ell = 2$.'
          resultat: 2
      - code: TLE-POINT-FIXE-04
        difficulte: 4
        type: numerique
        enonce: 'La suite définie par $u_0 = 1$ et $u_{n+1} = \dfrac{1}{2}\left(u_n + \dfrac{4}{u_n}\right)$ converge vers un réel strictement positif. Lequel ?'
        solution: 2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\ell = \dfrac{1}{2}\left(\ell + \dfrac{4}{\ell}\right)$ donne $\ell = \dfrac{4}{\ell}$, soit $\ell^2 = 4$.
          - '$\ell > 0$ : $\ell = 2$.'
          resultat: 2
      - code: TLE-POINT-FIXE-05
        difficulte: 5
        type: numerique
        enonce: 'La suite définie par $u_0 = 1$ et $u_{n+1} = \dfrac{u_n}{1 + u_n}$ converge. Quelle est sa limite ?'
        solution: 0
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\ell = \dfrac{\ell}{1 + \ell}$ donne $\ell(1 + \ell) = \ell$, soit $\ell^2 = 0$.
          resultat: 0
