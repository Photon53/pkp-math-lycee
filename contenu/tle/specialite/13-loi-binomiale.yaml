chapitre:
  code: TLE-BINOMIALE
  niveau: Tle
  parcours: specialite
  ordre: 13
  titre: Succession d'épreuves indépendantes, loi binomiale

competences:
  - code: TLE-BINOM-LOI
    libelle: Calculer des probabilités avec la loi binomiale
    objectifs:
    - Reconnaitre un schéma de Bernoulli et calculer P(X = k) pour une loi binomiale.
    prerequis:
    - TLE-COMB-DEN
    - 1RE-LOI
    methodes:
    - titre: Calculer P(X = k) pour une loi binomiale
      etapes:
      - 'Justifier : $n$ épreuves identiques et indépendantes à deux issues, succès de probabilité $p$.'
      - $P(X = k) = \dbinom{n}{k} p^k (1 - p)^{n - k}$.
      exemple:
        enonce: $X \sim \mathcal B(4 ; 0{,}5)$. Calculer $P(X = 2)$.
        resolution:
        - $\dbinom{4}{2} \times 0{,}5^2 \times 0{,}5^2 = 6 \times \dfrac{1}{16}$.
        resultat: $\dfrac{3}{8}$
    erreurs_frequentes:
    - erreur: Oublier le coefficient $\dbinom{n}{k}$.
      explication: Il compte le nombre de façons de placer les k succès parmi les n épreuves.
    resume: |
      - Un **schéma de Bernoulli** répète $n$ fois, de façon indépendante, une épreuve à deux issues (succès de probabilité $p$).
      - Le nombre de succès $X$ suit la loi binomiale $\mathcal B(n ; p)$ : $P(X = k) = \dbinom{n}{k} p^k (1 - p)^{n - k}$.
      - $\dbinom{n}{k}$ compte les chemins de l'arbre réalisant $k$ succès.
    cours: |
      ## Coefficients binomiaux
      $\dbinom{5}{2} = \dfrac{5 \times 4}{2} = 10$ ; $\dbinom{10}{5} = 252$.

      ## Calculs
      $X \sim \mathcal B(3 ; 0{,}5)$ : $P(X = 2) = \dbinom{3}{2} \times 0{,}5^2 \times 0{,}5 = \dfrac{3}{8}$.
      $X \sim \mathcal B(4 ; \tfrac{1}{3})$ : $P(X = 0) = \left(\dfrac{2}{3}\right)^4 = \dfrac{16}{81}$.
      $X \sim \mathcal B(5 ; 0{,}2)$ : $P(X = 1) = 5 \times 0{,}2 \times 0{,}8^4 = 0{,}4096$.

      ## Justifier une loi binomiale
      Il faut préciser : épreuves **identiques et indépendantes**, deux issues, $X$ compte les succès, valeurs de $n$ et $p$.
    questions:
      - code: TLE-BINOM-LOI-01
        difficulte: 1
        type: numerique
        enonce: 'Calculer $\dbinom{5}{2}$.'
        solution: 10
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\dbinom{5}{2} = \dfrac{5 \times 4}{2} = 10$.
          resultat: 10
      - code: TLE-BINOM-LOI-02
        difficulte: 2
        type: numerique
        enonce: '$X$ suit la loi binomiale $\mathcal B(3 ; 0{,}5)$. Calculer $P(X = 2)$.'
        solution: 3/8
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $\dbinom{3}{2} \times 0{,}5^2 \times 0{,}5 = \dfrac{3}{8}$.
          resultat: 3/8
      - code: TLE-BINOM-LOI-03
        difficulte: 3
        type: numerique
        enonce: '$X$ suit la loi binomiale $\mathcal B\left(4 ; \dfrac{1}{3}\right)$. Calculer $P(X = 0)$.'
        solution: 16/81
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Loi binomiale : $P(X = k) = \dbinom{n}{k}p^k(1-p)^{n-k}$ ; pour $k = 0$, le coefficient binomial vaut $1$.'
          etapes:
          - On identifie $n = 4$, $p = \dfrac{1}{3}$ et $k = 0$, donc $1 - p = \dfrac{2}{3}$.
          - 'On applique la formule : $P(X = 0) = \dbinom{4}{0}\left(\dfrac{1}{3}\right)^0\left(\dfrac{2}{3}\right)^4$.'
          - Comme $\dbinom{4}{0} = 1$ et $\left(\dfrac{1}{3}\right)^0 = 1$, il reste $P(X = 0) = \left(\dfrac{2}{3}\right)^4 = \dfrac{16}{81}$.
          - 'Vérification : $\dfrac{16}{81} \approx 0{,}198$, valeur comprise entre $0$ et $1$, cohérente avec une probabilité.'
          erreurs_frequentes:
          - Oublier que $\dbinom{n}{0} = 1$, ou calculer $p^0(1-p)^0$ au lieu de $(1-p)^n$.
          resultat: 16/81
      - code: TLE-BINOM-LOI-04
        difficulte: 4
        type: numerique
        enonce: '$X$ suit la loi binomiale $\mathcal B(5 ; 0{,}2)$. Calculer $P(X = 1)$.'
        solution: 256/625
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Loi binomiale : $P(X = k) = \dbinom{n}{k}p^k(1-p)^{n-k}$.'
          etapes:
          - On identifie $n = 5$, $p = 0{,}2$ et $k = 1$, donc $1 - p = 0{,}8$.
          - 'On applique la formule : $P(X = 1) = \dbinom{5}{1} \times 0{,}2^1 \times 0{,}8^4$.'
          - 'On calcule : $5 \times 0{,}2 \times 0{,}4096 = 1 \times 0{,}4096 = 0{,}4096$.'
          - 'On convertit en fraction : $0{,}4096 = \dfrac{4096}{10\,000} = \dfrac{256}{625}$.'
          - 'Vérification : $256 \div 625 = 0{,}4096$ ; la fraction redonne bien la probabilité calculée.'
          erreurs_frequentes:
          - Oublier le coefficient $\dbinom{5}{1} = 5$, ou utiliser $p^{n-k}$ et $(1-p)^k$ à l'envers.
          resultat: 256/625
      - code: TLE-BINOM-LOI-05
        difficulte: 5
        type: numerique
        enonce: 'On lance 10 fois une pièce équilibrée. Quelle est la probabilité d''obtenir exactement 5 piles ? (Fraction irréductible.)'
        solution: 63/256
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Loi binomiale $\mathcal B\left(10 ; \dfrac{1}{2}\right)$ : $P(X = 5) = \dbinom{10}{5}\left(\dfrac{1}{2}\right)^{10}$.'
          etapes:
          - 'On identifie $n = 10$, $p = \dfrac{1}{2}$ et $k = 5$ : $P(X = 5) = \dbinom{10}{5}\left(\dfrac{1}{2}\right)^5\left(\dfrac{1}{2}\right)^5$.'
          - 'On calcule le coefficient du binôme : $\dbinom{10}{5} = \dfrac{10 \times 9 \times 8 \times 7 \times 6}{5 \times 4 \times 3 \times 2 \times 1} = 252$.'
          - 'On obtient $P(X = 5) = \dfrac{252}{2^{10}} = \dfrac{252}{1024}$, puis on simplifie par $4$ : $\dfrac{63}{256}$.'
          - 'Vérification : $\dfrac{63}{256} \approx 0{,}246$ ; c''est la valeur la plus probable de la loi, cohérente avec $5$ piles sur $10$.'
          erreurs_frequentes:
          - Oublier le coefficient binomial et répondre $\left(\dfrac{1}{2}\right)^{10}$, ou confondre $\dbinom{10}{5}$ avec $10^5$.
          resultat: 63/256
  - code: TLE-BINOM-ESP
    libelle: Utiliser espérance et variance d'une loi binomiale
    objectifs:
    - Utiliser E(X) = np et V(X) = np(1 − p) ; calculer une probabilité « au moins un ».
    prerequis:
    - TLE-BINOM-LOI
    methodes:
    - titre: Trouver n pour que P(au moins un succès) dépasse un seuil
      etapes:
      - $P(X \geq 1) = 1 - (1 - p)^n$.
      - Résoudre $(1 - p)^n < 1 - \text{seuil}$ avec $\ln$ ou en testant des valeurs.
      exemple:
        enonce: '$p = 0{,}2$ : plus petit $n$ tel que $P(X \geq 1) > 0{,}9$.'
        resolution:
        - $0{,}8^n < 0{,}1$ donne $n > \dfrac{\ln 0{,}1}{\ln 0{,}8} \approx 10{,}3$.
        resultat: $n = 11$
    erreurs_frequentes:
    - erreur: Prendre np(1 − p) pour l'écart type.
      explication: C'est la variance ; l'écart type en est la racine carrée.
    resume: |
      - Si $X \sim \mathcal B(n ; p)$ : $E(X) = np$, $V(X) = np(1 - p)$, $\sigma(X) = \sqrt{np(1 - p)}$.
      - « Au moins un succès » : $P(X \ge 1) = 1 - P(X = 0) = 1 - (1 - p)^n$.
      - Pour trouver le plus petit $n$ tel que $1 - (1 - p)^n \ge s$, on utilise le logarithme.
    cours: |
      ## Espérance et variance
      $X \sim \mathcal B(20 ; 0{,}3)$ : $E(X) = 6$ et $V(X) = 20 \times 0{,}3 \times 0{,}7 = 4{,}2$.

      ## Au moins un succès
      Trois lancers d'une pièce : $P(X \ge 1) = 1 - \left(\dfrac{1}{2}\right)^3 = \dfrac{7}{8}$.

      ## Nombre minimal d'essais
      $1 - 0{,}9^n \ge 0{,}5 \iff 0{,}9^n \le 0{,}5 \iff n \ge \dfrac{\ln 0{,}5}{\ln 0{,}9} \approx 6{,}58$.
      On divise par $\ln 0{,}9 < 0$ : le sens change. Réponse : $n = 7$.
    questions:
      - code: TLE-BINOM-ESP-01
        difficulte: 1
        type: numerique
        enonce: '$X$ suit la loi binomiale $\mathcal B(20 ; 0{,}3)$. Calculer $E(X)$.'
        solution: 6
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $E(X) = np = 20 \times 0{,}3$.
          resultat: 6
      - code: TLE-BINOM-ESP-02
        difficulte: 2
        type: numerique
        enonce: '$X$ suit la loi binomiale $\mathcal B(20 ; 0{,}3)$. Calculer $V(X)$.'
        solution: 21/5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $V(X) = np(1 - p) = 20 \times 0{,}3 \times 0{,}7 = 4{,}2$.
          resultat: 21/5
      - code: TLE-BINOM-ESP-03
        difficulte: 3
        type: numerique
        enonce: 'On lance trois fois une pièce équilibrée. Quelle est la probabilité d''obtenir au moins un pile ?'
        solution: 7/8
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Passer à l''événement contraire : « au moins un pile » est le contraire de « aucun pile ».'
          etapes:
          - 'Soit $X$ le nombre de piles : $X$ suit $\mathcal B\left(3 ; \dfrac{1}{2}\right)$ et on cherche $P(X \geq 1)$.'
          - 'L''événement contraire est $X = 0$ : $P(X = 0) = \left(\dfrac{1}{2}\right)^3 = \dfrac{1}{8}$.'
          - On en déduit $P(X \geq 1) = 1 - P(X = 0) = 1 - \dfrac{1}{8} = \dfrac{7}{8}$.
          - 'Vérification : $P(X = 0) + P(X \geq 1) = \dfrac{1}{8} + \dfrac{7}{8} = 1$, comme attendu.'
          erreurs_frequentes:
          - Calculer $P(X = 1)$ au lieu de « au moins un » pile, ou oublier le $1 -$ du contraire.
          resultat: 7/8
      - code: TLE-BINOM-ESP-04
        difficulte: 4
        type: numerique
        enonce: 'Une épreuve réussit avec la probabilité 0,1. Quel est le plus petit nombre $n$ de répétitions indépendantes pour que la probabilité d''au moins un succès dépasse 0,5 ?'
        solution: 7
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $1 - 0{,}9^n > 0{,}5 \iff 0{,}9^n < 0{,}5$.
          - $0{,}9^6 \approx 0{,}531$ et $0{,}9^7 \approx 0{,}478$.
          resultat: 7
      - code: TLE-BINOM-ESP-05
        difficulte: 5
        type: numerique
        enonce: '$X$ suit une loi binomiale de paramètre $p = 0{,}2$ et d''espérance 4. Calculer $V(X)$.'
        solution: 16/5
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $np = 4$ donne $n = 20$.
          - $V(X) = 20 \times 0{,}2 \times 0{,}8 = 3{,}2$.
          resultat: 16/5
