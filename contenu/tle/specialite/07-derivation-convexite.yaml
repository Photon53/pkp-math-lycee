chapitre:
  code: TLE-CONVEXITE
  niveau: Tle
  parcours: specialite
  ordre: 7
  titre: Compléments sur la dérivation et convexité

competences:
  - code: TLE-COMPOSEE
    libelle: Dériver une fonction composée
    objectifs:
    - Dériver une fonction composée $x \mapsto g(u(x))$.
    prerequis:
    - 1RE-DER-CALC
    methodes:
    - titre: Dériver une composée
      etapes:
      - Repérer la fonction intérieure $u$ et la fonction extérieure $g$.
      - 'Appliquer $(g \circ u)'' = u'' \times g''(u)$ : $(u^n)'' = nu''u^{n-1}$, $(e^u)'' = u''e^u$, $(\sqrt u)'' = \dfrac{u''}{2\sqrt u}$.'
      exemple:
        enonce: Dériver $f(x) = e^{3x^2}$.
        resolution:
        - $u = 3x^2$, $u' = 6x$.
        resultat: $f'(x) = 6x\,e^{3x^2}$
    erreurs_frequentes:
    - erreur: Oublier de multiplier par u'.
      explication: '$((2x + 1)^3)'' = 3 \times 2 \times (2x + 1)^2$ : le facteur $2$ vient de $u''$.'
    resume: |
      - $(g \circ u)' = u' \times (g' \circ u)$, c'est-à-dire $\big(g(u(x))\big)' = u'(x)\,g'(u(x))$.
      - $(u^n)' = n\,u'\,u^{n-1}$ ; $(e^u)' = u'\,e^u$ ; $(\sqrt u)' = \dfrac{u'}{2\sqrt u}$ ; $\left(\dfrac{1}{u}\right)' = -\dfrac{u'}{u^2}$.
    cours: |
      ## Exemples
      - $\big((2x + 1)^3\big)' = 3 \times 2 \times (2x + 1)^2 = 6(2x + 1)^2$.
      - $\big(e^{x^2}\big)' = 2x\,e^{x^2}$.
      - $\left(\sqrt{x^2 + 1}\right)' = \dfrac{2x}{2\sqrt{x^2 + 1}} = \dfrac{x}{\sqrt{x^2 + 1}}$.
      - $\left(\dfrac{1}{x^2 + 1}\right)' = -\dfrac{2x}{(x^2 + 1)^2}$.

      ## Produit et composée
      $f(x) = x e^{-2x}$ : $f'(x) = e^{-2x} + x \times (-2)e^{-2x} = (1 - 2x)e^{-2x}$.

      ## Erreur fréquente
      Oublier le facteur $u'$ : $\big(e^{x^2}\big)' \neq e^{x^2}$.
    questions:
      - code: TLE-COMPOSEE-01
        difficulte: 1
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = (2x + 1)^3$.'
        solution: 6(2x + 1)^2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - '$u = 2x + 1$, $u'' = 2$ : $f''(x) = 3 \times 2 \times (2x + 1)^2$.'
          resultat: 6(2x + 1)^2
      - code: TLE-COMPOSEE-02
        difficulte: 2
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = e^{x^2}$.'
        solution: 2x e^(x^2)
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $(e^u)' = u'e^u$ avec $u = x^2$, $u' = 2x$.
          resultat: 2x e^(x^2)
      - code: TLE-COMPOSEE-03
        difficulte: 3
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = \sqrt{x^2 + 1}$.'
        solution: x/sqrt(x^2 + 1)
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Formule de dérivation d''une composée $\sqrt{u}$ : $\left(\sqrt{u}\right)^{\prime} = \dfrac{u^{\prime}}{2\sqrt{u}}$, avec $u > 0$.'
          etapes:
          - 'On pose $u(x) = x^2 + 1$, donc $u^{\prime}(x) = 2x$ ; $u > 0$ sur $\mathbb{R}$.'
          - 'On applique la formule : $f^{\prime}(x) = \dfrac{2x}{2\sqrt{x^2 + 1}}$.'
          - 'On simplifie le facteur $2$ : $f^{\prime}(x) = \dfrac{x}{\sqrt{x^2 + 1}}$.'
          - 'Vérification : $f^{\prime}(1) = \dfrac{1}{\sqrt{2}} \approx 0{,}71 > 0$, cohérent avec une fonction croissante pour $x > 0$.'
          erreurs_frequentes:
          - 'Oublier de diviser par $2\sqrt{u}$ et répondre $2x$, ou oublier de simplifier le facteur $2$ au numérateur.'
          resultat: x/sqrt(x^2 + 1)
      - code: TLE-COMPOSEE-04
        difficulte: 4
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = \dfrac{1}{x^2 + 1}$.'
        solution: -2x/(x^2 + 1)^2
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Formule de dérivation d''un inverse : $\left(\dfrac{1}{u}\right)^{\prime} = -\dfrac{u^{\prime}}{u^2}$, avec $u \neq 0$.'
          etapes:
          - On pose $u(x) = x^2 + 1$, donc $u^{\prime}(x) = 2x$ ; $u > 0$ sur $\mathbb{R}$.
          - 'On applique la formule : $f^{\prime}(x) = -\dfrac{2x}{\left(x^2 + 1\right)^2}$.'
          - 'La dérivée est du signe de $-x$ : $f$ croît pour $x < 0$ puis décroît, avec un maximum en $0$.'
          - 'Vérification : $f^{\prime}(0) = 0$ (tangente horizontale au maximum) et $f^{\prime}(1) = -\dfrac{2}{4} = -0{,}5 < 0$, cohérent avec la décroissance après $0$.'
          erreurs_frequentes:
          - Oublier le signe $-$ de la formule, ou oublier d'élever $u$ au carré au dénominateur.
          resultat: -2x/(x^2 + 1)^2
      - code: TLE-COMPOSEE-05
        difficulte: 5
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = x e^{-2x}$ (forme factorisée conseillée).'
        solution: (1 - 2x)e^(-2x)
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $f'(x) = 1 \times e^{-2x} + x \times (-2e^{-2x})$.
          - $= (1 - 2x)e^{-2x}$.
          resultat: (1 - 2x)e^(-2x)

  - code: TLE-CONVEX
    libelle: Étudier la convexité d'une fonction
    objectifs:
    - Étudier la convexité avec la dérivée seconde et trouver un point d'inflexion.
    prerequis:
    - TLE-COMPOSEE
    methodes:
    - titre: Étudier la convexité
      etapes:
      - Calculer $f'$ puis $f''$.
      - '$f'''' \geq 0$ : convexe ; $f'''' \leq 0$ : concave.'
      - Un point d'inflexion est un point où $f''$ s'annule en changeant de signe.
      exemple:
        enonce: Convexité de $f(x) = x^3 + 3x^2$.
        resolution:
        - $f''(x) = 6x + 6$, négative avant $-1$, positive après.
        resultat: Concave sur $]-\infty ; -1]$, convexe sur $[-1 ; +\infty[$, inflexion en $x = -1$.
    erreurs_frequentes:
    - erreur: Utiliser le signe de f' pour la convexité.
      explication: f' donne les variations ; c'est f'' qui donne la convexité.
    resume: |
      - $f$ est **convexe** sur $I$ si $f'' \ge 0$ sur $I$ (courbe au-dessus de ses tangentes), **concave** si $f'' \le 0$.
      - Un **point d'inflexion** est un point où la courbe traverse sa tangente : $f''$ s'y annule en changeant de signe.
      - $x \mapsto e^x$ et $x \mapsto x^2$ sont convexes sur $\mathbb{R}$.
    cours: |
      ## Dérivée seconde
      $f(x) = x^3 - 3x^2 + 1$ : $f'(x) = 3x^2 - 6x$ et $f''(x) = 6x - 6$.
      $f''$ est négative sur $]-\infty ; 1]$ (concave) et positive sur $[1 ; +\infty[$ (convexe) : point d'inflexion d'abscisse $1$.

      ## Avec l'exponentielle
      $f(x) = x e^x$ : $f'(x) = (x + 1)e^x$, $f''(x) = (x + 2)e^x$, qui change de signe en $-2$.

      ## Inégalités de convexité
      Comme $\exp$ est convexe, sa courbe est au-dessus de sa tangente en $0$ : $e^x \ge x + 1$ pour tout réel $x$.
    questions:
      - code: TLE-CONVEX-01
        difficulte: 1
        type: expression
        enonce: 'Calculer la dérivée seconde $f''''(x)$ de $f(x) = x^3 - 3x^2$.'
        solution: 6x - 6
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $f'(x) = 3x^2 - 6x$, puis $f''(x) = 6x - 6$.
          resultat: 6x - 6
      - code: TLE-CONVEX-02
        difficulte: 2
        type: qcm
        enonce: '$f$ est convexe sur un intervalle $I$ lorsque, sur $I$ : A) $f'''' \ge 0$  B) $f'''' \le 0$  C) $f'' \ge 0$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Convexe signifie dérivée seconde positive.
          resultat: A
      - code: TLE-CONVEX-03
        difficulte: 3
        type: numerique
        enonce: 'Donner l''abscisse du point d''inflexion de la courbe de $f(x) = x^3 - 3x^2 + 1$.'
        solution: 1
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Un point d''inflexion correspond à un changement de convexité : on cherche où $f^{\prime\prime}$ s''annule en changeant de signe.'
          etapes:
          - 'On dérive deux fois : $f^{\prime}(x) = 3x^2 - 6x$, puis $f^{\prime\prime}(x) = 6x - 6$.'
          - 'On résout $f^{\prime\prime}(x) = 0$ : $6x - 6 = 0$ donne $x = 1$.'
          - 'On vérifie le changement de signe : $f^{\prime\prime}(0) = -6 < 0$ (concave) et $f^{\prime\prime}(2) = 6 > 0$ (convexe).'
          - 'Vérification : le point d''inflexion est $(1 ; f(1))$ avec $f(1) = 1 - 3 + 1 = -1$, soit $(1 ; -1)$.'
          erreurs_frequentes:
          - 'Conclure dès que $f^{\prime\prime}$ s''annule : il faut aussi que le signe change (par exemple $x^4$ a $f^{\prime\prime}(0) = 0$ sans point d''inflexion).'
          resultat: '1'
      - code: TLE-CONVEX-04
        difficulte: 4
        type: qcm
        enonce: 'La fonction exponentielle est sur $\mathbb{R}$ : A) convexe  B) concave  C) ni convexe ni concave'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: Une fonction deux fois dérivable est convexe sur un intervalle si $f^{\prime\prime} \geq 0$ sur cet intervalle.
          etapes:
          - 'On dérive deux fois $\exp$ : $\left(e^x\right)^{\prime} = e^x$ puis $\left(e^x\right)^{\prime\prime} = e^x$.'
          - Or $e^x > 0$ pour tout réel $x$.
          - 'La dérivée seconde est strictement positive sur $\mathbb{R}$ : la fonction exponentielle est convexe sur $\mathbb{R}$.'
          - 'Vérification : la courbe est située au-dessus de chacune de ses tangentes, propriété caractéristique d''une fonction convexe.'
          erreurs_frequentes:
          - 'Confondre « $e^x > 0$ » (la fonction est positive) avec « convexe » : c''est le signe de la dérivée seconde qui décide.'
          resultat: A
      - code: TLE-CONVEX-05
        difficulte: 5
        type: numerique
        enonce: 'Donner l''abscisse du point d''inflexion de la courbe de $f(x) = x e^x$.'
        solution: -2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $f'(x) = (x + 1)e^x$ et $f''(x) = (x + 2)e^x$.
          - $f''$ change de signe en $x = -2$.
          resultat: -2
