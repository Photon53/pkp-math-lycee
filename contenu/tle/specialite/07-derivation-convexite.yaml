chapitre:
  code: TLE-CONVEXITE
  niveau: Tle
  parcours: specialite
  ordre: 7
  titre: Compléments sur la dérivation et convexité

competences:
  - code: TLE-COMPOSEE
    libelle: Dériver une fonction composée
    resume: |
      - $(g \circ u)' = u' \times (g' \circ u)$, c'est-à-dire $\big(g(u(x))\big)' = u'(x)\,g'(u(x))$.
      - $(u^n)' = n\,u'\,u^{n-1}$ ; $(e^u)' = u'\,e^u$ ; $(\sqrt u)' = \dfrac{u'}{2\sqrt u}$ ; $\left(\dfrac{1}{u}\right)' = -\dfrac{u'}{u^2}$.
    cours: |
      ## Exemples
      - $\big((2x + 1)^3\big)' = 3 \times 2 \times (2x + 1)^2 = 6(2x + 1)^2$.
      - $\big(e^{x^2}\big)' = 2x\,e^{x^2}$.
      - $\left(\sqrt{x^2 + 1}\right)' = \dfrac{2x}{2\sqrt{x^2 + 1}} = \dfrac{x}{\sqrt{x^2 + 1}}$.
      - $\left(\dfrac{1}{x^2 + 1}\right)' = -\dfrac{2x}{(x^2 + 1)^2}$.

      ## Produit et composée
      $f(x) = x e^{-2x}$ : $f'(x) = e^{-2x} + x \times (-2)e^{-2x} = (1 - 2x)e^{-2x}$.

      ## Erreur fréquente
      Oublier le facteur $u'$ : $\big(e^{x^2}\big)' \neq e^{x^2}$.
    questions:
      - code: TLE-COMPOSEE-01
        difficulte: 1
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = (2x + 1)^3$.'
        solution: 6(2x + 1)^2
      - code: TLE-COMPOSEE-02
        difficulte: 2
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = e^{x^2}$.'
        solution: 2x e^(x^2)
      - code: TLE-COMPOSEE-03
        difficulte: 3
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = \sqrt{x^2 + 1}$.'
        solution: x/sqrt(x^2 + 1)
      - code: TLE-COMPOSEE-04
        difficulte: 4
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = \dfrac{1}{x^2 + 1}$.'
        solution: -2x/(x^2 + 1)^2
      - code: TLE-COMPOSEE-05
        difficulte: 5
        type: expression
        enonce: 'Calculer la dérivée de $f(x) = x e^{-2x}$ (forme factorisée conseillée).'
        solution: (1 - 2x)e^(-2x)

  - code: TLE-CONVEX
    libelle: Étudier la convexité d'une fonction
    resume: |
      - $f$ est **convexe** sur $I$ si $f'' \ge 0$ sur $I$ (courbe au-dessus de ses tangentes), **concave** si $f'' \le 0$.
      - Un **point d'inflexion** est un point où la courbe traverse sa tangente : $f''$ s'y annule en changeant de signe.
      - $x \mapsto e^x$ et $x \mapsto x^2$ sont convexes sur $\mathbb{R}$.
    cours: |
      ## Dérivée seconde
      $f(x) = x^3 - 3x^2 + 1$ : $f'(x) = 3x^2 - 6x$ et $f''(x) = 6x - 6$.
      $f''$ est négative sur $]-\infty ; 1]$ (concave) et positive sur $[1 ; +\infty[$ (convexe) : point d'inflexion d'abscisse $1$.

      ## Avec l'exponentielle
      $f(x) = x e^x$ : $f'(x) = (x + 1)e^x$, $f''(x) = (x + 2)e^x$, qui change de signe en $-2$.

      ## Inégalités de convexité
      Comme $\exp$ est convexe, sa courbe est au-dessus de sa tangente en $0$ : $e^x \ge x + 1$ pour tout réel $x$.
    questions:
      - code: TLE-CONVEX-01
        difficulte: 1
        type: expression
        enonce: 'Calculer la dérivée seconde $f''''(x)$ de $f(x) = x^3 - 3x^2$.'
        solution: 6x - 6
      - code: TLE-CONVEX-02
        difficulte: 2
        type: qcm
        enonce: '$f$ est convexe sur un intervalle $I$ lorsque, sur $I$ : A) $f'''' \ge 0$  B) $f'''' \le 0$  C) $f'' \ge 0$'
        solution: A
      - code: TLE-CONVEX-03
        difficulte: 3
        type: numerique
        enonce: 'Donner l''abscisse du point d''inflexion de la courbe de $f(x) = x^3 - 3x^2 + 1$.'
        solution: 1
      - code: TLE-CONVEX-04
        difficulte: 4
        type: qcm
        enonce: 'La fonction exponentielle est sur $\mathbb{R}$ : A) convexe  B) concave  C) ni convexe ni concave'
        solution: A
      - code: TLE-CONVEX-05
        difficulte: 5
        type: numerique
        enonce: 'Donner l''abscisse du point d''inflexion de la courbe de $f(x) = x e^x$.'
        solution: -2
