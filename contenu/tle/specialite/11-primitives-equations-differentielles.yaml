chapitre:
  code: TLE-PRIMITIVES
  niveau: Tle
  parcours: specialite
  ordre: 11
  titre: Primitives et équations différentielles

competences:
  - code: TLE-PRIM
    libelle: Déterminer une primitive
    objectifs:
    - Déterminer une primitive avec le tableau des primitives usuelles.
    - Trouver la primitive qui vérifie une condition.
    prerequis:
    - TLE-COMPOSEE
    methodes:
    - titre: Trouver la primitive qui vérifie F(a) = b
      etapes:
      - Écrire une primitive générale $F(x) + C$ (penser à reconnaitre $u'e^u$, $u'u^n$, etc.).
      - Utiliser la condition pour calculer $C$.
      - Vérifier en dérivant.
      exemple:
        enonce: Primitive de $f(x) = 4x^3 - 1$ qui vaut $2$ en $1$.
        resolution:
        - $F(x) = x^4 - x + C$ et $F(1) = C = 2$.
        resultat: $F(x) = x^4 - x + 2$
    erreurs_frequentes:
    - erreur: 'Oublier de diviser par $a$ pour $e^{ax}$ : la primitive de $e^{2x}$ n''est pas $e^{2x}$.'
      explication: En dérivant $e^{2x}$ on obtient $2e^{2x}$ ; il faut donc $\dfrac{e^{2x}}{2}$.
    resume: |
      - $F$ est une primitive de $f$ sur $I$ si $F' = f$ ; les autres primitives sont $F + C$.
      - Une condition comme $F(0) = 0$ fixe la constante.
      - Primitives usuelles : $x^n \to \dfrac{x^{n+1}}{n+1}$ ; $e^{ax} \to \dfrac{e^{ax}}{a}$ ; $\dfrac{1}{x^2} \to -\dfrac{1}{x}$ ; $\cos(ax) \to \dfrac{\sin(ax)}{a}$.
      - Formes composées : $u'e^u \to e^u$ ; $u'u^n \to \dfrac{u^{n+1}}{n+1}$ ; $\dfrac{u'}{u} \to \ln|u|$.
    cours: |
      ## Polynômes
      Une primitive de $3x^2 + 2x$ est $x^3 + x^2$ ; c'est celle qui s'annule en $0$.

      ## Fixer la constante
      Primitive de $e^{2x}$ s'annulant en $0$ : $F(x) = \dfrac{e^{2x}}{2} + C$ et $F(0) = \dfrac{1}{2} + C = 0$, donc $F(x) = \dfrac{e^{2x}}{2} - \dfrac{1}{2}$.

      ## Reconnaître une forme composée
      $2x\,e^{x^2} = u'e^u$ avec $u = x^2$ : primitive $e^{x^2} + C$.

      ## Vérifier
      Dériver la primitive trouvée doit redonner $f$ : c'est le contrôle le plus sûr.
    questions:
      - code: TLE-PRIM-01
        difficulte: 1
        type: expression
        enonce: 'Donner la primitive de $f(x) = 3x^2 + 2x$ qui s''annule en 0.'
        solution: x^3 + x^2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $F(x) = x^3 + x^2 + C$ et $F(0) = C = 0$.
          resultat: x^3 + x^2
      - code: TLE-PRIM-02
        difficulte: 2
        type: expression
        enonce: 'Donner la primitive de $f(x) = e^{2x}$ qui s''annule en 0.'
        solution: e^(2x)/2 - 1/2
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $F(x) = \dfrac{e^{2x}}{2} + C$ et $F(0) = \dfrac{1}{2} + C = 0$.
          resultat: e^(2x)/2 - 1/2
      - code: TLE-PRIM-03
        difficulte: 3
        type: expression
        enonce: 'Donner la primitive sur $]0 ; +\infty[$ de $f(x) = \dfrac{1}{x^2}$ qui s''annule en 1.'
        solution: 1 - 1/x
        auteur: Brouillon IA (Claude)
        correction:
          methode: Une primitive de $\dfrac{1}{x^2} = x^{-2}$ sur $]0 ; +\infty[$ est $-\dfrac{1}{x}$ ; la condition initiale fixe la constante $C$.
          etapes:
          - 'On primitive $f(x) = x^{-2}$ : $F(x) = \dfrac{x^{-1}}{-1} + C = -\dfrac{1}{x} + C$.'
          - 'On traduit la condition $F(1) = 0$ : $-\dfrac{1}{1} + C = 0$, donc $-1 + C = 0$ et $C = 1$.'
          - La primitive cherchée est $F(x) = 1 - \dfrac{1}{x}$.
          - 'Vérification : $F^{\prime}(x) = \dfrac{1}{x^2} = f(x)$ et $F(1) = 1 - 1 = 0$ : les deux conditions sont remplies.'
          erreurs_frequentes:
          - Donner $-\dfrac{1}{x}$ sans constante, ou oublier la condition $F(1) = 0$ qui détermine $C$.
          resultat: 1 - 1/x
      - code: TLE-PRIM-04
        difficulte: 4
        type: expression
        enonce: 'Donner la primitive de $f(x) = 2x e^{x^2}$ qui s''annule en 0.'
        solution: e^(x^2) - 1
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Reconnaître la forme $u^{\prime}e^{u}$ : une primitive est $e^{u}$ lorsque $u = x^2$ et $u^{\prime} = 2x$.'
          etapes:
          - 'On pose $u(x) = x^2$, donc $u^{\prime}(x) = 2x$ : on a bien $f(x) = u^{\prime}(x)e^{u(x)}$.'
          - 'Une primitive de $u^{\prime}e^{u}$ est $e^{u}$ : $F(x) = e^{x^2} + C$.'
          - 'On utilise $F(0) = 0$ : $e^0 + C = 1 + C = 0$, donc $C = -1$.'
          - 'Vérification : $F^{\prime}(x) = 2x e^{x^2} = f(x)$ et $F(0) = e^0 - 1 = 0$.'
          erreurs_frequentes:
          - Écrire $F(x) = e^{x^2}$ sans constante, ou dériver $e^{x^2}$ en oubliant le facteur $2x$ lors de la vérification.
          resultat: e^(x^2) - 1
      - code: TLE-PRIM-05
        difficulte: 5
        type: expression
        enonce: 'Donner la primitive de $f(x) = \cos(2x)$ qui s''annule en 0.'
        solution: sin(2x)/2
        auteur: Brouillon IA (Claude)
        correction:
          methode: Une primitive de $\cos(ax)$ est $\dfrac{\sin(ax)}{a}$, car la dérivée de $\sin(ax)$ est $a\cos(ax)$.
          etapes:
          - On cherche une primitive de $\cos(2x)$ sous la forme $\dfrac{\sin(2x)}{2}$.
          - 'On vérifie la formule : $\left(\dfrac{\sin(2x)}{2}\right)^{\prime} = \dfrac{2\cos(2x)}{2} = \cos(2x)$.'
          - 'On ajoute la constante : $F(x) = \dfrac{\sin(2x)}{2} + C$, et $F(0) = 0 + C = 0$ donne $C = 0$.'
          - 'Vérification : $F(0) = \dfrac{\sin 0}{2} = 0$ et $F^{\prime}(x) = \cos(2x)$.'
          erreurs_frequentes:
          - Oublier de diviser par $2$ et proposer $\sin(2x)$, dont la dérivée est $2\cos(2x)$.
          resultat: sin(2x)/2
  - code: TLE-EQDIFF
    libelle: Résoudre une équation différentielle y' = ay + b
    objectifs:
    - Résoudre $y' = ay$ et $y' = ay + b$ avec une condition initiale.
    prerequis:
    - TLE-PRIM
    - 1RE-EXP-ETU
    methodes:
    - titre: Résoudre y' = ay + b avec une condition initiale
      etapes:
      - 'Solution constante : $y = -\dfrac{b}{a}$.'
      - 'Solutions : $y(x) = Ce^{ax} - \dfrac{b}{a}$.'
      - Utiliser $y(0)$ pour trouver $C$.
      exemple:
        enonce: $y' = 2y - 4$ et $y(0) = 5$.
        resolution:
        - Solution constante $2$ ; $y = Ce^{2x} + 2$ et $C + 2 = 5$.
        resultat: $y(x) = 3e^{2x} + 2$
    erreurs_frequentes:
    - erreur: Prendre la valeur initiale y(0) pour la constante C directement.
      explication: '$y(0) = C - \dfrac{b}{a}$ : il faut retirer la solution constante.'
    resume: |
      - Les solutions de $y' = ay$ sont les fonctions $x \mapsto Ce^{ax}$, $C \in \mathbb{R}$.
      - Pour $y' = ay + b$ ($a \neq 0$) : solution constante $-\dfrac{b}{a}$, et solutions $x \mapsto Ce^{ax} - \dfrac{b}{a}$.
      - Une condition initiale $y(0) = y_0$ fixe $C$ : la solution est alors unique.
    cours: |
      ## Équation homogène
      $y' = 3y$ avec $y(0) = 2$ : $y = Ce^{3x}$ et $C = 2$, donc $y = 2e^{3x}$.

      ## Avec second membre constant
      $y' = -2y + 6$ : la solution constante vérifie $0 = -2y + 6$, soit $y = 3$.
      Les solutions sont $y = Ce^{-2x} + 3$ ; avec $y(0) = 5$ : $C = 2$.

      ## Loi de refroidissement
      $\theta' = -0{,}1(\theta - 20)$ et $\theta(0) = 80$ : $\theta(t) = 20 + 60e^{-0{,}1t}$.
      $\theta(t) = 50 \iff e^{-0{,}1t} = \dfrac{1}{2} \iff t = 10\ln 2 \approx 6{,}9$.
    questions:
      - code: TLE-EQDIFF-01
        difficulte: 1
        type: qcm
        enonce: 'Les solutions de l''équation $y'' = 2y$ sont les fonctions : A) $x \mapsto Ce^{2x}$  B) $x \mapsto Ce^{x/2}$  C) $x \mapsto 2e^x + C$'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - Les solutions de $y' = ay$ sont $x \mapsto Ce^{ax}$, ici $a = 2$.
          resultat: A
      - code: TLE-EQDIFF-02
        difficulte: 2
        type: expression
        enonce: 'Donner la solution de $y'' = 3y$ telle que $y(0) = 2$.'
        solution: 2e^(3x)
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $y = Ce^{3x}$ et $y(0) = C = 2$.
          resultat: 2e^(3x)
      - code: TLE-EQDIFF-03
        difficulte: 3
        type: numerique
        enonce: 'Quelle est la solution constante de l''équation $y'' = -2y + 6$ ?'
        solution: 3
        auteur: Brouillon IA (Claude)
        correction:
          methode: Une solution constante $y = k$ a pour dérivée $y^{\prime} = 0$ ; on reporte dans l'équation pour trouver $k$.
          etapes:
          - On cherche une solution constante $y(x) = k$, donc $y^{\prime}(x) = 0$.
          - 'On reporte dans $y^{\prime} = -2y + 6$ : $0 = -2k + 6$.'
          - 'On résout : $2k = 6$, donc $k = 3$.'
          - 'Vérification : avec $y = 3$, $-2 \times 3 + 6 = 0 = y^{\prime}$ : l''équation est satisfaite.'
          erreurs_frequentes:
          - Chercher une solution de la forme $Ce^{-2x}$ au lieu d'une constante, ou oublier que la dérivée d'une constante est nulle.
          resultat: '3'
      - code: TLE-EQDIFF-04
        difficulte: 4
        type: expression
        enonce: 'Donner la solution de $y'' = -2y + 6$ telle que $y(0) = 5$.'
        solution: 3 + 2e^(-2x)
        auteur: Brouillon IA (Claude)
        correction:
          methode: 'Solutions de $y^{\prime} = ay + b$ : $y = Ce^{ax} - \dfrac{b}{a}$, la constante $C$ étant fixée par la condition initiale.'
          etapes:
          - 'L''équation $y^{\prime} = -2y + 6$ a pour solutions $y(x) = Ce^{-2x} + 3$ : solution générale de l''équation homogène plus la solution constante $3$.'
          - 'On utilise $y(0) = 5$ : $C e^0 + 3 = C + 3 = 5$, donc $C = 2$.'
          - La solution est $y(x) = 2e^{-2x} + 3$.
          - 'Vérification : $y(0) = 2 + 3 = 5$ et $y^{\prime}(x) = -4e^{-2x}$, tandis que $-2y + 6 = -2\left(2e^{-2x} + 3\right) + 6 = -4e^{-2x}$ : l''équation est satisfaite.'
          erreurs_frequentes:
          - Confondre la solution générale et la solution constante, ou oublier d'utiliser $y(0) = 5$ pour déterminer $C$.
          resultat: 3 + 2e^(-2x)
      - code: TLE-EQDIFF-05
        difficulte: 5
        type: numerique
        enonce: 'La température d''un café vérifie $\theta(t) = 20 + 60e^{-0{,}1t}$ ($t$ en minutes). Au bout de combien de minutes atteint-elle 50 °C ? (Valeur exacte avec ln.)'
        solution: 10ln(2)
        auteur: Brouillon IA (Claude)
        correction:
          etapes:
          - $20 + 60e^{-0{,}1t} = 50$ donne $e^{-0{,}1t} = \dfrac{1}{2}$.
          - $-0{,}1t = -\ln 2$, donc $t = 10\ln 2$ (environ $6{,}9$ min).
          resultat: 10ln(2)
