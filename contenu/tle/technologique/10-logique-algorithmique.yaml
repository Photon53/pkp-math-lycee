  cours_couvre: [TLE-TEC-2026-TRANS-06, TLE-TEC-2026-TRANS-07, TLE-TEC-2026-TRANS-08, TLE-TEC-2026-TRANS-09, TLE-TEC-2026-TRANS-10, TLE-TEC-2026-TRANS-11, TLE-TEC-2026-TRANS-12, TLE-TEC-2026-TRANS-13, TLE-TEC-2026-TRANS-14, TLE-TEC-2026-TRANS-15, TLE-TEC-2026-ANA-08, TLE-TEC-2026-ANA-16, TLE-TEC-2026-SP-03, TLE-TEC-2026-SP-16, TLE-TEC-2026-SP-17]
  resume: |
    - Une **fonction** Python reçoit des entrées (paramètres) et renvoie une sortie avec `return`.
    - **Compteur** : `c = c + 1` ; **accumulateur** : `s = s + terme` (initialisé à $0$) ou `p = p * terme` (initialisé à $1$).
    - $\displaystyle\sum_{k=1}^{n} u_k$ se programme avec `for k in range(1, n + 1)` : la borne de fin de `range` est **exclue**.
    - Listes : `[1, 4, 9]`, `L.append(x)`, `[k**2 for k in range(5)]`, `L[0]` est le premier élément ; `random() < p` simule une épreuve de Bernoulli.
  cours: |
    ## 1. Fonctions : entrées et sorties

    Une **fonction** regroupe des instructions réutilisables. Ses **entrées** sont ses paramètres, sa **sortie** est la valeur renvoyée par `return`.

    ```python
    def moyenne_geometrique(a, b):
        return (a * b) ** 0.5
    ```

    `moyenne_geometrique(4, 9)` renvoie `6.0`. Structurer un programme en fonctions courtes (une tâche chacune) le rend lisible et testable.

    ## 2. Compteur et accumulateur

    - Un **compteur** compte des événements : on l'initialise à `0` et on ajoute `1` à chaque événement.
    - Un **accumulateur** cumule des valeurs : initialisé à `0` pour une somme, à `1` pour un produit.

    ## 3. Sommes $\Sigma$ et boucles

    > **Correspondance.** Pour calculer $\displaystyle S = \sum_{k=1}^{n} u_k$ :
    > - **initialisation** : `s = 0` ;
    > - **compteur** : `k` parcourt $1, 2, \dots, n$ grâce à `for k in range(1, n + 1)` ;
    > - **accumulateur** : `s = s + u(k)` à chaque tour ;
    > - **sortie de boucle** : après le dernier tour ($k = n$), on renvoie `s`.

    ```python
    def somme_carres(n):
        s = 0
        for k in range(1, n + 1):
            s = s + k ** 2
        return s
    ```

    `somme_carres(4)` renvoie $1 + 4 + 9 + 16 = 30$. On remplace `k ** 2` par `k ** 3` pour la somme des cubes, par `1 / k` pour la somme des inverses.

    **Moyennes et points intercalés.** Entre les points $A(x_A ; y_A)$ et $B(x_B ; y_B)$ d'une courbe exponentielle, le point d'abscisse $\dfrac{x_A + x_B}{2}$ (moyenne arithmétique) a pour ordonnée $\sqrt{y_A y_B}$ (moyenne géométrique). Une boucle qui répète cette construction remplit peu à peu la courbe.

    ## 4. Listes

    - **Création** : en extension `L = [3, 7, 2]` ; par ajouts successifs `L = []` puis `L.append(x)` ; en compréhension `C = [k ** 2 for k in range(1, 6)]`.
    - **Indices** : `L[0]` est le premier élément, `L[len(L) - 1]` le dernier ; `L[i] = v` modifie un élément ; `L.pop(i)` supprime l'élément d'indice `i`, `L.remove(v)` la première occurrence de `v`.
    - **Itération** : `for x in L:` parcourt les éléments ; `for i in range(len(L)):` parcourt les indices.

    **Espérance d'une loi donnée par deux listes** :

    ```python
    def esperance(x, p):
        e = 0
        for i in range(len(x)):
            e = e + x[i] * p[i]
        return e
    ```

    ## 5. Simulation et loi binomiale

    `random()` (module `random`) renvoie un nombre aléatoire de $[0 ; 1[$. Le test `random() < p` est vrai avec la probabilité $p$ : il simule une **épreuve de Bernoulli**.

    ```python
    from random import random

    def nombre_succes(n, p):
        c = 0
        for i in range(n):
            if random() < p:
                c = c + 1
        return c
    ```

    En répétant `nombre_succes(n, p)` un grand nombre de fois, l'histogramme des fréquences observées ressemble au **diagramme en bâtons** de $\mathcal B(n ; p)$ (tracé par exemple avec `matplotlib`), et la moyenne des résultats est proche de $E(X) = np$ ; en représentant $E(X)$ pour plusieurs lois $\mathcal B(n ; p)$, on visualise que l'espérance « centre » le diagramme.

    **Triangle de Pascal** : chaque ligne se construit à partir de la précédente.

    ```python
    def pascal(n):
        ligne = [1]
        for i in range(n):
            ligne = [1] + [ligne[k] + ligne[k + 1] for k in range(len(ligne) - 1)] + [1]
        return ligne
    ```

    `pascal(4)` renvoie `[1, 4, 6, 4, 1]`.

    ## 6. Ajustement : somme des carrés des écarts

    Pour une droite $y = ax + b$ et les points $(x_i ; y_i)$, on mesure la qualité de l'ajustement par $\displaystyle\sum (y_i - (a x_i + b))^2$ : plus elle est petite, meilleur est l'ajustement.

    ```python
    def ecarts(x, y, a, b):
        s = 0
        for i in range(len(x)):
            s = s + (y[i] - (a * x[i] + b)) ** 2
        return s
    ```

    On peut **balayer** des couples $(a ; b)$ (par exemple $a$ de $1$ à $3$ par pas de $0{,}1$) et garder celui qui donne la plus petite somme.

    ## 7. Données réelles et tableau croisé

    Un fichier de données (CSV) se lit ligne par ligne ; chaque ligne devient une liste de valeurs. On peut alors filtrer, compter, calculer des moyennes. Un **tableau croisé** compte les individus selon deux critères : on utilise un compteur par case, par exemple un dictionnaire dont les clés sont les couples (critère 1, critère 2).

    ```python
    tableau = {}
    for (classe, option) in donnees:
        cle = (classe, option)
        tableau[cle] = tableau.get(cle, 0) + 1
    ```

    ## 8. Exemple complet

    **Énoncé.** Écrire une fonction `seuil(u0, q, M)` qui renvoie le premier rang $n$ tel que $u_0 \times q^n > M$, puis l'utiliser pour un capital de $1\,000$ € placé à $4\,\%$ par an, avec $M = 1\,500$.

    ```python
    def seuil(u0, q, M):
        n = 0
        u = u0
        while u <= M:
            u = u * q
            n = n + 1
        return n
    ```

    `seuil(1000, 1.04, 1500)` renvoie `11` : $1{,}04^{10} \approx 1{,}480$ et $1{,}04^{11} \approx 1{,}539$. Ici `n` est un compteur et `u` un accumulateur multiplicatif.

    ## 9. Erreurs fréquentes

    - Écrire `range(1, n)` pour aller jusqu'à $n$ : la dernière valeur est $n - 1$.
    - Oublier d'initialiser l'accumulateur, ou l'initialiser à `0` pour un produit.
    - Confondre l'indice `i` et l'élément `L[i]` ; le premier indice est `0`.
