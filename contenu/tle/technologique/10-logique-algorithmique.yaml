      - '$s = 1 + \dfrac{1}{2} + \dfrac{1}{3} + \dfrac{1}{4}$ ; au dénominateur commun $12$ : $\dfrac{12}{12} + \dfrac{6}{12} + \dfrac{4}{12} + \dfrac{3}{12}$.'
      - '$s = \dfrac{25}{12}$.'
      resultat: 25/12
  - code: TLE-TEC-ALGO-04
