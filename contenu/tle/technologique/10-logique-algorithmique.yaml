  libelle: Raisonner avec les connecteurs, les conditions et les contre-exemples
  attendus: [TLE-TEC-2026-TRANS-01, TLE-TEC-2026-TRANS-02, TLE-TEC-2026-TRANS-03, TLE-TEC-2026-TRANS-04, TLE-TEC-2026-TRANS-05]
  objectifs:
  - Utiliser correctement « et », « ou », et le statut des lettres d'une égalité.
  - Infirmer par un contre-exemple, distinguer une proposition de sa réciproque.
  - Employer « condition nécessaire », « condition suffisante », « équivalence ».
  methodes:
  - titre: Tester une proposition « pour tout »
    quand: Une affirmation porte sur tous les nombres d'un ensemble.
    etapes:
    - Chercher un cas qui la met en défaut (valeurs particulières $:$ $0$, $1$, un négatif, un nombre entre $0$ et $1$).
    - Un seul contre-exemple suffit pour conclure qu'elle est fausse ; sinon, il faut une démonstration.
    exemple:
      enonce: « Pour tout réel $x$, $x^2 \geqslant x$. »
      resolution:
      - Pour $x = 0{,}5$ $:$ $x^2 = 0{,}25 < 0{,}5$.
      resultat: la proposition est fausse
  erreurs_frequentes:
  - erreur: Croire qu'une implication vraie a une réciproque vraie.
    explication: « Si $x = 2$, alors $x^2 = 4$ » est vraie ; « si $x^2 = 4$, alors $x = 2$ » est fausse ($x = -2$).
  cours_couvre: [TLE-TEC-2026-TRANS-01, TLE-TEC-2026-TRANS-02, TLE-TEC-2026-TRANS-03, TLE-TEC-2026-TRANS-04, TLE-TEC-2026-TRANS-05]
  resume: |
    - « $P$ et $Q$ » est vraie quand les deux le sont ; « $P$ ou $Q$ » quand au moins l'une l'est (« ou » inclusif).
    - Une **identité** est vraie pour toutes les valeurs ; une **équation** pose la question des valeurs de l'**inconnue** qui la rendent vraie.
    - Un seul **contre-exemple** suffit pour montrer qu'une proposition « pour tout » est fausse.
    - La réciproque de « si $P$, alors $Q$ » est « si $Q$, alors $P$ » ; si $P \Rightarrow Q$, $P$ est condition **suffisante** pour $Q$ et $Q$ condition **nécessaire** pour $P$.
  cours: |
    ## 1. Connecteurs « et », « ou »

    - « $P$ **et** $Q$ » est vraie lorsque $P$ et $Q$ sont vraies toutes les deux.
    - « $P$ **ou** $Q$ » est vraie lorsque l'une au moins est vraie : en mathématiques, le « ou » est **inclusif** (les deux peuvent être vraies).

    Exemples : $x \in [2 ; 5]$ signifie « $x \geqslant 2$ **et** $x \leqslant 5$ » ; $x \in ]-\infty ; 1[ \cup ]4 ; +\infty[$ signifie « $x < 1$ **ou** $x > 4$ ».

    > **Négation.** Le contraire de « $P$ et $Q$ » est « non $P$ **ou** non $Q$ » ; le contraire de « $P$ ou $Q$ » est « non $P$ **et** non $Q$ ».

    ## 2. Statut d'une égalité et des lettres

    - Une **identité** est vraie quelles que soient les valeurs des lettres : $(x + 1)^2 = x^2 + 2x + 1$. Les lettres y sont des **variables** (ou des indéterminées).
    - Une **équation** est une égalité dont on cherche les valeurs de l'**inconnue** qui la rendent vraie : $2x + 1 = 7$.
    - Un **paramètre** est une lettre fixée mais quelconque : dans $y = mx + p$, $m$ et $p$ sont des paramètres et $x$ la variable.
    - Dans une formule comme $d = vt$, chaque lettre peut devenir l'inconnue selon la question posée.

    ## 3. Propositions universelles et contre-exemples

    Une proposition **universelle** commence (parfois implicitement) par « pour tout » : « pour tout réel $x$, $x^2 \geqslant x$ ».

    > **Propriété.** Pour démontrer qu'une proposition universelle est **fausse**, il suffit d'exhiber **un** contre-exemple. Pour démontrer qu'elle est vraie, des exemples ne suffisent pas : il faut une démonstration.

    Ici $x = 0{,}5$ donne $x^2 = 0{,}25 < 0{,}5$ : la proposition est fausse.

    ## 4. Implication et réciproque

    « Si $P$, alors $Q$ » (noté $P \Rightarrow Q$) signifie : chaque fois que $P$ est vraie, $Q$ l'est aussi.

    **Définition.** La **réciproque** de « si $P$, alors $Q$ » est « si $Q$, alors $P$ ».

    Une implication vraie peut avoir une réciproque fausse : « si $x = 3$, alors $x^2 = 9$ » est vraie, mais sa réciproque « si $x^2 = 9$, alors $x = 3$ » est fausse ($x = -3$).

    ## 5. Condition nécessaire, condition suffisante, équivalence

    > **Vocabulaire.** Si $P \Rightarrow Q$ est vraie :
    > - $P$ est une condition **suffisante** pour $Q$ (il suffit que $P$ soit vraie pour avoir $Q$) ;
    > - $Q$ est une condition **nécessaire** pour $P$ (sans $Q$, pas de $P$).
    > Si $P \Rightarrow Q$ et sa réciproque sont vraies, $P$ et $Q$ sont **équivalentes** : $P \iff Q$ (« si et seulement si »).

    Exemple : « être un carré » $\Rightarrow$ « être un rectangle ». Être un rectangle est **nécessaire** pour être un carré, mais pas suffisant.

    ## 6. Exemple complet

    **Énoncé.** On considère « si un nombre entier est divisible par $6$, alors il est pair ». Est-elle vraie ? Sa réciproque ? Quel vocabulaire employer ?

    **Résolution.**
    1. Si $n = 6k$, alors $n = 2 \times 3k$ est pair : l'implication est vraie.
    2. Réciproque : « si un entier est pair, alors il est divisible par $6$ ». Contre-exemple : $4$ est pair mais pas divisible par $6$. Elle est fausse.
    3. Être divisible par $6$ est une condition suffisante pour être pair ; être pair est une condition nécessaire, non suffisante, pour être divisible par $6$. Les deux propositions ne sont pas équivalentes.

    ## 7. Erreurs fréquentes

    - Croire qu'une implication vraie a une réciproque vraie.
    - Comprendre « ou » comme exclusif.
    - Penser que quelques exemples démontrent une proposition universelle.
