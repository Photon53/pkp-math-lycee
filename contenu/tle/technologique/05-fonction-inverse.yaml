chapitre:
  code: TLE-TEC-INVERSE
  niveau: Tle
  parcours: technologique
  ordre: 5
  titre: Fonction inverse
competences:
- code: TLE-TEC-INV
  libelle: Étudier la fonction inverse et l'utiliser dans un problème
  attendus: [TLE-TEC-2026-ANA-21, TLE-TEC-2026-ANA-22]
  objectifs:
  - Connaitre la dérivée, les variations et les asymptotes de la fonction inverse.
  - Étudier une fonction de la forme ax + b + c/x.
  prerequis:
  - 1RE-TEC-VARIA
  cours_couvre: [TLE-TEC-2026-ANA-21, TLE-TEC-2026-ANA-22]
  resume: |
    - $f(x) = \dfrac{1}{x}$ est définie sur $\mathbb{R}^* = ]-\infty ; 0[ \cup ]0 ; +\infty[$.
    - $\dfrac{1}{x} \to 0$ en $+\infty$ et en $-\infty$ ; $\dfrac{1}{x} \to +\infty$ quand $x \to 0^+$, $\to -\infty$ quand $x \to 0^-$ : asymptotes $y = 0$ et $x = 0$.
    - $f'(x) = -\dfrac{1}{x^2} < 0$ : $f$ est décroissante sur $]-\infty ; 0[$ **et** sur $]0 ; +\infty[$ (pas sur $\mathbb{R}^*$).
    - $\left(\dfrac{k}{x}\right)' = -\dfrac{k}{x^2}$ ; pour étudier $P(x) + \dfrac{k}{x}$, on dérive, on réduit au même dénominateur $x^2$ et on étudie le signe du numérateur.
  cours: |
    ## 1. Définition

    **Définition.** La **fonction inverse** est la fonction $f : x \mapsto \dfrac{1}{x}$, définie sur $\mathbb{R}^* = ]-\infty ; 0[ \cup ]0 ; +\infty[$ (on ne divise pas par $0$).

    $f(x)$ a le même signe que $x$ : négatif sur $]-\infty ; 0[$, positif sur $]0 ; +\infty[$.

    ## 2. Comportement aux bornes

    > **Propriété.**
    > - Quand $x$ tend vers $+\infty$ ou vers $-\infty$, $\dfrac{1}{x}$ tend vers $0$.
    > - Quand $x$ tend vers $0$ en restant positif ($x \to 0^+$), $\dfrac{1}{x}$ tend vers $+\infty$ ; quand $x \to 0^-$, $\dfrac{1}{x}$ tend vers $-\infty$.

    Exemples numériques : $\dfrac{1}{1\,000} = 0{,}001$ ; $\dfrac{1}{0{,}001} = 1\,000$ ; $\dfrac{1}{-0{,}001} = -1\,000$.

    **Asymptotes.** La courbe se rapproche de l'axe des abscisses aux infinis : la droite d'équation $y = 0$ est **asymptote horizontale**. Elle « monte » ou « descend » le long de l'axe des ordonnées près de $0$ : la droite d'équation $x = 0$ est **asymptote verticale**.

    ## 3. Dérivée et sens de variation

    > **Propriété.** La fonction inverse est dérivable sur $]-\infty ; 0[$ et sur $]0 ; +\infty[$, et $$f'(x) = -\frac{1}{x^2}.$$

    **Justification.** Pour $a \neq 0$ et $h$ petit non nul, le taux d'accroissement vaut
    $$\frac{\frac{1}{a + h} - \frac{1}{a}}{h} = \frac{a - (a + h)}{h\,a(a + h)} = \frac{-1}{a(a + h)},$$
    qui se rapproche de $-\dfrac{1}{a^2}$ quand $h$ tend vers $0$.

    Comme $x^2 > 0$, on a $f'(x) < 0$ :

    | $x$ | $-\infty$ | | $0$ | | $+\infty$ |
    |:-:|:-:|:-:|:-:|:-:|:-:|
    | $f'(x)$ | | $-$ | ‖ | $-$ | |
    | $f$ | $0$ | décroît vers $-\infty$ | ‖ | décroît de $+\infty$ vers $0$ | |

    La fonction inverse est décroissante sur **chacun** des deux intervalles, mais pas sur $\mathbb{R}^*$ : $-1 < 1$ et pourtant $\dfrac{1}{-1} < \dfrac{1}{1}$.

    **Courbe.** C'est une **hyperbole** à deux branches, symétrique par rapport à l'origine, passant par $(1 ; 1)$, $(2 ; 0{,}5)$, $(0{,}5 ; 2)$ et leurs symétriques.

    ## 4. Fonctions combinant inverse et polynômes

    > **Propriété.** Pour un réel $k$, $\left(\dfrac{k}{x}\right)' = k \times \left(-\dfrac{1}{x^2}\right) = -\dfrac{k}{x^2}$. La dérivée d'une somme est la somme des dérivées.

    **Méthode : étudier $g(x) = P(x) + \dfrac{k}{x}$** ($P$ polynôme de degré au plus $3$).
    1. Dériver : $g'(x) = P'(x) - \dfrac{k}{x^2}$.
    2. Réduire au même dénominateur : $g'(x) = \dfrac{x^2 P'(x) - k}{x^2}$ ; comme $x^2 > 0$, $g'(x)$ a le signe du numérateur.
    3. Étudier ce signe, dresser le tableau de variations, calculer les extremums.

    ## 5. Exemple complet

    **Énoncé.** Pour $x$ centaines d'objets fabriqués ($x > 0$), le coût moyen est $C_M(x) = 0{,}5x + 2 + \dfrac{50}{x}$ (en euros). Étudier ses variations et trouver le coût moyen minimal.

    **Résolution.**
    1. $C_M'(x) = 0{,}5 - \dfrac{50}{x^2} = \dfrac{0{,}5x^2 - 50}{x^2} = \dfrac{0{,}5(x^2 - 100)}{x^2}$.
    2. Pour $x > 0$ : $x^2 - 100 < 0$ si $x < 10$, $> 0$ si $x > 10$. Donc $C_M$ est décroissante sur $]0 ; 10]$ et croissante sur $[10 ; +\infty[$.
    3. Minimum : $C_M(10) = 5 + 2 + 5 = 12$ €, atteint pour $1\,000$ objets.

    Autre exemple avec un polynôme de degré 2 : $h(x) = x^2 + \dfrac{16}{x}$ sur $]0 ; +\infty[$ ; $h'(x) = 2x - \dfrac{16}{x^2} = \dfrac{2(x^3 - 8)}{x^2}$, qui s'annule en $x = 2$ ; minimum $h(2) = 4 + 8 = 12$.

    ## 6. Erreurs fréquentes

    - Dire que la fonction inverse est décroissante sur $\mathbb{R}$ ou sur $\mathbb{R}^*$.
    - Écrire $\left(\dfrac{1}{x}\right)' = \dfrac{1}{x^2}$ : il manque le signe $-$.
    - Oublier la valeur interdite $0$ dans le tableau de variations (double barre).
  methodes:
  - titre: Trouver le minimum d'une fonction ax + c/x
    etapes:
    - 'Dériver : $a - \dfrac{c}{x^2}$.'
    - Réduire au même dénominateur et étudier le signe du numérateur.
    - Calculer l'image de la valeur qui annule la dérivée.
    exemple:
      enonce: $f(x) = 4x + \dfrac{9}{x}$ sur $]0 ; +\infty[$.
      resolution:
      - $f'(x) = \dfrac{4x^2 - 9}{x^2}$, nul en $x = 1{,}5$.
      resultat: Minimum $f(1{,}5) = 12$.
  erreurs_frequentes:
  - erreur: Dire que la fonction inverse est décroissante sur ℝ.
    explication: 'Elle n''est pas définie en $0$ : $-1 < 1$ mais $\dfrac{1}{-1} < \dfrac{1}{1}$.'
  questions:
  - code: TLE-TEC-INV-01
    difficulte: 1
    type: numerique
    enonce: Quelle est la limite de $\dfrac{1}{x}$ quand $x$ tend vers $+\infty$ ?
    solution: '0'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - Plus $x$ est grand, plus $\dfrac{1}{x}$ est proche de $0$.
      resultat: '0'
  - code: TLE-TEC-INV-02
    difficulte: 2
    type: expression
    enonce: Donner la dérivée de $f(x) = \dfrac{1}{x}$.
    solution: -1/x^2
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Formule de cours : $-\dfrac{1}{x^2}$.'
      resultat: -1/x^2
  - code: TLE-TEC-INV-03
    difficulte: 3
    type: qcm
    enonce: 'Sur $]0 ; +\infty[$, la fonction inverse est : A) décroissante  B) croissante  C) constante'
    solution: A
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Sur $]0 ; +\infty[$, la dérivée de la fonction inverse est $f''(x) = -\dfrac{1}{x^2}$.'
      - 'Un carré non nul est strictement positif, donc $-\dfrac{1}{x^2} < 0$ pour tout $x > 0$.'
      - 'Dérivée strictement négative : la fonction inverse est décroissante sur cet intervalle (réponse A).'
      resultat: A
  - code: TLE-TEC-INV-04
    difficulte: 4
    type: expression
    enonce: Donner la dérivée de $f(x) = 3x + \dfrac{2}{x}$.
    solution: 3 - 2/x^2
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'La dérivée d''une somme est la somme des dérivées : on dérive $3x$ et $\dfrac{2}{x}$ séparément.'
      - '$(3x)'' = 3$.'
      - '$\dfrac{2}{x} = 2 \times \dfrac{1}{x}$, donc sa dérivée est $2 \times \left(-\dfrac{1}{x^2}\right) = -\dfrac{2}{x^2}$.'
      - 'Finalement $f''(x) = 3 - \dfrac{2}{x^2}$.'
      resultat: 3 - 2/x^2
  - code: TLE-TEC-INV-05
    difficulte: 5
    type: numerique
    enonce: Le coût moyen de fabrication est $C_M(x) = x + \dfrac{100}{x}$ pour $x > 0$. Quel est le coût moyen minimal ?
    solution: '20'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $C_M'(x) = \dfrac{x^2 - 100}{x^2}$, négatif avant $10$, positif après.
      - $C_M(10) = 10 + 10 = 20$.
      resultat: '20'
