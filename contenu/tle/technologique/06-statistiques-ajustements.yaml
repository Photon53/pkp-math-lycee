chapitre:
  code: TLE-TEC-STAT
  niveau: Tle
  parcours: technologique
  ordre: 6
  titre: Séries statistiques à deux variables, changement de variable
competences:
- code: TLE-TEC-AJUST
  libelle: Utiliser un ajustement après changement de variable
  attendus: [TLE-TEC-2026-SP-01, TLE-TEC-2026-SP-02]
  objectifs:
  - Calculer un point moyen.
  - Utiliser un ajustement z = log y pour un modèle exponentiel.
  prerequis:
  - 1RE-TEC-STAT2
  - TLE-TEC-LOG
  cours_couvre: [TLE-TEC-2026-SP-01, TLE-TEC-2026-SP-02]
  resume: |
    - Point moyen d'un nuage : $G(\bar{x} ; \bar{y})$ ; la droite d'ajustement affine (moindres carrés) passe par $G$.
    - Quand le nuage $(x_i ; y_i)$ n'est pas allongé selon une droite, on pose une nouvelle variable ($z = \log y$, $x^2$, $\dfrac{1}{x}$…) et on regarde si le nuage transformé est aligné.
    - Si $z = \log y$ s'ajuste par $z = ax + b$, alors $y = 10^{ax + b} = 10^b \times (10^a)^x$ : modèle exponentiel.
    - Pour une prévision : calculer $z$ avec l'ajustement, puis **revenir à $y$** ($y = 10^z$).
  cours: |
    ## 1. Rappels sur les séries à deux variables

    Une série statistique à deux variables est une liste de couples $(x_i ; y_i)$, représentée par un **nuage de points**. Le **point moyen** est $G(\bar{x} ; \bar{y})$, où $\bar{x}$ et $\bar{y}$ sont les moyennes des $x_i$ et des $y_i$.

    Quand le nuage est allongé selon une droite, on réalise un **ajustement affine** : la calculatrice (ou le tableur) donne la droite des moindres carrés $y = ax + b$, qui passe par $G$. Elle permet d'**interpoler** ou d'**extrapoler** (prévoir).

    ## 2. Changement de variable

    **Définition.** Faire un **changement de variable**, c'est remplacer l'une des variables (ou les deux) par une fonction de celle-ci, par exemple $z = \log y$, $z = \dfrac{1}{y}$, $t = x^2$ ou $t = \dfrac{1}{x}$, puis représenter le nouveau nuage.

    > **Principe.** Si le nouveau nuage est allongé selon une droite, on fait un ajustement affine **entre les nouvelles variables**, puis on revient aux variables d'origine.

    | Allure du nuage $(x ; y)$ | Changement de variable | Modèle obtenu |
    |---|---|---|
    | croissance « de plus en plus rapide », à taux constant | $z = \log y$ | $y = k \times c^x$ (exponentiel) |
    | forme en parabole partant de l'origine | $t = x^2$ | $y = a x^2 + b$ |
    | décroissance vers une valeur limite | $t = \dfrac{1}{x}$ | $y = \dfrac{a}{x} + b$ |

    ## 3. Le cas $z = \log y$

    > **Propriété.** Si $z = \log y$ est ajusté par $z = ax + b$, alors $$y = 10^{ax + b} = 10^b \times (10^a)^x.$$ Le modèle est exponentiel, de coefficient multiplicateur $10^a$ par unité de $x$.

    **Justification.** $z = \log y \iff y = 10^z$, et $10^{ax + b} = 10^b \times 10^{ax} = 10^b \times (10^a)^x$ (propriétés des exponentielles).

    ## 4. Méthode et exemple complet

    **Énoncé.** Le nombre de bactéries (en milliers) d'une culture est relevé chaque heure :

    | $x$ (heures) | $0$ | $1$ | $2$ | $3$ | $4$ |
    |---|:-:|:-:|:-:|:-:|:-:|
    | $y$ (milliers) | $3$ | $7$ | $16$ | $37$ | $85$ |

    **Résolution.**
    1. Le nuage $(x ; y)$ « décolle » : il n'est pas aligné. On pose $z = \log y$ : $z \approx 0{,}477$ ; $0{,}845$ ; $1{,}204$ ; $1{,}568$ ; $1{,}929$.
    2. Les écarts successifs de $z$ sont presque constants (environ $0{,}36$) : le nuage $(x ; z)$ est aligné.
    3. La calculatrice donne l'ajustement $z \approx 0{,}36x + 0{,}48$.
    4. Retour à $y$ : $y \approx 10^{0{,}48} \times (10^{0{,}36})^x \approx 3{,}02 \times 2{,}29^x$ : la population est multipliée par environ $2{,}29$ chaque heure.
    5. Prévision pour $x = 6$ : $z \approx 0{,}36 \times 6 + 0{,}48 = 2{,}64$, donc $y \approx 10^{2{,}64} \approx 437$ milliers.

    ## 5. Erreurs fréquentes

    - Donner $z$ comme estimation de $y$ : il faut revenir à $y = 10^z$.
    - Faire l'ajustement sur $(x ; y)$ alors que c'est le nuage $(x ; z)$ qui est aligné.
    - Calculer $\log$ d'une valeur nulle ou négative : le changement $z = \log y$ suppose $y > 0$.
  methodes:
  - titre: Estimer y avec un ajustement en z = log y
    etapes:
    - Calculer z avec l'équation de la droite.
    - Revenir à $y = 10^z$.
    exemple:
      enonce: $z = 0{,}2x + 1$, $x = 5$.
      resolution:
      - $z = 2$.
      resultat: $y = 100$
  erreurs_frequentes:
  - erreur: Donner z comme estimation de y.
    explication: z n'est qu'une variable intermédiaire ; il faut revenir à y.
  questions:
  - code: TLE-TEC-AJUST-01
    difficulte: 1
    type: numerique
    enonce: 'Série : $x$ = 0, 1, 2, 3 et $y$ = 1, 3, 5, 11. Quelle est l''ordonnée du point moyen ?'
    solution: '5'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\dfrac{1 + 3 + 5 + 11}{4} = 5$.
      resultat: '5'
  - code: TLE-TEC-AJUST-02
    difficulte: 2
    type: numerique
    enonce: 'Série : $x$ = 0, 1, 2, 3 et $y$ = 1, 3, 5, 11. Quelle est l''abscisse du point moyen ?'
    solution: '1.5'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\dfrac{0 + 1 + 2 + 3}{4} = 1{,}5$.
      resultat: '1.5'
  - code: TLE-TEC-AJUST-03
    difficulte: 3
    type: numerique
    enonce: On pose $z = \log y$ et on obtient l'ajustement $z = 0{,}3x + 1$. Quelle valeur de $y$ ce modèle donne-t-il pour $x = 0$ ?
    solution: '10'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Pour $x = 0$, l''ajustement donne $z = 0{,}3 \times 0 + 1 = 1$.'
      - 'On revient à $y$ : $z = \log y \iff y = 10^z$.'
      - '$y = 10^1 = 10$.'
      resultat: '10'
  - code: TLE-TEC-AJUST-04
    difficulte: 4
    type: numerique
    enonce: On pose $z = \log y$ et on obtient l'ajustement $z = 0{,}3x + 1$. Quelle valeur de $y$ ce modèle donne-t-il pour $x = 10$ ?
    solution: '10000'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Pour $x = 10$, l''ajustement donne $z = 0{,}3 \times 10 + 1 = 3 + 1 = 4$.'
      - 'On revient à $y$ : $z = \log y \iff y = 10^z$.'
      - '$y = 10^4 = 10\,000$ (et non $4$, qui est la valeur de $z$).'
      resultat: '10000'
  - code: TLE-TEC-AJUST-05
    difficulte: 5
    type: numerique
    enonce: On pose $z = \log y$ et on obtient l'ajustement $z = 0{,}5x + 2$. Pour quelle valeur de $x$ le modèle donne-t-il $y = 100\,000$ ?
    solution: '6'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $y = 10^5$, donc $z = 5$.
      - $0{,}5x + 2 = 5$ donne $x = 6$.
      resultat: '6'
