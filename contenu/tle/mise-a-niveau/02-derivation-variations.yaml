chapitre:
  code: TLE-MAN-DER
  niveau: Tle
  parcours: mise-a-niveau
  ordre: 2
  titre: Bases de première, dérivation et variations
competences:
- code: TLE-MAN-DERIVATION
  libelle: Dériver, écrire une tangente et trouver un extremum
  objectifs:
  - Calculer une dérivée (somme, quotient) et un nombre dérivé.
  - Écrire une tangente et trouver un extremum.
  prerequis:
  - 1RE-DER-CALC
  - 1RE-DER-NB
  - 1RE-EXTR
  resume: |
    - $(x^n)' = nx^{n-1}$ ; $\left(\dfrac{u}{v}\right)' = \dfrac{u'v - uv'}{v^2}$.
    - Tangente en $a$ : $y = f'(a)(x - a) + f(a)$.
    - Extremum là où $f'$ s'annule en changeant de signe.
  cours: |
    ## Dérivées
    $(x^3 - 2x)' = 3x^2 - 2$ ; $\left(\dfrac{2x + 1}{x - 1}\right)' = \dfrac{2(x - 1) - (2x + 1)}{(x - 1)^2} = \dfrac{-3}{(x - 1)^2}$.

    ## Tangente
    $f(x) = x^2$ en $3$ : $f(3) = 9$, $f'(3) = 6$, donc $y = 6(x - 3) + 9 = 6x - 9$.

    ## Extremum
    $f(x) = -x^3 + 3x$ sur $[0 ; 2]$ : $f'(x) = -3(x - 1)(x + 1)$, maximum $f(1) = 2$.
  methodes:
  - titre: Trouver un maximum sur un intervalle
    etapes:
    - Calculer et factoriser f'.
    - Dresser le tableau de signes et de variations sur l'intervalle.
    - Comparer les valeurs aux extremums locaux et aux bornes.
    exemple:
      enonce: $f(x) = 4x - x^2$ sur $[0 ; 5]$.
      resolution:
      - '$f''(x) = 4 - 2x$, nul en $2$ : $f(2) = 4$.'
      resultat: Maximum 4.
  erreurs_frequentes:
  - erreur: Oublier le carré du dénominateur dans la dérivée d'un quotient.
    explication: C'est $v^2$, pas $v$.
  questions:
  - code: TLE-MAN-DERIVATION-01
    difficulte: 1
    type: expression
    enonce: Calculer la dérivée de $f(x) = x^3 - 2x$.
    solution: 3x^2 - 2
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $3x^2 - 2$.
      resultat: 3x^2 - 2
  - code: TLE-MAN-DERIVATION-02
    difficulte: 2
    type: numerique
    enonce: $f(x) = x^2$. Calculer $f'(4)$.
    solution: '8'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $f'(x) = 2x$, $f'(4) = 8$.
      resultat: '8'
  - code: TLE-MAN-DERIVATION-03
    difficulte: 3
    type: expression
    enonce: Calculer la dérivée de $f(x) = \dfrac{2x + 1}{x - 1}$.
    solution: -3/(x - 1)^2
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\dfrac{2(x - 1) - (2x + 1) \times 1}{(x - 1)^2} = \dfrac{-3}{(x - 1)^2}$.
      resultat: -3/(x - 1)^2
  - code: TLE-MAN-DERIVATION-04
    difficulte: 4
    type: expression
    enonce: Donner l'équation réduite $y = \dots$ de la tangente à la courbe de $f(x) = x^2$ au point d'abscisse 3 (expression en $x$).
    solution: 6x - 9
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $y = 6(x - 3) + 9 = 6x - 9$.
      resultat: 6x - 9
  - code: TLE-MAN-DERIVATION-05
    difficulte: 5
    type: numerique
    enonce: Quel est le maximum de $f(x) = -x^3 + 3x$ sur $[0 ; 2]$ ?
    solution: '2'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - '$f''(x) = -3x^2 + 3 = -3(x - 1)(x + 1)$ : positif sur $[0 ; 1[$, négatif sur $]1 ; 2]$.'
      - $f(1) = -1 + 3 = 2$.
      resultat: '2'
