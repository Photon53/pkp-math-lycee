chapitre:
  code: TLE-ME-PGCD
  niveau: Tle
  parcours: expertes
  ordre: 5
  titre: PGCD, théorèmes de Bézout et de Gauss
competences:
- code: TLE-ME-PGCD-CALC
  libelle: Calculer un PGCD avec l'algorithme d'Euclide
  attendus: [TLE-EXP-2019-ARITH-04, TLE-EXP-2019-ARITH-11]
  objectifs:
  - Calculer un PGCD par l'algorithme d'Euclide.
  - Reconnaitre des entiers premiers entre eux.
  prerequis:
  - TLE-ME-DIV
  resume: |
    - $\mathrm{PGCD}(a, b) = \mathrm{PGCD}(b, r)$ où $r$ est le reste de $a$ par $b$.
    - Le dernier reste non nul de l'algorithme d'Euclide est le PGCD.
    - $a$ et $b$ sont **premiers entre eux** si leur PGCD vaut 1.
  cours: |
    ## Algorithme d'Euclide
    $\mathrm{PGCD}(1071, 462)$ :
    - $1071 = 2 \times 462 + 147$
    - $462 = 3 \times 147 + 21$
    - $147 = 7 \times 21 + 0$

    Le dernier reste non nul est $21$.

    ## Expressions en n
    $\mathrm{PGCD}(2n + 3, n + 1) = \mathrm{PGCD}(n + 1, 1) = 1$ car $2n + 3 = 2(n + 1) + 1$.

    ## PPCM
    $\mathrm{PPCM}(12, 18) = 36$ : deux évènements périodiques de 12 et 18 minutes coïncident toutes les 36 minutes.
  methodes:
  - titre: Calculer un PGCD par l'algorithme d'Euclide
    etapes:
    - Diviser le plus grand par le plus petit.
    - Remplacer le couple par (diviseur, reste).
    - S'arrêter au reste nul ; le PGCD est le dernier reste non nul.
    exemple:
      enonce: $\mathrm{PGCD}(84, 30)$.
      resolution:
      - $84 = 2 \times 30 + 24$ ; $30 = 1 \times 24 + 6$ ; $24 = 4 \times 6$.
      resultat: $6$
  erreurs_frequentes:
  - erreur: Prendre le dernier reste (0) comme PGCD.
    explication: C'est le dernier reste non nul.
  questions:
  - code: TLE-ME-PGCD-CALC-01
    difficulte: 1
    type: numerique
    enonce: Calculer $\mathrm{PGCD}(12, 18)$.
    solution: '6'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Diviseurs communs : 1, 2, 3, 6.'
      resultat: '6'
  - code: TLE-ME-PGCD-CALC-02
    difficulte: 2
    type: numerique
    enonce: Calculer $\mathrm{PGCD}(1071, 462)$ par l'algorithme d'Euclide.
    solution: '21'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $1071 = 2 \times 462 + 147$ ; $462 = 3 \times 147 + 21$ ; $147 = 7 \times 21$.
      resultat: '21'
  - code: TLE-ME-PGCD-CALC-03
    difficulte: 3
    type: qcm
    enonce: Les entiers 35 et 18 sont-ils premiers entre eux ? A) oui  B) non
    solution: A
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - '$35 = 5 \times 7$ et $18 = 2 \times 3^2$ : aucun facteur commun.'
      resultat: A
  - code: TLE-ME-PGCD-CALC-04
    difficulte: 4
    type: numerique
    enonce: Pour tout entier naturel $n$, que vaut $\mathrm{PGCD}(2n + 3, n + 1)$ ?
    solution: '1'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $2n + 3 = 2(n + 1) + 1$, donc $\mathrm{PGCD}(2n + 3, n + 1) = \mathrm{PGCD}(n + 1, 1) = 1$.
      resultat: '1'
  - code: TLE-ME-PGCD-CALC-05
    difficulte: 5
    type: numerique
    enonce: Deux bus partent ensemble d'un arrêt ; l'un y repasse toutes les 12 minutes, l'autre toutes les 18 minutes. Au bout de combien de minutes repasseront-ils ensemble pour la première fois ?
    solution: '36'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - On cherche $\mathrm{PPCM}(12, 18)$.
      - '$12 = 2^2 \times 3$, $18 = 2 \times 3^2$ : $\mathrm{PPCM} = 2^2 \times 3^2 = 36$.'
      resultat: '36'
- code: TLE-ME-BEZOUT
  libelle: Utiliser les théorèmes de Bézout et de Gauss
  attendus: [TLE-EXP-2019-ARITH-05, TLE-EXP-2019-ARITH-06, TLE-EXP-2019-ARITH-07, TLE-EXP-2019-ARITH-15, TLE-EXP-2019-ARITH-16]
  objectifs:
  - Utiliser Bézout pour prouver que deux entiers sont premiers entre eux.
  - Résoudre une équation ax + by = c et utiliser le théorème de Gauss.
  prerequis:
  - TLE-ME-PGCD-CALC
  resume: |
    - **Bézout** : $a$ et $b$ premiers entre eux $\iff$ il existe $u, v$ entiers avec $au + bv = 1$.
    - $ax + by = c$ a des solutions entières si et seulement si $\mathrm{PGCD}(a, b)$ divise $c$.
    - **Gauss** : si $a$ divise $bc$ et $a$ est premier avec $b$, alors $a$ divise $c$.
  cours: |
    ## Bézout
    $7 \times 3 + 5 \times (-4) = 1$ : $7$ et $5$ sont premiers entre eux.

    ## Existence de solutions
    $6x + 9y = 4$ n'a pas de solution entière : $3$ divise $6x + 9y$ mais pas $4$.

    ## Gauss
    $3x = 7y$ : $7$ divise $3x$ et $7$ est premier avec $3$, donc $7$ divise $x$. La plus petite solution positive est $x = 7$ (avec $y = 3$).
  methodes:
  - titre: Résoudre une équation ax = by avec a et b premiers entre eux
    etapes:
    - Utiliser Gauss pour obtenir que b divise x.
    - Écrire $x = bk$, puis en déduire $y = ak$.
    exemple:
      enonce: $4x = 9y$ en entiers.
      resolution:
      - '$9$ divise $4x$ et $\mathrm{PGCD}(9, 4) = 1$ : $x = 9k$.'
      resultat: $x = 9k$, $y = 4k$ ($k$ entier).
  erreurs_frequentes:
  - erreur: Appliquer Gauss sans vérifier que les nombres sont premiers entre eux.
    explication: $6$ divise $4 \times 3$, mais $6$ ne divise ni $4$ ni $3$.
  questions:
  - code: TLE-ME-BEZOUT-01
    difficulte: 1
    type: qcm
    enonce: 'Deux entiers $a$ et $b$ sont premiers entre eux si et seulement si : A) il existe des entiers $u$ et $v$ tels que $au + bv = 1$  B) $a$ divise $b$  C) $a$ et $b$ sont tous deux premiers'
    solution: A
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - Théorème de Bézout.
      resultat: A
  - code: TLE-ME-BEZOUT-02
    difficulte: 2
    type: numerique
    enonce: Trouver l'entier $u$ tel que $5u + 3 \times (-3) = 1$.
    solution: '2'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $5u - 9 = 1$, donc $5u = 10$ et $u = 2$.
      resultat: '2'
  - code: TLE-ME-BEZOUT-03
    difficulte: 3
    type: numerique
    enonce: Trouver l'entier $x$ tel que $7x + 5 \times (-4) = 1$.
    solution: '3'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $7x - 20 = 1$, donc $7x = 21$ et $x = 3$.
      resultat: '3'
  - code: TLE-ME-BEZOUT-04
    difficulte: 4
    type: qcm
    enonce: 'L''équation $6x + 9y = 4$ : A) a des solutions entières  B) n''a aucune solution entière'
    solution: B
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\mathrm{PGCD}(6, 9) = 3$ divise $6x + 9y$ mais ne divise pas $4$.
      resultat: B
  - code: TLE-ME-BEZOUT-05
    difficulte: 5
    type: numerique
    enonce: On cherche les entiers $x$ et $y$ tels que $3x = 7y$. Quelle est la plus petite valeur strictement positive de $x$ ?
    solution: '7'
    auteur: Brouillon IA (Claude)
    correction:
      methode: Théorème de Gauss.
      etapes:
      - $7$ divise $3x$ et $\mathrm{PGCD}(7, 3) = 1$, donc $7$ divise $x$.
      - $x = 7$ convient avec $y = 3$.
      resultat: '7'

- code: TLE-ME-DIOPH
  libelle: Résoudre une congruence ax ≡ b [n] et une équation diophantienne
  attendus: [TLE-EXP-2019-ARITH-12, TLE-EXP-2019-ARITH-14]
  objectifs:
  - Déterminer un inverse de $a$ modulo $n$ quand $a$ et $n$ sont premiers entre eux.
  - Résoudre $ax \equiv b \; [n]$ et une équation $ax + by = c$ en entiers.
  prerequis:
  - TLE-ME-BEZOUT
  - TLE-ME-CONG
  methodes:
  - titre: Résoudre $ax + by = c$ en entiers
    quand: $a$ et $b$ sont des entiers et le PGCD $d$ de $a$ et $b$ divise $c$.
    etapes:
    - Trouver une solution particulière $(x_0, y_0)$ (à vue ou par l'algorithme d'Euclide étendu).
    - Soustraire $:$ $a(x - x_0) = -b(y - y_0)$.
    - Appliquer le théorème de Gauss pour obtenir toutes les solutions.
    exemple:
      enonce: Résoudre $3x + 5y = 1$.
      resolution:
      - Solution particulière $(2, -1)$.
      - $3(x - 2) = -5(y + 1)$ ; $5$ divise $3(x - 2)$ et $\text{PGCD}(3, 5) = 1$, donc $x = 2 + 5k$.
      resultat: $(2 + 5k, -1 - 3k)$, $k \in \mathbb{Z}$
  erreurs_frequentes:
  - erreur: Diviser une congruence par un nombre.
    explication: On ne divise pas modulo $n$ $:$ on multiplie par un inverse de $a$ modulo $n$, quand il existe.
  resume: |
    - $a$ a un inverse modulo $n$ si et seulement si $\text{PGCD}(a, n) = 1$ ; Bézout le fournit : $au + nv = 1$ donne $au \equiv 1 \; [n]$.
    - $ax \equiv b \; [n]$ : on multiplie par l'inverse $u$ de $a$ : $x \equiv ub \; [n]$.
    - $ax + by = c$ a des solutions entières si et seulement si $\text{PGCD}(a, b)$ divise $c$.
  cours: |
    ## Inverse modulo $n$
    $3 \times 5 = 15 \equiv 1 \; [7]$ : $5$ est un inverse de $3$ modulo $7$.

    ## Congruence linéaire
    $3x \equiv 4 \; [7]$ : on multiplie par $5$, $x \equiv 20 \equiv 6 \; [7]$.

    ## Équation diophantienne
    $3x + 5y = 1$ : solutions $(2 + 5k, -1 - 3k)$ avec $k \in \mathbb{Z}$. L'équation $4x + 6y = 3$ n'a pas de solution entière, car $\text{PGCD}(4, 6) = 2$ ne divise pas $3$.
  questions:
    - code: TLE-ME-DIOPH-01
      difficulte: 1
      type: numerique
      enonce: 'Donner l''inverse de $3$ modulo $7$, compris entre $0$ et $6$.'
      solution: 5
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $3 \times 5 = 15 = 2 \times 7 + 1$.
        resultat: 5
    - code: TLE-ME-DIOPH-02
      difficulte: 2
      type: numerique
      enonce: 'Résoudre $3x \equiv 4 \; [7]$ : donner la solution comprise entre $0$ et $6$.'
      solution: 6
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - On multiplie par $5$ $:$ $x \equiv 20 \equiv 6 \; [7]$.
        - Vérification $:$ $3 \times 6 = 18 \equiv 4 \; [7]$.
        resultat: 6
    - code: TLE-ME-DIOPH-03
      difficulte: 3
      type: qcm
      enonce: 'L''équation $4x + 6y = 3$ a-t-elle des solutions entières ? A) Non, car $\text{PGCD}(4, 6) = 2$ ne divise pas $3$  B) Oui, par exemple $x = 0$  C) Oui, une infinité'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $4x + 6y$ est toujours pair, alors que $3$ est impair.
        resultat: A
    - code: TLE-ME-DIOPH-04
      difficulte: 4
      type: qcm
      enonce: 'Quelles sont les solutions entières de $3x + 5y = 1$ ? A) $(2 + 5k, -1 - 3k)$, $k \in \mathbb{Z}$  B) $(2 + 3k, -1 - 5k)$, $k \in \mathbb{Z}$  C) $(2, -1)$ seulement'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $3(x - 2) = -5(y + 1)$ ; Gauss $:$ $5 \mid x - 2$, $x = 2 + 5k$.
        - Puis $y = -1 - 3k$ ; on vérifie $3(2 + 5k) + 5(-1 - 3k) = 1$.
        resultat: A
    - code: TLE-ME-DIOPH-05
      difficulte: 5
      type: numerique
      enonce: 'Un chiffrement affine code la lettre de rang $x$ (de $0$ à $25$) par $y \equiv 7x + 3 \; [26]$. On reçoit $y = 10$. Quel est le rang $x$ de la lettre d''origine ?'
      solution: 1
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $7x \equiv 7 \; [26]$.
        - $7 \times 15 = 105 = 4 \times 26 + 1$ $:$ l'inverse de $7$ modulo $26$ est $15$.
        - $x \equiv 15 \times 7 = 105 \equiv 1 \; [26]$.
        resultat: 1
