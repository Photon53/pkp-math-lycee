        - Restes successifs $:$ $54$, $36$, $18$, $0$.
        resultat: 18
    - code: TLE-ME-PREM-ALGO-02
      difficulte: 2
      type: numerique
      enonce: 'La fonction `facteurs(360)` renvoie la liste des facteurs premiers de $360$, avec répétition. Combien d''éléments contient cette liste ?'
      solution: 6
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $360 = 2^3 \times 3^2 \times 5$ $:$ la liste est `[2, 2, 2, 3, 3, 5]`.
        resultat: 6
    - code: TLE-ME-PREM-ALGO-03
      difficulte: 3
      type: numerique
      enonce: 'Dans le crible d''Ératosthène jusqu''à $100$, quel est le plus grand nombre premier dont il faut rayer les multiples ?'
      solution: 7
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - 'Un entier composé $m \leqslant 100$ a un diviseur premier $p$ tel que $p \leqslant \sqrt{m} \leqslant 10$.'
        - 'Il suffit donc de rayer les multiples des nombres premiers inférieurs ou égaux à $10$ : $2, 3, 5, 7$.'
        - 'Le plus grand est $7$ (les multiples composés de $11$ inférieurs à $100$, comme $77$, sont déjà rayés comme multiples d''un premier plus petit).'
        resultat: 7
    - code: TLE-ME-PREM-ALGO-04
      difficulte: 4
      type: qcm
      enonce: 'Dans la démonstration de l''infinité des nombres premiers, on pose $N = p_1 p_2 \cdots p_n + 1$. Pourquoi aucun $p_i$ ne divise-t-il $N$ ? A) Parce qu''il diviserait alors $1$  B) Parce que $N$ est premier  C) Parce que $N$ est impair'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - 'Supposons que $p_i$ divise $N$. Il divise aussi le produit $p_1 p_2 \cdots p_n$, dont il est un facteur.'
        - 'Il divise alors la différence $N - p_1 p_2 \cdots p_n = 1$.'
        - 'Aucun nombre premier ne divise $1$ : contradiction, donc aucun $p_i$ ne divise $N$ (réponse A).'
        resultat: A
    - code: TLE-ME-PREM-ALGO-05
      difficulte: 5
      type: qcm
      enonce: 'L''entier $30\,031 = 2 \times 3 \times 5 \times 7 \times 11 \times 13 + 1$ vaut $59 \times 509$. Que montre cet exemple ? A) $N = p_1 \cdots p_n + 1$ n''est pas toujours premier, mais ses facteurs premiers sont hors de la liste  B) La démonstration de l''infinité des nombres premiers est fausse  C) $59$ divise l''un des nombres $2, 3, 5, 7, 11, 13$'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - La démonstration n'affirme pas que $N$ est premier, seulement qu'il a un diviseur premier absent de la liste.
        - $59$ et $509$ sont bien des premiers qui ne figurent pas parmi $2, \ldots, 13$.
        resultat: A
