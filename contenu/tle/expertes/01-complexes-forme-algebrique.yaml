- code: TLE-ME-POLY
  libelle: Factoriser un polynôme dont une racine est connue
  attendus: [TLE-EXP-2019-TRIGPOLY-10, TLE-EXP-2019-TRIGPOLY-11, TLE-EXP-2019-TRIGPOLY-12, TLE-EXP-2019-TRIGPOLY-14, TLE-EXP-2019-TRIGPOLY-15, TLE-EXP-2019-TRIGPOLY-16, TLE-EXP-2019-TRIGPOLY-17]
  objectifs:
  - Factoriser $z^n - a^n$ par $z - a$, et un polynôme $P$ par $z - a$ quand $P(a) = 0$.
  - Résoudre une équation de degré $3$ à coefficients réels dont une racine est connue.
  - Savoir qu'un polynôme de degré $n$ a au plus $n$ racines.
  prerequis:
  - TLE-ME-CPLX-EQ
  methodes:
  - titre: Résoudre une équation de degré 3 avec une racine connue
    quand: On connaît (ou on devine) une racine $a$ de $P(z) = 0$.
    etapes:
    - Vérifier que $P(a) = 0$.
    - Écrire $P(z) = (z - a)(\alpha z^2 + \beta z + \gamma)$ et identifier les coefficients.
    - Résoudre l'équation du second degré restante (éventuellement dans $\mathbb{C}$).
    exemple:
      enonce: Résoudre $z^3 - 1 = 0$.
      resolution:
      - $1$ est racine ; $z^3 - 1 = (z - 1)(z^2 + z + 1)$.
      - $z^2 + z + 1 = 0$ $:$ $\Delta = -3$, $z = \dfrac{-1 \pm i\sqrt{3}}{2}$.
      resultat: $\left\{1 ; \dfrac{-1 + i\sqrt{3}}{2} ; \dfrac{-1 - i\sqrt{3}}{2}\right\}$
  erreurs_frequentes:
  - erreur: Oublier les solutions complexes non réelles.
    explication: Dans $\mathbb{C}$, un polynôme de degré $3$ à coefficients réels a toujours $3$ racines (comptées avec multiplicité).
  cours_couvre: [TLE-EXP-2019-TRIGPOLY-10, TLE-EXP-2019-TRIGPOLY-11, TLE-EXP-2019-TRIGPOLY-12, TLE-EXP-2019-TRIGPOLY-14, TLE-EXP-2019-TRIGPOLY-15, TLE-EXP-2019-TRIGPOLY-16, TLE-EXP-2019-TRIGPOLY-17]
  resume: |
    - $z^n - a^n = (z - a)(z^{n-1} + az^{n-2} + \dots + a^{n-2}z + a^{n-1})$.
    - Si $P(a) = 0$, alors $P(z) = (z - a)Q(z)$ avec $\deg Q = \deg P - 1$ ; on trouve $Q$ par identification des coefficients.
    - Un polynôme non nul de degré $n$ a **au plus $n$ racines** dans $\mathbb{C}$.
    - Degré 3 à coefficients réels avec une racine connue : factoriser, puis résoudre le facteur du second degré (éventuellement $\Delta < 0$).
  cours: |
    ## 1. Vocabulaire

    Un **polynôme** de degré $n$ est une fonction $P(z) = c_n z^n + \dots + c_1 z + c_0$ avec $c_n \neq 0$. Un nombre $a$ est une **racine** de $P$ si $P(a) = 0$.

    ## 2. Factorisation de $z^n - a^n$

    > **Propriété.** Pour tous complexes $z$, $a$ et tout entier $n \geqslant 1$ : $$z^n - a^n = (z - a)\sum_{k=0}^{n-1} a^k z^{n-1-k} = (z - a)(z^{n-1} + a z^{n-2} + \dots + a^{n-1}).$$

    **Démonstration.** On développe :
    $$(z - a)\sum_{k=0}^{n-1} a^k z^{n-1-k} = \sum_{k=0}^{n-1} a^k z^{n-k} - \sum_{k=0}^{n-1} a^{k+1} z^{n-1-k}.$$
    La seconde somme est $\displaystyle\sum_{j=1}^{n} a^j z^{n-j}$ (avec $j = k + 1$). Tous les termes s'éliminent sauf $z^n$ (pour $k = 0$) et $-a^n$ (pour $j = n$).

    Exemples : $z^3 - 1 = (z - 1)(z^2 + z + 1)$ ; $z^4 - 16 = (z - 2)(z^3 + 2z^2 + 4z + 8)$.

    ## 3. Factorisation par $z - a$ quand $P(a) = 0$

    > **Théorème.** Si $P$ est un polynôme de degré $n \geqslant 1$ et $P(a) = 0$, il existe un polynôme $Q$ de degré $n - 1$ tel que $P(z) = (z - a)Q(z)$.

    **Démonstration.** Écrivons $P(z) = \sum_{k=0}^{n} c_k z^k$. Comme $P(a) = 0$ : $P(z) = P(z) - P(a) = \sum_{k=1}^{n} c_k (z^k - a^k)$. D'après le paragraphe 2, chaque $z^k - a^k$ s'écrit $(z - a)$ fois un polynôme de degré $k - 1$. En factorisant par $z - a$, on obtient $P(z) = (z - a)Q(z)$, et le terme de plus haut degré de $Q$ est $c_n z^{n-1}$.

    ## 4. Nombre de racines

    > **Théorème.** Un polynôme non nul de degré $n$ admet au plus $n$ racines distinctes dans $\mathbb{C}$.

    **Démonstration, par récurrence sur $n$.** Un polynôme de degré $0$ est une constante non nulle : aucune racine. Supposons le résultat vrai pour le degré $n - 1$, et soit $P$ de degré $n$. Si $P$ n'a pas de racine, c'est fini. Sinon, soit $a$ une racine : $P(z) = (z - a)Q(z)$ avec $\deg Q = n - 1$. Un produit de complexes est nul si et seulement si l'un des facteurs l'est, donc les racines de $P$ sont $a$ et les racines de $Q$, qui sont au plus $n - 1$. $P$ a donc au plus $n$ racines.

    **Conséquence.** Un polynôme de degré au plus $n$ qui s'annule en $n + 1$ valeurs distinctes est le polynôme nul.

    ## 5. Méthode : résoudre une équation de degré 3 dont une racine est connue

    1. Vérifier que $P(a) = 0$ (racine évidente : tester $0$, $1$, $-1$, $2$, $-2$, $i$…).
    2. Écrire $P(z) = (z - a)(\alpha z^2 + \beta z + \gamma)$, développer et **identifier** les coefficients.
    3. Résoudre $\alpha z^2 + \beta z + \gamma = 0$ avec le discriminant.

    ## 6. Exemple complet

    **Énoncé.** Résoudre dans $\mathbb{C}$ : $z^3 - z^2 + 2 = 0$.

    **Résolution.**
    1. $P(-1) = -1 - 1 + 2 = 0$ : $-1$ est racine.
    2. $(z + 1)(\alpha z^2 + \beta z + \gamma) = \alpha z^3 + (\alpha + \beta)z^2 + (\beta + \gamma)z + \gamma$. On identifie avec $z^3 - z^2 + 0z + 2$ : $\alpha = 1$, $\alpha + \beta = -1$ donc $\beta = -2$, $\gamma = 2$ (et $\beta + \gamma = 0$ ✓).
    3. $z^2 - 2z + 2 = 0$ : $\Delta = 4 - 8 = -4$, solutions $\dfrac{2 \pm 2i}{2} = 1 \pm i$.
    4. Solutions : $-1$, $1 - i$, $1 + i$. Il y en a $3$, le maximum possible pour un degré $3$.

    ## 7. Erreurs fréquentes

    - Oublier les solutions complexes non réelles du facteur du second degré.
    - Se tromper de signe : si $a$ est racine, le facteur est $z - a$ (ici $z + 1$ pour $a = -1$).
    - Oublier de vérifier le dernier coefficient lors de l'identification.
  questions:
    - code: TLE-ME-POLY-01
      difficulte: 1
      type: numerique
      enonce: 'Soit $P(z) = z^3 - 3z^2 + 4z - 2$. Calculer $P(1)$.'
      solution: 0
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $1 - 3 + 4 - 2 = 0$ $:$ $1$ est racine de $P$.
        resultat: 0
    - code: TLE-ME-POLY-02
      difficulte: 2
      type: expression
      enonce: 'Compléter la factorisation $z^3 - 1 = (z - 1)(\ldots)$ en donnant le second facteur.'
      solution: z^2 + z + 1
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $z^n - a^n = (z - a)(z^{n - 1} + \cdots + a^{n - 1})$ avec $n = 3$, $a = 1$.
        resultat: z^2 + z + 1
    - code: TLE-ME-POLY-03
      difficulte: 3
      type: qcm
      enonce: 'On a $z^3 - 3z^2 + 4z - 2 = (z - 1)(z^2 + bz + c)$. Que valent $b$ et $c$ ? A) $b = -2$ et $c = 2$  B) $b = 2$ et $c = -2$  C) $b = -3$ et $c = 4$'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - En développant $:$ $z^3 + (b - 1)z^2 + (c - b)z - c$.
        - Identification $:$ $b - 1 = -3$ et $-c = -2$, donc $b = -2$, $c = 2$.
        resultat: A
    - code: TLE-ME-POLY-04
      difficulte: 4
      type: qcm
      enonce: 'Quelles sont les solutions dans $\mathbb{C}$ de $z^3 - 3z^2 + 4z - 2 = 0$ ? A) $1$, $1 + i$, $1 - i$  B) $1$ seulement  C) $1$, $2$, $-1$'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $(z - 1)(z^2 - 2z + 2) = 0$.
        - $z^2 - 2z + 2 = 0$ $:$ $\Delta = -4$, $z = 1 \pm i$.
        resultat: A
    - code: TLE-ME-POLY-05
      difficulte: 5
      type: qcm
      enonce: 'Un polynôme $P$ de degré $4$ s''annule en $5$ nombres complexes distincts. Que peut-on en conclure ? A) C''est impossible : $P$ est en fait le polynôme nul  B) $P$ a exactement $5$ racines  C) $P$ est de degré $5$'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - Un polynôme non nul de degré $4$ a au plus $4$ racines.
        - Avoir $5$ racines distinctes force $P$ à être le polynôme nul, qui n'est pas de degré $4$ $:$ la situation est impossible.
        resultat: A
