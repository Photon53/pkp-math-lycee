      enonce: 'Quelle est la forme algébrique de $(1 + i)^2$ ? A) $2i$  B) $2$  C) $1 + i^2$'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $1 + 2i + i^2 = 1 + 2i - 1 = 2i$.
        resultat: A
    - code: TLE-ME-BINOME-03
      difficulte: 3
      type: qcm
      enonce: 'Quelle est la forme algébrique de $(1 + i)^3$ ? A) $-2 + 2i$  B) $1 - i$  C) $2 + 2i$'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - 'Binôme avec $n = 3$ (coefficients $1, 3, 3, 1$) : $(1 + i)^3 = 1 + 3i + 3i^2 + i^3$.'
        - '$i^2 = -1$ et $i^3 = -i$ : $(1 + i)^3 = 1 + 3i - 3 - i$.'
        - 'On regroupe : $-2 + 2i$ (réponse A).'
        resultat: A
    - code: TLE-ME-BINOME-04
      difficulte: 4
      type: numerique
      enonce: 'Calculer la partie réelle de $(2 + i)^3$.'
      solution: 2
      auteur: Brouillon IA (Claude)
