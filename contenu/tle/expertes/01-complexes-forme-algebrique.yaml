        etapes:
        - 'Binôme : $(2 + i)^3 = 2^3 + 3 \times 2^2 \times i + 3 \times 2 \times i^2 + i^3$.'
        - '$= 8 + 12i - 6 - i$, car $i^2 = -1$ et $i^3 = -i$.'
        - '$= 2 + 11i$ : la partie réelle vaut $2$.'
