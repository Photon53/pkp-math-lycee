        - 'Plutôt que de développer à l''ordre $8$, on calcule d''abord $(1 + i)^2 = 1 + 2i + i^2 = 2i$.'
        - '$(1 + i)^8 = \left((1 + i)^2\right)^4 = (2i)^4 = 2^4 \times i^4$.'
        - '$i^4 = (i^2)^2 = 1$, donc $(1 + i)^8 = 16$.'
