chapitre:
  code: TLE-ME-MAT
  niveau: Tle
  parcours: expertes
  ordre: 7
  titre: Matrices et systèmes linéaires
competences:
- code: TLE-ME-MAT-CALC
  libelle: Calculer avec des matrices
  attendus: [TLE-EXP-2019-GRAPHMAT-03, TLE-EXP-2019-GRAPHMAT-05, TLE-EXP-2019-GRAPHMAT-12, TLE-EXP-2019-GRAPHMAT-14]
  objectifs:
  - Additionner et multiplier des matrices.
  - Calculer des puissances et l'inverse d'une matrice carrée d'ordre 2.
  resume: |
    - Coefficient $(i, j)$ du produit $AB$ : ligne $i$ de $A$ « fois » colonne $j$ de $B$.
    - En général $AB \neq BA$.
    - $M = \begin{pmatrix} a & b \\ c & d \end{pmatrix}$ est inversible si $ad - bc \neq 0$, et $M^{-1} = \dfrac{1}{ad - bc}\begin{pmatrix} d & -b \\ -c & a \end{pmatrix}$.
  cours: |
    ## Produit
    $$\begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}\begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix} = \begin{pmatrix} 2 & 1 \\ 4 & 3 \end{pmatrix}.$$

    ## Puissances
    $A = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$ : on conjecture (et on démontre par récurrence) $A^n = \begin{pmatrix} 1 & n \\ 0 & 1 \end{pmatrix}$.

    ## Inverse
    $M = \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}$ : $ad - bc = 1$, donc $M^{-1} = \begin{pmatrix} 1 & -1 \\ -1 & 2 \end{pmatrix}$.
  methodes:
  - titre: Inverser une matrice d'ordre 2
    etapes:
    - Calculer ad − bc et vérifier qu'il est non nul.
    - Échanger a et d, changer le signe de b et c.
    - Diviser par ad − bc.
    exemple:
      enonce: $M = \begin{pmatrix} 4 & 3 \\ 1 & 1 \end{pmatrix}$.
      resolution:
      - $ad - bc = 4 - 3 = 1$.
      resultat: $M^{-1} = \begin{pmatrix} 1 & -3 \\ -1 & 4 \end{pmatrix}$
  erreurs_frequentes:
  - erreur: Multiplier les matrices coefficient par coefficient.
    explication: Le produit se fait ligne par colonne.
  questions:
  - code: TLE-ME-MAT-CALC-01
    difficulte: 1
    type: numerique
    enonce: $A = \begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$ et $B = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$. Quel est le coefficient en ligne 1, colonne 1 de $A + B$ ?
    solution: '1'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $1 + 0 = 1$.
      resultat: '1'
  - code: TLE-ME-MAT-CALC-02
    difficulte: 2
    type: numerique
    enonce: $A = \begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$ et $B = \begin{pmatrix} 0 & 1 \\ 1 & 0 \end{pmatrix}$. Quel est le coefficient en ligne 1, colonne 1 de $AB$ ?
    solution: '2'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Ligne 1 de $A$ par colonne 1 de $B$ : $1 \times 0 + 2 \times 1 = 2$.'
      resultat: '2'
  - code: TLE-ME-MAT-CALC-03
    difficulte: 3
    type: numerique
    enonce: Calculer $ad - bc$ pour $A = \begin{pmatrix} 1 & 2 \\ 3 & 4 \end{pmatrix}$.
    solution: '-2'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $1 \times 4 - 2 \times 3 = -2$.
      resultat: '-2'
  - code: TLE-ME-MAT-CALC-04
    difficulte: 4
    type: numerique
    enonce: $A = \begin{pmatrix} 1 & 1 \\ 0 & 1 \end{pmatrix}$. Quel est le coefficient en ligne 1, colonne 2 de $A^{10}$ ?
    solution: '10'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - '$A^2 = \begin{pmatrix} 1 & 2 \\ 0 & 1 \end{pmatrix}$, $A^3 = \begin{pmatrix} 1 & 3 \\ 0 & 1 \end{pmatrix}$ : $A^n = \begin{pmatrix} 1 & n \\ 0 & 1 \end{pmatrix}$.'
      resultat: '10'
  - code: TLE-ME-MAT-CALC-05
    difficulte: 5
    type: numerique
    enonce: $M = \begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}$. Quel est le coefficient en ligne 2, colonne 2 de $M^{-1}$ ?
    solution: '2'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $ad - bc = 1$ ; $M^{-1} = \begin{pmatrix} 1 & -1 \\ -1 & 2 \end{pmatrix}$.
      resultat: '2'
  - code: TLE-ME-MAT-CALC-V1
    difficulte: 2
    type: numerique
    gabarit:
      parametres: {a: {entre: [-4, 5]}, b: {entre: [-4, 5]}, c: {entre: [-4, 5]}, d: {entre: [-4, 5]}, e: {entre: [-4, 5]}, f: {entre: [-4, 5]}}
      calculs: {p: "a*e + b*f"}
    enonce: 'Soit $A = \begin{pmatrix} [[a]] & [[b]] \\ [[c]] & [[d]] \end{pmatrix}$ et $X = \begin{pmatrix} [[e]] \\ [[f]] \end{pmatrix}$. Calculer le premier coefficient de $AX$.'
    solution: '[[p]]'
    auteur: Brouillon IA (Claude)
    correction:
      methode: 'Ligne de $A$ fois colonne de $X$.'
      etapes:
      - 'Première ligne de $A$ : $([[a]] \;\; [[b]])$.'
      - '$[[a]] \times ([[e]]) + [[b]] \times ([[f]]) = [[p]]$.'
      resultat: '[[p]]'
- code: TLE-ME-MAT-SYS
  libelle: Résoudre un système linéaire avec une matrice inverse
  attendus: [TLE-EXP-2019-GRAPHMAT-04]
  objectifs:
  - Écrire un système sous la forme MX = B.
  - Le résoudre avec l'inverse de M.
  prerequis:
  - TLE-ME-MAT-CALC
  - 2NDE-SYST
  resume: |
    - Le système $\begin{cases} ax + by = e \\ cx + dy = f \end{cases}$ s'écrit $MX = B$.
    - Si $M$ est inversible : $X = M^{-1}B$.
  cours: |
    ## Écriture matricielle
    $\begin{cases} 3x + y = 4 \\ 5x + 2y = 7 \end{cases}$ s'écrit $\begin{pmatrix} 3 & 1 \\ 5 & 2 \end{pmatrix}\begin{pmatrix} x \\ y \end{pmatrix} = \begin{pmatrix} 4 \\ 7 \end{pmatrix}$.

    ## Résolution
    $ad - bc = 1$ : $M^{-1} = \begin{pmatrix} 2 & -1 \\ -5 & 3 \end{pmatrix}$ et $X = M^{-1}B = \begin{pmatrix} 8 - 7 \\ -20 + 21 \end{pmatrix} = \begin{pmatrix} 1 \\ 1 \end{pmatrix}$.
  methodes:
  - titre: Résoudre MX = B
    etapes:
    - Écrire M et B à partir du système.
    - Calculer M⁻¹.
    - Calculer $X = M^{-1}B$.
    exemple:
      enonce: $\begin{cases} 2x + y = 5 \\ x + y = 3 \end{cases}$
      resolution:
      - $M^{-1} = \begin{pmatrix} 1 & -1 \\ -1 & 2 \end{pmatrix}$, $X = \begin{pmatrix} 2 \\ 1 \end{pmatrix}$.
      resultat: $x = 2$, $y = 1$
  erreurs_frequentes:
  - erreur: Calculer BM⁻¹ au lieu de M⁻¹B.
    explication: Le produit matriciel n'est pas commutatif ; B est une colonne, elle se place à droite.
  questions:
  - code: TLE-ME-MAT-SYS-01
    difficulte: 1
    type: qcm
    enonce: 'Le système $2x + y = 5$, $x - y = 1$ s''écrit $MX = B$ avec $M$ égale à : A) $\begin{pmatrix} 2 & 1 \\ 1 & -1 \end{pmatrix}$  B) $\begin{pmatrix} 2 & 1 \\ 1 & 1 \end{pmatrix}$  C) $\begin{pmatrix} 5 & 1 \\ 1 & -1 \end{pmatrix}$'
    solution: A
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - Chaque ligne de M contient les coefficients de x et de y d'une équation.
      resultat: A
  - code: TLE-ME-MAT-SYS-02
    difficulte: 2
    type: numerique
    enonce: Résoudre le système $2x + y = 5$, $x - y = 1$. Donner $x$.
    solution: '2'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'En additionnant : $3x = 6$, donc $x = 2$ (et $y = 1$).'
      resultat: '2'
  - code: TLE-ME-MAT-SYS-03
    difficulte: 3
    type: numerique
    enonce: $M = \begin{pmatrix} 1 & 2 \\ 0 & 3 \end{pmatrix}$ et $X = \begin{pmatrix} 1 \\ 1 \end{pmatrix}$. Quel est le premier coefficient de $MX$ ?
    solution: '3'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $1 \times 1 + 2 \times 1 = 3$.
      resultat: '3'
  - code: TLE-ME-MAT-SYS-04
    difficulte: 4
    type: numerique
    enonce: $M = \begin{pmatrix} 3 & 1 \\ 5 & 2 \end{pmatrix}$. Quel est le coefficient en ligne 1, colonne 1 de $M^{-1}$ ?
    solution: '2'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $ad - bc = 6 - 5 = 1$ ; $M^{-1} = \begin{pmatrix} 2 & -1 \\ -5 & 3 \end{pmatrix}$.
      resultat: '2'
  - code: TLE-ME-MAT-SYS-05
    difficulte: 5
    type: numerique
    enonce: Résoudre le système $3x + y = 4$, $5x + 2y = 7$ à l'aide d'une matrice inverse. Donner $y$.
    solution: '1'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $M^{-1} = \begin{pmatrix} 2 & -1 \\ -5 & 3 \end{pmatrix}$.
      - $y = -5 \times 4 + 3 \times 7 = 1$ (et $x = 2 \times 4 - 7 = 1$).
      resultat: '1'

- code: TLE-ME-MAT-SUITE
  libelle: Étudier une suite de matrices Uₙ₊₁ = AUₙ + C
  attendus: [TLE-EXP-2019-GRAPHMAT-06, TLE-EXP-2019-GRAPHMAT-15]
  objectifs:
  - Traduire deux suites récurrentes couplées par une relation matricielle.
  - Exprimer $U_n$ en fonction de $n$ à l'aide des puissances d'une matrice, éventuellement après un changement de suite.
  prerequis:
  - TLE-ME-MAT-CALC
  - TLE-ME-MAT-SYS
  methodes:
  - titre: Résoudre $U_{n+1} = AU_n + C$
    quand: La matrice $I - A$ est inversible.
    etapes:
    - Chercher la matrice constante $L$ telle que $L = AL + C$ $:$ $L = (I - A)^{-1}C$.
    - Poser $V_n = U_n - L$ $:$ alors $V_{n+1} = AV_n$, donc $V_n = A^n V_0$.
    - Conclure $:$ $U_n = A^n(U_0 - L) + L$.
    exemple:
      enonce: $u_{n+1} = 0{,}5u_n + 2$ vu comme une matrice $1 \times 1$.
      resolution:
      - $L = 0{,}5L + 2$ donne $L = 4$.
      - $u_n = 0{,}5^n(u_0 - 4) + 4$.
      resultat: $u_n = 4 + 0{,}5^n(u_0 - 4)$
  erreurs_frequentes:
  - erreur: Écrire $U_n = A^n U_0 + nC$.
    explication: La constante $C$ est elle aussi multipliée par $A$ à chaque étape ; il faut passer par la suite $V_n = U_n - L$.
  resume: |
    - Deux suites couplées $u_{n+1} = au_n + bv_n$, $v_{n+1} = cu_n + dv_n$ s'écrivent $U_{n+1} = AU_n$ avec $U_n = \begin{pmatrix} u_n \\ v_n \end{pmatrix}$.
    - Si $U_{n+1} = AU_n$, alors $U_n = A^n U_0$.
    - Si $U_{n+1} = AU_n + C$ et $L = AL + C$, alors $U_n = A^n(U_0 - L) + L$.
  cours: |
    ## Écriture matricielle
    Chaque année, $90\,\%$ des abonnés d'un opérateur restent et $20\,\%$ des clients du concurrent le rejoignent. Avec $U_n = \begin{pmatrix} a_n \\ b_n \end{pmatrix}$ : $U_{n+1} = \begin{pmatrix} 0{,}9 & 0{,}2 \\ 0{,}1 & 0{,}8 \end{pmatrix} U_n$.

    ## Avec une constante
    $U_{n+1} = AU_n + C$ : on cherche l'état d'équilibre $L$, puis on étudie l'écart $U_n - L$, qui vérifie une relation sans constante.
  questions:
    - code: TLE-ME-MAT-SUITE-01
      difficulte: 1
      type: numerique
      enonce: 'On a $U_{n+1} = AU_n$ avec $A = \begin{pmatrix} 2 & 0 \\ 0 & 3 \end{pmatrix}$ et $U_0 = \begin{pmatrix} 1 \\ 1 \end{pmatrix}$. Quelle est la seconde coordonnée de $U_2$ ?'
      solution: 9
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $U_2 = A^2 U_0$ et $A^2 = \begin{pmatrix} 4 & 0 \\ 0 & 9 \end{pmatrix}$.
        resultat: 9
    - code: TLE-ME-MAT-SUITE-02
      difficulte: 2
      type: numerique
      enonce: 'Avec $A = \begin{pmatrix} 0{,}9 & 0{,}2 \\ 0{,}1 & 0{,}8 \end{pmatrix}$ et $U_0 = \begin{pmatrix} 1\,000 \\ 500 \end{pmatrix}$, calculer la première coordonnée de $U_1 = AU_0$.'
      solution: 1000
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $0{,}9 \times 1\,000 + 0{,}2 \times 500 = 900 + 100 = 1\,000$.
        resultat: 1000
    - code: TLE-ME-MAT-SUITE-03
      difficulte: 3
      type: numerique
      enonce: 'La suite $(u_n)$ vérifie $u_{n+1} = 0{,}5u_n + 2$. Quelle est la valeur $L$ telle que $L = 0{,}5L + 2$ ?'
      solution: 4
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $0{,}5L = 2$, donc $L = 4$.
        resultat: 4
    - code: TLE-ME-MAT-SUITE-04
      difficulte: 4
      type: qcm
      enonce: 'On a $U_{n+1} = AU_n + C$ et une matrice $L$ vérifiant $L = AL + C$. On pose $V_n = U_n - L$. Quelle relation vérifie $(V_n)$ ? A) $V_{n+1} = AV_n$  B) $V_{n+1} = AV_n + C$  C) $V_{n+1} = V_n + C$'
      solution: A
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $V_{n+1} = AU_n + C - (AL + C) = A(U_n - L) = AV_n$.
        resultat: A
    - code: TLE-ME-MAT-SUITE-05
      difficulte: 5
      type: numerique
      enonce: 'Avec $A = \begin{pmatrix} 0{,}5 & 0 \\ 0 & 0{,}5 \end{pmatrix}$, $C = \begin{pmatrix} 2 \\ 1 \end{pmatrix}$, $U_{n+1} = AU_n + C$ et $U_0 = \begin{pmatrix} 0 \\ 0 \end{pmatrix}$, vers quelle valeur tend la première coordonnée de $U_n$ ?'
      solution: 4
      auteur: Brouillon IA (Claude)
      correction:
        etapes:
        - $L = (I - A)^{-1}C = 2C$, soit $L = \begin{pmatrix} 4 \\ 2 \end{pmatrix}$.
        - $U_n = A^n(U_0 - L) + L$ et $A^n$ tend vers la matrice nulle $:$ $U_n$ tend vers $L$.
        resultat: 4
