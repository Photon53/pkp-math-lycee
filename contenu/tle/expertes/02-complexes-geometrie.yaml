chapitre:
  code: TLE-ME-CGEO
  niveau: Tle
  parcours: expertes
  ordre: 2
  titre: Module, argument et géométrie
competences:
- code: TLE-ME-CPLX-TRIG
  libelle: Utiliser module, argument et forme exponentielle
  attendus: [TLE-EXP-2019-CPLX-10, TLE-EXP-2019-CPLX-11, TLE-EXP-2019-CPLX-12, TLE-EXP-2019-CPLX-14, TLE-EXP-2019-CPLX-15, TLE-EXP-2019-CPLX-16, TLE-EXP-2019-CPLX-17, TLE-EXP-2019-CPLX-18, TLE-EXP-2019-TRIGPOLY-02, TLE-EXP-2019-TRIGPOLY-05, TLE-EXP-2019-TRIGPOLY-06]
  objectifs:
  - Calculer module et argument d'un nombre complexe.
  - Utiliser la forme exponentielle pour calculer des puissances.
  prerequis:
  - TLE-ME-CPLX-ALG
  - 1RE-COSSIN
  cours_couvre: [TLE-EXP-2019-CPLX-10, TLE-EXP-2019-CPLX-11, TLE-EXP-2019-CPLX-12, TLE-EXP-2019-CPLX-14, TLE-EXP-2019-CPLX-15, TLE-EXP-2019-CPLX-16, TLE-EXP-2019-CPLX-17, TLE-EXP-2019-CPLX-18, TLE-EXP-2019-TRIGPOLY-02, TLE-EXP-2019-TRIGPOLY-05, TLE-EXP-2019-TRIGPOLY-06]
  resume: |
    - $z = a + ib$ a pour image $M(a ; b)$ ; $|z| = \sqrt{a^2 + b^2} = OM$, $|z|^2 = z\bar z$, $|zz'| = |z||z'|$, $|z^n| = |z|^n$.
    - Un argument $\theta$ de $z \neq 0$ vérifie $\cos\theta = \dfrac{a}{|z|}$, $\sin\theta = \dfrac{b}{|z|}$ ; il est défini à $2\pi$ près.
    - Forme exponentielle : $z = re^{i\theta}$ avec $e^{i\theta} = \cos\theta + i\sin\theta$ et $e^{i\theta}e^{i\theta'} = e^{i(\theta + \theta')}$.
    - $\arg(zz') = \arg z + \arg z'$, $\arg(z^n) = n\arg z$, $\arg\left(\dfrac{1}{z}\right) = -\arg z$ (modulo $2\pi$) : forme exponentielle pour produits et puissances.
  cours: |
    ## 1. Représentation géométrique

    Le plan est muni d'un repère orthonormé direct $(O ; \vec u, \vec v)$.

    **Définitions.** Le point $M(a ; b)$ est l'**image** de $z = a + ib$, et $z$ est l'**affixe** de $M$. Le vecteur $\vec w(a ; b)$ a aussi pour affixe $z$. Si $A$ et $B$ ont pour affixes $z_A$ et $z_B$, le vecteur $\overrightarrow{AB}$ a pour affixe $z_B - z_A$.

    L'image de $\bar z$ est le **symétrique** de $M$ par rapport à l'axe des abscisses ; celle de $-z$ est son symétrique par rapport à $O$.

    ## 2. Module

    **Définition.** Le module de $z = a + ib$ est $|z| = \sqrt{a^2 + b^2}$. C'est la distance $OM$. Pour un réel, c'est la valeur absolue.

    > **Propriétés.** Pour tous complexes $z$, $z'$ et tout entier naturel $n$ :
    > $$|z|^2 = z\bar z, \qquad |zz'| = |z|\,|z'|, \qquad |z^n| = |z|^n, \qquad \left|\frac{1}{z}\right| = \frac{1}{|z|} \ (z \neq 0), \qquad |z_B - z_A| = AB.$$

    **Démonstrations.**
    - $z\bar z = (a + ib)(a - ib) = a^2 - i^2 b^2 = a^2 + b^2 = |z|^2$.
    - $|zz'|^2 = zz'\,\overline{zz'} = z z' \bar z \bar{z'} = (z\bar z)(z'\bar{z'}) = |z|^2|z'|^2$ ; les modules étant positifs, $|zz'| = |z||z'|$.
    - Par récurrence : $|z^0| = 1 = |z|^0$ et, si $|z^n| = |z|^n$, alors $|z^{n+1}| = |z^n \times z| = |z|^n|z| = |z|^{n+1}$.
    - Pour $z \neq 0$ : $|z| \times \left|\dfrac{1}{z}\right| = \left|z \times \dfrac{1}{z}\right| = 1$.

    ## 3. Arguments et forme trigonométrique

    **Définition.** Pour $z \neq 0$ d'image $M$, un **argument** de $z$ est une mesure $\theta$ de l'angle orienté $(\vec u, \overrightarrow{OM})$. Il est défini **à $2\pi$ près** ; on note $\arg z \equiv \theta \pmod{2\pi}$.

    > **Propriété.** Avec $r = |z|$ : $\cos\theta = \dfrac{a}{r}$ et $\sin\theta = \dfrac{b}{r}$, donc $$z = r(\cos\theta + i\sin\theta) \qquad \text{(forme trigonométrique)}.$$

    Exemples : $\arg i = \dfrac{\pi}{2}$, $\arg(-2) = \pi$, $\arg(1 + i) = \dfrac{\pi}{4}$ (modulo $2\pi$).

    ## 4. Forme exponentielle

    **Définition.** Pour tout réel $\theta$, on note $e^{i\theta} = \cos\theta + i\sin\theta$. C'est le complexe de module $1$ et d'argument $\theta$.

    > **Propriété (relation fonctionnelle).** $e^{i\theta} \times e^{i\theta'} = e^{i(\theta + \theta')}$.

    **Justification.** $(\cos\theta + i\sin\theta)(\cos\theta' + i\sin\theta') = (\cos\theta\cos\theta' - \sin\theta\sin\theta') + i(\sin\theta\cos\theta' + \cos\theta\sin\theta')$, qui vaut $\cos(\theta + \theta') + i\sin(\theta + \theta')$ d'après les formules d'addition.

    Tout complexe non nul s'écrit $z = re^{i\theta}$ avec $r = |z| > 0$ et $\theta = \arg z$ : c'est la **forme exponentielle**.

    > **Conséquences.** Pour $z = re^{i\theta}$ et $z' = r'e^{i\theta'}$ non nuls, et $n \in \mathbb{Z}$ :
    > $$zz' = rr'e^{i(\theta + \theta')}, \qquad \frac{z}{z'} = \frac{r}{r'}e^{i(\theta - \theta')}, \qquad z^n = r^n e^{in\theta}, \qquad \bar z = re^{-i\theta}.$$

    ## 5. Méthodes

    **De la forme algébrique à la forme exponentielle** : calculer $r = |z|$, puis chercher $\theta$ tel que $\cos\theta = \dfrac{a}{r}$ et $\sin\theta = \dfrac{b}{r}$ (valeurs remarquables, en regardant les **deux** signes).

    **De la forme exponentielle à la forme algébrique** : $re^{i\theta} = r\cos\theta + ir\sin\theta$.

    **Choisir la forme adaptée** : la forme algébrique pour les sommes ; la forme exponentielle pour les produits, quotients et puissances.

    ## 6. Exemple complet

    **Énoncé.** Écrire $z = -\sqrt{3} + i$ sous forme exponentielle, puis calculer $z^4$ sous forme algébrique.

    **Résolution.**
    1. $r = \sqrt{3 + 1} = 2$ ; $\cos\theta = -\dfrac{\sqrt{3}}{2}$ et $\sin\theta = \dfrac{1}{2}$, donc $\theta = \dfrac{5\pi}{6}$ : $z = 2e^{i5\pi/6}$.
    2. $z^4 = 2^4 e^{i \cdot 4 \cdot 5\pi/6} = 16e^{i10\pi/3}$. Or $\dfrac{10\pi}{3} = -\dfrac{2\pi}{3} + 4\pi$, donc $z^4 = 16e^{-i2\pi/3}$.
    3. $z^4 = 16\left(-\dfrac{1}{2} - i\dfrac{\sqrt{3}}{2}\right) = -8 - 8\sqrt{3}\,i$.

    ## 7. Erreurs fréquentes

    - Écrire $|a + ib| = a + b$ ou $\sqrt{a^2 - b^2}$.
    - Ne regarder que le cosinus pour trouver l'argument : $\cos\theta = \dfrac{1}{2}$ donne $\dfrac{\pi}{3}$ **ou** $-\dfrac{\pi}{3}$, le signe du sinus tranche.
    - Écrire $|z + z'| = |z| + |z'|$ : c'est faux en général (seulement $\leqslant$).
  methodes:
  - titre: Calculer une puissance avec la forme exponentielle
    etapes:
    - Calculer le module r et un argument θ.
    - $z^n = r^n e^{in\theta}$.
    - Revenir à la forme algébrique si besoin.
    exemple:
      enonce: $(\sqrt{3} + i)^3$.
      resolution:
      - '$\sqrt{3} + i = 2e^{i\pi/6}$ ; puissance 3 : $8e^{i\pi/2}$.'
      resultat: $8i$
  erreurs_frequentes:
  - erreur: Écrire $|a + ib| = a + b$.
    explication: 'Le module est une distance : $\sqrt{a^2 + b^2}$.'
  questions:
  - code: TLE-ME-CPLX-TRIG-01
    difficulte: 1
    type: numerique
    enonce: Calculer le module de $3 + 4i$.
    solution: '5'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\sqrt{9 + 16} = 5$.
      resultat: '5'
  - code: TLE-ME-CPLX-TRIG-02
    difficulte: 2
    type: numerique
    enonce: Donner l'argument de $i$ appartenant à $]-\pi ; \pi]$. (Utiliser pi.)
    solution: pi/2
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - '$i$ est sur l''axe imaginaire positif : $\arg i = \dfrac{\pi}{2}$.'
      resultat: pi/2
  - code: TLE-ME-CPLX-TRIG-03
    difficulte: 3
    type: numerique
    enonce: Donner l'argument de $1 + i$ appartenant à $]-\pi ; \pi]$. (Utiliser pi.)
    solution: pi/4
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Module : $|1 + i| = \sqrt{1^2 + 1^2} = \sqrt{2}$.'
      - 'Un argument $\theta$ vérifie $\cos\theta = \dfrac{1}{\sqrt{2}} = \dfrac{\sqrt{2}}{2}$ et $\sin\theta = \dfrac{\sqrt{2}}{2}$.'
      - 'Dans $]-\pi ; \pi]$, le seul angle qui convient est $\theta = \dfrac{\pi}{4}$.'
      resultat: pi/4
  - code: TLE-ME-CPLX-TRIG-04
    difficulte: 4
    type: numerique
    enonce: Calculer le module de $(1 + i)^8$.
    solution: '16'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Le module d''une puissance est la puissance du module : $|(1 + i)^8| = |1 + i|^8$.'
      - '$|1 + i| = \sqrt{2}$, donc $|(1 + i)^8| = (\sqrt{2})^8 = 2^4 = 16$.'
      resultat: '16'
  - code: TLE-ME-CPLX-TRIG-05
    difficulte: 5
    type: numerique
    enonce: Quelle est la partie réelle de $(1 + i\sqrt{3})^6$ ?
    solution: '64'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $1 + i\sqrt{3} = 2e^{i\pi/3}$.
      - $(1 + i\sqrt{3})^6 = 2^6 e^{2i\pi} = 64$.
      resultat: '64'
  - code: TLE-ME-CPLX-TRIG-V1
    difficulte: 2
    type: numerique
    gabarit:
      parametres: {k: {entre: [1, 4]}, i: {parmi: [0, 1, 2]}, s1: {parmi: [-1, 1]}, s2: {parmi: [-1, 1]}}
      calculs: {a: "s1*k*(3*(i == 0) + 5*(i == 1) + 8*(i == 2))", b: "s2*k*(4*(i == 0) + 12*(i == 1) + 15*(i == 2))", m: "k*(5*(i == 0) + 13*(i == 1) + 17*(i == 2))"}
    enonce: 'Calculer le module de $z = [[a]] [[b:+]]i$.'
    solution: '[[m]]'
    auteur: Brouillon IA (Claude)
    correction:
      methode: '$|a + ib| = \sqrt{a^2 + b^2}$.'
      etapes:
      - '$|z|^2 = ([[a]])^2 + ([[b]])^2 = [[a*a + b*b]]$.'
      - '$|z| = \sqrt{[[a*a + b*b]]} = [[m]]$.'
      resultat: '[[m]]'
- code: TLE-ME-CPLX-GEOM
  libelle: Résoudre des problèmes de géométrie avec les complexes
  attendus: [TLE-EXP-2019-GEOM-01, TLE-EXP-2019-GEOM-03]
  objectifs:
  - Calculer distances et milieux avec les affixes.
  - Interpréter des égalités entre complexes (cercles, triangles, rotations).
  prerequis:
  - TLE-ME-CPLX-TRIG
  cours_couvre: [TLE-EXP-2019-GEOM-01, TLE-EXP-2019-GEOM-03]
  resume: |
    - $AB = |z_B - z_A|$ ; le milieu de $[AB]$ a pour affixe $\dfrac{z_A + z_B}{2}$.
    - $\left|\dfrac{z_C - z_A}{z_B - z_A}\right| = \dfrac{AC}{AB}$ et $\arg\left(\dfrac{z_C - z_A}{z_B - z_A}\right) \equiv (\overrightarrow{AB}, \overrightarrow{AC}) \pmod{2\pi}$.
    - Ce quotient est réel $\iff$ $A$, $B$, $C$ alignés ; imaginaire pur $\iff$ $(AB) \perp (AC)$ ; égal à $\pm i$ : triangle rectangle isocèle en $A$.
    - $|z - z_\Omega| = r$ : cercle de centre $\Omega$ et de rayon $r$ ; $|z - z_A| = |z - z_B|$ : médiatrice de $[AB]$.
  cours: |
    ## 1. Distances et milieux

    > **Propriété.** Si $A$ et $B$ ont pour affixes $z_A$ et $z_B$ : $AB = |z_B - z_A|$, et le milieu $I$ de $[AB]$ a pour affixe $z_I = \dfrac{z_A + z_B}{2}$.

    Exemple : $A(1 + i)$, $B(4 + 5i)$ : $AB = |3 + 4i| = 5$.

    ## 2. Interprétation de $\dfrac{z_C - z_A}{z_B - z_A}$

    > **Théorème.** Soient $A$, $B$, $C$ trois points distincts. Alors
    > $$\left|\frac{z_C - z_A}{z_B - z_A}\right| = \frac{AC}{AB} \qquad \text{et} \qquad \arg\left(\frac{z_C - z_A}{z_B - z_A}\right) \equiv (\overrightarrow{AB}, \overrightarrow{AC}) \pmod{2\pi}.$$

    **Justification.** Le module d'un quotient est le quotient des modules, et $|z_C - z_A| = AC$. Pour l'argument : $\arg(z_C - z_A) \equiv (\vec u, \overrightarrow{AC})$ et $\arg(z_B - z_A) \equiv (\vec u, \overrightarrow{AB})$ ; l'argument d'un quotient est la différence des arguments, et la relation de Chasles donne $(\vec u, \overrightarrow{AC}) - (\vec u, \overrightarrow{AB}) \equiv (\overrightarrow{AB}, \overrightarrow{AC})$.

    > **Conséquences.** Notons $q = \dfrac{z_C - z_A}{z_B - z_A}$.
    > - $A$, $B$, $C$ sont **alignés** $\iff$ $q$ est réel (angle $0$ ou $\pi$).
    > - $(AB) \perp (AC)$ $\iff$ $q$ est imaginaire pur (angle $\pm\dfrac{\pi}{2}$).
    > - $ABC$ est isocèle en $A$ $\iff$ $|q| = 1$ ; rectangle isocèle en $A$ $\iff$ $q = i$ ou $q = -i$ ; équilatéral $\iff$ $q = e^{i\pi/3}$ ou $q = e^{-i\pi/3}$.

    ## 3. Ensembles de points

    - $|z - z_\Omega| = r$ ($r > 0$) : $\Omega M = r$, cercle de centre $\Omega$ et de rayon $r$ ; $|z - z_\Omega| \leqslant r$ : disque.
    - $|z - z_A| = |z - z_B|$ : $MA = MB$, **médiatrice** de $[AB]$.
    - $\arg(z - z_A) \equiv \theta \pmod{2\pi}$ : demi-droite d'origine $A$ (privée de $A$) dirigée par $e^{i\theta}$.

    **Méthode** : traduire le module ou l'argument en distance ou en angle, puis reconnaitre la figure.

    ## 4. Rotations

    Multiplier par $e^{i\theta}$ fait tourner d'un angle $\theta$ : l'image de $M(z)$ par la rotation de centre $\Omega$ et d'angle $\theta$ est $M'(z')$ avec $$z' - z_\Omega = e^{i\theta}(z - z_\Omega).$$ Pour un quart de tour direct autour de $O$ : $z' = iz$.

    ## 5. Exemple complet

    **Énoncé.** $A$, $B$, $C$ ont pour affixes $1$, $3 + 2i$ et $-1 + 2i$. Quelle est la nature du triangle $ABC$ ?

    **Résolution.**
    1. $z_B - z_A = 2 + 2i$ et $z_C - z_A = -2 + 2i$.
    2. $q = \dfrac{-2 + 2i}{2 + 2i} = \dfrac{(-2 + 2i)(2 - 2i)}{(2 + 2i)(2 - 2i)} = \dfrac{-4 + 4i + 4i + 4}{8} = i$.
    3. $|q| = 1$ donne $AB = AC$, et $\arg q = \dfrac{\pi}{2}$ donne $(\overrightarrow{AB}, \overrightarrow{AC}) = \dfrac{\pi}{2}$ : $ABC$ est **rectangle isocèle en $A$**, avec $AB = AC = |2 + 2i| = 2\sqrt{2}$.

    ## 6. Erreurs fréquentes

    - Calculer $AB$ avec $|z_A| - |z_B|$ au lieu de $|z_B - z_A|$.
    - Inverser l'ordre : $\arg\dfrac{z_C - z_A}{z_B - z_A}$ mesure l'angle **de** $\overrightarrow{AB}$ **vers** $\overrightarrow{AC}$.
    - Confondre « le quotient est réel » (alignement) et « le quotient vaut $1$ » ($B = C$).
  methodes:
  - titre: Reconnaitre la nature d'un triangle
    etapes:
    - Calculer $\dfrac{z_B - z_A}{z_C - z_A}$.
    - Lire son module (rapport de longueurs) et son argument (angle).
    exemple:
      enonce: $\dfrac{z_B - z_A}{z_C - z_A} = e^{i\pi/3}$.
      resolution:
      - 'Module $1$ : $AB = AC$ ; angle $\dfrac{\pi}{3}$.'
      resultat: Triangle équilatéral.
  erreurs_frequentes:
  - erreur: Calculer $AB$ avec $|z_A| - |z_B|$.
    explication: 'C''est le module de la différence : $|z_B - z_A|$.'
  questions:
  - code: TLE-ME-CPLX-GEOM-01
    difficulte: 1
    type: numerique
    enonce: Les points $A$ et $B$ ont pour affixes $1 + i$ et $4 + 5i$. Calculer $AB$.
    solution: '5'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $|z_B - z_A| = |3 + 4i| = 5$.
      resultat: '5'
  - code: TLE-ME-CPLX-GEOM-02
    difficulte: 2
    type: numerique
    enonce: Les points $A$ et $B$ ont pour affixes $2 + i$ et $4 - 3i$. Quelle est la partie réelle de l'affixe du milieu de $[AB]$ ?
    solution: '3'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - $\dfrac{(2 + i) + (4 - 3i)}{2} = 3 - i$.
      resultat: '3'
  - code: TLE-ME-CPLX-GEOM-03
    difficulte: 3
    type: qcm
    enonce: 'L''ensemble des points d''affixe $z$ tels que $|z - 2i| = 3$ est : A) le cercle de centre le point d''affixe $2i$ et de rayon 3  B) une droite  C) le cercle de centre $O$ et de rayon 3'
    solution: A
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Notons $\Omega$ le point d''affixe $2i$ et $M$ celui d''affixe $z$ : $|z - 2i| = |z - z_\Omega| = \Omega M$.'
      - 'La condition $\Omega M = 3$ caractérise les points situés à la distance $3$ de $\Omega$.'
      - 'C''est le cercle de centre le point d''affixe $2i$ et de rayon $3$ (réponse A).'
      resultat: A
  - code: TLE-ME-CPLX-GEOM-04
    difficulte: 4
    type: qcm
    enonce: 'On sait que $z_B - z_A = i(z_C - z_A)$. Le triangle formé par ces trois points est : A) rectangle isocèle en son sommet d''affixe $z_A$  B) équilatéral  C) quelconque'
    solution: A
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'On divise : $\dfrac{z_B - z_A}{z_C - z_A} = i$.'
      - 'Module : $\dfrac{AB}{AC} = |i| = 1$, donc $AB = AC$.'
      - 'Argument : $(\overrightarrow{AC}, \overrightarrow{AB}) \equiv \arg i = \dfrac{\pi}{2} \pmod{2\pi}$, donc l''angle en $A$ est droit.'
      - 'Le triangle est rectangle isocèle en son sommet d''affixe $z_A$ (réponse A).'
      resultat: A
  - code: TLE-ME-CPLX-GEOM-05
    difficulte: 5
    type: numerique
    enonce: On fait tourner le point d'affixe $3 + 2i$ d'un quart de tour direct autour de l'origine. Quelle est la partie réelle de l'affixe de son image ?
    solution: '-2'
    auteur: Brouillon IA (Claude)
    correction:
      etapes:
      - 'Quart de tour direct : multiplication par $i$.'
      - $i(3 + 2i) = 3i + 2i^2 = -2 + 3i$.
      resultat: '-2'

- code: TLE-ME-EULER
  libelle: Utiliser les formules d'addition, d'Euler et de Moivre
  attendus: [TLE-EXP-2019-TRIGPOLY-01, TLE-EXP-2019-TRIGPOLY-03, TLE-EXP-2019-TRIGPOLY-04, TLE-EXP-2019-TRIGPOLY-07, TLE-EXP-2019-TRIGPOLY-08]
  objectifs:
  - Établir et utiliser les formules d'addition et de duplication.
  - Utiliser les formules d'Euler et de Moivre pour linéariser ou calculer des puissances.
  prerequis:
  - TLE-ME-CPLX-TRIG
  methodes:
  - titre: Linéariser avec les formules d'Euler
    quand: On doit transformer une puissance de $\cos$ ou de $\sin$ (par exemple pour intégrer).
    etapes:
    - Remplacer $\cos x$ par $\dfrac{e^{ix} + e^{-ix}}{2}$ (ou $\sin x$ par $\dfrac{e^{ix} - e^{-ix}}{2i}$).
    - Développer avec la formule du binôme.
    - Regrouper les termes conjugués pour revenir à des cosinus et sinus.
    exemple:
      enonce: Linéariser $\cos^2 x$.
      resolution:
      - $\cos^2 x = \dfrac{e^{2ix} + 2 + e^{-2ix}}{4}$.
      - $= \dfrac{2\cos(2x) + 2}{4}$.
      resultat: $\cos^2 x = \dfrac{1 + \cos(2x)}{2}$
  erreurs_frequentes:
  - erreur: Écrire $\cos(a + b) = \cos a + \cos b$.
    explication: $\cos(a + b) = \cos a \cos b - \sin a \sin b$.
  cours_couvre: [TLE-EXP-2019-TRIGPOLY-01, TLE-EXP-2019-TRIGPOLY-03, TLE-EXP-2019-TRIGPOLY-04, TLE-EXP-2019-TRIGPOLY-07, TLE-EXP-2019-TRIGPOLY-08]
  resume: |
    - $\cos(a - b) = \cos a\cos b + \sin a\sin b$, $\cos(a + b) = \cos a\cos b - \sin a\sin b$, $\sin(a + b) = \sin a\cos b + \cos a\sin b$.
    - Duplication : $\cos 2a = \cos^2 a - \sin^2 a = 2\cos^2 a - 1 = 1 - 2\sin^2 a$, $\sin 2a = 2\sin a\cos a$.
    - Euler : $\cos\theta = \dfrac{e^{i\theta} + e^{-i\theta}}{2}$, $\sin\theta = \dfrac{e^{i\theta} - e^{-i\theta}}{2i}$ ; Moivre : $(\cos\theta + i\sin\theta)^n = \cos(n\theta) + i\sin(n\theta)$.
    - Linéariser $\cos^n$ ou $\sin^n$ : Euler, binôme, puis regrouper ; exprimer $\cos(n\theta)$ en fonction de $\cos\theta$ : Moivre, binôme, partie réelle.
  cours: |
    ## 1. Formules d'addition

    > **Théorème.** Pour tous réels $a$ et $b$ :
    > $$\cos(a - b) = \cos a\cos b + \sin a\sin b, \qquad \cos(a + b) = \cos a\cos b - \sin a\sin b,$$
    > $$\sin(a + b) = \sin a\cos b + \cos a\sin b, \qquad \sin(a - b) = \sin a\cos b - \cos a\sin b.$$

    **Démonstration de la première, par le produit scalaire.** Dans un repère orthonormé direct, soient $\vec u(\cos a ; \sin a)$ et $\vec v(\cos b ; \sin b)$, deux vecteurs de norme $1$ tels que $(\vec\imath, \vec u) = a$ et $(\vec\imath, \vec v) = b$.
    - Avec les coordonnées : $\vec u \cdot \vec v = \cos a\cos b + \sin a\sin b$.
    - Avec la formule du cosinus : $\vec u \cdot \vec v = \|\vec u\|\,\|\vec v\|\cos(\vec u, \vec v) = \cos(b - a) = \cos(a - b)$, car $(\vec u, \vec v) = (\vec u, \vec\imath) + (\vec\imath, \vec v) = b - a$ et le cosinus est pair.

    **Les autres s'en déduisent.** On remplace $b$ par $-b$ (avec $\cos(-b) = \cos b$, $\sin(-b) = -\sin b$) pour $\cos(a + b)$. Puis $\sin(a + b) = \cos\left(\dfrac{\pi}{2} - a - b\right) = \cos\left(\left(\dfrac{\pi}{2} - a\right) - b\right) = \sin a\cos b + \cos a\sin b$.

    > **Formules de duplication** ($b = a$) : $$\cos(2a) = \cos^2 a - \sin^2 a = 2\cos^2 a - 1 = 1 - 2\sin^2 a, \qquad \sin(2a) = 2\sin a\cos a.$$

    Exemple : $\cos\dfrac{\pi}{12} = \cos\left(\dfrac{\pi}{3} - \dfrac{\pi}{4}\right) = \dfrac{1}{2} \cdot \dfrac{\sqrt{2}}{2} + \dfrac{\sqrt{3}}{2} \cdot \dfrac{\sqrt{2}}{2} = \dfrac{\sqrt{2} + \sqrt{6}}{4}$.

    ## 2. Formules d'Euler

    > **Propriété.** Pour tout réel $\theta$ : $$\cos\theta = \frac{e^{i\theta} + e^{-i\theta}}{2}, \qquad \sin\theta = \frac{e^{i\theta} - e^{-i\theta}}{2i}.$$

    **Démonstration.** $e^{i\theta} = \cos\theta + i\sin\theta$ et $e^{-i\theta} = \cos\theta - i\sin\theta$. En additionnant : $2\cos\theta$ ; en soustrayant : $2i\sin\theta$.

    ## 3. Formule de Moivre

    > **Propriété.** Pour tout réel $\theta$ et tout entier $n$ : $$(\cos\theta + i\sin\theta)^n = \cos(n\theta) + i\sin(n\theta).$$

    **Démonstration.** C'est $(e^{i\theta})^n = e^{in\theta}$, conséquence de la relation fonctionnelle (récurrence pour $n \geqslant 0$, puis passage à l'inverse pour $n < 0$).

    ## 4. Méthodes

    **Linéariser** $\cos^n\theta$ ou $\sin^n\theta$ (l'écrire comme combinaison de $\cos(k\theta)$, $\sin(k\theta)$, par exemple pour calculer une intégrale) :
    1. Remplacer par la formule d'Euler ;
    2. Développer avec le binôme ;
    3. Regrouper $e^{ik\theta}$ et $e^{-ik\theta}$ et réutiliser Euler.

    Exemple : $\cos^3\theta = \dfrac{(e^{i\theta} + e^{-i\theta})^3}{8} = \dfrac{e^{3i\theta} + 3e^{i\theta} + 3e^{-i\theta} + e^{-3i\theta}}{8} = \dfrac{\cos(3\theta) + 3\cos\theta}{4}$.

    Application : $\cos^2 x = \dfrac{1 + \cos(2x)}{2}$, d'où $\displaystyle\int_0^{\pi/2} \cos^2 x\,dx = \left[\frac{x}{2} + \frac{\sin(2x)}{4}\right]_0^{\pi/2} = \frac{\pi}{4}$.

    **Exprimer $\cos(n\theta)$ ou $\sin(n\theta)$ en fonction de $\cos\theta$ et $\sin\theta$** : développer $(\cos\theta + i\sin\theta)^n$ par le binôme, puis prendre la partie réelle ou imaginaire (Moivre).

    **Calculer une puissance** : passer à la forme exponentielle, puis $\left(re^{i\theta}\right)^n = r^n e^{in\theta}$.

    ## 5. Exemple complet

    **Énoncé.** Exprimer $\sin(3\theta)$ en fonction de $s = \sin\theta$.

    **Résolution.** Notons $c = \cos\theta$.
    1. Moivre : $\sin(3\theta) = \operatorname{Im}\left((c + is)^3\right)$.
    2. Binôme : $(c + is)^3 = c^3 + 3c^2(is) + 3c(is)^2 + (is)^3 = (c^3 - 3cs^2) + i(3c^2 s - s^3)$.
    3. Donc $\sin(3\theta) = 3c^2 s - s^3 = 3(1 - s^2)s - s^3 = 3s - 4s^3$.

    Contrôle avec $\theta = \dfrac{\pi}{2}$ : $\sin\dfrac{3\pi}{2} = -1$ et $3 - 4 = -1$.

    ## 6. Erreurs fréquentes

    - Écrire $\cos(a + b) = \cos a + \cos b$.
    - Se tromper de signe : $\cos(a + b)$ contient $-\sin a\sin b$.
    - Oublier le $2i$ au dénominateur de la formule d'Euler pour $\sin\theta$.
