chapitre:
  code: 4E-TRANSFORMATIONS
  niveau: 4e
  parcours: tronc-commun
  ordre: 6
  titre: Translations, agrandissements et réductions

competences:
  - code: 4E-TRANSLATION
    libelle: Transformer une figure par translation
    attendus: [4E-2020-GEOM-02, 4E-2020-GEOM-03, 4E-2020-GEOM-04, 4E-2020-GEOM-05, 4E-2020-TRANS-03]
    cours_couvre: [4E-2020-GEOM-02, 4E-2020-GEOM-03, 4E-2020-GEOM-04, 4E-2020-GEOM-05, 4E-2020-TRANS-03]
    objectifs:
    - Construire l’image d’une figure par une translation.
    - Identifier des translations dans des frises et des pavages.
    - Utiliser les propriétés de conservation de la translation dans un raisonnement.
    methodes:
    - titre: Construire l’image d’un point par la translation qui transforme $A$ en $B$
      etapes:
      - 'Faire « glisser » le point $M$ dans la même direction, le même sens et de la même longueur que de $A$ vers $B$.'
      - Sur quadrillage, compter le déplacement horizontal et vertical de $A$ à $B$ et l’appliquer à $M$.
      - Vérifier que $ABM'M$ est un parallélogramme.
      exemple:
        enonce: 'Dans un repère, $A(1 ; 2)$, $B(4 ; 3)$ et $M(0 ; -1)$. Quelles sont les coordonnées de l’image $M’$ de $M$ ?'
        resolution:
        - De $A$ à $B$, on se déplace de $+3$ en abscisse et $+1$ en ordonnée.
        - $M'(0 + 3 ; -1 + 1) = M'(3 ; 0)$.
        resultat: $M'(3 ; 0)$
    erreurs_frequentes:
    - erreur: Confondre translation et symétrie.
      explication: 'Une translation fait **glisser** la figure sans la tourner ni la retourner.'
    - erreur: Penser qu’une translation change les longueurs.
      explication: La translation conserve les longueurs, les angles, les aires et le parallélisme.
    resume: |
      - La translation qui transforme $A$ en $B$ fait glisser tout point $M$ en $M'$ tel que $ABM'M$ soit un parallélogramme (éventuellement aplati).
      - Elle conserve les longueurs, les angles, les aires, l’alignement et le parallélisme.
      - Une frise est invariante par une translation ; un pavage, par deux translations de directions différentes.
    cours: |
      ## 1. Définition
      > **Définition.** L’image d’un point $M$ par la translation qui transforme $A$ en $B$ est le point $M'$ tel que $ABM'M$ soit un parallélogramme.

      Direction, sens et longueur du déplacement sont les mêmes pour tous les points.

      ## 2. Propriétés
      > **Propriété.** Une translation conserve les longueurs, les mesures d’angles, les aires et le parallélisme. L’image d’une droite est une droite parallèle.

      ## 3. Frises et pavages
      Dans une frise, on passe d’un motif au suivant par une translation. Les pavages de l’Alhambra ou les œuvres d’Escher utilisent des translations dans deux directions.
    questions:
      - code: 4E-TRANSLATION-01
        difficulte: 1
        type: qcm
        enonce: 'Une translation fait : A) glisser une figure  B) tourner une figure autour d’un point  C) retourner une figure comme un pliage'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: Définition de la translation.
          etapes:
          - Une translation est un glissement.
          resultat: A
      - code: 4E-TRANSLATION-02
        difficulte: 2
        type: numerique
        enonce: 'Un segment $[CD]$ mesure $7{,}2$ cm. Combien mesure son image par une translation, en cm ?'
        solution: '7,2'
        auteur: Brouillon IA (Claude)
        correction:
          methode: La translation conserve les longueurs.
          etapes:
          - L’image mesure $7{,}2$ cm.
          resultat: '7,2'
      - code: 4E-TRANSLATION-03
        difficulte: 3
        type: numerique
        enonce: 'Dans un repère, $A(1 ; 2)$ et $B(4 ; 3)$. Le point $M(0 ; -1)$ a pour image $M’$ par la translation qui transforme $A$ en $B$. Quelle est l’abscisse de $M’$ ?'
        solution: '3'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Appliquer à $M$ le même déplacement que de $A$ à $B$.
          etapes:
          - Déplacement horizontal $4 - 1 = 3$ ; abscisse de $M'$ ; $0 + 3 = 3$.
          resultat: '3'
      - code: 4E-TRANSLATION-04
        difficulte: 4
        type: qcm
        enonce: '$M’$ est l’image de $M$ par la translation qui transforme $A$ en $B$. Quelle est la nature de $ABM’M$ (points non alignés) ? A) un parallélogramme  B) un trapèze quelconque  C) un cerf-volant'
        solution: A
        auteur: Brouillon IA (Claude)
        correction:
          methode: Définition de la translation.
          etapes:
          - $ABM'M$ est un parallélogramme.
          resultat: A
      - code: 4E-TRANSLATION-05
        difficulte: 5
        type: numerique
        enonce: 'Dans une frise, le motif est un triangle d’aire $6$ cm², reproduit $8$ fois par translation sans chevauchement. Quelle est l’aire totale couverte par les motifs, en cm² ?'
        solution: '48'
        auteur: Brouillon IA (Claude)
        correction:
          methode: La translation conserve les aires.
          etapes:
          - $8 \times 6 = 48$ cm².
          resultat: '48'

  - code: 4E-AGRANDISSEMENT
    libelle: Agrandir ou réduire une figure et calculer longueurs, aires, volumes
    attendus: [4E-2020-TRANS-01, 4E-2020-TRANS-02, 4E-2020-PROP-04]
    cours_couvre: [4E-2020-TRANS-01, 4E-2020-TRANS-02, 4E-2020-PROP-04]
    prerequis: [4E-THALES]
    objectifs:
    - Construire un agrandissement ou une réduction de rapport $k$.
    - Savoir que les longueurs sont multipliées par $k$, les aires par $k^2$, les volumes par $k^3$.
    methodes:
    - titre: Calculer une aire après agrandissement
      etapes:
      - Déterminer le rapport $k$ (quotient d’une longueur de la nouvelle figure par la longueur correspondante de l’ancienne).
      - Multiplier l’aire initiale par $k^2$ (par $k^3$ pour un volume).
      exemple:
        enonce: 'Un triangle d’aire $5$ cm² est agrandi de rapport $3$. Quelle est l’aire du triangle obtenu ?'
        resolution:
        - $5 \times 3^2 = 5 \times 9 = 45$.
        resultat: $45$ cm²
    erreurs_frequentes:
    - erreur: Multiplier une aire par $k$ au lieu de $k^2$.
      explication: 'En doublant les longueurs d’un carré de côté $1$, on obtient un carré d’aire $4$, pas $2$.'
    - erreur: Croire qu’une réduction a un rapport supérieur à $1$.
      explication: 'Agrandissement : $k > 1$ ; réduction : $0 < k < 1$.'
    resume: |
      - Dans un agrandissement ou une réduction de rapport $k$, les longueurs sont multipliées par $k$, les angles conservés.
      - Les aires sont multipliées par $k^2$, les volumes par $k^3$.
      - $k > 1$ : agrandissement ; $0 < k < 1$ : réduction.
    cours: |
      ## 1. Définition
      Agrandir ou réduire une figure de rapport $k$, c’est multiplier toutes ses longueurs par $k$. Les longueurs de la nouvelle figure sont proportionnelles à celles de la figure de départ ; les angles sont conservés.

      ## 2. Effet sur les aires et les volumes
      > **Propriété.** Dans un agrandissement ou une réduction de rapport $k$, les aires sont multipliées par $k^2$ et les volumes par $k^3$.

      Une maquette au $\dfrac{1}{50}$ a un volume $50^3 = 125\,000$ fois plus petit que l’original.

      ## 3. Lien avec Thalès
      Dans la configuration de Thalès, le triangle $AMN$ est une réduction de $ABC$ de rapport $k = \dfrac{AM}{AB}$.
    questions:
      - code: 4E-AGRANDISSEMENT-01
        difficulte: 1
        type: numerique
        enonce: 'Un segment de $4$ cm est agrandi de rapport $2{,}5$. Quelle est sa nouvelle longueur, en cm ?'
        solution: '10'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Multiplier par $k$.
          etapes:
          - $4 \times 2{,}5 = 10$ cm.
          resultat: '10'
      - code: 4E-AGRANDISSEMENT-02
        difficulte: 2
        type: numerique
        enonce: 'Un triangle d’aire $5$ cm² est agrandi de rapport $3$. Quelle est l’aire du nouveau triangle, en cm² ?'
        solution: '45'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Les aires sont multipliées par $k^2$.
          etapes:
          - $5 \times 9 = 45$ cm².
          resultat: '45'
      - code: 4E-AGRANDISSEMENT-03
        difficulte: 3
        type: numerique
        enonce: 'Un rectangle de $6$ cm sur $4$ cm est réduit en un rectangle de longueur $4{,}5$ cm. Quel est le rapport de réduction ?'
        solution: '0,75'
        auteur: Brouillon IA (Claude)
        correction:
          methode: $k = \dfrac{\text{nouvelle longueur}}{\text{ancienne longueur}}$.
          etapes:
          - $k = \dfrac{4{,}5}{6} = 0{,}75$.
          resultat: '0,75'
      - code: 4E-AGRANDISSEMENT-04
        difficulte: 4
        type: numerique
        enonce: 'Un cube de volume $8$ cm³ est agrandi de rapport $3$. Quel est le volume du cube obtenu, en cm³ ?'
        solution: '216'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Les volumes sont multipliés par $k^3$.
          etapes:
          - $8 \times 27 = 216$ cm³.
          resultat: '216'
      - code: 4E-AGRANDISSEMENT-05
        difficulte: 5
        type: numerique
        enonce: 'Sur une maquette à l’échelle $\dfrac{1}{100}$, un jardin a une aire de $12$ cm². Quelle est l’aire réelle du jardin, en m² ?'
        solution: '12'
        auteur: Brouillon IA (Claude)
        correction:
          methode: Les aires sont multipliées par $100^2$.
          etapes:
          - $12 \times 10\,000 = 120\,000$ cm².
          - $120\,000$ cm² $= 12$ m².
          resultat: '12'
