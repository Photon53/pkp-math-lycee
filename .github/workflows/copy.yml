
name: Synchroniser Boussole vers PKP Education

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer Boussole
        uses: actions/checkout@v5
        with:
          repository: Photon53/boussole-maitrise-plus
          ref: main
          path: source
          persist-credentials: false

      - name: Recuperer PKP
        uses: actions/checkout@v5
        with:
          ref: main
          path: destination
          persist-credentials: false

      - name: Preparer les fichiers
        run: |
          mkdir -p sync
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env*' \
            --exclude='*stripe*' \
            --exclude='*payment*' \
            --exclude='*billing*' \
            source/ sync/

          echo "Contenu prepare pour validation"
          find sync -maxdepth 2 -type f | head -50

      - name: Controle manuel requis
        run: |
          echo "Synchronisation preparee."
          echo "Aucune modification de main."
          echo "Valider les fichiers autorises"
          echo "avant de creer une Pull Request."