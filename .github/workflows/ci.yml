# Vérifie chaque push et chaque pull request : moteur, API, contenu pédagogique, front.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Moteur, API et contenu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/pyproject.toml
            api/pyproject.toml
      - name: Installer
        run: pip install -e "./engine[dev]" -e "./api[dev]"
      - name: Vérifier le contenu pédagogique (contenu/*.yaml)
        working-directory: api
        run: python -m app.contenu verifier
      - name: Tests du moteur
        working-directory: engine
        run: pytest -q
      - name: Tests de l'API
        working-directory: api
        run: pytest -q -W ignore::DeprecationWarning

  web:
    name: Front
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Audit A-04 : aucune vulnérabilité high/critical dans ce qui est livré au navigateur.
      - name: Vulnérabilités des dépendances livrées
        run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run build
