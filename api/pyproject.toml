[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkp-api"
version = "0.1.0"
description = "API FastAPI PKP Math Lycée"
requires-python = ">=3.11"
dependencies = [
    "pkp-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    # Issue #4 : analyse des PDF déposés (app/controle_pdf.py). Version récente : correctifs de sécurité de l'analyseur.
    "pypdf>=6.1",
    # Sécurité (#126) : tirée par FastAPI ≥ 0.142 ; 1.45.2 borne la taille de `traceparent` (GHSA-mf5v-w3w3-f6cg).
    "opentelemetry-api>=1.45.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
