  - {code: 5E-2026-REL-13, type: capacite, page: 8, texte: "Simplifier l’écriture de sommes comportant des parenthèses."}
  - {code: 5E-2026-REL-14, type: capacite, page: 8, texte: "Enchainer additions et soustractions de décimaux relatifs."}
