theme:
  code: REL
  titre: Nombres relatifs
  partie: Nombres et calculs

attendus:
  - {code: 5E-2026-REL-01, type: automatisme, page: 7, texte: "Additionner, soustraire, multiplier des nombres décimaux à une ou deux décimales."}
  - {code: 5E-2026-REL-02, type: automatisme, page: 7, texte: "Savoir que pour compléter une addition à trou, on utilise une soustraction : 2 + ... = 7 se complète en calculant 7 – 2."}
  - {code: 5E-2026-REL-03, type: capacite, page: 7, texte: "Définir les nombres relatifs."}
  - {code: 5E-2026-REL-04, type: capacite, page: 7, texte: "Définir l’opposé et la valeur absolue d’un nombre."}
  - {code: 5E-2026-REL-05, type: capacite, page: 7, texte: "Définir la notion de nombre positif, strictement positif, négatif, strictement négatif."}
  - {code: 5E-2026-REL-06, type: capacite, page: 7, texte: "Utiliser les nombres relatifs pour représenter des grandeurs observables qui peuvent prendre des valeurs inférieures à zéro (température, temps, altitude, etc.), en particulier dans le cadre de la résolution de problèmes."}
  - {code: 5E-2026-REL-07, type: capacite, page: 8, texte: "Lire l’abscisse d’un nombre relatif sur une droite graduée et placer un nombre relatif d’abscisse donnée."}
