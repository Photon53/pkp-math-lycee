attendus:
  # Étude de configurations planes
  - {code: 6E-2025-GEO-01, type: automatisme, page: 23, texte: "L’élève connaît le lexique et le codage des objets de base de la géométrie plane : angle droit, égalité de longueurs, égalité d’angles."}
  - {code: 6E-2025-GEO-02, type: automatisme, page: 23, texte: "Il reconnaît un carré, un rectangle, un triangle."}
