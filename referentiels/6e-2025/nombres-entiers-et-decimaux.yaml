theme:
  code: NUM
  titre: Les nombres entiers et décimaux
  partie: Nombres, calcul et résolution de problèmes

attendus:
  # Automatismes (page 13) : fractions écrites a/b, l'extraction du PDF les coupe sur plusieurs lignes.
  - {code: 6E-2025-NUM-01, type: automatisme, page: 13, texte: "L’élève restitue de manière automatique les résultats suivants, relatifs aux relations entre 1/1 000 ; 1/100 ; 1/10 et 1 : 1 = 10/10 = 100/100 = 1 000/1 000 ; 1/10 = 10/100 = 100/1 000 ; 1/100 = 10/1 000 ; 1 = 10 × 1/10 = 100 × 1/100 ; 1/10 = 10 × 1/100."}
  - {code: 6E-2025-NUM-02, type: automatisme, page: 13, texte: "L’élève restitue de manière automatique les équivalences d’écriture suivantes : 1/10 = 0,1 ; 1/100 = 0,01 ; 1/1 000 = 0,001."}
  - {code: 6E-2025-NUM-03, type: automatisme, page: 13, texte: "L’élève passe de manière automatique d’une écriture sous forme de fraction décimale ou de somme de fractions décimales à une écriture décimale, et inversement. Par exemple, il sait que les écritures 4 107/1 000 ; 4 + 107/1 000 ; 4 + 1/10 + 7/1 000 ; 4,107, représentent le même nombre."}
  - {code: 6E-2025-NUM-04, type: automatisme, page: 13, texte: "L’élève applique de manière automatique la procédure de multiplication d’un nombre décimal par 1, par 10, par 100 ou par 1 000, en lien avec la numération."}
  - {code: 6E-2025-NUM-05, type: automatisme, page: 13, texte: "Il applique de manière automatique la procédure de division d’un nombre décimal par 1, par 10, par 100 ou par 1 000."}
