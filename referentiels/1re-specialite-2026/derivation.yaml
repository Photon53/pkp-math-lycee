  - {code: 1RE-SPE-2026-DER-04, type: contenu, page: 7, texte: "Approximation linéaire : fonction affine tangente x ↦ ƒ(a) + ƒ′(a)(x – a) et approximation de ƒ(a + h) par ƒ(a) + ƒ′(a)h."}
