# Partie « Algèbre », rubrique « Équations, fonctions polynômes du second degré » (page 6 du PDF).
# Textes recopiés du BO, sans reformulation. Les commentaires du BO (objectifs) éclairent les attendus :
# - forme canonique par complétion du carré, x² + 2ax = (x + a)² − a², dans des cas simples ;
#   « le calcul effectif de la forme canonique dans le cas général n'est pas un attendu du programme » ;
# - factorisation directe : racines apparentes, coefficient de x nul, racines entières détectées
#   par calcul mental à partir de leur somme et de leur produit.
# La capacité « Étudier, en lien avec la dérivation, une fonction polynôme du second degré : variations,
# extrémum, allure selon le signe du coefficient de x² » relève de la partie Analyse.
