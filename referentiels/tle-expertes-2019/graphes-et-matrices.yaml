  - {code: TLE-EXP-2019-GRAPHMAT-04, type: contenu, page: 10, texte: "Exemples de représentations matricielles : matrice d’adjacence d’un graphe ; transformations géométriques du plan ; systèmes linéaires ; suites récurrentes."}
  - {code: TLE-EXP-2019-GRAPHMAT-05, type: contenu, page: 10, texte: "Exemples de calcul de puissances de matrices carrées d’ordre 2 ou 3."}
