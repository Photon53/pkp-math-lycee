# Partie « Graphes et matrices » (pages 10 et 11 du PDF). Textes recopiés du BO ;
# les « Problèmes possibles » (non exigibles) sont saisis comme approfondissements.
theme:
  code: GRAPHMAT
  titre: Graphes et matrices
  partie: Graphes et matrices

attendus:
