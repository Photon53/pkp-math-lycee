  - {code: TLE-EXP-2019-ARITH-02, type: contenu, page: 9, texte: "Division euclidienne d'un élément de ℤ par un élément de ℕ*."}
  - {code: TLE-EXP-2019-ARITH-03, type: contenu, page: 9, texte: "Congruences dans ℤ. Compatibilité des congruences avec les opérations."}
  - {code: TLE-EXP-2019-ARITH-04, type: contenu, page: 9, texte: "PGCD de deux entiers. Algorithme d’Euclide."}
  - {code: TLE-EXP-2019-ARITH-05, type: contenu, page: 9, texte: "Couples d’entiers premiers entre eux."}
  - {code: TLE-EXP-2019-ARITH-06, type: contenu, page: 9, texte: "Théorème de Bézout."}
  - {code: TLE-EXP-2019-ARITH-07, type: contenu, page: 9, texte: "Théorème de Gauss."}
  - {code: TLE-EXP-2019-ARITH-08, type: contenu, page: 9, texte: "Nombres premiers. Leur ensemble est infini."}
  - {code: TLE-EXP-2019-ARITH-09, type: contenu, page: 9, texte: "Existence et unicité de la décomposition d'un entier en produit de facteurs premiers."}
