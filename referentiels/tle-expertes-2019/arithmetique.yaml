# Partie « Arithmétique » (page 9 du PDF). Textes recopiés du BO ; les « Exemples d'algorithmes » sont saisis
# comme capacités, les « Problèmes possibles » (non exigibles) comme approfondissements.
theme:
  code: ARITH
  titre: Arithmétique
  partie: Arithmétique

attendus:
