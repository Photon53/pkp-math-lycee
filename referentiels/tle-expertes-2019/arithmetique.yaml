  - {code: TLE-EXP-2019-ARITH-18, type: capacite, page: 9, texte: "Algorithme d’Euclide de calcul du PGCD de deux nombres et calcul d’un couple de Bézout. Crible d’Ératosthène. Décomposition en facteurs premiers (exemples d'algorithmes)."}
