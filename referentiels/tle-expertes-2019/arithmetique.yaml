  - {code: TLE-EXP-2019-ARITH-13, type: capacite, page: 9, texte: "Établir et utiliser des tests de divisibilité, étudier la primalité de certains nombres, étudier des problèmes de chiffrement."}
  - {code: TLE-EXP-2019-ARITH-14, type: capacite, page: 9, texte: "Résoudre des équations diophantiennes simples."}
  - {code: TLE-EXP-2019-ARITH-15, type: demonstration, page: 9, texte: "Écriture du PGCD de a et b sous la forme ax + by, (x, y) ∈ ℤ²."}
  - {code: TLE-EXP-2019-ARITH-16, type: demonstration, page: 9, texte: "Théorème de Gauss."}
  - {code: TLE-EXP-2019-ARITH-17, type: demonstration, page: 9, texte: "L’ensemble des nombres premiers est infini."}
